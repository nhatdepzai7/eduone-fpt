                    setBusy(false);
                }
            };
            return (
                <Modal title="Gửi đề đóng góp cho admin" onClose={onClose} footer={<><button type="button" className="btn btn-secondary" onClick={onClose}>Đóng</button><button type="button" className="btn btn-primary" disabled={busy} onClick={send}>{busy ? 'Đang gửi…' : 'Gửi đề đóng góp cho admin'}</button></>}>
                <div className="space-y-4 text-sm text-ink2">
                        <p className="text-flow">Đề gửi vào hàng chờ. Admin duyệt thì cả lớp thấy trong Đề hệ thống. File tự tải ở Kho của tôi vẫn chỉ nằm trên máy này.</p>
                        <div className="grid sm:grid-cols-2 gap-3">
                            <label className="block text-ink"><span className="label">Tên đề</span><input value={name} onChange={(e) => setName(e.target.value)} className="field" maxLength={80} /></label>
                            <label className="block text-ink"><span className="label">Mã môn</span><input value={code} onChange={(e) => setCode(e.target.value.toUpperCase())} className="field uppercase" maxLength={16} /></label>
                            <label className="block text-ink"><span className="label">Loại</span>
                                <select value={subject} onChange={(e) => setSubject(e.target.value)} className="field">
                                    <option value="eos">EOS</option><option value="fe">FE</option><option value="pt">PT</option><option value="vocab">Từ vựng</option><option value="other">Khác</option>
                                </select>
                            </label>
                            <label className="block text-ink"><span className="label">Mã quỹ để nhận lượt thưởng</span><input value={quotaId} onChange={(e) => setQuotaId(e.target.value.toUpperCase())} className="field uppercase" maxLength={12} /></label>
                    </div>
                        <label className="block text-ink"><span className="label">File JSON / TXT</span>
                            <input type="file" accept=".json,.txt,application/json,text/plain" className="block mt-1 text-sm" onChange={(e) => readFile(e.target.files && e.target.files[0])} />
                            {fileName && <span className="text-xs text-muted">{fileName}</span>}
                        </label>
                        <label className="block text-ink"><span className="label">Hoặc dán nội dung</span>
                            <textarea value={text} onChange={(e) => setText(e.target.value)} rows={6} className="field text-xs" placeholder="Dán JSON hoặc từng câu có A. B. C. D. và Đáp án" />
                        </label>
                        <button type="button" className="btn btn-secondary btn-sm" onClick={() => downloadBlob(new Blob([JSON.stringify(contributeTemplate(pack), null, 2)], { type: 'application/json' }), 'mau-gop-de.json')}><Icon name="download" size={14} /> Tải file mẫu</button>
                    {pack && pack.status === 'ready' && (
                        <div className="rounded-xl border border-line p-4">
                                <p className="font-semibold text-ink flex items-center gap-2"><Icon name="users" /> Chia sẻ cho bạn cùng lớp</p>
                            <p className="mt-2 rounded-lg bg-surface2 p-3 text-flow">{inviteText(pack)}</p>
                            <button type="button" className="btn btn-secondary btn-sm mt-3" onClick={() => copyText(inviteText(pack)).then(() => toast('Đã copy lời mời', 'success')).catch(() => toast('Trình duyệt chặn clipboard', 'error'))}><Icon name="copy" size={14} /> Copy lời mời</button>
                        </div>
                    )}
                </div>
            </Modal>
        );
        };

        const PanicDivider = ({ pack, remaining, onSave, onSkip, onCancel }) => {
            const [days, setDays] = useState(3);
            const [hours, setHours] = useState(0);
            const hoursLeft = Math.max(1, (Number(days) || 0) * 24 + (Number(hours) || 0));
            const plan = Panic.plan({ remaining, hoursLeft });
            const quick = [['3 giờ', 0, 3], ['1 ngày', 1, 0], ['3 ngày', 3, 0], ['1 tuần', 7, 0], ['2 tuần', 14, 0]];
            const save = () => onSave({ examAt: Date.now() + hoursLeft * 3600000, createdAt: Date.now(), sessions: plan.sessions, perSession: plan.perSession, perDay: plan.perDay, sessionsDone: 0 });
            return (
                <section className="card p-5 sm:p-6 border-primary" aria-labelledby="panic-title">
                    <p className="text-xs font-semibold uppercase tracking-wider text-primary mb-1">Máy chia nhỏ nỗi sợ mùa thi</p>
                    <h2 id="panic-title" className="text-xl font-bold">Còn mấy ngày / giờ nữa bạn bước vào phòng thi?</h2>
                    <div className="flex flex-wrap gap-2 mt-4" role="group" aria-label="Chọn nhanh">
                        {quick.map(([l, d, h]) => (
                            <button key={l} type="button" aria-pressed={days === d && hours === h} onClick={() => { setDays(d); setHours(h); }} className={'btn btn-sm ' + (days === d && hours === h ? 'btn-primary' : 'btn-secondary')}>{l}</button>
                        ))}
                    </div>
                    <div className="grid grid-cols-2 gap-3 mt-3 max-w-xs">
                        <label><span className="label">Ngày</span><input type="number" min="0" max="120" value={days} onChange={(e) => setDays(Math.max(0, Math.min(120, Number(e.target.value) || 0)))} className="field tnum" /></label>
                        <label><span className="label">Giờ</span><input type="number" min="0" max="23" value={hours} onChange={(e) => setHours(Math.max(0, Math.min(23, Number(e.target.value) || 0)))} className="field tnum" /></label>
                    </div>
                    <div className="mt-4 rounded-xl bg-primary-soft p-4 text-ink" aria-live="polite">
                        <p className="font-semibold text-flow">Chia {remaining} câu còn lại thành <span className="tnum">{plan.sessions}</span> ca × 10 phút.</p>
                        <p className="text-sm text-ink2 mt-1 text-flow">
                            {hoursLeft >= 24
                                ? 'Mỗi ngày ' + plan.perDay + ' ca (~' + plan.minutesPerDay + ' phút), mỗi ca ' + plan.perSession + ' câu.'
                                : 'Khoảng ' + plan.gapMin + ' phút làm 1 ca, mỗi ca ' + plan.perSession + ' câu.'}
                        </p>
                        {plan.overload && <p className="text-sm text-warn mt-2 flex items-start gap-1.5"><Icon name="alert" size={14} className="mt-0.5" /> Hơi gấp. Ưu tiên Chặng 1 và câu sai, bỏ qua câu đã chắc — vẫn kịp nếu đều tay.</p>}
                    </div>
                    <div className="flex flex-wrap gap-2 mt-4">
                        <button type="button" className="btn btn-primary" onClick={save}><Icon name="calendar" /> Chốt lịch ôn</button>
                        {onSkip && <button type="button" className="btn btn-ghost" onClick={onSkip}>Học luôn 1 ca, tính sau</button>}
                        {onCancel && <button type="button" className="btn btn-ghost" onClick={onCancel}>Hủy</button>}
                    </div>
                </section>
            );
        };

        const Milestone = ({ pack, unlocked, onUnlock, onContribute, onLater, onContinue }) => {
            const locked = (pack.stages || []).filter(s => !s.free).reduce((n, s) => n + s.count, 0);
            useEffect(() => { Sfx.milestone(); }, []);
            return (
                <div className="max-w-3xl mx-auto space-y-4 enter">
                    <div className="card p-6 sm:p-8 text-center">
                        <div className="mx-auto w-16 h-16 rounded-2xl bg-success text-white flex items-center justify-center mb-4 pop-ok"><Icon name="trophy" size={30} /></div>
                        <p className="text-xs font-semibold uppercase tracking-wider text-success">Hoàn thành Chặng 1</p>
                        <h2 className="text-2xl sm:text-3xl font-bold mt-1 text-flow">Bạn đã nạp trọn {pack.stages[0].count} câu nền tảng {pack.code}</h2>
                        <p className="text-ink2 mt-2 text-flow">Chặng 1 là của bạn — ôn lại, thi thử miễn phí mãi mãi. Ghi nhận thật sự: phần cốt lõi của môn đã nằm trong đầu bạn.</p>
                        {unlocked && <button type="button" className="btn btn-primary mt-5" onClick={onContinue} data-autofocus>Học tiếp Chặng 2</button>}
                    </div>
                    {!unlocked && (
                        <>
                            <p className="text-center text-sm text-muted">Nếu muốn đi tiếp {locked} câu phân hóa cùng team, có 2 cách — chọn cách nào cũng được:</p>
                            <div className="grid md:grid-cols-2 gap-4">
                                <div className="card p-5">
                                    <p className="font-semibold flex items-center gap-2"><Icon name="heart" className="text-danger" /> Ủng hộ team 39k</p>
                                    <p className="text-sm text-ink2 mt-1 text-flow">Tiền ủng hộ giúp team soạn thêm môn và trả phí AI. Quét QR, nhận mã kích hoạt qua tin nhắn.</p>
                                    <div className="flex flex-wrap items-start gap-4 mt-4">
                                        <QrBox />
                                        <ul className="text-sm space-y-1.5 text-ink2 flex-1 min-w-[160px]">
                                            {['Chặng 2 & 3: ' + locked + ' câu phân hóa', 'Phím H — Highlight keyword', 'Lời giải AI từng câu', 'Phòng thi giả lập EOS'].map(x => <li key={x} className="flex items-start gap-1.5"><Icon name="check" size={14} className="text-success mt-0.5" />{x}</li>)}
                                        </ul>
                                    </div>
                                    <button type="button" className="btn btn-primary mt-4 w-full" onClick={onUnlock} data-autofocus><Icon name="key" /> Nhập mã kích hoạt</button>
                                </div>
                                <div className="card p-5">
                                    <p className="font-semibold flex items-center gap-2"><Icon name="users" /> Đồng môn góp sức</p>
                                    <p className="text-sm text-ink2 mt-1 text-flow">Đóng góp 1 bộ đề mới, hoặc chia sẻ cho 3 bạn cùng lớp — team gửi mã mở khóa free. Ai cũng có cách đi tiếp.</p>
                                    <button type="button" className="btn btn-secondary mt-4 w-full" onClick={onContribute}><Icon name="share" /> Góp đề / chia sẻ bạn bè</button>
                                </div>
                            </div>
                            <div className="text-center"><button type="button" className="btn btn-ghost" onClick={onLater}>Để sau — quay lại bộ đề</button></div>
                        </>
                    )}
                </div>
            );
        };

        /* Thẻ đầu Kho đề: chọn môn là vào phòng thi thử EOS ngay. Link /app?mode=eos từ trang chủ trỏ thẳng vào đây. */
        const EosTrialCard = ({ packs, onStart, focus }) => {
            const ready = packs.filter(p => p.status === 'ready' && p.total >= 5);
            const box = useRef(null);
            useEffect(() => {
                if (!focus || !box.current) return;
                if (ready.length === 1) { onStart(ready[0].id); return; }
                box.current.scrollIntoView({ block: 'start' });
                const first = box.current.querySelector('button');
                if (first) first.focus({ preventScroll: true });
            }, []);
            if (!ready.length) return null;
            return (
                <section ref={box} className={'card p-5 sm:p-6 mb-5 scroll-mt-20 ' + (focus ? 'ring-2 ring-indigo-400' : '')} aria-labelledby="eos-trial-title">
                    <div className="flex flex-wrap items-start gap-4">
                        <span className="w-12 h-12 shrink-0 rounded-2xl bg-[#1E3A8A] text-white flex items-center justify-center"><Icon name="monitor" /></span>
                        <div className="flex-1 min-w-[220px]">
                            <h2 id="eos-trial-title" className="text-lg font-bold">Phòng thi EOS · Thi thử miễn phí</h2>
                            <p className="text-sm text-ink2 mt-1 text-flow">10 câu, 12 phút, giao diện giống phần mềm thi thật. Có Keyword, VI / EN và cắm cờ. Nộp bài là chấm ngay kèm giải thích, câu sai tự vào thẻ ôn của Ca học 3 buổi.</p>
                        </div>
                    </div>
                    <p className="label mt-4">Chọn môn để vào phòng thi</p>
                    <div className="flex flex-wrap gap-2">
                        {ready.slice(0, 12).map(p => (
                            <button key={p.id} type="button" className="btn btn-secondary max-w-full" onClick={() => onStart(p.id)}>
                                <span className="font-semibold tnum">{p.code}</span>
                                <span className="text-ink2 text-sm truncate max-w-[200px]">{p.name}</span>
                            </button>
                        ))}
                    </div>
                    <p className="text-xs text-muted mt-3">Không cần đăng nhập, không trừ lượt. Đề đầy đủ 30–50 câu trộn cả 3 chặng dùng lượt EOS ở bên dưới.</p>
                </section>
            );
        };

        const Storefront = ({ packs, block, setBlock, statsOf, unlockedIds, exams, openPack, onContribute, now, toast }) => {
            const [trialFocus] = useState(() => takeGo('eos'));
            const startTrial = (id) => { window.__fpassTrial = id; openPack(id); };
            const blocks = (Catalog.blocks || []).concat(packs.some(p => p.block === 'system') ? [{ id: 'system', name: 'Đề hệ thống' }] : []);
            const list = packs.filter(p => p.block === block);
            const onTabKey = (e) => {
                const i = blocks.findIndex(b => b.id === block);
                if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                    e.preventDefault();
                    const n = blocks[(i + (e.key === 'ArrowRight' ? 1 : blocks.length - 1)) % blocks.length];
                    setBlock(n.id);
                    const el = document.getElementById('blk-' + n.id);
                    if (el) el.focus();
                }
            };
            return (
                <div>
                    <div className="mb-5">
                        <h1 className="text-xl font-bold">Kho Src Qua Môn</h1>
                        <p className="text-sm text-ink2 mt-1 text-flow">Bộ Src ôn thi FE / EOS / PT do team biên soạn. Chặng 1 của mọi bộ đề: free 100% với đầy đủ Băng đạn 5 câu. Đề hệ thống là bản admin vừa đăng.</p>
                        <button type="button" className="btn btn-secondary btn-sm mt-3" onClick={() => onContribute(null)}><Icon name="share" size={14} /> Gửi đề đóng góp cho admin</button>
                    </div>
                    <EosTrialCard packs={packs} onStart={startTrial} focus={trialFocus} />
                    <FundPanel toast={toast} kind="eos" />
                    <div role="tablist" aria-label="Khối ngành" className="flex flex-wrap gap-1 p-1 rounded-2xl bg-surface border border-line mb-5" onKeyDown={onTabKey}>
                        {blocks.map(b => (
                            <button key={b.id} id={'blk-' + b.id} type="button" role="tab" aria-selected={block === b.id} tabIndex={block === b.id ? 0 : -1} onClick={() => setBlock(b.id)} className="tab text-flow">
                                {b.name} <span className="tnum text-xs opacity-70">{packs.filter(p => p.block === b.id).length}</span>
                            </button>
                        ))}
                    </div>
                    <div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-4" role="tabpanel">
                        {list.map(p => {
                            if (p.status !== 'ready') {
                                return (
                                    <div key={p.id} className="card p-5 bg-surface2/60 border-dashed">
                                        <div className="flex flex-wrap items-center gap-2"><span className="chip bg-surface text-ink2 tnum">{p.code}</span><span className="chip bg-surface text-muted">Đang biên soạn</span></div>
                                        <p className="font-semibold mt-3 text-flow">{p.name}</p>
                                        <button type="button" className="btn btn-ghost btn-sm mt-3 -ml-2" onClick={() => onContribute(p)}><Icon name="plus" size={14} /> Góp đề môn này</button>
                                    </div>
                                );
                            }
                            const st = statsOf(p);
                            const exam = exams[p.id];
                            const unlocked = unlockedIds.indexOf(p.id) >= 0;
                            return (
                                <button key={p.id} type="button" onClick={() => openPack(p.id)} className="card p-5 text-left hover:border-primary transition-colors flex flex-col">
                                    <div className="flex flex-wrap items-center gap-2">
                                        <span className="chip bg-primary-soft text-primary tnum font-semibold">{p.code}</span>
                                        <span className="chip bg-surface2 text-ink2">{p.type === 'mcq' ? 'Trắc nghiệm' : 'Từ vựng'}</span>
                                        {p.system
                                            ? <span className="chip bg-success-soft text-success">Đề hệ thống</span>
                                            : <span className={'chip ' + (unlocked ? 'bg-success-soft text-success' : 'bg-surface2 text-muted')}><Icon name={unlocked ? 'unlock' : 'lock'} size={12} /> {unlocked ? 'Đã mở 3 chặng' : 'Chặng 1 free'}</span>}
                                    </div>
                                    <p className="font-semibold mt-3 text-flow">{p.name}</p>
                                    <p className="text-sm text-ink2 mt-1 text-flow flex-1">{p.desc}</p>
                                    <div className="mt-4 space-y-1.5">
                                        <div className="flex justify-between text-xs text-ink2 tnum"><span>Chặng 1 · {st.m1}/{st.c1}</span><span>Tổng {st.mAll}/{p.total}</span></div>
                                        <Progress value={st.m1} max={st.c1} tone={st.m1 >= st.c1 ? 'success' : 'primary'} label={'Tiến độ chặng 1 ' + p.code} />
                                    </div>
                                    {exam && <p className="text-xs text-muted mt-2 flex items-center gap-1"><Icon name="clock" size={12} /> Thi sau {fmtLeft(Math.max(0, exam.examAt - now))}</p>}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const PackScreen = ({ pack, view, setView, progress, reviewPack, unlockedItems, onUnlock, exam, setExam, bumpSession, milestoneShown, markMilestone, toast, now, queueEos, onOpenSlots }) => {
            const [unlockOpen, setUnlockOpen] = useState(false);
            const [contribOpen, setContribOpen] = useState(false);
            const [replan, setReplan] = useState(false);
            const [eosSetup, setEosSetup] = useState(null);
            const [run, setRun] = useState(null);
            const unlocked = !!unlockedItems || !!pack.system;
            const base = useMemo(() => pack.items.concat(unlockedItems || []), [pack, unlockedItems]);
            const rec = (t) => progress[progKey(pack.id, t.id)];
            const view$ = (t) => { const r = rec(t); return r ? Object.assign({}, t, { srsStage: r.srsStage, wrongCount: r.wrongCount, correctCount: r.correctCount, reviewCount: r.reviewCount, nextReview: r.nextReview, lastReview: r.lastReview }) : t; };
            const items = base.map(view$);
            const itemsById = new Map(items.map(t => [t.id, t]));
            const stage = (n) => items.filter(t => t.checkpoint === n);
            const c1 = stage(1);
            const m1 = c1.filter(t => isMastered(rec(t))).length;
            const mastered = items.filter(t => isMastered(rec(t))).length;
            const c1Done = c1.length > 0 && m1 >= c1.length;
            const weakIds = items.filter(t => isPackWeak(rec(t), now)).map(t => t.id);
            const remaining = Math.max(0, pack.total - mastered);
            const status = Panic.status(exam, now);
            const perSession = (exam && exam.perSession) || 15;

            const nextIds = () => {
                const pending = items.filter(t => !isMastered(rec(t)));
                let ids = pending.slice(0, perSession).map(t => t.id);
                if (ids.length < perSession) ids = ids.concat(weakIds.filter(id => ids.indexOf(id) < 0).slice(0, perSession - ids.length));
                if (!ids.length) ids = Sch.shuffle(items.map(t => t.id)).slice(0, perSession);
                return ids;
            };
            const startCa = () => { setRun({ kind: 'ca', ids: nextIds(), key: Date.now() }); setView('burst'); };
            const startWeak = () => { if (!weakIds.length) { toast('Chưa có câu yếu — làm 1 ca hoặc thi thử trước', 'info'); return; } setRun({ kind: 'weak', ids: weakIds.slice(0, 25), key: Date.now() }); setView('burst'); };
            const mcqPool = pack.type === 'mcq' ? items.filter(t => t.type === 'mcq') : vocabAsMcq(items);
            const openEOS = () => {
                if (mcqPool.length < 5) { toast('Cần ít nhất 5 câu để mở phòng thi EOS', 'info'); return; }
                if (!requireTurns(toast)) return;
                setEosSetup(mcqPool);
            };
            /* Thi thử miễn phí: 10 câu lấy từ phần free (Chặng 1 hoặc đề hệ thống), không trừ lượt. */
            const openTrial = () => {
                const free = pack.type === 'mcq' ? pack.items.filter(t => t.type === 'mcq') : vocabAsMcq(pack.items);
                if (free.length < 5) { toast('Bộ đề này chưa đủ 5 câu free để thi thử', 'info'); return; }
                Store.prefs.set('eosTried', true);
                const n = Math.min(10, free.length);
                setRun({ kind: 'eos', trial: true, pool: free, count: n, minutes: Math.max(5, Math.round(n * 1.2)), key: Date.now() });
                setView('eos');
            };
            useEffect(() => {
                if (window.__fpassTrial !== pack.id) return;
                window.__fpassTrial = '';
                openTrial();
            }, []);

            const backToPack = () => { setRun(null); setView('pack'); };
            const lockedMsg = 'Highlight keyword (phím H) mở cùng Chặng 2–3 — Chặng 1 vẫn học đầy đủ Băng đạn.';

            if (view === 'burst' && run) {
                return (
                    <BurstSession key={run.key} itemsById={itemsById} ids={run.ids} title={pack.code + ' · ' + (run.kind === 'ca' ? 'Ca 10 phút' : run.kind === 'eos' ? 'Nhồi lại câu sai EOS' : 'Ôn câu yếu')}
                        subtitle={pack.name} timerMin={run.kind === 'ca' ? 10 : undefined} canHighlight={unlocked} highlightLockedMsg={lockedMsg} canExplain={unlocked && AI.ready()} toast={toast}
                        onReview={(id, ok) => reviewPack(pack.id, id, ok)} onExit={backToPack}
                        onFinish={(st) => { if (run.kind === 'ca') bumpSession(pack.id); setRun(Object.assign({}, run, { stats: st })); setView('caDone'); }} renderDone={() => null} />
                );
            }

            if (view === 'eos' && run) {
                return (
                    <EOSSimulator key={run.key} title={String(pack.name || '').indexOf(pack.code) === 0 ? pack.name : pack.code + ' · ' + pack.name} items={run.pool} count={run.count} minutes={run.minutes} toast={toast} canExplain={AI.ready()} trial={!!run.trial}
                        onSubmit={async (r) => {
                            if (!run.trial) {
                                const paid = await window.EDU.chargeTurn(toast, 'Nộp ' + pack.code);
                                if (!paid) return false;
                            }
                            r.wrong.forEach(w => reviewPack(pack.id, w.id, false));
                            const ids = Array.from(new Set(r.wrong.map(w => w.id).concat(r.flaggedIds)));
                            const list = ids.map(id => itemsById.get(id)).filter(Boolean).map(item => ({ item, packId: pack.id, code: pack.code }));
                            return { queued: queueEos ? queueEos(list) : 0 };
                        }}
                        onDrillWrong={(ids) => { setRun({ kind: 'eos', ids, key: Date.now() }); setView('burst'); }}
                        onOpenSlots={onOpenSlots}
                        onExit={backToPack} />
                );
            }

            if (view === 'caDone' && run) {
                if (c1Done && !milestoneShown) {
                    return <Milestone pack={pack} unlocked={unlocked} onUnlock={() => setUnlockOpen(true)} onContribute={() => setContribOpen(true)}
                        onLater={() => { markMilestone(pack.id); backToPack(); }} onContinue={() => { markMilestone(pack.id); startCa(); }} />;
                }
                const st = run.stats || { total: 0, firstTryCorrect: 0, elapsedMs: 0 };
                const safe = !status || status.onTrack;
                return (
                    <div className="max-w-xl mx-auto card p-6 sm:p-8 text-center enter">
                        <div className={'mx-auto w-14 h-14 rounded-2xl flex items-center justify-center mb-4 ' + (safe ? 'bg-success text-white' : 'bg-warn-soft text-warn')}><Icon name={safe ? 'shield' : 'clock'} size={28} /></div>
                        <h2 className="text-2xl font-bold text-flow">{run.kind !== 'ca' ? 'Đã nhồi sạch câu yếu' : safe ? 'Ca này an toàn — Bạn đang đúng tiến độ qua môn!' : 'Ca này xong — còn ' + status.behind + ' ca để bắt kịp tiến độ'}</h2>
                        <p className="text-ink2 mt-2 tnum">Đúng ngay lần đầu {st.firstTryCorrect}/{st.total} · {Plan.fmtCountdown(st.elapsedMs)}</p>
                        {status && <p className="text-sm text-muted mt-1 tnum">Đã xong {status.done}/{status.total} ca · thi sau {fmtLeft(status.msLeft)}</p>}
                        <div className="flex flex-wrap justify-center gap-2 mt-6">
                            <button type="button" className="btn btn-primary" onClick={startCa} data-autofocus><Icon name="play" /> Làm tiếp 1 ca</button>
                            <button type="button" className="btn btn-secondary" onClick={backToPack}>Về bộ đề</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="space-y-4">
                    <div className="flex flex-wrap items-start gap-3">
                        <div className="min-w-0 flex-1">
                            <div className="flex flex-wrap gap-2 mb-1"><span className="chip bg-surface2 text-ink2">{pack.total} {pack.type === 'mcq' ? 'câu' : 'từ'}</span></div>
                            <h1 className="text-xl font-bold text-flow">{[pack.code, pack.name].filter(Boolean).join(' — ')}</h1>
                            {pack.desc && String(pack.desc).trim() ? <p className="text-sm text-ink2 text-flow mt-1">{pack.desc}</p> : null}
                        </div>
                    </div>

                    {(!exam || replan) ? (
                        <PanicDivider pack={pack} remaining={remaining} onSave={(e) => { setExam(pack.id, e); setReplan(false); toast('Đã chốt lịch ôn ' + e.sessions + ' ca', 'success'); }}
                            onSkip={!exam ? startCa : undefined} onCancel={replan ? () => setReplan(false) : undefined} />
                    ) : (
                        <section className="card p-5 sm:p-6 flex flex-wrap items-center gap-4">
                            <div className="flex-1 min-w-[220px]">
                                <p className={'text-sm font-semibold flex items-center gap-1.5 ' + (status.onTrack ? 'text-success' : 'text-warn')}><Icon name={status.onTrack ? 'shield' : 'alert'} size={16} /> {status.onTrack ? 'Đúng tiến độ qua môn' : 'Chậm ' + status.behind + ' ca so với lịch'}</p>
                                <p className="text-2xl font-bold tnum mt-1">Thi sau {fmtLeft(status.msLeft)}</p>
                                <p className="text-sm text-ink2 tnum">Đã xong {status.done}/{status.total} ca · mỗi ca {perSession} câu · {exam.perDay} ca/ngày</p>
                                <div className="mt-2 max-w-sm"><Progress value={status.done} max={status.total} tone={status.onTrack ? 'success' : 'warn'} label="Tiến độ ca" /></div>
                            </div>
                            <div className="flex flex-wrap gap-2">
                                <button type="button" className="btn btn-primary btn-lg" onClick={startCa} autoFocus><Icon name="play" /> Bắt đầu ca 10 phút</button>
                                <button type="button" className="btn btn-secondary btn-lg" onClick={openTrial}><Icon name="monitor" /> Thi thử EOS miễn phí 10 câu</button>
                                <button type="button" className="btn btn-secondary btn-lg" onClick={openEOS} disabled={mcqPool.length < 5}><Icon name="monitor" /> Thi đủ đề EOS</button>
                                <button type="button" className="btn btn-ghost" onClick={() => setReplan(true)}><Icon name="calendar" /> Đổi lịch thi</button>
                            </div>
                        </section>
                    )}

                    <section className="card p-5 sm:p-6" aria-labelledby="stage-title">
                        <h2 id="stage-title" className="font-semibold mb-3">Các chặng</h2>
                        <ol className="space-y-3">
                            {pack.stages.map(sg => {
                                const list = stage(sg.n);
                                const open = sg.free || unlocked;
                                const m = list.filter(t => isMastered(rec(t))).length;
                                return (
                                    <li key={sg.n} className="rounded-xl border border-line p-4 flex flex-wrap items-center gap-3">
                                        <span className={'w-10 h-10 rounded-xl flex items-center justify-center ' + (open ? 'bg-primary-soft text-primary' : 'bg-surface2 text-muted')}><Icon name={open ? (sg.free ? 'target' : 'unlock') : 'lock'} /></span>
                                        <div className="flex-1 min-w-[180px]">
                                            <p className="font-semibold">Chặng {sg.n} · {sg.count} {pack.type === 'mcq' ? 'câu' : 'từ'} {sg.free ? <span className="chip bg-success-soft text-success ml-1">FREE 100%</span> : null}</p>
                                            <p className="text-xs text-ink2 mt-0.5">{sg.n === 1 ? 'Nền tảng cốt lõi' : sg.n === 2 ? 'Câu phân hóa' : 'Câu khó sát đề thật'}</p>
                                            {open && <div className="mt-2 max-w-xs"><Progress value={m} max={list.length || sg.count} tone={m >= list.length && list.length ? 'success' : 'primary'} label={'Tiến độ chặng ' + sg.n} /></div>}
                                        </div>
                                        <span className="tnum text-sm text-ink2">{open ? m + '/' + (list.length || sg.count) : 'Đã mã hóa'}</span>
                                    </li>
                                );
                            })}
                        </ol>
                        {!unlocked && pack.locked && (
                            <div className="mt-4 flex flex-wrap gap-2">
                                <button type="button" className="btn btn-secondary" onClick={() => setUnlockOpen(true)}><Icon name="key" /> Nhập mã kích hoạt</button>
                                <button type="button" className="btn btn-ghost" onClick={() => setContribOpen(true)}><Icon name="users" /> Góp đề / chia sẻ để nhận mã free</button>
                            </div>
                        )}
                    </section>

                    <section className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">
                        <button type="button" className="card p-4 text-left hover:border-primary" onClick={startWeak}>
                            <Icon name="flame" className="text-warn" /><p className="font-semibold mt-2">Ôn câu yếu ({weakIds.length})</p><p className="text-sm text-ink2">Câu sai trong ca hoặc EOS, nhồi lại bằng Băng đạn.</p>
                        </button>
                        <button type="button" className="card p-4 text-left hover:border-primary" onClick={openEOS} disabled={mcqPool.length < 5}>
                            <Icon name="monitor" className="text-eos" /><p className="font-semibold mt-2">Phòng thi giả lập EOS</p><p className="text-sm text-ink2">Làm ngay trên giao diện EOS cổ điển, trộn đề 30–50 câu.</p>
                        </button>
                        <button type="button" className="card p-4 text-left hover:border-primary" onClick={openTrial}>
                            <Icon name="play" className="text-primary" /><p className="font-semibold mt-2">Thi thử miễn phí 10 câu</p><p className="text-sm text-ink2">Không trừ lượt. Câu sai tự vào thẻ ôn của Ca học 3 buổi.</p>
                        </button>
                        <div className="card p-4">
                            <Icon name="keyboard" className="text-ink2" /><p className="font-semibold mt-2">Zero-mouse</p><p className="text-sm text-ink2"><Kbd>1</Kbd>–<Kbd>4</Kbd> chọn đáp án · <Kbd>H</Kbd> highlight{unlocked ? '' : ' (mở ở Chặng 2)'} · <Kbd>Esc</Kbd> thoát</p>
                        </div>
                    </section>

                    {unlockOpen && <UnlockModal pack={pack} onUnlock={onUnlock} onClose={() => setUnlockOpen(false)} />}
                    {contribOpen && <ContributeModal pack={pack} toast={toast} onClose={() => setContribOpen(false)} />}
                    {eosSetup && <EOSSetup max={eosSetup.length} onClose={() => setEosSetup(null)} onStart={(n, min) => { if (!requireTurns(toast, true)) return; setRun({ kind: 'eos', pool: eosSetup, count: n, minutes: min, key: Date.now() }); setEosSetup(null); setView('eos'); }} />}
                </div>
            );
        };
        /* ===================== APP ROOT ===================== */
        const BASE_TITLE = 'FPass · Học đúng giờ, thi chắc qua';

        const promptOf = (t) => {
            if (!t) return '';
            const s = t.type === 'mcq' ? t.questionOrWord : Sch.recallPromptOf(t);
            return s.length > 90 ? s.slice(0, 88) + '…' : s;
        };

        const googleToken = () => Store.prefs.get('googleToken', '') || '';

        const librarySnapshot = async () => ({
            fundCode: (E.Quota.read() || {}).code || '',
            library: {
                items: (await Store.items.all()).filter((t) => !(String(t.id || '').indexOf('starter-') === 0 && !(t.reviewCount > 0))).slice(0, 4000),
                progress: (await Store.progress.all()).slice(0, 8000),
                votes: (await Store.identityVotes.all()).slice(0, 5000)
            }
        });

        const applyCloud = async (data) => {
            /* spendCode: máy này đang dùng mã nhóm của người khác thì giữ mã đó để trừ lượt chung. */
            const keep = data && (data.spendCode || data.fundCode);
            if (keep) {
                try { E.Quota.setCode(keep); } catch (e) {}
            }
            const until = data && data.proUntil;
            if (until === -1 || Number(until) > 0) E.Quota.noteAi({ proUntil: until, aiUnlocked: until === -1 || Number(until) > Date.now() });
            const lib = data && data.library || {};
            if (Array.isArray(lib.items) && lib.items.length) await Store.items.putMany(lib.items.map((row) => Sch.normalizeItem(row)));
            if (Array.isArray(lib.progress) && lib.progress.length) await Store.progress.putMany(lib.progress.filter((row) => row && row.id));
            if (Array.isArray(lib.votes) && lib.votes.length) await Store.identityVotes.putMany(lib.votes.filter((row) => row && row.id && row.sessionId));
            try { await E.Quota.sync(); } catch (e) {}
            window.dispatchEvent(new CustomEvent('edu-library'));
            window.dispatchEvent(new CustomEvent('edu-votes'));
        };

        const loginWithCredential = async (credential) => {
            const guest = await librarySnapshot();
            const res = await fetch('/api/fund?action=login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                body: JSON.stringify({ credential, guest })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || 'Chưa đăng nhập được Google.');
            Store.prefs.set('googleToken', data.token || '');
            Store.prefs.set('googleUser', data.user || null);
            await applyCloud(data);
            noteAccount();
            return data;
        };

        const redeemGiftCode = async (code) => {
            const res = await fetch('/api/fund?action=redeem', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Accept: 'application/json', Authorization: 'Bearer ' + googleToken() },
                body: JSON.stringify({ code, fundCode: (E.Quota.read() || {}).code || '' })
            });
            const data = await res.json().catch(() => ({}));
            if (res.status === 401) {
                const err = new Error(data.error || 'Cần đăng nhập Google.');
                err.needLogin = true;
                throw err;
            }
            if (!res.ok) throw new Error(data.error || 'Chưa kích hoạt được mã.');
            Store.prefs.set('googleUser', Object.assign({}, Store.prefs.get('googleUser', {}) || {}, { tier: 'OBSIDIAN_PRO', proUntil: data.proUntil }));
            noteAccount();
            if (data.fundCode) { try { E.Quota.setCode(data.fundCode); } catch (e) {} }
            E.Quota.noteAi({ proUntil: data.proUntil, aiUnlocked: true });
            try { await E.Quota.sync(); } catch (e) {}
            return data;
        };

        /* Nút Google dùng chung cho hộp đăng nhập và cổng thanh toán. */
        const GoogleButton = ({ onDone, onBusy, width = 320, className = '' }) => {
            const box = useRef(null);
            const [note, setNote] = useState('');
            const [busy, setBusy] = useState(false);
            const done = useRef(onDone);
            done.current = onDone;
            useEffect(() => {
                let alive = true;
                const run = async () => {
                    try {
                        const res = await fetch('/api/fund?action=config', { headers: { Accept: 'application/json' } });
                        const cfg = await res.json().catch(() => ({}));
                        if (!alive) return;
                        if (!cfg.enabled || !cfg.clientId) {
                            setNote('Máy chủ chưa bật đăng nhập Google. Thêm GOOGLE_CLIENT_ID trên Vercel rồi tải lại trang.');
                            return;
                        }
                        await new Promise((resolve, reject) => {
                            if (window.google && google.accounts && google.accounts.id) { resolve(); return; }
                            const script = document.createElement('script');
                            script.src = 'https://accounts.google.com/gsi/client';
                            script.async = true;
                            script.onload = () => resolve();
                            script.onerror = () => reject(new Error('Không tải được nút Google.'));
                            document.head.appendChild(script);
                        });
                        if (!alive || !box.current) return;
                        google.accounts.id.initialize({
                            client_id: cfg.clientId,
                            callback: async (resp) => {
                                if (!resp || !resp.credential) return;
                                setBusy(true);
                                if (onBusy) onBusy(true);
                                try {
                                    const data = await loginWithCredential(resp.credential);
                                    await done.current(data.user || null, null);
                                } catch (e) {
                                    await done.current(null, e);
                                } finally {
                                    if (alive) setBusy(false);
                                    if (onBusy) onBusy(false);
                                }
                            }
                        });
                        google.accounts.id.renderButton(box.current, { theme: 'outline', size: 'large', text: 'continue_with', width });
                    } catch (e) {
                        if (alive) setNote(e.message || 'Chưa mở được đăng nhập Google.');
                    }
                };
                run();
                return () => { alive = false; };
            }, []);
            return (
                <div className={className}>
                    <div ref={box} className="min-h-[44px]" />
                    {busy && <p className="mt-2 text-sm text-muted" role="status">Đang đăng nhập và gộp kho…</p>}

                            <div className="mt-2 flex gap-2">

                                    <button type="button" className="btn btn-secondary btn-sm" onClick={() => { try { const saved = E.Quota.setCode(fundCode); setFundCode(saved.code); E.Quota.sync(); toast('Đã lưu mã quỹ ' + saved.code, 'success'); } catch (e) { toast(e.message, 'error'); } }}>Lưu</button>
                                </span>

                            <label className="mt-2 block text-sm"><span className="label">Dán mã quỹ hoặc EDUF1</span>

                            </label>
                            <button type="button" className="btn btn-secondary btn-sm mt-2" disabled={!shared.trim()} onClick={() => {
                                try {
                                    const saved = /^EDUF1\./i.test(shared.trim()) ? E.Quota.importCode(shared.trim()) : E.Quota.setCode(shared.trim());
                                    setFundCode(saved.code);

                                    toast('Máy này đang dùng mã ' + saved.code + '.', 'success');

                        </div>
                        <p className="text-xs text-muted tnum">Dung lượng bộ nhớ trình duyệt: {usage && usage.quota ? (usage.usage / 1048576).toFixed(1) + ' MB / ' + (usage.quota / 1048576).toFixed(0) + ' MB' : 'trình duyệt không báo số liệu'}</p>
                    </div>
