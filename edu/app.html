                });
            }, [nav.packId]);
            const myPacks = useMemo(() => {
                const touched = [];
                Object.keys(progress).forEach(k => { const r = progress[k]; if (r && r.packId && touched.indexOf(r.packId) < 0) touched.push(r.packId); });
                Object.keys(exams || {}).forEach(id => { if (touched.indexOf(id) < 0) touched.push(id); });
                const order = recentPacks.concat(touched.filter(id => recentPacks.indexOf(id) < 0));
                return order.map(id => packById.get(id)).filter(pk => pk && pk.status === 'ready');
            }, [recentPacks, progress, exams, packById]);
            const itemsById = useMemo(() => new Map(items.map(t => [t.id, t])), [items]);

            /* ---------- Boot: migration → IndexedDB → plan ---------- */
            useEffect(() => {
                (async () => {
                    try {
                        const migrated = await Store.migrateLegacy();
                        let rows = (await Store.items.all()).map(d => Sch.normalizeItem(d));
                        /* Người mới: nạp sẵn bộ thẻ mẫu để đồng hồ và nút Học ngay chạy được ngay, không phải tạo thẻ trước. */
                        if (!rows.length && !Store.prefs.get('starterSeeded', false)) {
                            const sample = (Catalog.packs || []).find(pk => pk.status === 'ready' && pk.type === 'vocab' && Array.isArray(pk.free) && pk.free.length);
                            if (sample) {
                                const seed = sample.free.slice(0, 40).map((d, i) => Sch.normalizeItem(Object.assign({}, d, { id: 'starter-' + sample.id + '-' + i, group: 'Thẻ mẫu · ' + sample.code })));
                                await Store.items.putMany(seed);
                                rows = seed;
                                Store.prefs.set('starterSeeded', true);
                            }
                        }
                        savedItems.current = rows;
                        setItems(rows);
                        const prog = {};
                        (await Store.progress.all()).forEach(r => { prog[r.id] = r; });
                        progressRef.current = prog;
                        setProgress(prog);
                        if (migrated) toast('Đã chuyển ' + migrated + ' mục từ bản cũ sang IndexedDB', 'info');
                    } catch (e) {
                        toast('Không mở được kho dữ liệu: ' + e.message, 'error');
                    }
                    setLoaded(true);
                })();
                const reloadLibrary = () => {
                    Store.items.all().then((rows) => {
                        const next = rows.map((row) => Sch.normalizeItem(row));
                        savedItems.current = next;
                        setItems(next);
                    }).catch(() => {});
                    Store.progress.all().then((rows) => {
                        const prog = {};
                        rows.forEach((row) => { prog[row.id] = row; });
                        progressRef.current = prog;
                        setProgress(prog);
                    }).catch(() => {});
                };
                window.addEventListener('edu-library', reloadLibrary);

                const today = Plan.dayKeyOf(new Date());
                const dayKey = Plan.weekdayOf(new Date());
                const shippedPersonal = (value) => {
                    try {
                        const text = JSON.stringify(value);
                        return text.indexOf('lớp FPT') >= 0 || text.indexOf('Tối · IELTS') >= 0;
                    } catch (e) { return false; }
                };
                ['weeklyPlan', 'nextWeeklyPlan', 'hybridToday'].forEach((key) => {
                    if (shippedPersonal(Store.prefs.get(key, null))) Store.prefs.remove(key);
                });
                let w = Plan.normWeek(Store.prefs.get('weeklyPlan', null));
                const nx = Store.prefs.get('nextWeeklyPlan', null);
                const saved = Store.prefs.get('hybridToday', null);
                setWeek(w);
                Store.prefs.set('weeklyPlan', w);
                if (Plan.isValidWeek(nx)) setNextWeek(Plan.normWeek(nx));
                const keep = saved && saved.date === today && Array.isArray(saved.slots) && saved.slots.length === 3 && saved.slots[0] && saved.slots[0].phase1_inApp;
                if (keep) {
                    setPlan(Plan.buildDay(saved, today, saved.dayKey || dayKey, true));
                } else {
                    const src = Plan.isValidWeek(nx) ? Plan.normWeek(nx) : w;
                    setPlan(Plan.buildDay({ slots: src.days[dayKey] }, today, dayKey, false));
                    if (Plan.isValidWeek(nx)) {
                        setWeek(src);
                        Store.prefs.set('weeklyPlan', src);
                        Store.prefs.remove('nextWeeklyPlan');
                        setNextWeek(null);
                    }
                }
                setPlanReady(true);
                return () => window.removeEventListener('edu-library', reloadLibrary);
            }, []);

            /* ---------- Persist: items (diff → IndexedDB), plan, mode ---------- */
            const flushItems = (list) => {
                clearTimeout(saveTimer.current);
                const prev = savedItems.current;
                savedItems.current = list;
                return Store.syncDiff(Store.items, prev, list).then(() => {
                    if (prev === list || !prev) return;
                    const before = new Map(prev.map(t => [t.id, t]));
                    const groups = new Set();
                    list.forEach(t => { if (before.get(t.id) !== t) groups.add(t.group || ''); before.delete(t.id); });
                    before.forEach(t => groups.add(t.group || ''));
                    noteGone(Array.from(before.keys()));
                    if (groups.size) window.dispatchEvent(new CustomEvent('edu-items-saved', { detail: { groups: Array.from(groups), at: Date.now() } }));
                }).catch(e => {
                    savedItems.current = prev;
                    toast('Lỗi lưu dữ liệu: ' + (e && e.message), 'error');
                });
            };
            const latestItems = useRef(items);
            latestItems.current = items;
            useEffect(() => {
                if (!loaded) return;
                clearTimeout(saveTimer.current);
                saveTimer.current = setTimeout(() => flushItems(items), 300);
            }, [items, loaded]);
            useEffect(() => {
                const onHide = () => { if (document.hidden && loaded) flushItems(latestItems.current); };
                document.addEventListener('visibilitychange', onHide);
                window.addEventListener('pagehide', onHide);
                return () => { document.removeEventListener('visibilitychange', onHide); window.removeEventListener('pagehide', onHide); };
            }, [loaded]);

            useEffect(() => {
                if (!planBoot.current) { planBoot.current = true; return; }
                if (plan) Store.prefs.set('hybridToday', plan);
            }, [plan]);
            useEffect(() => { if (nextWeek && Plan.isValidWeek(nextWeek)) Store.prefs.set('nextWeeklyPlan', nextWeek); }, [nextWeek]);

            /* ---------- Giải mã các bộ đề đã có license ---------- */
            useEffect(() => {
                Object.keys(licenses).forEach(pid => {
                    const p = packById.get(pid);
                    if (!p || !p.locked || unlocked[pid]) return;
                    Vault.unlock(p, licenses[pid]).then(list => setUnlocked(u => Object.assign({}, u, { [pid]: list }))).catch(() => {});
                });
            }, []);

            /* ---------- Nhịp đồng hồ chống đóng băng tab nền ---------- */
            useEffect(() => {
                const stop = E.Engine.createTicker((t) => setNow(t));
                const onVis = () => setHidden(document.hidden);
                document.addEventListener('visibilitychange', onVis);
                return () => { stop(); document.removeEventListener('visibilitychange', onVis); document.title = BASE_TITLE; };
            }, []);

            /* ---------- Qua 00:00: áp plan ngày mai, không cộng dồn nợ ---------- */
            useEffect(() => {
                const d = new Date(now);
                const key = Plan.dayKeyOf(d);
                if (key === dayRef.current) return;
                dayRef.current = key;
                const dayKey = Plan.weekdayOf(d);
                const src = Plan.isValidWeek(nextWeek) ? Plan.normWeek(nextWeek) : week;
                if (Plan.isValidWeek(nextWeek)) {
                    setWeek(src);
                    Store.prefs.set('weeklyPlan', src);
                    Store.prefs.remove('nextWeeklyPlan');
                    setNextWeek(null);
                }
                if (Plan.isValidWeek(src)) setPlan(Plan.buildDay({ slots: src.days[dayKey] }, key, dayKey, false));
                setSession(s => (s && s.slotId ? null : s));
                setMinimal(false);
                alerted.current = {};
            }, [now]);

            /* ---------- Item operations ---------- */
            const review = (id, ok, kind) => setItems(prev => prev.map(t => (t.id === id ? Sch.applyReview(t, ok, kind).item : t)));
            const patch = (map) => setItems(prev => prev.map(t => (map[t.id] ? Object.assign({}, t, map[t.id]) : t)));
            /* Câu Kho đề trong ca không có trong Sổ từ: trả lời sai thì đưa vào Sổ từ để ôn (giống phòng thi EOS). */
            const reviewSlot = (id, ok, kind) => {
                const b = session && session.bank && session.bank[id];
                if (b) { if (!ok) queueEos([b]); return; }
                review(id, ok, kind);
            };
            const uniqueIds = (incoming, taken) => incoming.map(t => {
                let id = t.id;
                while (taken.has(id)) id = Sch.newId('it');
                taken.add(id);
                return id === t.id ? t : Object.assign({}, t, { id });
            });
            const mergeItems = (incoming, mode) => {
                if (mode === 'replace') setItems(uniqueIds(incoming, new Set()));
                else setItems(prev => prev.concat(uniqueIds(incoming, new Set(prev.map(t => t.id)))));
            };
            const addItems = (raws) => mergeItems(raws.map(r => Sch.normalizeItem(Object.assign({}, r, { id: undefined }))), 'append');
            /* Câu sai hoặc cắm cờ trong phòng thi EOS: thành thẻ ôn trong Sổ tay (đánh dấu sai, đến hạn ngay)
               và xếp hàng chờ để ca học kế tiếp lấy trước. entries: { id } cho thẻ đã có trong Sổ tay,
               hoặc { item, packId, code } cho câu của Kho đề. Trả về số câu đã xếp. */
            const queueEos = (entries) => {
                const known = new Set(items.map(t => t.id));
                const ids = [];
                const fresh = [];
                (entries || []).forEach(e => {
                    if (e.id) { if (known.has(e.id)) ids.push(e.id); return; }
                    if (!e.item) return;
                    const id = ('eos-' + e.packId + '-' + e.item.id).slice(0, Sch.MAX.id);
                    ids.push(id);
                    if (!fresh.some(f => f.id === id)) fresh.push({ id, item: e.item, code: e.code || '' });
                });
                if (fresh.length) {
                    setItems(prev => {
                        const have = new Set(prev.map(t => t.id));
                        const again = new Set(fresh.map(f => f.id));
                        const out = prev.map(t => (again.has(t.id) ? Sch.applyReview(t, false).item : t));
                        fresh.forEach(f => {
                            if (have.has(f.id)) return;
                            const raw = Object.assign(Sch.toShareable(f.item), { id: f.id, group: 'Ôn lại EOS · ' + f.code });
                            out.push(Sch.applyReview(Sch.normalizeItem(raw, { source: 'eos' }), false).item);
                        });
                        return out;
                    });
                }
                const uniq = Array.from(new Set(ids));
                if (!uniq.length) return 0;
                const rest = (Store.prefs.get(EOS_QUEUE, []) || []).filter(id => uniq.indexOf(id) < 0);
                Store.prefs.set(EOS_QUEUE, uniq.concat(rest).slice(0, 80));
                return uniq.length;
            };
            const openSlots = () => {
                setSession(s => (s && s.mode === 'eos' ? null : s));
                dispatch({ type: 'TAB', tab: 'today', force: true });
            };

            /* ---------- Phiên học Mode 1 ---------- */
            const noteStudyStart = () => window.dispatchEvent(new CustomEvent('edu-study-start'));
            const startPractice = (list, mode, title, opts) => {
                const pool = (list || []).filter(Sch.isFilled);
                if (!pool.length) { toast('Không có mục để luyện', 'error'); return; }
                if (mode === 'eos') {
                    if (!requireTurns(toast, true)) return;
                    noteStudyStart();
                    const n = (opts && opts.count) || Math.min(40, pool.length);
                    setSession({ id: Date.now(), title, mode: 'eos', pool, count: n, minutes: (opts && opts.minutes) || Math.max(5, Math.round(n * 1.2)), ids: [] });
                } else {
                    noteStudyStart();
                    setSession({ id: Date.now(), title, mode, ids: Sch.shuffle(pool.map(t => t.id)), voteType: voteTypeFor(mode) });
                }
                dispatch({ type: 'TAB', tab: 'practice' });
            };
            const startQuickBurst = () => {
                const pool = Sch.shuffle(items.filter(Sch.isFilled)).slice(0, 5);
                if (pool.length < 5) return;
                noteStudyStart();
                setSession({ id: Date.now(), title: 'Băng đạn 5 câu', mode: 'burst', voteType: 'quiz5', ids: pool.map(t => t.id), slotId: null });
                dispatch({ type: 'TAB', tab: 'practice' });
            };
            /* Nút Học ngay: trong 30 phút trước ca hoặc đang trong giờ thì vào chính ca đó; ngoài giờ thì học nhanh, không tính là ca. */
            const studyNow = () => {
                const slotNow = cur.slot;
                if (slotNow && (cur.early || cur.kind === 'ON_TIME_ACTIVE' || cur.kind === 'LATE_RECOVERY')) {
                    enterEarly(slotNow);
                    return;
                }
                /* Câu sai từ phòng thi EOS lên trước; hàng đợi giữ nguyên để ca chính thức nhắc lại lần nữa. */
                const queued = (Store.prefs.get(EOS_QUEUE, []) || []).map(id => itemsById.get(id)).filter(t => t && Sch.isFilled(t));
                const pool = queued.slice(0, 4).concat(Sch.shuffle(items.filter(t => Sch.isFilled(t) && queued.slice(0, 4).indexOf(t) < 0)));
                if (!pool.length) { dispatch({ type: 'TAB', tab: 'library' }); toast('Kho chưa có thẻ. Thêm vài từ trước nhé.', 'info'); return; }
                noteStudyStart();
                setSession({ id: Date.now(), title: 'Học nhanh ' + Math.min(8, pool.length) + ' thẻ', mode: 'flash', voteType: 'flashcard', ids: pool.slice(0, 8).map(t => t.id), slotId: null, home: true });
                dispatch({ type: 'TAB', tab: 'today', force: true });
                window.scrollTo(0, 0);
            };
            /* Bắt đầu ca đang đến giờ: học đủ ca, hoặc Chạm đáy (2 thẻ) để giữ chuỗi. */
            const startSlot = (lean) => {
                const slotNow = cur.slot;
                if (!slotNow || !(cur.kind === 'ON_TIME_ACTIVE' || cur.kind === 'LATE_RECOVERY')) { studyNow(); return; }
                const limit = lean ? Math.min(2, slotNow.baseCardCount || 8) : Plan.cardLimit(slotNow, cur.kind, false);
                const deck = deckFor(slotNow, limit);
                const ids = deck.ids;
                setKick(null);
                if (!ids.length) { dispatch({ type: 'TAB', tab: 'library', force: true }); toast('Nhóm "' + Sch.groupLabel(slotNow.group) + '" chưa có thẻ. Thêm vài thẻ trước nhé.', 'info'); return; }
                setMinimal(!!lean);
                const mode = sessionModeOf(slotNow.mode);
                noteStudyStart();
                setSession({ id: Date.now(), title: 'Ca ' + slotNow.id + ' · ' + slotNow.anchorLabel, mode: lean ? 'flash' : mode, voteType: voteTypeFor(lean ? 'flash' : mode), ids, slotId: slotNow.id, lean: !!lean, extra: deck.extra, bank: deck.bank });
                dispatch({ type: 'TAB', tab: 'today', force: true });
                window.scrollTo(0, 0);
            };
            const openSetup = () => {
                if (!readAccount()) { setPendingGift(''); setGoogleReason('setup'); setGoogleOpen(true); return; }
                setSetupOpen(true);
            };
            const applySetup = (w) => {
                const n = Plan.normWeek(w);
                const untouched = plan && plan.slots.every(sl => sl.status === 'pending' && !sl.cardsDone) && !(session && session.slotId);
                if (untouched) {
                    const d = new Date();
                    const key = Plan.dayKeyOf(d);
                    const wd = Plan.weekdayOf(d);
                    setWeek(n);
                    Store.prefs.set('weeklyPlan', n);
                    Store.prefs.remove('nextWeeklyPlan');
                    setNextWeek(null);
                    setPlan(Plan.buildDay({ slots: n.days[wd] }, key, wd, false));
                    toast('Đã lưu lịch. Áp dụng ngay từ hôm nay.', 'success');
                } else {
                    saveWeek(n);
                }
                Store.prefs.set('setupDone', true);
                setSetupDone(true);
                setSetupOpen(false);
            };
            const restartSession = (ids, mode, title, voteType) => { noteStudyStart(); setSession({ id: Date.now(), title, mode, ids, slotId: null, voteType: voteType === undefined ? voteTypeFor(mode) : voteType }); };
            const studyFrom = (t) => {
                const g = Sch.groupKey(t);
                const same = items.filter(x => Sch.groupKey(x) === g && Sch.isFilled(x));
                const i = Math.max(0, same.findIndex(x => x.id === t.id));
                noteStudyStart();
                setSession({ id: Date.now(), title: Sch.groupLabel(g), mode: 'flash', voteType: 'flashcard', ids: same.slice(i).concat(same.slice(0, i)).map(x => x.id) });
                dispatch({ type: 'TAB', tab: 'practice' });
            };
            const startWeak = () => {
                const weak = Sch.byGroup(items, groupFilter).filter(t => Sch.isWeak(t)).sort((a, b) => Sch.weakScore(b) - Sch.weakScore(a)).slice(0, 20);
                if (!weak.length) { toast('Không có mục yếu hoặc đến hạn trong nhóm này', 'info'); return; }
                noteStudyStart();
                setSession({ id: Date.now(), title: 'Ôn từ yếu', mode: 'flash', voteType: 'reviewWeak', ids: weak.map(t => t.id) });
                dispatch({ type: 'TAB', tab: 'practice' });
            };

            const groups = useMemo(() => {
                const m = new Map();
                items.forEach(t => { const k = Sch.groupKey(t); m.set(k, (m.get(k) || 0) + 1); });
                return Array.from(m.entries()).sort((a, b) => Sch.groupLabel(a[0]).localeCompare(Sch.groupLabel(b[0]), 'vi'));
            }, [items]);
            useEffect(() => { if (groupFilter !== 'all' && !groups.some(([k]) => k === groupFilter)) setGroupFilter('all'); }, [groups, groupFilter]);

            /* ---------- Kế hoạch ngày ---------- */
            const saveWeek = (w) => {
                const n = Plan.normWeek(w);
                setNextWeek(n);
                Store.prefs.set('nextWeeklyPlan', n);
                toast('Đã lưu. Thay đổi áp dụng từ 00:00 ngày mai', 'info');
            };
            const patchSlot = (id, fn) => setPlan(p => p && Object.assign({}, p, { slots: p.slots.map(s => (s.id === id ? fn(s) : s)) }));
            const snooze = (id) => {
                const d = new Date();
                const min = Math.min(d.getHours() * 60 + d.getMinutes() + 15, 23 * 60 + 59);
                patchSlot(id, s => Object.assign({}, s, { snoozedOnce: true, snoozeMin: min }));
                setSession(s => (s && s.slotId === id ? null : s));
                toast('Ca này lùi 15 phút — chỉ dùng được 1 lần', 'info');
            };
            const finishSlot = ({ slotId, cardsDone, remembered }) => {
                patchSlot(slotId, s => {
                    const book = s.phase2_externalTask && s.phase2_externalTask.hasExternal;
                    return Object.assign({}, s, {
                        status: book ? 'phase2' : 'done',
                        phase2StartedAt: book ? new Date().toISOString() : null,
                        finishedAt: book ? null : new Date().toISOString(),
                        cardsDone, remembered
                    });
                });
                setSession(null);
                setMinimal(false);
                window.scrollTo(0, 0);
            };
            const finishGate = (slotId) => patchSlot(slotId, s => Object.assign({}, s, { status: 'done', finishedAt: new Date().toISOString() }));
            const bankItem = (b) => Object.assign({}, b.item, { id: b.id, group: 'Kho đề EOS · ' + b.code });
            const pickBank = (n) => Sch.shuffle(bankPool).slice(0, n);
            const extrasOf = (deckBank, ids) => {
                const list = (deckBank || []).filter(b => ids.indexOf(b.id) >= 0);
                return { extra: list.map(bankItem), bank: list.reduce((m, b) => { m[b.id] = { item: b.item, packId: b.packId, code: b.code }; return m; }, {}) };
            };
            /* Bộ thẻ của ca theo nguồn đã chọn: Sổ từ (câu sai EOS lên đầu), Kho đề EOS, hoặc trộn nửa-nửa. */
            const deckFor = (slot, limit) => {
                let full = slot.deckIds;
                let deckBank = slot.deckBank || [];
                if (!full || !full.length) {
                    const size = slot.baseCardCount || limit;
                    const src = bankPool.length ? source : 'vocab';
                    const vocabNeed = src === 'eos' ? 0 : src === 'mix' ? Math.ceil(size / 2) : size;
                    let mine = [];
                    if (vocabNeed > 0) {
                        const built = Plan.buildDeck(Object.assign({}, slot, { deckIds: null }), items, vocabNeed).map(t => t.id);
                        /* Câu sai / cắm cờ từ phòng thi EOS đứng đầu (tối đa nửa phần Sổ từ), phần còn lại theo lịch thường. */
                        const queued = (Store.prefs.get(EOS_QUEUE, []) || []).filter(id => itemsById.has(id));
                        const take = queued.slice(0, Math.max(1, Math.ceil(vocabNeed / 2)));
                        mine = take.concat(built.filter(id => take.indexOf(id) < 0)).slice(0, vocabNeed);
                        Store.prefs.set(EOS_QUEUE, queued.slice(take.length));
                    }
                    deckBank = src === 'vocab' ? [] : pickBank(size - mine.length);
                    const theirs = deckBank.map(b => b.id);
                    /* Xen kẽ hai nguồn để ca không dồn một loại về một phía. */
                    full = [];
                    for (let i = 0; full.length < size && (i < mine.length || i < theirs.length); i += 1) {
                        if (i < mine.length) full.push(mine[i]);
                        if (i < theirs.length && full.length < size) full.push(theirs[i]);
                    }
                    const keep = full;
                    if (keep.length) patchSlot(slot.id, sl => Object.assign({}, sl, { deckIds: keep, deckBank }));
                }
                const ids = full.slice(0, limit);
                return Object.assign({ ids }, extrasOf(deckBank, ids));
            };
            /* Câu khởi động: 1 câu ngẫu nhiên từ nguồn đã chọn. "Cả 2" thì bốc thăm; nguồn trống thì lấy nguồn kia. */
            const pickWarm = (key) => {
                const mine = items.filter(Sch.isFilled);
                const fromBank = () => { const b = pickBank(1)[0]; return b ? { item: bankItem(b), bank: { item: b.item, packId: b.packId, code: b.code } } : null; };
                const fromMine = () => { const t = Sch.shuffle(mine)[0]; return t ? { item: t, bank: null } : null; };
                const first = key === 'eos' ? fromBank : key === 'vocab' ? fromMine : (Math.random() < 0.5 ? fromBank : fromMine);
                const second = first === fromBank ? fromMine : fromBank;
                return first() || (key === 'mix' ? second() : null);
            };
            const answerWarm = (warm, ok) => {
                if (!warm) return;
                if (warm.bank) { if (!ok) queueEos([warm.bank]); }
                else review(warm.item.id, ok);
            };
            /* Đổi nguồn: ca chưa bắt đầu soạn lại bộ thẻ theo nguồn mới. */
            const changeSource = (key) => {
                setSource(key);
                Store.prefs.set('slotSource', key);
                setPlan(pl => pl && Object.assign({}, pl, { slots: pl.slots.map(sl => (sl.status === 'pending' && !sl.cardsDone && !(session && session.slotId === sl.id)) ? Object.assign({}, sl, { deckIds: null, deckBank: null }) : sl) }));
                setKick(k => (k ? Object.assign({}, k, { warm: pickWarm(key) }) : k));
            };
            const enterEarly = (slot) => {
                const deck = deckFor(slot, Plan.cardLimit(slot, 'ON_TIME_ACTIVE', false));
                const ids = deck.ids;
                if (!ids.length) { toast('Nhóm này chưa có thẻ', 'error'); return; }
                const mode = sessionModeOf(slot.mode);
                noteStudyStart();
                setSession({ id: Date.now(), title: 'Ca ' + slot.id + ' · ' + slot.anchorLabel, mode: mode, voteType: voteTypeFor(mode), ids, slotId: slot.id, extra: deck.extra, bank: deck.bank });
                dispatch({ type: 'TAB', tab: 'today', force: true });
                window.scrollTo(0, 0);
            };
            const bonus = () => {
                const ids = Sch.shuffle(items.filter(Sch.isFilled)).slice(0, 5).map(t => t.id);
                if (!ids.length) { toast('Chưa có thẻ để học thêm', 'error'); return; }
                noteStudyStart();
                setSession({ id: Date.now(), title: 'Thêm 5 thẻ', mode: 'flash', voteType: 'flashcard', ids, slotId: null, home: true });
                window.scrollTo(0, 0);
            };
            const askNotify = () => {
                if (!window.Notification) { toast('Trình duyệt này không có thông báo', 'error'); return; }
                Notification.requestPermission().then(q => toast(q === 'granted' ? 'Đã bật nhắc khi đến giờ' : 'Chưa bật được thông báo', q === 'granted' ? 'success' : 'info'));
            };

            const goDone = useRef(false);
            useEffect(() => {
                if (!loaded || !planReady || goDone.current) return;
                goDone.current = true;
                let go = '';
                go = readGo();
                if (!go) return;
                try { history.replaceState(null, '', location.pathname); } catch (e) {}
                if (go === 'today' || go === 'plan') dispatch({ type: 'TAB', tab: 'today', force: true });
                else if (go === 'reading' || go === 'import') dispatch({ type: 'TAB', tab: 'library', force: true });
                else if (go === 'exams') dispatch({ type: 'SWITCH_MODE', mode: 'bank', force: true });
                else if (go === 'eos') dispatch({ type: 'SHELF', force: true });
                else if (go === 'pro') setBilling('ai');
                else if (go === 'eos-pay') setBilling('eos');
                else if (go === 'video') setGuideOpen(true);
                else if (go === 'legal-id' || go === 'legal-pay' || go === 'legal-study') setLegalTab(go.slice(6));
            }, [loaded, planReady]);

            const cur = plan ? Plan.currentSlot(plan.slots, new Date(now)) : { kind: 'NONE', slot: null };
            const live = plan && plan.date === Plan.dayKeyOf(new Date(now)) && (cur.kind === 'ON_TIME_ACTIVE' || cur.kind === 'LATE_RECOVERY');
            const liveLimit = live ? Plan.cardLimit(cur.slot, cur.kind, minimal) : 0;

            /* ---------- Đến giờ: gõ chuông và báo, không tự mở màn học. Người dùng bấm bắt đầu trên Tổng quan. ---------- */
            useEffect(() => {
                if (!live || !loaded) return;
                const slot = cur.slot;
                const key = plan.date + '-' + slot.id + '-' + (slot.snoozedOnce ? 's' + slot.snoozeMin : 'n') + '-' + cur.kind;
                if (alerted.current[key]) return;
                alerted.current[key] = true;
                Sfx.knock();
                /* Đến giờ: hiện ngay 1 câu khởi động (không mở cả màn học). Đang học hay đang thi thì không chen ngang. */
                if (!session) setKick({ slotId: slot.id, warm: pickWarm(source) });
                if (document.hidden && window.Notification && Notification.permission === 'granted') {
                    try {
                        const n = new Notification('Đến giờ ca ' + slot.id + ' · ' + slot.anchorLabel, { body: 'Mở FPass: học đủ ca, hoặc Chạm đáy 30 giây để giữ chuỗi.', tag: 'ca-hoc-' + slot.id });
                        n.onclick = () => { window.focus(); n.close(); };
                    } catch (e) {}
                }
            }, [now, plan, live, loaded]);

            /* ---------- Treo tab cả ngày: nháy document.title bằng nội dung thẻ s1 ---------- */
            const s1id = live ? ((cur.slot.deckIds && cur.slot.deckIds.length) ? cur.slot.deckIds : [])[0] : null;
            const s1b = s1id && !itemsById.has(s1id) ? (cur.slot.deckBank || []).find(b => b.id === s1id) : null;
            const s1 = live ? (itemsById.get(s1id) || (s1b ? s1b.item : null)) : null;
            const titleA = live && s1 ? '🔴 [1/' + liveLimit + '] ' + promptOf(s1) : '';
            const titleB = live ? '🔔 Đến giờ ca ' + cur.slot.id + ' · ' + cur.slot.anchorLabel : '';
            useEffect(() => {
                if (!hidden || !titleA) { document.title = BASE_TITLE; return undefined; }
                let flip = false;
                document.title = titleA;
                const id = setInterval(() => { flip = !flip; document.title = flip ? titleB : titleA; }, 1500);
                return () => { clearInterval(id); document.title = BASE_TITLE; };
            }, [hidden, titleA, titleB]);

            /* ---------- Mode 2: tiến độ, license, lịch thi ---------- */
            const reviewPack = (packId, itemId, ok) => {
                const k = progKey(packId, itemId);
                const prev = progressRef.current[k] || { id: k, packId, itemId, srsStage: 0, wrongCount: 0, correctCount: 0, reviewCount: 0, nextReview: null, lastReview: null };
                const r = Sch.applyReview(prev, ok).item;
                const rec = { id: k, packId, itemId, srsStage: r.srsStage, wrongCount: r.wrongCount, correctCount: r.correctCount, reviewCount: r.reviewCount, nextReview: r.nextReview, lastReview: r.lastReview };
                progressRef.current = Object.assign({}, progressRef.current, { [k]: rec });
                setProgress(progressRef.current);
                Store.progress.putMany([rec]).catch(e => toast('Lỗi lưu tiến độ: ' + e.message, 'error'));
            };
            const unlockPack = async (pack, key) => {
                const list = await Vault.unlock(pack, key);
                setUnlocked(u => Object.assign({}, u, { [pack.id]: list }));
                const next = Object.assign({}, licenses, { [pack.id]: Vault.normalizeKey(key) });
                setLicenses(next);
                Store.prefs.set('licenses', next);
                Sfx.milestone();
                toast('Đã mở khóa ' + list.length + ' câu Chặng 2–3 · ' + pack.code, 'success');
            };
            const setExam = (packId, e) => {
                const next = Object.assign({}, exams);
                if (e) next[packId] = e; else delete next[packId];
                setExams(next);
                Store.prefs.set('exams', next);
            };
            const bumpSession = (packId) => {
                const e = exams[packId];
                if (!e) return;
                setExam(packId, Object.assign({}, e, { sessionsDone: (e.sessionsDone || 0) + 1 }));
            };
            const markMilestone = (packId) => {
                const next = Object.assign({}, milestones, { [packId]: true });
                setMilestones(next);
                Store.prefs.set('milestones', next);
            };
            const statsOf = (p) => {
                const all = p.items.concat(unlocked[p.id] || []);
                const c1 = all.filter(t => t.checkpoint === 1);
                return {
                    c1: c1.length,
                    m1: c1.filter(t => isMastered(progress[progKey(p.id, t.id)])).length,
                    mAll: all.filter(t => isMastered(progress[progKey(p.id, t.id)])).length
                };
            };

            const navItems = [
                { k: 'today', icon: 'home', label: 'Tổng quan', short: 'Tổng quan' },
                { k: 'library', icon: 'book', label: 'Sổ từ', short: 'Sổ từ' },
                { k: 'practice', icon: 'target', label: 'Luyện tập', short: 'Luyện tập' },
                { k: 'bank', icon: 'monitor', label: 'Kho đề EOS', short: 'Kho đề' }
            ];
            const navNow = nav.mode === 'bank' ? 'bank' : nav.tab;
            const slotDue = live && navNow !== 'today';
            const goNav = (k) => {
                if (nav.busy && !confirm('Bạn đang giữa một ca / phòng thi. Thoát ra?')) return;
                if (k === 'bank') {
                    dispatch(nav.mode === 'bank' ? { type: 'SHELF', force: true } : { type: 'SWITCH_MODE', mode: 'bank', force: true });
                } else {
                    /* Về Tổng quan là thoát màn học; ca đang dở vẫn học tiếp được từ thẻ tâm điểm. */
                    if (k === 'today') setSession(null);
                    else if (k === 'library') setSession(s => (s && s.slotId ? s : null));
                    dispatch({ type: 'TAB', tab: k, force: true });
                }
                window.scrollTo(0, 0);
            };
            /* Mở thẳng "AI quét bài đọc" ở Sổ từ từ bất kỳ đâu (thanh điều hướng). */
            const openReading = () => {
                if (nav.busy && !confirm('Bạn đang giữa một ca / phòng thi. Thoát ra?')) return;
                setSession(s => (s && s.slotId ? s : null));
                window.__fpassGo = 'reading';
                dispatch({ type: 'TAB', tab: 'library', force: true });
                window.scrollTo(0, 0);
                /* Sổ từ đang mở sẵn thì không mount lại: báo qua sự kiện. */
                window.setTimeout(() => { if (window.__fpassGo === 'reading') { window.__fpassGo = ''; window.dispatchEvent(new CustomEvent('edu-reading')); } }, 0);
            };
            /* Banner "Chốt nhanh 30s": đang trong ca thì vào ca bản Chạm đáy; ngoài ca thì lật 2 thẻ (hoặc số thẻ còn thiếu hôm nay), từ yếu trước. */
            const quickVote = () => {
                const slotNow = cur.slot;
                if (slotNow && (cur.kind === 'ON_TIME_ACTIVE' || cur.kind === 'LATE_RECOVERY')) { startSlot(true); return; }
                const filled = items.filter(Sch.isFilled);
                const base = readMission();
                const need = Math.max(1, MISSION_GOAL - base);
                if (filled.length < need) { toast('Cần ít nhất ' + need + ' thẻ có nghĩa để chốt phiếu. Thêm 1–2 từ nhé.', 'info'); return; }
                const weak = filled.filter(t => Sch.isWeak(t)).sort((a, b) => Sch.weakScore(b) - Sch.weakScore(a));
                const rest = Sch.shuffle(filled.filter(t => weak.indexOf(t) < 0));
                const ids = weak.concat(rest).slice(0, need).map(t => t.id);
                noteStudyStart();
                setSession({ id: Date.now(), title: 'Chốt nhanh 30s · ' + need + ' thẻ', mode: 'flash', voteType: 'flashcard', ids: ids, lean: true, need: need, mission: true, missionBase: base });
                dispatch({ type: 'TAB', tab: 'practice', force: true });
                window.scrollTo(0, 0);
            };
            /* Nội dung menu dọc: dùng chung cho sidebar máy tính và menu trượt trên điện thoại. */
            const sideBody = () => (
                <>
                    <nav aria-label="Mục chính" className="flex flex-col gap-1">
                        {navItems.map(it => (
                            <button key={it.k} type="button" className="side-link" aria-current={navNow === it.k ? 'page' : undefined} onClick={() => goNav(it.k)}>
                                <Icon name={it.icon} size={18} /> <span className="min-w-0 flex-1 truncate text-left">{it.label}</span>
                                {it.k === 'today' && slotDue && <><span className="side-dot" aria-hidden="true" /><span className="sr-only">, có ca học đến giờ</span></>}
                            </button>
                        ))}
                        <button type="button" className="side-link side-ai" onClick={openReading}>
                            <Icon name="sparkles" size={18} /> <span className="min-w-0 flex-1 truncate text-left">AI quét bài đọc</span><span className="side-new">AI</span>
                        </button>
                    </nav>
                    <p className="side-head">Kho đề của tôi</p>
                    {myPacks.length ? (
                        <div className="flex flex-col gap-0.5">
                            {myPacks.map(pk => (
                                <button key={pk.id} type="button" className="side-link side-sub" title={pk.name} aria-current={nav.mode === 'bank' && nav.packId === pk.id ? 'page' : undefined} onClick={() => openMyPack(pk.id)}>
                                    <span className="side-code">{pk.code}</span><span className="min-w-0 flex-1 truncate text-left">{pk.name}</span>
                                </button>
                            ))}
                        </div>
                    ) : <p className="px-3 text-xs leading-5 text-muted">Môn bạn thi thử sẽ hiện ở đây để mở lại nhanh.</p>}
                    <p className="side-head">Khác</p>
                    <div className="flex flex-col gap-1">
                        <button type="button" className="side-link side-gem" onClick={() => setBilling('ai')}><Icon name="gem" size={18} /> Gói & Nhập mã</button>
                        <button type="button" className="side-link" onClick={() => setGuideOpen(true)}><Icon name="play" size={18} /> Video hướng dẫn</button>
                        <button type="button" className="side-link" onClick={openSupport}><Icon name="headset" size={18} /> Hỗ trợ & FAQ</button>
                        <button type="button" className="side-link" onClick={openFeedback}><Icon name="bulb" size={18} /> Góp ý</button>
                    </div>
                </>
            );
            const openMyPack = (id) => {
                if (nav.busy && !confirm('Bạn đang giữa một ca / phòng thi. Thoát ra?')) return;
                setSession(s => (s && s.slotId ? s : null));
                dispatch({ type: 'OPEN_PACK', id, force: true });
                window.scrollTo(0, 0);
            };
            /* Lối vào 4 trụ cột từ Tổng quan. */
            const openPillar = (key) => {
                if (key === 'video') { setGuideOpen(true); return; }
                if (key === 'vocab') { dispatch({ type: 'TAB', tab: 'library', force: true }); window.scrollTo(0, 0); return; }
                if (key === 'eos') window.__fpassGo = 'eos';
                dispatch({ type: 'SHELF', force: true });
                window.scrollTo(0, 0);
            };
            const pack = nav.packId ? packById.get(nav.packId) : null;
            const screenNow = (() => {
                const bits = [];
                if (nav.mode === 'self') bits.push(nav.tab === 'library' ? 'Kho của tôi' : nav.tab === 'practice' ? 'Luyện tự do' : 'Hôm nay');
                else if (pack) bits.push((pack.code ? pack.code + ' · ' : '') + (pack.name || 'Đề'));
                else bits.push('Kệ đề');
                if (session && session.title) bits.push(session.title);
                return bits.join(' · ').slice(0, 160);
            })();
            const openFeedback = () => {
                setSupportOpen(false);
                setLegalTab(null);
                setFeedbackOpen(true);
            };
            const goHome = () => {
                if (nav.busy && !confirm('Bạn đang giữa một ca / phòng thi. Thoát ra?')) return;
                setSession(null);
                setSettingsOpen(false);
                setBilling(null);
                setLegalTab(null);
                setSupportOpen(false);
                setFeedbackOpen(false);
                setContribOpen(false);
                dispatch({ type: 'TAB', tab: 'today', force: true });
                window.scrollTo(0, 0);
            };

            return (
                <div className="app-root min-h-screen flex flex-col" data-tier={tierAttr}>
                    <a href="#main" className="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[70] btn btn-primary">Bỏ qua tới nội dung</a>
                    <header className={'sticky top-0 z-50 border-b ' + (darkSkin ? 'obsidian-head' : luxSkin ? 'ivory-head' : 'border-line')} style={luxSkin ? undefined : { background: '#E2E8F0' }}>
                        <div className="flex h-16 w-full items-center gap-2 px-4 sm:gap-3 lg:px-6">
                            <button type="button" className="btn btn-ghost btn-icon -ml-2 lg:hidden" onClick={() => setDrawer(true)} aria-label="Mở menu" aria-expanded={drawer} aria-controls="side-drawer"><Icon name="menu" /></button>
                            <button type="button" onClick={goHome} aria-label="Về Tổng quan" className="flex shrink-0 items-center gap-2.5 border-0 bg-transparent p-0 text-left cursor-pointer">
                                <span className={luxSkin ? 'ob-logo' : ''}>
                                    <img src="/public/stickers/logo.png" alt="" className="h-9 w-auto object-contain sm:h-10" />
                                </span>
                                <span className={'text-xl font-extrabold leading-none sm:text-2xl ' + (luxSkin ? 'ob-word' : 'text-[#0B192C]')}>FPass</span>
                            </button>
                            <div className="ml-auto flex min-w-0 items-center gap-1">
                                {/* Liên hệ: Zalo + hotline trên màn rộng, một nút mở khung Hỗ trợ trên điện thoại. */}
                                <div className={'top-contact mr-1 hidden md:flex' + (darkSkin ? ' is-dark' : '')}>
                                    <a href={SUPPORT.zalo} target="_blank" rel="noopener noreferrer" aria-label="Nhắn Zalo hỗ trợ"><Icon name="chat" size={15} /> Zalo</a>
                                    <a href={'tel:' + SUPPORT.phone} aria-label={'Gọi hỗ trợ ' + SUPPORT.phoneDisplay}><Icon name="headset" size={15} /> <span className="tnum">{SUPPORT.phoneDisplay}</span></a>
                                </div>
                                <button type="button" className="btn btn-ghost btn-icon hidden sm:inline-flex md:hidden" onClick={openSupport} aria-label="Liên hệ hỗ trợ"><Icon name="headset" /></button>
                                {obsidian && (
                                    <button type="button" onClick={() => setMemberOpen(true)} className="ob-chip">
                                        <Icon name="gem" size={13} /> Obsidian
                                    </button>
                                )}
                                <button type="button" className="btn btn-ghost btn-icon hidden sm:inline-flex lg:hidden" onClick={() => setGuideOpen(true)} aria-label="Video hướng dẫn"><Icon name="play" size={16} /></button>
                                {!obsidian && <button type="button" className="top-plan lg:hidden" onClick={() => setBilling('ai')} aria-label="Gói & Nhập mã" title="Gói & Nhập mã"><Icon name="gem" size={15} /> <span>Gói</span></button>}
                                <button type="button" className="btn btn-ghost btn-icon hidden sm:inline-flex" onClick={() => setMuted(!muted)} aria-pressed={!muted} aria-label={muted ? 'Bật âm thanh' : 'Tắt âm thanh'}><Icon name={muted ? 'mute' : 'volume'} /></button>
                                <button type="button" className={'btn btn-sm ' + (googleAccount && googleAccount.email ? 'min-w-0 btn-secondary' : 'shrink-0 whitespace-nowrap btn-primary')} onClick={() => { setPendingGift(''); setGoogleReason('save'); setGoogleOpen(true); }}>
                                    <span className="block max-w-[150px] truncate sm:max-w-[200px]">{googleAccount && googleAccount.email ? googleAccount.email : 'Đăng nhập'}</span>
                                </button>
                                <button type="button" className="btn btn-ghost btn-icon" onClick={() => setSettingsOpen(true)} aria-label="Cài đặt"><Icon name="sliders" /></button>
                            </div>
                        </div>
                    </header>

                    <div className="flex w-full flex-1">
                    <aside className="app-side" data-tier={tierAttr} aria-label="Điều hướng">
                        {sideBody()}
                    </aside>
                    {drawer && (
                        <div className="side-scrim lg:hidden" onMouseDown={(e) => { if (e.target === e.currentTarget) setDrawer(false); }}>
                            <div id="side-drawer" ref={drawerRef} role="dialog" aria-modal="true" aria-label="Menu" className="app-side is-drawer" data-tier={tierAttr}
                                onClick={(e) => { if (e.target.closest && e.target.closest('button')) setDrawer(false); }}>
                                <div className="side-drawer-head">
                                    <span className="flex items-center gap-2">
                                        <span className={luxSkin ? 'ob-logo' : ''}><img src="/public/stickers/logo.png" alt="" className="h-8 w-auto object-contain" /></span>
                                        <b className={'text-lg font-extrabold leading-none ' + (luxSkin ? 'ob-word' : 'text-[#0B192C]')}>FPass</b>
                                    </span>
                                    <button type="button" className="side-close" aria-label="Đóng menu"><Icon name="x" size={18} /></button>
                                </div>
                                {obsidian && <button type="button" className="ob-chip is-wide" onClick={() => setMemberOpen(true)}><Icon name="gem" size={13} /> Thẻ hội viên Obsidian</button>}
                                {sideBody()}
                            </div>
                        </div>
                    )}
                    <main id="main" className="min-w-0 flex-1 px-4 py-6 lg:px-8">
                        {!loaded ? (
                            <p className="text-center text-muted py-16">Đang mở kho dữ liệu…</p>
                        ) : nav.mode === 'self' ? (
                            nav.tab === 'today' ? (
                                <TodayView plan={plan} planReady={planReady} week={week} nextWeek={nextWeek} now={now} items={items} itemsById={itemsById} groups={groups}
                                    session={session} cur={cur} saveWeek={saveWeek} addItems={addItems} finishGate={finishGate}
                                    snooze={snooze} askNotify={askNotify} bonus={bonus} closeSession={() => { setSession(null); setMinimal(false); window.scrollTo(0, 0); }} startSession={restartSession} onBurst={startQuickBurst}
                                    review={reviewSlot} patch={patch} toast={toast} finishSlot={finishSlot} source={source} onSource={changeSource} bankCount={bankPool.length}
                                    onStudyNow={studyNow} onStart={startSlot} onPillar={openPillar} onLogin={() => { setPendingGift(''); setGoogleReason('save'); setGoogleOpen(true); }}
                                    onSetup={openSetup} account={account} setupDone={setupDone} onAddFirst={() => { dispatch({ type: 'TAB', tab: 'library' }); window.scrollTo(0, 0); }} />
                            ) : nav.tab === 'library' ? (
                                <LibraryView items={items} setItems={setItems} groups={groups} groupFilter={groupFilter} setGroupFilter={setGroupFilter}
                                    onPractice={startPractice} onWeak={startWeak} onStudyFrom={studyFrom} onQuickVote={quickVote} toast={toast} mergeItems={mergeItems} />
                            ) : (
                                <PracticeHub items={items} itemsById={itemsById} groups={groups} groupFilter={groupFilter} setGroupFilter={setGroupFilter}
                                    session={session && !session.slotId ? session : null} startSession={restartSession} closeSession={() => setSession(null)}
                                    review={review} patch={patch} toast={toast} onPractice={startPractice} onWeak={startWeak} queueEos={queueEos} onOpenSlots={openSlots} />
                            )
                        ) : pack && pack.status === 'ready' ? (
                            <div>
                                {nav.view === 'pack' && <button type="button" className="btn btn-ghost btn-sm mb-3 -ml-2" onClick={() => dispatch({ type: 'SHELF' })}><Icon name="back" size={14} /> Kệ đề</button>}
                                <PackScreen key={pack.id} pack={pack} view={nav.view} setView={(v) => dispatch({ type: 'PACK_VIEW', view: v })} progress={progress} reviewPack={reviewPack}
                                    unlockedItems={unlocked[pack.id]} onUnlock={unlockPack} exam={exams[pack.id]} setExam={setExam} bumpSession={bumpSession}
                                    milestoneShown={!!milestones[pack.id]} markMilestone={markMilestone} toast={toast} now={now} queueEos={queueEos} onOpenSlots={openSlots} />
                            </div>
                        ) : (
                            <>
                            {myPacks.length > 0 && (
                                <div className="mb-4 lg:hidden">
                                    <p className="mb-2 text-xs font-semibold uppercase tracking-[0.12em] text-muted">Kho đề của tôi</p>
                                    <div className="flex gap-2 overflow-x-auto pb-1">
                                        {myPacks.map(pk => (
                                            <button key={pk.id} type="button" className="my-pack" onClick={() => openMyPack(pk.id)} title={pk.name}>
                                                <span className="side-code">{pk.code}</span><span className="max-w-[10rem] truncate">{pk.name}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}
                            <StorefrontHost packs={packs} block={nav.block} setBlock={(b) => dispatch({ type: 'BLOCK', block: b })} statsOf={statsOf}
                                unlockedIds={Object.keys(unlocked)} exams={exams} openPack={(id) => dispatch({ type: 'OPEN_PACK', id })} toast={toast} now={now} />
                            </>
                        )}
                    </main>
                    </div>

                    <nav aria-label="Mục chính" className="bnav" data-tier={tierAttr}>
                        {navItems.map(it => (
                            <button key={it.k} type="button" aria-current={navNow === it.k ? 'page' : undefined} onClick={() => goNav(it.k)}>
                                <Icon name={it.icon} size={20} /> {it.short}
                                {it.k === 'today' && slotDue && <><span className="nav-dot" aria-hidden="true" /><span className="sr-only">, có ca học đến giờ</span></>}
                            </button>
                        ))}
                    </nav>
                    <footer className="border-t border-[#1E293B] bg-[#0F172A] text-slate-200">
                        <div className="max-w-7xl mx-auto px-4 pt-4 pb-24 lg:pb-4 sm:pr-40 flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
                            <div>
                                <p className="text-sm font-semibold text-slate-100">FPass <span className="font-normal text-slate-400">— Đúng nhịp học, vững phòng thi</span></p>
                                <p className="mt-1 text-[13px] font-normal text-[#9ca3af]">© 2026 FPass · @nvn.n07</p>
                                <p className="mt-1 inline-flex items-center gap-2 text-xs text-slate-300">
                                    <span className="foot-live" aria-hidden="true" />
                                    Hệ thống cấp lượt tự động 24/7: Hoạt động ổn định
                                </p>
                            </div>
                            <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-end">
                                <nav aria-label="Pháp lý" className="flex flex-wrap items-center gap-x-2 gap-y-1 text-xs">
                                    <button type="button" className="text-slate-100 underline-offset-2 hover:underline" onClick={() => openLegal('id')}>Điều khoản & Mã định danh</button>
                                    <span aria-hidden="true" className="text-slate-500">•</span>
                                    <button type="button" className="text-slate-100 underline-offset-2 hover:underline" onClick={() => openLegal('pay')}>Chính sách Thanh toán</button>
                                    <span aria-hidden="true" className="text-slate-500">•</span>
                                    <button type="button" className="text-slate-100 underline-offset-2 hover:underline" onClick={() => openLegal('study')}>Miễn trừ Học thuật</button>
                                    <span aria-hidden="true" className="text-slate-500">•</span>
                                    <button type="button" data-help-open className="inline-flex items-center min-h-[44px] px-1 text-slate-100 underline-offset-2 hover:underline" aria-expanded={supportOpen} aria-controls="fpass-help" aria-haspopup="dialog" onClick={() => { if (supportOpen) setSupportOpen(false); else openSupport(); }}>Hỗ trợ</button>
                                    <span aria-hidden="true" className="text-slate-500">•</span>
                                    <button type="button" className="inline-flex items-center min-h-[44px] px-1 text-slate-100 underline-offset-2 hover:underline" aria-expanded={feedbackOpen} aria-controls="fpass-feedback-title" aria-haspopup="dialog" onClick={openFeedback}>Góp ý & Báo lỗi</button>
                                </nav>
                            </div>
                        </div>
                    </footer>
                    {settingsOpen && <SettingsModal onClose={() => setSettingsOpen(false)} toast={toast} muted={muted} setMuted={setMuted} onGoogle={() => { setSettingsOpen(false); setPendingGift(''); setGoogleReason('save'); setGoogleOpen(true); }} />}
                    {googleOpen && <GoogleSaveModal pendingCode={pendingGift} reason={googleReason} toast={toast} onClose={() => { setGoogleOpen(false); setPendingGift(''); }} onDone={(user) => {
                        setGoogleAccount(user);
                        setGoogleOpen(false);
                        setPendingGift('');
                        /* Đăng nhập xong mới mở bước đặt lịch. Đang thanh toán thì không chen ngang. */
                        if (googleReason !== 'pay' && !Store.prefs.get('setupDone', false)) setSetupOpen(true);
                    }} />}
                    {guideOpen && <GuideModal onClose={() => setGuideOpen(false)} />}
                    {kick && live && !session && cur.slot && cur.slot.id === kick.slotId && (
                        <FlowKick slot={cur.slot} kind={cur.kind} warm={kick.warm} source={source} bankCount={bankPool.length} onSource={changeSource}
                            cardCount={Plan.cardLimit(cur.slot, cur.kind, false)} onAnswer={answerWarm}
                            onStart={(lean) => { setKick(null); dispatch({ type: 'TAB', tab: 'today', force: true }); startSlot(lean); }}
                            onLater={() => setKick(null)} />
                    )}
                    {setupOpen && <SetupWizard week={week} groups={groups} onSave={applySetup} onClose={() => setSetupOpen(false)} />}
                    {billing && <BillingHub toast={toast} tab={billing} onClose={() => setBilling(null)} />}
                    {legalTab && <LegalModal tab={legalTab} onClose={() => setLegalTab(null)} onSupport={openSupport} />}
                    {contribOpen && <ContributeModal pack={null} toast={toast} onClose={() => setContribOpen(false)} />}
                    <SupportDock open={supportOpen} toast={toast} returnTo={helpReturn} onOpen={(el) => { helpReturn.current = el || document.activeElement; setFeedbackOpen(false); setSupportOpen(true); }} onClose={() => setSupportOpen(false)} onFeedback={openFeedback} />
                    {feedbackOpen && <FeedbackModal screen={screenNow} onClose={() => setFeedbackOpen(false)} />}
                    {memberOpen && obsidian && <MembershipDesk fund={fund} units={items.filter(Sch.isFilled).length} reviews={items.reduce((n, t) => n + (t.reviewCount || 0), 0)} onClose={() => setMemberOpen(false)} />}
                    {welcome && obsidian && (
                        <ObsidianWelcome fund={fund} onSkip={() => setWelcome(false)} onExplore={() => { setWelcome(false); setMemberOpen(true); }} />
                    )}
                    <Toasts list={toasts} />
                </div>
            );
        };

        const StorefrontHost = (props) => {
            const [contrib, setContrib] = useState(null);
            const [open, setOpen] = useState(false);
            return (
                <>
                    <Storefront {...props} onContribute={(p) => { setContrib(p); setOpen(true); }} />
                    {open && <ContributeModal pack={contrib} toast={props.toast} onClose={() => setOpen(false)} />}
                </>
            );
        };

        E.Keys.install();
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
