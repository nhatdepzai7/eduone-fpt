    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        canvas: 'var(--bg)', surface: 'var(--surface)', surface2: 'var(--surface-2)', line: 'var(--border)',
                        ink: 'var(--ink)', ink2: 'var(--ink-2)', muted: 'var(--muted)',
                        primary: 'var(--primary)', 'primary-hover': 'var(--primary-hover)', 'primary-soft': 'var(--primary-soft)',
                        success: 'var(--success)', 'success-soft': 'var(--success-soft)',
                        danger: 'var(--danger)', 'danger-soft': 'var(--danger-soft)',
                        warn: 'var(--warn)', 'warn-soft': 'var(--warn-soft)',
                        eos: 'var(--eos-head)'
                    },
                    fontFamily: {
                        sans: ['"Be Vietnam Pro"', 'system-ui', 'Segoe UI', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'ui-monospace', 'Consolas', 'monospace']
                    }
                }
            }
        };
    </script>
    <style>
        :root {
            --bg: #E2E8F0; --surface: #FFFFFF; --surface-2: #F1F5F9; --border: #DCE0E8;
            --ink: #111827; --ink-2: #374151; --muted: #5B6474;
            --primary: #4338CA; --primary-hover: #3730A3; --primary-soft: #EEF0FF;
            --success: #047857; --success-soft: #ECFDF5;
            --danger: #BE123C; --danger-soft: #FFF1F2;
            --warn: #B45309; --warn-soft: #FFFBEB;
            --mark: #FDE68A; --eos-head: #1E3A8A;
        }
        html { -webkit-text-size-adjust: 100%; }
        .cmd-card { position: relative; overflow: hidden; border-radius: 24px; background: linear-gradient(135deg, #312E81 0%, #4338CA 55%, #6366F1 100%); color: #fff; box-shadow: 0 24px 40px -24px rgba(49, 46, 129, .75), 0 0 0 1px rgba(255, 255, 255, .06) inset; }
        .cmd-card::after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 999px; background: rgba(255, 255, 255, .08); pointer-events: none; }
        .cmd-pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; }
        .cmd-slot { flex: 1 1 0; min-width: 0; border-radius: 12px; padding: 8px 6px; text-align: center; font-size: 12px; font-weight: 700; background: rgba(255, 255, 255, .12); color: #E0E7FF; }
        .cmd-slot.is-done { background: #10B981; color: #fff; }
        .cmd-slot.is-now { background: #fff; color: #312E81; box-shadow: 0 6px 16px -8px rgba(0, 0, 0, .5); }
        .cmd-go { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: 16px; background: #fff; color: #312E81; font-weight: 800; font-size: 16px; box-shadow: 0 10px 22px -12px rgba(0, 0, 0, .6); transition: transform .15s ease; }
        .cmd-go:hover { transform: translateY(-1px); }
        .cmd-go:disabled { opacity: .6; cursor: not-allowed; transform: none; }
        .cmd-link { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-radius: 12px; font-size: 14px; font-weight: 600; color: #E0E7FF; }
        .cmd-link:hover { background: rgba(255, 255, 255, .12); color: #fff; }
        .cmd-alt { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 18px; border-radius: 16px; background: rgba(255, 255, 255, .12); color: #fff; font-weight: 700; font-size: 15px; border: 1px solid rgba(255, 255, 255, .3); transition: background .15s ease; }
        .cmd-alt:hover { background: rgba(255, 255, 255, .22); }
        .slot-path { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
        .slot-path::before { content: ""; position: absolute; left: 16.66%; right: 16.66%; top: 17px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .22); }
        .slot-node { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; }
        .slot-dot { width: 36px; height: 36px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; background: #3F3B9A; color: #C7D2FE; box-shadow: 0 0 0 3px rgba(255, 255, 255, .16); }
        .slot-node.is-done .slot-dot { background: #10B981; color: #fff; box-shadow: 0 0 0 3px rgba(16, 185, 129, .35); }
        .slot-node.is-now .slot-dot { background: #fff; color: #312E81; animation: nowRing 1.8s ease-in-out infinite; }
        .slot-node.is-off .slot-dot { opacity: .45; }
        .slot-time { margin-top: 6px; font-size: 13px; font-weight: 700; color: #fff; }
        .slot-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; font-weight: 500; color: #C7D2FE; }
        @keyframes nowRing { 0%, 100% { box-shadow: 0 0 0 4px rgba(255, 255, 255, .35); } 50% { box-shadow: 0 0 0 9px rgba(255, 255, 255, .06); } }
        .pillar { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; height: 100%; text-align: left; border-radius: 20px; padding: 16px; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 1px 2px rgba(15, 23, 42, .04); transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
        .pillar:hover { transform: translateY(-2px); box-shadow: 0 16px 30px -20px rgba(15, 23, 42, .4); border-color: #C7D2FE; }
        .pillar-ic { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
        .pillar-go { margin-top: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; }
        .app-side { display: none; }
        @media (min-width: 1024px) {
            .app-side { position: sticky; top: 65px; display: flex; flex-direction: column; flex-shrink: 0; width: 232px; height: calc(100vh - 65px); padding: 20px 12px 16px; border-right: 1px solid var(--border); overflow-y: auto; }
        }
        body:has(.eos-shell) .app-side { display: none; }
        .side-link { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 0 12px; border-radius: 12px; font-size: 14px; font-weight: 600; color: var(--ink-2); transition: background .15s ease, color .15s ease; }
        .side-link svg { color: var(--muted); flex-shrink: 0; }
        .side-link:hover:not([aria-current="page"]) { background: rgba(255, 255, 255, .55); color: var(--ink); }
        .side-link[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(15, 23, 42, .12); }
        .side-link[aria-current="page"] svg { color: var(--primary); }
        .side-link[aria-current="page"]::before { content: ""; position: absolute; left: -12px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--primary); }
        .side-sub { min-height: 38px; gap: 8px; font-weight: 500; font-size: 13px; }
        .side-code { flex-shrink: 0; padding: 2px 6px; border-radius: 6px; background: var(--primary-soft); color: var(--primary); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; font-weight: 700; }
        .side-sub[aria-current="page"] .side-code { background: var(--primary); color: #fff; }
        .my-pack { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; min-height: 40px; padding: 0 12px 0 8px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; font-weight: 600; color: var(--ink); }
        .my-pack:hover { border-color: var(--primary); }
        .side-dot { width: 8px; height: 8px; border-radius: 999px; background: #EF4444; flex-shrink: 0; }
        .side-head { margin: 20px 12px 6px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
        .top-contact { align-items: center; gap: 2px; padding: 3px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); }
        .top-contact a { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
        .top-contact a:hover { background: var(--surface); color: var(--primary); }
        .top-contact.is-dark { background: #202637; border-color: #2A3142; }
        .top-contact.is-dark a { color: #C6CBD4; }
        .top-contact.is-dark a:hover { background: #F8F9FC; color: #0B192C; }
        .nav-dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 999px; background: #EF4444; box-shadow: 0 0 0 2px var(--surface-2); }
        .bnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: rgba(255, 255, 255, .96); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
        .bnav button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 58px; font-size: 11px; font-weight: 600; color: var(--muted); }
        .bnav button[aria-current="page"] { color: var(--primary); }
        .bnav button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--primary); }
        .bnav .nav-dot { top: 8px; right: calc(50% - 18px); box-shadow: 0 0 0 2px #fff; }
        @media (min-width: 1024px) { .bnav { display: none; } }
        @media (max-width: 1023px) { body .help-dock { bottom: calc(70px + env(safe-area-inset-bottom)); } }
        body:has(.eos-shell) .bnav { display: none; }
        .id-invite { display: inline-flex; align-items: center; gap: 4px; min-height: 34px; padding: 0 12px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); border: 1px dashed var(--primary); font-size: 13px; font-weight: 700; white-space: nowrap; transition: background .15s ease, color .15s ease; }
        .id-invite:hover { background: var(--primary); color: #fff; }
        .fund-strip { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 40px; margin-bottom: 12px; padding: 0 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; color: var(--ink-2); text-align: left; white-space: nowrap; overflow: hidden; }
        .fund-strip:hover { border-color: var(--primary); }
        .fund-strip svg { color: var(--muted); flex-shrink: 0; }
        /* CTA gói AI: pill nhạt khi còn nhiều lượt, nút tím đậm khi còn <= 20 lượt. */
        .fund-cta { margin-left: auto; flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; min-height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 700; transition: background .15s ease, transform .15s ease; }
        .fund-cta.is-soft { background: rgba(124, 58, 237, .08); border: 1px solid rgba(124, 58, 237, .28); color: var(--primary); }
        .fund-cta.is-soft svg { color: var(--primary); }
        .fund-strip:hover .fund-cta.is-soft { background: rgba(124, 58, 237, .14); }
        .fund-cta.is-hot { background: var(--primary); border: 1px solid var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(124, 58, 237, .35); }
        .fund-cta.is-hot svg { color: #fff; }
        .fund-strip:hover .fund-cta.is-hot { transform: translateY(-1px); }
        .lib-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 45; width: min(19rem, calc(100vw - 2rem)); padding: 6px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 12px 32px rgba(15, 23, 42, .18); }
        .lib-menu button { display: flex; align-items: flex-start; gap: 10px; width: 100%; padding: 10px; border-radius: 10px; text-align: left; color: var(--ink); }
        .lib-menu button:hover:not(:disabled) { background: var(--surface-2); }
        .lib-menu button:disabled { opacity: .45; }
        .lib-menu svg { margin-top: 2px; color: var(--primary); flex-shrink: 0; }
        .lib-menu b { display: block; font-size: 14px; font-weight: 600; }
        .lib-menu button.is-danger { margin-top: 4px; border-top: 1px solid var(--border); border-radius: 0 0 10px 10px; color: #B91C1C; }
        .lib-menu button.is-danger svg { color: #DC2626; }
        .lib-menu button.is-danger:hover:not(:disabled) { background: #FEF2F2; }
        .lib-menu small { display: block; margin-top: 1px; font-size: 12px; line-height: 1.4; color: var(--muted); }
        .lib-row { display: flex; gap: 10px; padding: 10px 12px 10px 0; }
        .lib-bar { width: 3px; flex-shrink: 0; border-radius: 0 3px 3px 0; }
        .lib-word { min-width: 0; padding-top: 4px; text-align: left; font-size: 15px; font-weight: 700; line-height: 1.4; color: var(--primary); word-break: normal; overflow-wrap: break-word; hyphens: auto; }
        .lib-tag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); font-size: 11px; font-weight: 600; line-height: 18px; vertical-align: 2px; }
        .ai-field { position: relative; display: block; }
        .ai-field > .field { padding-right: 92px; }
        .ai-field > textarea.field { padding-right: 112px; }
        .ai-pin { position: absolute; right: 6px; top: 6px; display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--primary); background: rgba(124, 58, 237, .08); border: 1px solid rgba(124, 58, 237, .28); white-space: nowrap; transition: background .15s ease; }
        .ai-pin:hover:not(:disabled) { background: rgba(124, 58, 237, .16); }
        .ai-pin:disabled { opacity: .45; cursor: not-allowed; }
        .ai-pin.is-mini { height: 26px; padding: 0 8px; }
        .ai-field:has(.ai-pin.is-mini) > .field { padding-right: 60px; }
        .batch-add { border-color: rgba(124, 58, 237, .35); box-shadow: 0 0 0 3px rgba(124, 58, 237, .08); }
        .batch-row { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; }
        .batch-num { width: 20px; padding-top: 11px; font-size: 12px; color: var(--muted); text-align: right; flex-shrink: 0; }
        .lib-act { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 9px; color: var(--muted); }
        .lib-act:hover:not(:disabled) { background: var(--surface-2); color: var(--primary); }
        .lib-act:disabled { opacity: .35; }
        .lib-mean { font-size: 14px; line-height: 1.5; color: var(--ink); word-break: normal; overflow-wrap: break-word; }
        .lib-group { flex-shrink: 0; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; padding: 0 6px; border-radius: 6px; background: var(--surface-2); color: var(--muted); font-size: 11px; line-height: 18px; }
        @media (max-width: 767px) { .help-dock .help-launch { display: none; } }
        .src-pick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface-2); }
        .src-opt { display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 36px; padding: 0 6px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; transition: background .15s ease, color .15s ease; }
        .src-opt:hover:not(:disabled) { color: var(--ink); }
        .src-opt.is-on { background: var(--surface); color: var(--primary); box-shadow: 0 1px 3px rgba(15, 23, 42, .12); }
        .src-opt:disabled { opacity: .45; cursor: not-allowed; }
        .warm-opt { display: flex; align-items: flex-start; gap: 6px; width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); text-align: left; font-size: 14px; line-height: 1.5; color: var(--ink); transition: border-color .15s ease, background .15s ease; }
        .warm-opt:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-soft); }
        .warm-opt:disabled { cursor: default; }
        .warm-opt.is-good { border-color: var(--success); background: var(--success-soft); color: var(--success); }
        .warm-opt.is-bad { border-color: #DC2626; background: #FEF2F2; color: #B91C1C; }
        .id-edit { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; margin-left: 4px; vertical-align: middle; border-radius: 10px; color: var(--muted); transition: background .15s ease, color .15s ease; }
        .id-edit:hover { background: var(--primary-soft); color: var(--primary); }
        .stat-pill { position: relative; display: inline-flex; align-items: center; gap: 5px; min-height: 32px; padding: 0 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); color: var(--ink-2); font-size: 13px; font-weight: 500; white-space: nowrap; }
        .stat-pill b { color: var(--ink); font-weight: 700; }
        .stat-pill svg { color: var(--muted); }
        .stat-pill.is-vote.is-on { border-color: var(--primary); background: var(--primary-soft); }
        .stat-pill.is-vote.is-on svg, .stat-pill.is-vote.is-on b { color: var(--primary); }
        .stat-pill.is-streak.is-on svg { color: #EA580C; }
        .stat-pill.is-slot.is-on { border-color: var(--success); background: var(--success-soft); }
        .stat-pill.is-slot.is-on svg, .stat-pill.is-slot.is-on b { color: var(--success); }
        @keyframes voteBump { 0% { transform: scale(1); } 35% { transform: scale(1.12); } 100% { transform: scale(1); } }
        @keyframes votePlus { 0% { opacity: 0; transform: translate(-50%, 4px); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -18px); } }
        .stat-pill.is-bump { animation: voteBump .5s ease-out 2; }
        .vote-plus { position: absolute; left: 50%; top: -4px; font-size: 12px; font-weight: 800; color: var(--primary); pointer-events: none; animation: votePlus 1.6s ease-out forwards; }
        @media (prefers-reduced-motion: reduce) { .slot-node.is-now .slot-dot { animation: none; } .pillar:hover { transform: none; } .stat-pill.is-bump { animation: none; } .vote-plus { animation: none; opacity: 1; } }
        .guide-frame { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: #0F172A; }
        .guide-frame.is-tall { aspect-ratio: 9 / 16; max-width: 340px; margin: 0 auto; }
        .guide-frame iframe, .guide-frame video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
        .pay-gate { border-radius: 16px; border: 1.5px dashed #A5B4FC; background: #EEF2FF; padding: 16px; }
        body { font-family: 'Be Vietnam Pro', system-ui, 'Segoe UI', sans-serif; color: var(--ink); background: radial-gradient(1100px 520px at 50% -8%, #F8FAFC 0%, rgba(248, 250, 252, 0) 58%), #E2E8F0; }
        .tnum { font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
        :focus { outline: none; }
        :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 8px; }
        .text-flow { overflow-wrap: anywhere; word-break: normal; hyphens: auto; }
        .reading { line-height: 1.6; max-width: 68ch; }
        .hl-on .hl-dim { opacity: .45; transition: opacity .15s ease; }
        mark { background: var(--mark); color: var(--ink); border-radius: 4px; padding: 0 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
        .shake { animation: shake .32s ease-in-out; }

        const useMounted = () => {

        const Hl = ({ text, keywords, on }) => {

            return (
                <span className="hl-on">

        const Kbd = ({ children }) => <kbd className="kbd">{children}</kbd>;

        const langMap = (byId, lang) => (lang === 'vi' ? new Map(Array.from(byId, ([k, t]) => [k, Sch.inLang(t, lang)])) : byId);
        const langList = (items, lang) => (lang === 'vi' ? items.map(t => Sch.inLang(t, lang)) : items);

        const Modal = ({ title, onClose, children, size = 'md', footer, badge, tone, layer }) => {
            const box = useRef(null);

            useHotkeys('modal', { Escape: { run: () => onClose && onClose(), allowInInput: true } }, { modal: true });
            useEffect(() => {
                const prev = document.activeElement;
                const el = box.current;
                const first = el && (el.querySelector('[data-autofocus]') || el.querySelector('input, textarea, select, button:not([data-close])'));
                if (first) first.focus();
                return () => { if (prev && prev.focus) prev.focus(); };
            }, []);
            const trap = (e) => {
                if (e.key !== 'Tab' || !box.current) return;
                const els = Array.from(box.current.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), select, textarea, [tabindex]:not([tabindex="-1"])'));
                if (!els.length) return;
                const first = els[0];
                const last = els[els.length - 1];
                if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
                else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
            };
            const width = size === 'xl' ? 'sm:max-w-6xl' : size === 'lg' ? 'sm:max-w-3xl' : size === 'sm' ? 'sm:max-w-sm' : 'sm:max-w-lg';

        const affirmStudy = () => { noteStudyDay(); };

                load();
                window.addEventListener('edu-votes', load);

        const voteTypeFor = (mode) => (mode === 'burst' ? 'quiz5' : mode === 'test' ? 'testAll' : (mode === 'flash' || mode === 'listen' ? 'flashcard' : ''));

            const [animateRing, setAnimateRing] = useState(false);
            const box = useRef(null);
            const pendingRing = useRef(false);
            useEffect(() => {
                try { pendingRing.current = sessionStorage.getItem('edu.ringAnim') === 'pending'; } catch (e) { pendingRing.current = false; }
            }, []);
            useEffect(() => {
                if (!open) return undefined;
                const close = (e) => { if (box.current && !box.current.contains(e.target)) setOpen(false); };
                const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
                document.addEventListener('mousedown', close);
                document.addEventListener('keydown', onKey);
                return () => {
                    document.removeEventListener('mousedown', close);
                    document.removeEventListener('keydown', onKey);

            }, [open]);
            useEffect(() => {
                const stop = () => setCue(false);

        const MembershipCard = ({ fund }) => {

                    <div className="mt-4 min-w-0 rounded-2xl border border-[#D8C7A0]/25 bg-[#202637] p-4">
                        <p className="text-[11px] font-semibold tracking-[0.14em] text-[#D8C7A0]">LỊCH SỬ GIAO DỊCH</p>
                        {buys.length ? (

        };

        const ObsidianWelcome = ({ fund, onSkip, onExplore }) => {
            useEffect(() => {
                const onKey = (e) => { if (e.key === 'Escape') onSkip(); };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [onSkip]);
            const line = paidVocab(fund) ? 'Gói 29.000đ đã được xác nhận.' : 'Quyền lợi PRO đã được ghi trên sổ quỹ.';
            return (
                <div className="fixed inset-0 z-[70] flex items-center justify-center bg-[#10141F]/80 p-4" role="dialog" aria-modal="true" aria-labelledby="obsidian-welcome">
                    <div className="obsidian-rise w-full max-w-md">
                        <p id="obsidian-welcome" className="mb-3 text-center text-xs font-semibold tracking-[0.22em] text-[#D8C7A0]">FPASS OBSIDIAN</p>
                        <MembershipCard fund={fund} />
                        <p className="mt-4 text-center text-lg font-semibold text-[#F8F9FC]">{line}</p>

                        <div className="mt-4 flex justify-center gap-2">
                            <button type="button" className="rounded-xl px-4 py-2 text-sm font-medium text-[#C6CBD4] hover:bg-white/10" onClick={onSkip}>Bỏ qua</button>
                            <button type="button" data-autofocus className="rounded-xl border border-[#D8C7A0]/70 bg-[#F8F9FC] px-4 py-2 text-sm font-semibold text-[#10141F]" onClick={onExplore}>Khám phá quyền lợi</button>
                        </div>
                    </div>
                </div>
            );
        };

        const Toasts = ({ list }) => (
            <div className="fixed z-[60] bottom-4 inset-x-4 sm:inset-x-auto sm:right-4 flex flex-col items-stretch sm:items-end gap-2 pointer-events-none" aria-live="polite" role="status">
                {list.map(t => (
                    <div key={t.id} className={'enter pointer-events-auto max-w-md rounded-xl px-4 py-3 text-sm font-medium shadow-lg flex items-start gap-2 text-flow ' +
                        (t.type === 'error' ? 'bg-danger text-white' : t.type === 'info' ? 'bg-ink text-white' : 'bg-success text-white')}>
                        <Icon name={t.type === 'error' ? 'alert' : t.type === 'info' ? 'info' : 'check'} className="mt-0.5" />
                        <span>{t.message}</span>
                    </div>
                ))}
            </div>
        );

        const Progress = ({ value, max, tone = 'primary', label }) => {
            const pct = max ? Math.min(100, Math.round((value / max) * 100)) : 0;
            const bg = tone === 'success' ? 'bg-success' : tone === 'warn' ? 'bg-warn' : 'bg-primary';
            return (
                <div className="h-2 rounded-full bg-surface2 overflow-hidden" role="progressbar" aria-valuemin={0} aria-valuemax={max} aria-valuenow={value} aria-label={label}>
                    <div className={'h-full rounded-full transition-all duration-300 ' + bg} style={{ width: pct + '%' }} />
                </div>
            );
        };

        const Empty = ({ icon = 'info', title, children }) => (
            <div className="text-center py-12 px-4">
                <div className="mx-auto w-12 h-12 rounded-2xl bg-surface2 text-muted flex items-center justify-center mb-3"><Icon name={icon} size={22} /></div>
                <p className="font-semibold">{title}</p>
                {children && <div className="text-sm text-muted mt-1 text-flow">{children}</div>}
            </div>
        );

        let heldUtterance = null;
        if (window.speechSynthesis) {
            try { window.speechSynthesis.getVoices(); } catch (e) {}
            try {
                window.speechSynthesis.addEventListener('voiceschanged', () => {
                    try { window.speechSynthesis.getVoices(); } catch (err) {}
                });
            } catch (e) {}
        }
        const englishVoice = () => {
            const list = (window.speechSynthesis && window.speechSynthesis.getVoices()) || [];
            return list.filter(v => /^en-GB/i.test(v.lang))[0]
                || list.filter(v => /^en-US/i.test(v.lang))[0]
                || list.filter(v => /^en/i.test(v.lang))[0]
                || null;
        };
        const speak = (text, rate) => {
            const synth = window.speechSynthesis;
            if (!text || !synth) return;
            const run = () => {
                const u = new SpeechSynthesisUtterance(String(text));
                const voice = englishVoice();
                if (voice) {
                    u.voice = voice;
                    u.lang = voice.lang;
                } else {
                    u.lang = 'en-US';
                }
                u.rate = rate || 0.8;
                u.volume = 1;
                heldUtterance = u;
                try { synth.resume(); } catch (e) {}
                try { synth.speak(u); } catch (e) {}
            };
            try { synth.resume(); } catch (e) {}
            if (synth.speaking || synth.pending) {
                try { synth.cancel(); } catch (e) {}
                setTimeout(run, 80);
                return;
            }
            run();
        };

        const downloadBlob = (blob, filename) => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.rel = 'noopener';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        };

        const copyText = (text) => {
            const viaBox = () => {
                const area = document.createElement('textarea');
                area.value = text;
                area.setAttribute('readonly', '');
                area.style.position = 'fixed';
                area.style.left = '-9999px';
                document.body.appendChild(area);
                area.select();
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
                area.remove();
                return ok ? Promise.resolve() : Promise.reject(new Error('no-clipboard'));
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text).catch(viaBox);
            }
            return viaBox();
        };

        const openLegal = (tab) => {
            try { window.dispatchEvent(new CustomEvent('fpass-legal', { detail: { tab: tab || 'id' } })); } catch (e) {}
        };
        const openSupport = () => {
            try { window.dispatchEvent(new CustomEvent('fpass-support')); } catch (e) {}
        };

        const todayIso = () => new Date().toISOString().split('T')[0];

        /* Biến từ vựng thành câu trắc nghiệm nghĩa (để vào EOS / luyện nhanh khi kho chỉ có vocab). */
        const vocabAsMcq = (list) => {
            const vocab = list.filter(t => t.type === 'vocab' && t.questionOrWord && t.answerOrMeaning);
            if (vocab.length < 4) return [];
            return vocab.map(t => {
                const others = Sch.shuffle(vocab.filter(o => o.id !== t.id && o.answerOrMeaning !== t.answerOrMeaning)).slice(0, 3).map(o => o.answerOrMeaning);
                const pos = Math.floor(Math.random() * 4);
                const opts = others.slice();
                opts.splice(pos, 0, t.answerOrMeaning);
                return Object.assign({}, t, {
                    type: 'mcq',
                    questionOrWord: '"' + t.questionOrWord + '"' + (t.wordType ? ' (' + t.wordType + ')' : '') + ' nghĩa là gì?',
                    options: opts.slice(0, 4),
                    answerOrMeaning: Sch.LETTERS[pos],
                    explanationOrExample: t.explanationOrExample ? t.explanationOrExample + (t.exampleVi ? ' — ' + t.exampleVi : '') : ''
                });
            });
        };

        const asMcqPool = (list) => {
            const mcq = list.filter(t => t.type === 'mcq' && t.answerOrMeaning && t.options.filter(Boolean).length >= 2);
            return mcq.concat(vocabAsMcq(list));
        };

        const vnd = (n) => Number(n || 0).toLocaleString('vi-VN') + 'đ';
        const useFund = () => {
            const [fund, setFund] = useState(() => E.Quota.read());
            useEffect(() => E.Quota.subscribe(setFund), []);
            return fund;
        };
        const requireTurns = (toast, quiet) => {
            const n = E.Quota.balance();
            if (n < 1) {
                toast('Quỹ lượt thi đã hết. Mua thêm gói hoặc dán mã quỹ được chia sẻ.', 'info');
                E.Quota.openShop();
                return false;
            }
            if (!quiet && n < 5) toast('Quỹ còn ' + n + ' lượt. Nên mua thêm gói sỉ trước khi kỳ thi tới.', 'info');
            return true;
        };
        const chargeTurn = (toast, note) => E.Quota.spend(note).then((next) => {
            if (!next) {
                toast('Quỹ đã hết lượt trên máy chủ. Bài chưa được nộp.', 'info');
                return false;
            }
            if (next.balance < 5) toast('Đã trừ 1 lượt. Mã này còn ' + next.balance + ' lượt trên mọi máy.', 'info');
            return true;
        }).catch((e) => {
            toast(e.message || 'Chưa trừ được lượt. Bài chưa được nộp.', 'error');
            return false;
        });
        window.EDU.chargeTurn = chargeTurn;

        /* ---------- Tài khoản Google, cổng thanh toán, video hướng dẫn ---------- */
        const readAccount = () => {
            const user = Store.prefs.get('googleUser', null);
            return user && user.email && Store.prefs.get('googleToken', '') ? user : null;
        };
        const useAccount = () => {
            const [account, setAccount] = useState(readAccount);
            useEffect(() => {
                const sync = () => setAccount(readAccount());
                window.addEventListener('edu-account', sync);
                return () => window.removeEventListener('edu-account', sync);
            }, []);
            return account;
        };
        const noteAccount = () => window.dispatchEvent(new CustomEvent('edu-account'));
        const askLogin = (reason) => window.dispatchEvent(new CustomEvent('edu-login', { detail: { reason: reason || '' } }));
        /* Lệnh đi thẳng tới một tính năng từ trang chủ (/app?go=...). Component nào cần thì lấy một lần. */
        const takeGo = (want) => {
            if (window.__fpassGo !== want) return false;
            window.__fpassGo = '';
            return true;
        };

        /* Mã QR chỉ hiện khi đã đăng nhập Google. Máy chủ trả mã quỹ của tài khoản, nên nội dung chuyển khoản luôn cộng lượt vào đúng tài khoản. */
        const PayGate = ({ children, compact }) => {
            const account = useAccount();
            const [state, setState] = useState(account ? 'checking' : 'login');
            const [note, setNote] = useState('');
            const [round, setRound] = useState(0);
            const [moved, setMoved] = useState(null);
            const asked = useRef(false);
            useEffect(() => {
                if (!account) {
                    setState('login');
                    if (!asked.current) { asked.current = true; askLogin('pay'); }
                    return undefined;
                }
                let alive = true;
                setState('checking');
                fetch('/api/fund?action=pay', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', Accept: 'application/json', Authorization: 'Bearer ' + googleToken() },
                    body: JSON.stringify({ fundCode: (E.Quota.read() || {}).code || '' })
                }).then(async (res) => {
                    const data = await res.json().catch(() => ({}));
                    if (!alive) return;
                    if (res.status === 401) {
                        Store.prefs.remove('googleToken');
                        noteAccount();
                        setState('login');
                        return;
                    }
                    if (!res.ok || !data.fundCode) {
                        setNote(data.error || 'Chưa kiểm tra được tài khoản.');
                        setState('error');
                        return;
                    }
                    if (data.fundCode !== (E.Quota.read() || {}).code) {
                        try { E.Quota.setCode(data.fundCode); } catch (e) {}
                        E.Quota.sync().catch(() => {});
                    }
                    if (data.sharedCode) setMoved({ shared: data.sharedCode, own: data.fundCode });
                    setState('ready');
                }).catch(() => {
                    if (!alive) return;
                    setNote('Mất kết nối. Kiểm tra mạng rồi thử lại.');
                    setState('error');
                });
                return () => { alive = false; };
            }, [account && account.email, round]);
            if (state === 'ready') {
                if (!moved) return children;
                return (
                    <>
                        <div className="mb-3 rounded-xl border border-amber-300 bg-amber-50 p-3 text-sm text-ink" role="status">
                            Bạn đang dùng mã quỹ chung <b className="tnum">{moved.shared}</b>. Lượt mua sau đây cộng vào mã riêng <b className="tnum">{moved.own}</b> của tài khoản bạn; app đã chuyển sang mã riêng. Muốn dùng lại lượt nhóm, dán lại mã <b className="tnum">{moved.shared}</b>.
                        </div>
                        {children}
                    </>
                );
            }
            if (state === 'checking') return <div className="pay-gate text-sm text-ink2" role="status">Đang kiểm tra tài khoản…</div>;
            if (state === 'error') {
                return (
                    <div className="pay-gate text-sm" role="alert">
                        <p className="font-semibold text-danger">{note}</p>
                        <button type="button" className="btn btn-secondary btn-sm mt-2" onClick={() => setRound(n => n + 1)}>Thử lại</button>
                    </div>
                );
            }
            return (
                <div className="pay-gate">
                    <p className="flex items-center gap-2 font-semibold text-ink"><Icon name="lock" size={16} className="text-primary" /> Đăng nhập Google để nhận mã QR</p>
                    <p className={'mt-1 text-ink2 ' + (compact ? 'text-xs' : 'text-sm')}>Lượt AI và gói PRO sẽ gắn vào tài khoản của bạn. Đổi máy hay xóa trình duyệt cũng không mất, chỉ cần đăng nhập lại.</p>
                    <GoogleButton className="mt-3" width={compact ? 220 : 300} onDone={() => {}} />
                </div>
            );
        };

        const GuideModal = ({ onClose }) => {
            const [videos, setVideos] = useState(null);
            const [pick, setPick] = useState(0);
            useEffect(() => {
                let alive = true;
                const loader = window.FPassGuide ? window.FPassGuide.load() : Promise.resolve([]);
                loader.then((list) => { if (alive) setVideos(list || []); });
                return () => { alive = false; };
            }, []);
            const video = videos && videos[pick];
            const info = video && window.FPassGuide.embed(video.url);
            return (
                <Modal title="Video hướng dẫn" onClose={onClose} size="lg">
                    {videos === null ? <p className="text-sm text-muted">Đang tải video…</p> : info ? (
                        <>
                            {videos.length > 1 && (
                                <div className="mb-3 flex flex-wrap gap-2" role="group" aria-label="Chọn video">
                                    {videos.map((v, i) => (
                                        <button key={i} type="button" aria-pressed={i === pick} onClick={() => setPick(i)} className={'rounded-full px-3 py-1.5 text-sm font-semibold ' + (i === pick ? 'bg-ink text-white' : 'bg-surface2 text-ink2')}>{v.title}</button>
                                    ))}
                                </div>
                            )}
                            <div className={'guide-frame' + (info.tall ? ' is-tall' : '')}>
                                {info.kind === 'video'
                                    ? <video key={info.src} src={info.src} controls playsInline preload="metadata" />
                                    : <iframe key={info.src} src={info.src} title={video.title || 'Video hướng dẫn FPass'} allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowFullScreen referrerPolicy="strict-origin-when-cross-origin" />}
                            </div>
                        </>
                    ) : (
                        <div className="rounded-2xl bg-surface2 p-4 text-sm text-ink2">
                            <p className="font-semibold text-ink">Video đang được quay.</p>
                            <p className="mt-1">Trong lúc chờ, ba bước dưới đây là đủ để bắt đầu.</p>
                        </div>
                    )}
                    <ol className="mt-4 space-y-3 text-sm">
                        <li className="flex gap-3"><span className="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-primary text-xs font-bold text-white">1</span><span><b>Bấm “Học ngay”</b> trên thẻ tím ở đầu màn hình Hôm nay. Bộ thẻ mẫu đã có sẵn.</span></li>
                        <li className="flex gap-3"><span className="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-primary text-xs font-bold text-white">2</span><span><b>Đến giờ ca học</b>, thẻ tự bật lên. Treo tab cả ngày cũng được.</span></li>
                        <li className="flex gap-3"><span className="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-primary text-xs font-bold text-white">3</span><span><b>Thêm từ của bạn</b> ở mục Kho của tôi: nhập Excel, dán nhanh, hoặc nhờ AI quét bài đọc.</span></li>
                    </ol>
                </Modal>
            );
        };

        /* Thẻ đầu màn hình Hôm nay: giờ tới ca kế, trạng thái khóa lịch, một nút học. */
        /* Chỉ mở sau khi đăng nhập Google: chọn giờ cho 3 ca, số thẻ mỗi ca và nhóm thẻ. */
        const SetupWizard = ({ week, groups, onSave, onClose }) => {
            const base = (week && week.days && week.days.monday) || Plan.defaultWeek().days.monday;
            const [rows, setRows] = useState(() => base.map(s => ({ time: s.time, label: s.anchorLabel })));
            const [count, setCount] = useState(() => (base[0] && base[0].baseCardCount) || 8);
            const [group, setGroup] = useState(() => (base[0] && base[0].group) || 'all');
            const [error, setError] = useState('');
            const setRow = (i, key, value) => setRows(list => list.map((r, n) => (n === i ? Object.assign({}, r, { [key]: value }) : r)));
            const save = () => {
                const mins = rows.map(r => Plan.minutesOf(r.time));
                if (mins.some(m => !(m >= 0)) || !(mins[0] < mins[1] && mins[1] < mins[2])) { setError('Giờ 3 ca cần tăng dần, ví dụ 07:30 · 12:30 · 21:00.'); return; }
                const days = {};
                Plan.WEEK.forEach((k) => {
                    days[k] = rows.map((r, i) => ({
                        id: i + 1, time: r.time, anchorLabel: (r.label || '').trim() || ['Sáng', 'Chiều', 'Tối'][i],
                        group, mode: 'flashcard', baseCardCount: count,
                        phase1_inApp: { group, mode: 'flashcard', cardCount: count }
                    }));
                });
                onSave({ version: 2, title: 'Lịch của tôi', days });
            };
            return (
                <Modal title="Đặt lịch học của bạn" onClose={onClose} footer={<><button type="button" className="btn btn-secondary" onClick={onClose}>Để sau</button><button type="button" className="btn btn-primary" onClick={save}>Lưu lịch</button></>}>
                    <p className="text-sm text-ink2">Chọn 3 lúc bạn chắc chắn rảnh mỗi ngày, ví dụ sau giờ ăn sáng, giờ nghỉ trưa, trước khi ngủ. Đến giờ, thẻ sẽ tự bật lên.</p>
                    <div className="mt-4 space-y-2">
                        {rows.map((r, i) => (
                            <div key={i} className="flex items-center gap-2 rounded-xl border border-line p-2">
                                <span className="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-primary-soft text-sm font-bold text-primary">{i + 1}</span>
                                <input type="time" value={r.time} onChange={(e) => setRow(i, 'time', e.target.value)} className="field w-32 tnum" aria-label={'Giờ ca ' + (i + 1)} />
                                <input value={r.label} maxLength={40} onChange={(e) => setRow(i, 'label', e.target.value)} className="field min-w-0 flex-1" aria-label={'Tên ca ' + (i + 1)} placeholder="Sau bữa trưa" />
                            </div>
                        ))}
                    </div>
                    <div className="mt-4 grid gap-3 sm:grid-cols-2">
                        <label className="block"><span className="label">Số thẻ mỗi ca</span>
                            <select value={count} onChange={(e) => setCount(Number(e.target.value))} className="field">
                                {[5, 8, 12, 20].map(v => <option key={v} value={v}>{v} thẻ{v === 8 ? ' (gợi ý)' : ''}</option>)}
                            </select>
                        </label>
                        <label className="block"><span className="label">Học nhóm nào</span>
                            <select value={group} onChange={(e) => setGroup(e.target.value)} className="field">
                                <option value="all">Tất cả thẻ trong kho</option>
                                {groups.map(([k]) => <option key={k} value={k}>{Sch.groupLabel(k)}</option>)}
                            </select>
                        </label>
                    </div>
                    {error && <p className="mt-3 text-sm text-danger" role="alert">{error}</p>}
                    <p className="mt-3 text-xs text-muted">Hôm nay chưa học ca nào thì lịch mới áp dụng ngay. Nếu đã học, lịch mới bắt đầu từ ngày mai để giữ cam kết hôm nay.</p>
                </Modal>
            );
        };

        const FundBody = ({ toast, kind, compact = false, items = [] }) => {
            const fund = useFund();
            const eos = kind === 'eos';
            const [picked, setPicked] = useState(null);
            const [code, setCode] = useState(fund.code);
            /* Mã quỹ đổi từ nơi khác (đăng nhập, mở QR) thì ô nhập theo mã mới. */
            useEffect(() => { setCode(fund.code); }, [fund.code]);
            const [incoming, setIncoming] = useState('');
            const [syncing, setSyncing] = useState(false);
            const [tools, setTools] = useState(false);
            const [offer, setOffer] = useState(false);
            const shelf = eos ? E.Quota.packs : [E.Quota.vocab];
            const pack = shelf.find(p => p.id === picked);
            const aiCap = fund.aiLimit || E.Quota.AI_FREE;
            const aiLeft = Math.max(0, aiCap - (fund.aiUsed || 0));
            const vocabOn = (fund.aiCredits || 0) > 0;
            const bank = E.Quota.BANK;
            const memo = E.Quota.memoOf(fund.code);
            const when = (t) => new Date(t).toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
            const checkPay = (quiet) => {
                setSyncing(true);
                return E.Quota.sync().then((r) => {
                    if (r.aiJustFunded) toast('Đã cộng 500 lượt điền thẻ và 30 lượt quét cho mã ' + r.code + '.', 'success');
                    else if (r.aiJustUnlocked && !(r.added > 0)) toast('Đã bật trợ lý AI cho mã ' + r.code + '.', 'success');
                    else if (r.added > 0) toast('Đã cộng ' + r.added + ' lượt từ chuyển khoản. Quỹ hiện có ' + r.balance + ' lượt.', 'success');
                    else if (!quiet) toast('Chưa thấy giao dịch mới cho nội dung ' + E.Quota.memoOf(r.code) + '.', 'info');
                }).catch((e) => {
                    if (!quiet) toast(e.message || 'Chưa kiểm tra được thanh toán.', 'error');
                }).finally(() => setSyncing(false));
            };
            useEffect(() => {
                if (!picked) return undefined;
                checkPay(true);
                const id = setInterval(() => checkPay(true), 12000);
                return () => clearInterval(id);
            }, [picked, fund.code]);
            const copyFund = () => {
                copyText(fund.code).then(() => toast('Đã copy mã ' + fund.code + '. Máy khác dán mã này để dùng chung quỹ.', 'success')).catch(() => toast('Không copy được. Hãy chọn mã và copy tay.', 'error'));
            };
            const [giftCode, setGiftCode] = useState('');
            const [giftBusy, setGiftBusy] = useState(false);
            const askGift = (code) => {
                window.dispatchEvent(new CustomEvent('edu-gift', { detail: { code: String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 24) } }));
            };
            const activateGift = async (raw) => {
                const code = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 24);
                if (code.length < 4) { toast('Mã Obsidian PRO cần từ 4 ký tự.', 'error'); return; }
                if (!googleToken()) { askGift(code); return; }
                setGiftBusy(true);
                try {
                    const gift = await redeemGiftCode(code);
                    setGiftCode('');
                    toast(gift.proUntil === -1 ? 'Đã mở Obsidian PRO vĩnh viễn.' : 'Đã mở Obsidian PRO.', 'success');
                } catch (e) {
                    if (e.needLogin) askGift(code);
                    else toast(e.message, 'error');
                } finally {
                    setGiftBusy(false);
                }
            };
            const useSharedCode = async () => {
                const text = incoming.trim();
                if (!text) return;
                const cleaned = text.toUpperCase().replace(/[^A-Z0-9]/g, '');
                if (!/^EDUF1\./i.test(text) && cleaned.length >= 4) {
                    if (!googleToken()) {
                        if (cleaned.length > 12) {
                            setIncoming('');
                            askGift(cleaned);
                            return;
                        }
                        toast('Nếu đây là mã Obsidian PRO do admin cấp, dán vào ô Mã Obsidian PRO bên dưới. Ô này chỉ nhận mã quỹ lượt.', 'info');
                    } else {
                        setGiftBusy(true);
                        try {
                            const gift = await redeemGiftCode(cleaned);
                            setIncoming('');
                            toast(gift.proUntil === -1 ? 'Đã mở Obsidian PRO vĩnh viễn.' : 'Đã mở Obsidian PRO.', 'success');
                            return;
                        } catch (e) {
                            if (e.needLogin) { setIncoming(''); askGift(cleaned); return; }
                            if (!/Không có mã này/.test(e.message || '')) {
                                toast(e.message, 'error');
                                return;
                            }
                        } finally {
                            setGiftBusy(false);
                        }
                    }
                }
                let saved;
                try {
                    saved = /^EDUF1\./i.test(text) ? E.Quota.importCode(text) : E.Quota.setCode(text);
                } catch (e) {
                    toast(e.message || 'Mã quỹ không hợp lệ.', 'error');
                    return;
                }
                setIncoming('');
                setCode(saved.code);
                checkPay(true).then(() => {
                    const now = E.Quota.read();
                    toast('Máy này đang dùng mã ' + now.code + '. Còn ' + now.balance + ' lượt, trừ chung trên mọi trình duyệt.', 'success');
                });
            };
            const saveCode = () => {
                try { const saved = E.Quota.setCode(code); setCode(saved.code); checkPay(true); toast('Đã lưu mã quỹ ' + saved.code, 'success'); }
                catch (e) { toast(e.message, 'error'); }
            };
            const vocabBenefits = (
                <ul className="mt-3 space-y-1.5 text-sm text-ink2">
                    <li className="flex items-start gap-2"><Icon name="check" size={16} className="mt-0.5 shrink-0 text-[#10B981]" /><span><b className="text-ink">+500 lượt AI Tự động điền thẻ</b> (Nghĩa sát ngữ cảnh, Câu ví dụ, Phiên âm IPA & Mẹo nhớ siêu tốc).</span></li>
                    <li className="flex items-start gap-2"><Icon name="check" size={16} className="mt-0.5 shrink-0 text-[#10B981]" /><span><b className="text-ink">+30 lượt AI Quét Bài Đọc / Đề Thi</b> (Tự động highlight từ vựng đắt giá & Luyện đọc Shadowing).</span></li>
                    <li className="flex items-start gap-2"><Icon name="check" size={16} className="mt-0.5 shrink-0 text-[#10B981]" /><span><b className="text-ink">Đồng bộ đa thiết bị qua Mã Quỹ</b> (Học mọi lúc trên cả Laptop & Điện thoại, không cần mua kèm lượt EOS).</span></li>
                    <li className="flex items-start gap-2"><Icon name="check" size={16} className="mt-0.5 shrink-0 text-[#10B981]" /><span><b className="text-ink">Trải nghiệm Obsidian độc quyền</b> (Mở khóa giao diện thành viên cao cấp với nhận diện Obsidian riêng biệt, huy hiệu thành viên đặc quyền và không gian trải nghiệm Premium xuyên suốt FPass).</span></li>
                </ul>
            );
            const vocabCard = (
                <div className="rounded-2xl border-2 border-[#4338CA]/80 bg-gradient-to-br from-white to-indigo-50/30 p-4 shadow-sm">
                    <span className="inline-flex rounded-full bg-indigo-100 px-2.5 py-1 text-xs font-semibold text-[#4338CA]">GÓI HỌC TỪ VỰNG & READING SIÊU TỐC • TIẾT KIỆM 50%</span>
                    <h3 className="mt-2 text-lg font-bold text-ink">Gói Trợ Lý AI Từ Vựng & Đọc Hiểu Toàn Diện (Trọn Kỳ)</h3>
                    <p className="mt-1 flex flex-wrap items-baseline gap-x-2 gap-y-1">
                        <span className="text-2xl font-bold tnum text-ink">29.000đ</span>
                        <span className="text-sm text-slate-400 line-through tnum">59.000đ</span>
                        <span className="text-sm text-ink2">Chỉ bằng 1 cốc trà sữa cho cả học kỳ • Kích hoạt tự động sau 3 giây</span>
                    </p>
                    {vocabBenefits}
                    {vocabOn ? (
                        <p className="mt-3 inline-flex rounded-xl bg-white px-4 py-2 text-sm font-semibold text-[#4338CA]">Đã kích hoạt trên mã này</p>
                    ) : (
                        <button type="button" className="mt-3 inline-flex items-center justify-center gap-2 rounded-xl bg-[#4338CA] px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition-all hover:bg-[#3730A3]" onClick={() => setPicked('vocab')}>Mở khóa ngay — 29.000đ (Quét QR tự động 3s)<Icon name="arrow" size={16} /></button>
                    )}
                </div>
            );
            const payBox = pack && (
                <PayGate>
                <div className="rounded-2xl border border-line p-4 flex flex-wrap gap-4 items-center">
                    <img src={E.Quota.qrUrl(pack.price, fund.code)} alt={'VietQR ' + bank.name + ' ' + bank.account} className="w-40 h-40 rounded-xl border border-line object-contain bg-white" />
                    <div className="min-w-0 flex-1">
                        <p className="font-semibold">Chuyển khoản {pack.name}</p>
                        <p className="text-sm text-ink2 mt-1">{bank.name} · {bank.bin}</p>
                        <p className="text-sm text-ink2 tnum">Số tài khoản: <b className="text-ink">{bank.account}</b></p>
                        <p className="text-sm text-ink2">Chủ tài khoản: <b className="text-ink">{bank.holder}</b></p>
                        <p className="text-sm text-ink2 tnum">Số tiền: <b className="text-ink">{vnd(pack.price)}</b></p>
                        <p className="text-sm text-ink2 tnum">Nội dung: <b className="text-ink">{memo}</b></p>
                        <p className="text-xs text-muted mt-2">{pack.id === 'vocab' ? 'SePay cộng 500 lượt điền thẻ và 30 lượt quét bài đọc khi tiền vào đúng 29.000đ và đúng nội dung. Gói này không cộng lượt EOS.' : 'SePay cộng đúng ' + pack.turns + ' lượt EOS và bật trợ lý AI khi tiền vào đúng số tiền và nội dung. Lượt không tự cộng nếu bấm nút khi chưa có giao dịch.'}</p>
                        <p className="text-xs mt-2 flex flex-wrap gap-x-3 gap-y-1">
                            <button type="button" className="font-semibold text-primary underline underline-offset-2" onClick={() => openLegal('id')}>Chính sách bảo lưu Mã Quỹ</button>
                            <button type="button" className="font-semibold text-primary underline underline-offset-2" onClick={openSupport}>Ghi sai nội dung? Liên hệ hỗ trợ cộng lượt</button>
                        </p>
                        <button type="button" className="btn btn-primary mt-3" disabled={syncing} onClick={() => checkPay(false)}>{syncing ? 'Đang kiểm tra…' : 'Kiểm tra chuyển khoản'}</button>
                    </div>
                </div>
                </PayGate>
            );
            if (compact && !eos) {
                const obsidian = obsidianOf(fund);
                const account = readAccount();
                const unlimited = !!(fund.aiUnlocked && !obsidian);
                const openMembership = () => window.dispatchEvent(new CustomEvent('edu-membership'));
                return (
                    <div className="space-y-3">
                        <div className="flex flex-wrap items-center justify-between gap-x-3 gap-y-2 rounded-2xl border border-slate-200 bg-white px-4 py-2.5 shadow-sm">
                            <div className="flex min-w-0 flex-wrap items-center gap-x-2 gap-y-1 text-xs text-slate-700">
                                {account ? (
                                    <span className="inline-flex items-center gap-1 font-medium" title={'Mã quỹ ' + fund.code}>Tài khoản: <b className="text-ink">{account.email}</b></span>
                                ) : (
                                    <button type="button" onClick={() => askLogin('save')} className="inline-flex items-center gap-1 rounded-full bg-amber-50 px-2.5 py-1 font-semibold text-amber-800 hover:bg-amber-100">Chưa đăng nhập · lượt chỉ lưu trên máy này</button>
                                )}
                                <span className="inline-flex items-center gap-1 font-medium">
                                    Mã quỹ: <b className="tnum text-ink">{fund.code}</b>
                                    <button type="button" onClick={copyFund} aria-label={'Copy mã ' + fund.code} className="inline-flex h-6 w-6 items-center justify-center rounded-md text-slate-500 hover:bg-slate-100 hover:text-slate-800"><Icon name="copy" size={13} /></button>
                                </span>
                                <span aria-hidden="true" className="text-slate-300">•</span>
                                {obsidian ? (
                                    <button type="button" onClick={openMembership} aria-label="Mở thẻ thành viên Obsidian" className="inline-flex h-7 items-center gap-2 rounded-full border border-[#D8C7A0]/60 bg-[#10141F] px-2.5 text-[11px] text-white shadow-sm">
                                        <Icon name="gem" size={13} className="text-[#D8C7A0]" />
                                        <span className="font-semibold tracking-wide">PRO MEMBER</span>
                                        <span className="text-[#D8C7A0]">Đang hoạt động</span>
                                        <span className="tnum">{proLive(fund) ? 'AI không giới hạn' : 'AI ' + aiLeft + '/' + aiCap}</span>
                                    </button>
                                ) : unlimited ? (
                                    <span className="inline-flex items-center rounded-full bg-slate-100 px-2.5 py-1 font-medium text-slate-700">AI tự điền: đang mở</span>
                                ) : (
                                    <span className="inline-flex items-center rounded-full bg-indigo-50 px-2.5 py-1 font-medium text-[#4338CA]">AI tự điền: {aiLeft}/{aiCap} miễn phí</span>
                                )}
                                <span aria-hidden="true" className="text-slate-300">•</span>
                                <span className="font-medium">EOS: <b className="tnum text-ink">{fund.balance}</b> lượt</span>
                                <LivingIdentityBadge items={items} />
                            </div>
                            <div className="flex shrink-0 flex-wrap items-center gap-2">
                                <button type="button" aria-expanded={tools} onClick={() => setTools(v => !v)} className="rounded-xl bg-slate-100 px-3 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-200">Đổi mã / Lịch sử quỹ</button>
                                {!obsidian && (
                                    <button type="button" onClick={() => { setPicked('vocab'); setOffer(true); }} className="rounded-xl bg-[#4338CA] px-3.5 py-1.5 text-xs font-semibold text-white shadow-sm hover:bg-[#3730A3]">Mở khóa gói AI 29k ↗</button>
                                )}
                            </div>
                        </div>
                        {tools && (
                            <div className="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
                                <div className="grid gap-4 sm:grid-cols-2">
                                    <div>
                                        <label className="text-sm">
                                            <span className="label">Mã quỹ</span>
                                            <span className="flex gap-2">
                                                <input value={code} onChange={(e) => setCode(e.target.value.toUpperCase())} maxLength={12} className="field w-32 uppercase" aria-label="Mã quỹ lượt" />
                                                <button type="button" className="btn btn-secondary btn-sm" onClick={saveCode}>Lưu</button>
                                            </span>
                                        </label>
                                        <p className="mb-2 mt-4 text-sm font-semibold">Lịch sử quỹ</p>
                                        {fund.history.length ? (
                                            <ul className="max-h-40 space-y-1 overflow-y-auto text-sm">
                                                {fund.history.slice(0, 12).map(ev => (
                                                    <li key={ev.id} className="flex justify-between gap-3 tnum">
                                                        <span className="truncate text-ink2">{when(ev.t)} · {ev.kind === 'buy' ? ev.note : 'Nộp EOS'}</span>
                                                        <span className={ev.delta > 0 ? 'text-success' : 'text-danger'}>{ev.delta > 0 ? '+' : ''}{ev.delta}</span>
                                                    </li>
                                                ))}
                                            </ul>
                                        ) : <p className="text-sm text-muted">Chưa có lần mua hoặc lần nộp EOS.</p>}
                                    </div>
                                    <div>
                                        <p className="mb-2 text-sm font-semibold">Dùng chung mã này</p>
                                        <p className="mb-2 text-xs text-muted">Chỉ dán mã quỹ lượt EOS. Mã admin cấp PRO không dán vào đây.</p>
                                        <label className="block"><span className="label">Dán mã quỹ</span>
                                            <textarea value={incoming} onChange={(e) => setIncoming(e.target.value)} rows={2} className="field text-xs" placeholder="Dán mã ngắn hoặc EDUF1...." />
                                        </label>
                                        <button type="button" className="btn btn-secondary btn-sm mt-2" disabled={!incoming.trim()} onClick={useSharedCode}>Dùng mã này</button>
                                    </div>
                                </div>
                                <div className="mt-4 rounded-xl border border-[#D8C7A0]/50 bg-[#10141F] p-3 text-white">
                                    <p className="text-sm font-semibold text-[#D8C7A0]">Mã Obsidian PRO</p>
                                    <p className="mt-1 text-xs text-slate-300">Dán mã admin cấp vào đây. Cần đăng nhập Google trước khi kích hoạt.</p>
                                    <div className="mt-2 flex gap-2">
                                        <input value={giftCode} onChange={(e) => setGiftCode(e.target.value.toUpperCase())} maxLength={24} className="field uppercase bg-white text-ink" placeholder="EARLYBIRD" aria-label="Mã Obsidian PRO" />
                                        <button type="button" className="btn btn-secondary btn-sm shrink-0" disabled={!giftCode.trim() || giftBusy} onClick={() => activateGift(giftCode)}>{giftBusy ? '…' : 'Kích hoạt'}</button>
                                    </div>
                                </div>
                            </div>

                else mq.addListener(apply);
                return () => {
                    if (mq.removeEventListener) mq.removeEventListener('change', apply);
                    else mq.removeListener(apply);
                };
            }, []);
            return on;
        };

                if (!done) return undefined;

            const trap = (e) => {

            const send = async (e) => {

                    const reason = typeof data.error === 'string' ? data.error : (data.error && data.error.message) || '';
                    if (!res.ok) throw new Error(reason || 'Không gửi được. Thử lại sau.');

                    </div>

        const SupportDock = ({ open, toast, returnTo, onOpen, onClose, onFeedback }) => (

                {open && <div className="help-scrim" onMouseDown={onClose} />}

        /* ===================== PRACTICE ENGINES: Flashcard · Băng đạn 5 câu · EOS ===================== */

        const JACK_STAGES = [

        const jackTier = (pct) => (pct >= 100 ? 3 : pct >= 60 ? 2 : pct >= 25 ? 1 : 0);

        const JackFace = ({ kind }) => {
            const mood = kind === 'wrong' ? 'M3 16 Q12 22 21 16' : kind === 'stage4' ? 'M4 15 Q12 20 20 15' : 'M5 16 Q12 19 19 16';
            const eyes = kind === 'wrong'
                ? <><circle cx="8" cy="11" r="2.2" /><circle cx="16" cy="11" r="2.2" /></>

            return (

                </svg>
            );

        const knockBlack = (img) => {
            const nw = img.naturalWidth || 1;
            const nh = img.naturalHeight || 1;
            const max = 960;
            const scale = Math.min(1, max / Math.max(nw, nh));
            const w = Math.max(1, Math.round(nw * scale));
            const h = Math.max(1, Math.round(nh * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const pen = canvas.getContext('2d', { willReadFrequently: true });
            pen.imageSmoothingEnabled = true;
            pen.imageSmoothingQuality = 'high';
            pen.drawImage(img, 0, 0, w, h);
            const frame = pen.getImageData(0, 0, w, h);
            const px = frame.data;
            for (let i = 0; i < px.length; i += 4) {
                if (px[i] < 24 && px[i + 1] < 24 && px[i + 2] < 24) px[i + 3] = 0;
            }
            pen.putImageData(frame, 0, 0);
            let minX = w, minY = h, maxX = -1, maxY = -1;
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    if (px[(y * w + x) * 4 + 3] < 16) continue;
                    if (x < minX) minX = x;
                    if (y < minY) minY = y;
                    if (x > maxX) maxX = x;
                    if (y > maxY) maxY = y;
                }
            }
            if (maxX < minX) return canvas.toDataURL('image/png');
            const cw = maxX - minX + 1;
            const ch = maxY - minY + 1;
            const trimmed = document.createElement('canvas');
            trimmed.width = cw;
            trimmed.height = ch;
            trimmed.getContext('2d').drawImage(canvas, minX, minY, cw, ch, 0, 0, cw, ch);
            return trimmed.toDataURL('image/png');
        };

                        if (cut || String(e.currentTarget.src).indexOf('data:') === 0) return;

                    onError={() => { if (!cut) setMissing(true); }} />

        /* Ba chế độ xem câu hỏi: Tiếng Việt / English (khi đề song ngữ) và Keyword (nhấn mạnh từ khóa, phím H). */
        const HighlightButton = ({ on, onToggle, locked, bilingual }) => {

                    {bilingual ? (
                        <>
                            <button type="button" onClick={() => setLang('vi')} aria-pressed={lang === 'vi'} className={tone(lang === 'vi')} title="Xem câu hỏi, lựa chọn và lời giải bằng tiếng Việt">Tiếng Việt</button>
                            <button type="button" onClick={() => setLang('en')} aria-pressed={lang === 'en'} className={tone(lang === 'en')} title="Xem câu hỏi, lựa chọn và lời giải bằng tiếng Anh">English</button>
                        </>
                    ) : null}
                    <button type="button" onClick={onToggle} aria-pressed={on} className={tone(on)} title="Nhấn mạnh từ khóa ăn điểm (phím H)">
                        <Icon name={locked ? 'lock' : 'highlighter'} size={14} /> Keyword <Kbd>H</Kbd>
                    </button>
                </div>
            );
        };

        /* Lời giải của câu trắc nghiệm, hiện ngay sau khi chọn đáp án. */
        const Explain = ({ t, hl }) => (t && t.type === 'mcq' && t.explanationOrExample
            ? <p className="mt-2 text-sm text-ink2 text-flow reading"><b className="text-ink">Giải thích: </b><Hl text={t.explanationOrExample} keywords={t.keywords} on={hl} /></p>
            : null);

        const InsightCard = ({ item }) => {
            if (!item) return null;
            const all = Array.isArray(item.keywords) ? item.keywords.filter(Boolean) : [];
            /* Đề song ngữ: chỉ nhắc từ khóa có trong chữ đang hiện (tiếng Việt hoặc tiếng Anh). */
            const shown = item.type === 'mcq' ? [item.questionOrWord, item.explanationOrExample].concat(item.options || []).join(' ').toLowerCase() : '';
            const inText = shown ? all.filter(k => shown.indexOf(k.toLowerCase()) >= 0) : all;
            const keys = inText.length ? inText : all;
            const example = item.type === 'mcq' ? '' : (item.explanationOrExample || '');
            const vi = item.exampleVi || '';
            const ipa = item.type === 'mcq' ? '' : (item.ipa || '');
            const word = item.type === 'mcq' ? '' : (item.questionOrWord || '');
            if (!ipa && !example && !vi && !keys.length && !word) return null;
            return (
                <div className="mt-3 rounded-xl border border-line bg-surface px-3 py-2 text-left">
                    <p className="text-[11px] font-semibold uppercase tracking-wide text-muted">Củng cố trí nhớ</p>
                    {ipa ? <p className="mt-1 text-sm font-medium">{ipa}</p> : null}
                    {word ? <button type="button" className="btn btn-secondary btn-sm mt-2" onClick={() => speak(word)}><Icon name="volume" size={14} /> Nghe</button> : null}
                    {example ? <p className="mt-2 text-sm italic text-ink2 text-flow">{example}</p> : null}
                    {vi ? <p className="text-sm text-muted text-flow">{vi}</p> : null}
                    {keys.length ? <p className="mt-1 text-sm text-ink2">Gợi nhớ: {keys.join(', ')}</p> : null}
                </div>
            );
        };

        /* ---------------------------------------------------------------
         * BurstSession — Băng đạn 5 câu
         * --------------------------------------------------------------- */
        const BurstSession = ({ itemsById: rawById, ids, title, subtitle, canHighlight = true, highlightLockedMsg, onReview, onFinish, onExit, canExplain, toast, timerMin, renderDone, skipPreview, sessionId, voteType, slotId }) => {
            const [qlang] = useQLang();
            const itemsById = useMemo(() => langMap(rawById, qlang), [rawById, qlang]);
            const bilingual = useMemo(() => ids.some(id => Sch.hasVi(rawById.get(id))), [rawById]);
            const [s, dispatch] = useReducer(Burst.reduce, ids, (x) => Burst.init(x.filter(id => itemsById.has(id)), { skipPreview }));
            const [fb, setFb] = useState(null);
            const [input, setInput] = useState('');
            const [hl, setHl] = useState(false);
            const [now, setNow] = useState(Date.now());
            const [explained, setExplained] = useState({});
            const [explaining, setExplaining] = useState(false);
            const lock = useRef(false);
            const composing = useRef(false);
            const inputRef = useRef(null);
            const cardRef = useRef(null);
            const finished = useRef(false);
            const mounted = useMounted();
            const orders = useMemo(() => {
                const m = {};
                ids.forEach(id => {
                    const t = itemsById.get(id);
                    if (t && t.type === 'mcq') m[id] = Sch.shuffle([0, 1, 2, 3].filter(i => t.options[i]));
                });
                return m;
            }, []);

            const batch = s.batches[s.b] || [];
            const head = Burst.head(s, now);
            const cur = head.id != null ? itemsById.get(head.id) : null;
            const waiting = s.phase === 'drill' && head.waitMs > 0;

            useEffect(() => {
                if (s.phase !== 'preview') return undefined;
                const t = setTimeout(() => dispatch({ type: 'START_DRILL' }), Burst.PREVIEW_MS);
                return () => clearTimeout(t);
            }, [s.phase, s.b]);

            useEffect(() => {
                if (!waiting) return undefined;
                const t = setTimeout(() => setNow(Date.now()), Math.min(250, head.waitMs));
                return () => clearTimeout(t);
            }, [waiting, now]);

            useEffect(() => {
                if (!fb || !cur || cur.type !== 'vocab') return undefined;
                speak(cur.questionOrWord);
                return undefined;
            }, [fb && fb.id]);

            useEffect(() => {
                if (s.phase === 'done' && !finished.current) {
                    finished.current = true;
                    const st = Burst.stats(s);
                    affirmStudy();
                    castSessionVote({ id: sessionId, voteType: voteType, slotId: slotId }, st.answered, toast);
                    if (onFinish) onFinish(st);
                }
            }, [s.phase]);

            useEffect(() => {
                if (s.phase !== 'drill' || !cur || waiting) return;
                if (cur.type === 'vocab' && inputRef.current) inputRef.current.focus();
                else if (cardRef.current) cardRef.current.focus();
            }, [s.phase, head.id, waiting]);

            const answer = (ok, chosen) => {
                if (lock.current || !cur || waiting || fb) return;
                lock.current = true;
                const id = cur.id;
                setFb({ ok, chosen, id });
                if (ok) Sfx.correct(); else Sfx.wrong();
                if (s.firstTry[id] === undefined && onReview) onReview(id, ok);
                if (inputRef.current) inputRef.current.blur();
            };
            const continueResult = () => {
                if (!fb || !cur) return;
                dispatch({ type: 'ANSWER', id: fb.id, correct: fb.ok, now: Date.now() });
                    setNow(Date.now());
                    setFb(null);
                    setInput('');
                    lock.current = false;
            };

            const pick = (di) => {
                if (s.phase !== 'drill' || !cur || cur.type !== 'mcq' || fb) return;
                const order = orders[cur.id] || [0, 1, 2, 3];
                if (di >= order.length) return;
                answer(Sch.LETTERS[order[di]] === cur.answerOrMeaning, di);
            };

            const matches = (v) => cur && Sch.normAnswer(v) !== '' && Sch.normAnswer(v) === Sch.normAnswer(cur.questionOrWord);

            const toggleHl = () => {
                if (!canHighlight) { if (toast) toast(highlightLockedMsg || 'Highlight chưa mở cho bộ này', 'info'); return; }
                setHl(v => !v);
            };

            const explainAI = async (t) => {
                if (!AI.ready()) { toast && toast('AI chỉ chạy khi mở trang qua web, không mở file trực tiếp.', 'info'); return; }
                setExplaining(true);
                try {
                    const txt = await AI.explain(t);
                    if (mounted.current) setExplained(m => Object.assign({}, m, { [t.id]: txt }));
                } catch (e) {
                    toast && toast(e.message, 'error');
                } finally {
                    if (mounted.current) setExplaining(false);
                }
            };

            useHotkeys('burst', {
                '1': () => pick(0), '2': () => pick(1), '3': () => pick(2), '4': () => pick(3),
                a: () => pick(0), b: () => pick(1), c: () => pick(2), d: () => pick(3),
                h: toggleHl,
                Enter: {
                    allowInInput: !!fb,
                    overrideButton: true,
                    run: () => {
                        if (fb) { continueResult(); return; }
                    if (s.phase === 'preview') dispatch({ type: 'START_DRILL' });
                    else if (s.phase === 'batchDone') dispatch({ type: 'NEXT_BATCH', skipPreview });
                    else return false;
                    }
                },
                Space: {
                    allowInInput: !!fb,
                    overrideButton: true,
                    run: () => {
                        if (fb) { continueResult(); return; }
                        if (s.phase === 'preview') dispatch({ type: 'START_DRILL' });
                        else if (s.phase === 'batchDone') dispatch({ type: 'NEXT_BATCH', skipPreview });
                        else return false;
                    }
                },
                Escape: () => { if (onExit) onExit(); }
            });

            const clearedN = batch.filter(id => s.cleared.indexOf(id) >= 0).length;
            const totalQ = s.batches.reduce((n, b) => n + b.length, 0);
            const header = (
                <div className="drill-head">
                    <div className="drill-head-row">
                    <div className="min-w-0">
                            <p className="text-[11px] font-semibold uppercase tracking-wider text-muted">{subtitle || 'Băng đạn 5 câu'}</p>
                            <h2 className="text-base font-bold text-flow truncate">{title}</h2>
                    </div>
                    <div className="flex flex-wrap items-center gap-2">
                        {timerMin ? <Elapsed startedAt={s.startedAt} limitMin={timerMin} /> : null}
                        <HighlightButton on={hl} onToggle={toggleHl} locked={!canHighlight} bilingual={bilingual} />
                        {onExit && <button type="button" className="btn btn-ghost btn-sm" onClick={onExit}><Icon name="x" size={14} /> Thoát <Kbd>Esc</Kbd></button>}
