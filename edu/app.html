                                <label className="min-w-0"><span className="label">Từ loại</span><input className="field" value={d.wordType} maxLength={24} onChange={(e) => set('wordType', e.target.value)} placeholder="n / v / adj…" /></label>
                                <label className="min-w-0"><span className="label">IPA</span><input className="field" value={d.ipa} maxLength={80} onChange={(e) => set('ipa', e.target.value)} placeholder="/əˈkaʊntənt/" /></label>
                            </div>
                            <label className="block mt-3"><span className="label">Nghĩa tiếng Việt</span><input className="field" value={d.answerOrMeaning} maxLength={1500} onChange={(e) => set('answerOrMeaning', e.target.value)} /></label>
                        </>
                    )}
                    <label className="block mt-3"><span className="label">{mcq ? 'Giải thích' : 'Câu ví dụ (EN)'}</span><textarea className="field py-2" rows={2} maxLength={2500} value={d.explanationOrExample} onChange={(e) => set('explanationOrExample', e.target.value)} /></label>
                    {!mcq && <label className="block mt-3"><span className="label">Dịch câu ví dụ</span><textarea className="field py-2" rows={1} maxLength={1500} value={d.exampleVi} onChange={(e) => set('exampleVi', e.target.value)} /></label>}
                    <label className="block mt-3"><span className="label">Từ khóa ăn điểm (phím H) — cách nhau bằng dấu phẩy</span><input className="field" value={d.keywordsText} maxLength={1200} onChange={(e) => set('keywordsText', e.target.value)} /></label>
                    <div className="grid grid-cols-4 gap-2 mt-4 text-center">
                        {[['Đúng', item.correctCount, 'text-success'], ['Sai', item.wrongCount, 'text-danger'], ['Lần ôn', item.reviewCount, 'text-primary'], ['Phát âm', item.pronounceCount, 'text-ink2']].map(([l, v, c]) => (
                            <div key={l} className="rounded-xl bg-surface2 p-2"><p className={'text-xl font-bold tnum ' + c}>{v || 0}</p><p className="text-xs text-ink2">{l}</p></div>
                        ))}
                    </div>
                    {Sch.reviewNote(item) && <p className="text-sm text-muted mt-2">Lịch ôn: {Sch.reviewNote(item)}</p>}
                </Modal>
            );
        };

        const BATCH_SAMPLE = { word: 'VD: accountant', type: 'n', meaning: 'kế toán viên', example: 'She works as an accountant…' };
        const BATCH_PLAIN = { word: 'Từ tiếng Anh', type: 'Loại', meaning: 'Nghĩa tiếng Việt', example: 'Câu ví dụ (EN)' };
        const newDraft = () => ({ key: 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), questionOrWord: '', answerOrMeaning: '', wordType: '', ipa: '', explanationOrExample: '', exampleVi: '', keywords: [], open: false });
        /* Thẻ nhập nhanh nối vào cuối một Nhóm: gõ từ (có gợi ý), Enter sang nghĩa, Enter nữa là dòng mới. Lưu tất cả một lần. */
        const BatchAdd = ({ drafts, setDrafts, group, onGroup, groups, onSave, onCancel, onAI, autoFocus = true, savedAt }) => {
            const refs = useRef({});
            const [focusKey, setFocusKey] = useState(() => (autoFocus && drafts[0] ? drafts[0].key : null));
            const [busyKey, setBusyKey] = useState(null);
            const count = useRef(drafts.length);
            const groupListId = useMemo(() => 'bg-' + Math.random().toString(36).slice(2, 8), []);
            useEffect(() => {
                /* Dòng mới (từ menu, nút "+ Thêm dòng" hay phím Enter) luôn được focus. */
                if (drafts.length > count.current && drafts.length) setFocusKey(drafts[drafts.length - 1].key);
                count.current = drafts.length;
            }, [drafts.length]);
            useEffect(() => {
                if (!focusKey) return;
                const el = refs.current[focusKey];
                if (el) { el.focus(); el.scrollIntoView({ block: 'nearest' }); }
                setFocusKey(null);
            }, [focusKey]);
            const patch = (key, p) => setDrafts(list => list.map(x => (x.key === key ? Object.assign({}, x, p) : x)));
            const addNext = () => setDrafts(list => list.concat([newDraft()]));
            const drop = (key) => setDrafts(list => { const next = list.filter(x => x.key !== key); return next.length ? next : [newDraft()]; });
            const fill = async (x) => {
                setBusyKey(x.key);
                try {
                    const e = await onAI(Object.assign({ id: 'draft-' + x.key, type: 'vocab' }, x));
                    if (e) setDrafts(list => list.map(y => (y.key === x.key ? Object.assign(mergeEnrich(y, e), { open: true }) : y)));
                } finally {
                    setBusyKey(null);
                }
            };
            const ready = drafts.filter(x => x.questionOrWord.trim()).length;
            const enterTo = (e, next) => { if (e.key === 'Enter' && !e.shiftKey && !e.nativeEvent.isComposing) { e.preventDefault(); next(); } };
            return (
                <section className="batch-add card" aria-label="Nhập từ trực tiếp">
                    <div className="flex flex-wrap items-center gap-2 border-b border-line px-3 py-2.5 sm:px-4">
                        <span className="grp-dot" style={{ background: group.trim() ? Sch.groupColor(group.trim()) : 'var(--border)' }} aria-hidden="true" />
                        <label className="batch-group">
                            <input list={groupListId} value={group} maxLength={80} size={Math.max(6, Math.min(32, (group || '').length + 1))} placeholder="Tên nhóm, vd Unit 1" aria-label="Tên nhóm (bấm để sửa)" onChange={(e) => onGroup(e.target.value)} />
                            <Icon name="pen" size={13} />
                        </label>
                        <datalist id={groupListId}>{(groups || []).filter(([k]) => k !== '__none').map(([k]) => <option key={k} value={k} />)}</datalist>
                        <span className="ml-auto flex min-w-0 items-center gap-3">
                            {savedAt ? <span key={savedAt} className="saved-tag"><Icon name="check" size={12} /> Đã tự lưu</span> : null}
                            <span className="hidden min-w-0 truncate text-xs text-muted lg:inline"><Kbd>Enter</Kbd> sang ô kế / dòng mới · <Kbd>↓</Kbd> chọn gợi ý</span>
                        </span>
                    </div>
                    <div className="batch-cols" aria-hidden="true"><span /><span>Từ tiếng Anh</span><span>Loại</span><span>Nghĩa tiếng Việt</span><span>Ví dụ</span><span /></div>
                    <ol className="divide-y divide-line">
                        {drafts.map((x, i) => {
                            const ph = i === 0 ? BATCH_SAMPLE : BATCH_PLAIN;
                            const nextRow = () => { const at = drafts.findIndex(y => y.key === x.key); const nx = drafts[at + 1]; if (nx) setFocusKey(nx.key); else addNext(); };
                            return (
                            <li key={x.key} className="batch-row">
                                <span className="batch-num tnum" aria-hidden="true">{i + 1}</span>
                                <div className="min-w-0 flex-1">
                                    <div className="batch-grid">
                                        <WordSuggest value={x.questionOrWord} placeholder={ph.word} ariaLabel={'Từ tiếng Anh, dòng ' + (i + 1)}
                                            inputRef={el => { refs.current[x.key] = el; }}
                                            onChange={(v) => patch(x.key, { questionOrWord: v })}
                                            onPick={(e) => { patch(x.key, fillFromDict(x, e)); const m = refs.current[x.key + ':m']; if (m) window.setTimeout(() => m.focus(), 0); }}
                                            onKeyDown={(e) => enterTo(e, () => { const m = refs.current[x.key + ':m']; if (m) m.focus(); })}>
                                            <AiPin mini onClick={() => fill(x)} busy={busyKey === x.key} disabled={!x.questionOrWord.trim()} label="AI điền từ loại, IPA, nghĩa, ví dụ" />
                                        </WordSuggest>
                                        <input className="field batch-type" value={x.wordType} maxLength={24} placeholder={ph.type} aria-label={'Từ loại, dòng ' + (i + 1)} onChange={(e) => patch(x.key, { wordType: e.target.value })} />
                                        <input ref={el => { refs.current[x.key + ':m'] = el; }} className="field batch-mean" value={x.answerOrMeaning} maxLength={1500} placeholder={ph.meaning} aria-label={'Nghĩa tiếng Việt, dòng ' + (i + 1)}
                                            onChange={(e) => patch(x.key, { answerOrMeaning: e.target.value })}
                                            onKeyDown={(e) => enterTo(e, nextRow)} />
                                        <input className="field batch-ex" value={x.explanationOrExample} maxLength={2500} placeholder={ph.example} aria-label={'Câu ví dụ, dòng ' + (i + 1)}
                                            onChange={(e) => patch(x.key, { explanationOrExample: e.target.value })}
                                            onKeyDown={(e) => enterTo(e, nextRow)} />
                                    </div>
                                    {x.ipa && !x.open && <p className="mt-1 text-xs text-muted">{x.ipa}</p>}
                                    {x.open && (
                                        <div className="mt-2 grid gap-2 md:grid-cols-[12rem_1fr]">
                                            <input className="field" value={x.ipa} maxLength={80} placeholder="IPA /…/" aria-label="IPA" onChange={(e) => patch(x.key, { ipa: e.target.value })} />
                                            <input className="field md:hidden" value={x.explanationOrExample} maxLength={2500} placeholder="Câu ví dụ (EN)" aria-label="Câu ví dụ" onChange={(e) => patch(x.key, { explanationOrExample: e.target.value })} />
                                            <input className="field" value={x.exampleVi} maxLength={1500} placeholder="Dịch câu ví dụ" aria-label="Dịch câu ví dụ" onChange={(e) => patch(x.key, { exampleVi: e.target.value })} />
                                        </div>
                                    )}
                                </div>
                                <div className="batch-acts">
                                    <button type="button" className="lib-act" aria-expanded={x.open} aria-label={x.open ? 'Thu gọn' : 'Thêm IPA, ví dụ'} title={x.open ? 'Thu gọn' : 'Thêm IPA, ví dụ'} onClick={() => patch(x.key, { open: !x.open })}><Icon name={x.open ? 'chevronUp' : 'chevronDown'} size={15} /></button>
                                    <button type="button" className="lib-act" aria-label={'Bỏ dòng ' + (i + 1)} title="Bỏ dòng" onClick={() => drop(x.key)}><Icon name="x" size={15} /></button>
                                </div>
                            </li>
                            );
                        })}
                    </ol>
                    <div className="flex flex-wrap items-center gap-2 border-t border-line px-3 py-2.5 sm:px-4">
                        <button type="button" className="btn btn-ghost btn-sm" onClick={addNext}><Icon name="plus" size={14} /> Thêm dòng</button>
                        <div className="ml-auto flex items-center gap-2">
                            {onCancel && <button type="button" className="btn btn-secondary btn-sm" onClick={onCancel}>Hủy</button>}
                            <button type="button" className="btn btn-primary btn-sm whitespace-nowrap" disabled={!ready} onClick={onSave}>Lưu tất cả{ready ? ' (' + ready + ')' : ''}</button>
                        </div>
                    </div>
                </section>
            );
        };

        /* ---------- Quick Paste ---------- */
        const EXCEL_RE = /\.(xlsx|xls|csv)$/i;
        const GENERIC_FILE = /^(book|sheet|trang tính|download|untitled|export|data|file|copy of)\s*[\d()\s-]*$/i;
        /* Tên nhóm từ file: tên file bỏ đuôi; tên file chung chung (Book1, download…) thì lấy tên sheet đầu tiên. */
        const groupFromFile = (fileName, sheetName) => {
            const base = String(fileName || '').replace(EXCEL_RE, '').replace(/[_]+/g, ' ').replace(/\s+/g, ' ').trim();
            const sheet = String(sheetName || '').trim();
            if (base && !GENERIC_FILE.test(base)) return base.slice(0, 80);
            if (sheet && !GENERIC_FILE.test(sheet)) return sheet.slice(0, 80);
            return base.slice(0, 80);
        };
        const SAMPLE_SHEET = [
            ['Từ / Câu hỏi', 'Nghĩa / Đáp án', 'Ví dụ / Giải thích'],
            ['colleague', 'đồng nghiệp', 'My colleague helped me finish the report.'],
            ['negotiate', 'đàm phán', 'We negotiated a higher salary.'],
            ['deadline', 'hạn chót', 'The deadline is next Friday.']
        ];
        const downloadSample = () => {
            if (!window.XLSX) return;
            const ws = XLSX.utils.aoa_to_sheet(SAMPLE_SHEET);
            ws['!cols'] = [{ wch: 18 }, { wch: 18 }, { wch: 44 }];
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Unit 1 - Jobs');
            XLSX.writeFile(wb, 'so-tu-mau.xlsx');
        };
        /* Đọc 1 file Excel/CSV thành danh sách mục. File không có dòng tiêu đề thì hiểu cột A = từ, B = nghĩa, C = ví dụ. */
        const readExcelFile = async (file, group) => {
            if (!window.XLSX) throw new Error('Thư viện Excel chưa tải xong, thử lại sau vài giây');
            const wb = XLSX.read(await Sec.readBuffer(file), { type: 'array', cellFormula: false, cellHTML: false });
            const sheetName = wb.SheetNames[0] || '';
            let rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, raw: false, defval: '' })
                .filter(r => Array.isArray(r) && r.some(c => String(c).trim()));
            const name = groupFromFile(Sec.cleanText(file.name, 120), sheetName);
            const g = group || name;
            let list;
            try {
                list = Sch.fromExcelRows(rows, g);
            } catch (e) {
                list = Sch.fromExcelRows([SAMPLE_SHEET[0]].concat(rows), g);
            }
            return { name, list };
        };

        const QuickPaste = ({ groups, onAdd, toast, onLocked, bare }) => {
            const [text, setText] = useState('');
            const [group, setGroup] = useState('');
            const [preview, setPreview] = useState(null);
            const [busy, setBusy] = useState(false);
            const [drag, setDrag] = useState(false);
            const xlsRef = useRef(null);
            const dragDepth = useRef(0);
            const isFileDrag = (e) => Array.from((e.dataTransfer && e.dataTransfer.types) || []).indexOf('Files') >= 0;
            const takeFiles = async (files) => {
                const picked = Array.from(files || []);
                if (!picked.length) return;
                const bad = picked.filter(f => !EXCEL_RE.test(f.name));
                if (bad.length === picked.length) { toast('Chỉ nhận file Excel (.xlsx, .xls) hoặc CSV', 'error'); return; }
                setBusy(true);
                try {
                    const typed = group.trim();
                    let all = [];
                    let first = '';
                    for (const f of picked.filter(x => EXCEL_RE.test(x.name))) {
                        const { name, list } = await readExcelFile(f, typed);
                        if (!first) first = name;
                        all = all.concat(list);
                    }
                    Sec.guardCount(all.length, 0);
                    if (!typed && first) setGroup(first);
                    if (!all.length) { toast('File không có dòng từ vựng nào', 'info'); return; }
                    setPreview(all);
                    toast('Đã tách ' + all.length + ' mục từ file' + (bad.length ? ' · bỏ qua ' + bad.length + ' file không phải Excel' : ''), 'success');
                } catch (e) {
                    toast((e && e.message) || 'File không đọc được', 'error');
                } finally {
                    setBusy(false);
                }
            };
            const dropZone = {
                onDragEnter: (e) => { if (!isFileDrag(e)) return; e.preventDefault(); dragDepth.current += 1; setDrag(true); },
                onDragOver: (e) => { if (!isFileDrag(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; },
                onDragLeave: (e) => { if (!isFileDrag(e)) return; dragDepth.current = Math.max(0, dragDepth.current - 1); if (!dragDepth.current) setDrag(false); },
                onDrop: (e) => { if (!isFileDrag(e)) return; e.preventDefault(); dragDepth.current = 0; setDrag(false); takeFiles(e.dataTransfer.files); }
            };
            const parseLocal = () => {
                const list = Sch.parseQuickPaste(text, group.trim());
                if (!list.length) { toast('Chưa tách được mục nào. Thử định dạng "word - nghĩa" hoặc câu có A. B. C. D.', 'info'); return; }
                setPreview(list);
            };
            const parseAI = async () => {
                if (!AI.ready()) { toast('AI chỉ chạy khi mở trang qua web, không mở file trực tiếp.', 'info'); return; }
                if (!E.Quota.aiFillAllowed()) { onLocked && onLocked(); return; }
                if (text.length > Sec.LIMITS.aiPasteChars) toast('Văn bản dài, AI chỉ đọc ' + Sec.LIMITS.aiPasteChars + ' ký tự đầu', 'info');
                setBusy(true);
                try {
                    const list = await AI.structurePaste(text, group.trim());
                    if (!list.length) toast('AI không tìm thấy mục nào', 'info');
                    else setPreview(list);
                } catch (e) {
                    if (e && e.code === 'ai-locked') { onLocked && onLocked(); return; }
                    toast(e.message, 'error');
                } finally {
                    setBusy(false);
                }
            };
            return (
                <section className={bare ? '' : 'card p-4 sm:p-5 mb-4'} aria-labelledby={bare ? undefined : 'qp-title'}>
                    {!bare && <div className="qp-head">
                        <h3 id="qp-title" className="flex min-w-0 items-center gap-2 whitespace-nowrap font-semibold"><Icon name="clipboard" />Ô nhập thông minh</h3>
                        <div className="qp-tools">
                            <button type="button" className="qp-xls" onClick={() => xlsRef.current && xlsRef.current.click()} disabled={busy} aria-label="Nhập file Excel (.xlsx, .xls, .csv)">
                                <Icon name="upload" size={15} /><span>Nhập Excel</span>
                            </button>
                            <button type="button" className="qp-sample hidden items-center md:inline-flex" onClick={downloadSample} title="Tải file .xlsx mẫu 3 cột: Từ, Nghĩa, Ví dụ">File mẫu</button>
                        </div>
                    </div>}
                    <input ref={xlsRef} type="file" multiple accept=".xlsx,.xls,.csv" className="hidden" onChange={(e) => { const f = e.target.files; takeFiles(f).finally(() => { e.target.value = ''; }); }} />
                    <p className="qp-sub">Mỗi dòng "từ - nghĩa", hoặc cả đoạn câu hỏi trắc nghiệm. Có thể kéo file Excel thả vào ô.{bare && <button type="button" className="qp-sample" onClick={() => xlsRef.current && xlsRef.current.click()}>Chọn file</button>}<button type="button" className={'qp-sample' + (bare ? '' : ' md:hidden')} onClick={downloadSample}>File mẫu</button></p>
                    {!preview ? (
                        <>
                            <div className={'qp-drop' + (drag ? ' is-drag' : '')} {...dropZone}>
                                <textarea value={text} onChange={(e) => setText(e.target.value)} rows={6} maxLength={Sec.LIMITS.pasteChars} className="field py-2 font-mono text-[13px]" aria-label="Văn bản cần tách"
                                    placeholder={'accountant - kế toán viên\nresign (v) - nghỉ việc\n\n1. Which testing technique is based on the specification?\nA. White-box\nB. Black-box\nC. Static analysis\nD. Code review\nĐáp án: B'} />
                                {drag && (
                                    <div className="qp-overlay" aria-hidden="true">
                                        <Icon name="upload" size={22} />
                                        <b>Thả file Excel để tự động tách từ vựng</b>
                                        <small>.xlsx, .xls hoặc .csv · tên file thành tên nhóm</small>
                                    </div>
                                )}
                            </div>
                            <div className="flex flex-wrap items-end gap-2 mt-3">
                                <label className="flex-1 min-w-[180px]"><span className="label">Nhóm</span><input className="field" list="qp-groups" value={group} maxLength={80} onChange={(e) => setGroup(e.target.value)} placeholder="Unit 1 - Jobs / SWT301 Ch.2" /></label>
                                <datalist id="qp-groups">{groups.filter(([k]) => k !== '__none').map(([k]) => <option key={k} value={k} />)}</datalist>
                                <button type="button" className="btn btn-secondary" onClick={parseLocal} disabled={!text.trim()}><Icon name="list" /> Tách nhanh</button>
                                <button type="button" className="btn btn-primary" onClick={parseAI} disabled={!text.trim() || busy}><Icon name="sparkles" /> {busy ? 'AI đang điền…' : 'AI điền tất cả'}</button>
                            </div>
                        </>
                    ) : (
                        <>
                            <p className="text-sm text-ink2 mb-2">Xem trước {preview.length} mục — bỏ mục sai trước khi thêm:</p>
                            <ul className="max-h-80 overflow-y-auto space-y-2 pr-1">
                                {preview.map(t => (
                                    <li key={t.id} className="rounded-xl border border-line p-3 flex gap-3 items-start">
                                        <span className={'chip shrink-0 ' + (t.type === 'mcq' ? 'bg-surface2 text-ink2' : 'bg-primary-soft text-primary')}>{t.type === 'mcq' ? 'MCQ' : 'Từ'}</span>
                                        <div className="min-w-0 flex-1 text-sm">
                                            <p className="font-semibold text-flow">{t.questionOrWord} {t.ipa && <span className="font-normal text-ink2">{t.ipa}</span>}</p>
                                            <p className="text-ink2 text-flow">{t.type === 'mcq' ? (t.answerOrMeaning ? t.answerOrMeaning + '. ' + Sch.correctText(t) : 'Chưa có đáp án') : (t.answerOrMeaning || 'Chưa có nghĩa')}</p>
                                            {t.keywords.length > 0 && <div className="flex flex-wrap gap-1 mt-1">{t.keywords.map(k => <span key={k} className="chip bg-warn-soft text-warn">{k}</span>)}</div>}
                                        </div>
                                        <button type="button" className="btn btn-ghost btn-sm btn-icon" onClick={() => setPreview(preview.filter(x => x.id !== t.id))} aria-label="Bỏ mục này"><Icon name="x" size={14} /></button>
                                    </li>
                                ))}
                            </ul>
                            <div className="flex flex-wrap gap-2 mt-3">
                                <button type="button" className="btn btn-secondary" onClick={() => setPreview(null)}><Icon name="back" /> Sửa văn bản</button>
                                <button type="button" className="btn btn-primary" disabled={!preview.length} onClick={() => { onAdd(preview); setPreview(null); setText(''); }}><Icon name="plus" /> Thêm {preview.length} mục vào kho</button>
                            </div>
                        </>
                    )}
                </section>
            );
        };

        /* ---------- Kho của tôi (bảng) ---------- */
        const splitSentences = (text) => {
            const clean = String(text || '').replace(/\s+/g, ' ').trim();
            if (!clean) return [];
            const parts = clean.split(/(?<=[.!?])\s+(?=[A-Z"“])/);
            return (parts.length > 1 ? parts : [clean]).map(s => s.trim()).filter(s => s.length > 1).slice(0, 30);
        };
        const sentenceIndexOf = (sentences, word, hint) => {
            const hinted = String(hint || '').toLowerCase();
            if (hinted) {
                const hit = sentences.findIndex(s => s.toLowerCase().indexOf(hinted.slice(0, 48)) >= 0);
                if (hit >= 0) return hit;
            }
            const low = String(word || '').toLowerCase();
            const i = sentences.findIndex(s => low && s.toLowerCase().indexOf(low) >= 0);
            return i >= 0 ? i : 0;
        };
        const markRanges = (sentence, words) => {
            const ranges = [];
            words.forEach(w => {
                const src = String(w.word || '').trim();
                if (src.length < 2) return;
                const re = new RegExp(src.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig');
                let m;
                while ((m = re.exec(sentence))) {
                    ranges.push({ start: m.index, end: m.index + m[0].length, wordId: w.id });
                    if (m.index === re.lastIndex) re.lastIndex += 1;
                }
            });
            ranges.sort((a, b) => a.start - b.start || b.end - a.end);
            const kept = [];
            let cursor = 0;
            ranges.forEach(r => {
                if (r.start < cursor) return;
                kept.push(r);
                cursor = r.end;
            });
            return kept;
        };
        const renderSentence = (sentence, active, charIndex, words, onMark, onAdd) => {
            const ranges = markRanges(sentence, words);
            const bits = [];
            const pushPlain = (from, to) => {
                const slice = sentence.slice(from, to);
                const re = /[A-Za-z]+(?:'[A-Za-z]+)?/g;
                let m;
                let last = 0;
                while ((m = re.exec(slice))) {
                    if (m.index > last) bits.push({ kind: 'gap', text: slice.slice(last, m.index), key: from + '-' + last });
                    const abs = from + m.index;
                    bits.push({ kind: 'tok', text: m[0], key: 't' + abs, karaoke: active && charIndex >= abs && charIndex < abs + m[0].length });
                    last = m.index + m[0].length;
                }
                if (last < slice.length) bits.push({ kind: 'gap', text: slice.slice(last), key: from + '-g' + last });
            };
            let at = 0;
            ranges.forEach(r => {
                if (r.start > at) pushPlain(at, r.start);
                bits.push({ kind: 'mark', text: sentence.slice(r.start, r.end), key: 'm' + r.start, id: r.wordId, karaoke: active && charIndex >= r.start && charIndex < r.end });
                at = r.end;
            });
            if (at < sentence.length) pushPlain(at, sentence.length);
            return bits.map(b => {
                if (b.kind === 'gap') return <span key={b.key}>{b.text}</span>;
                if (b.kind === 'mark') {
                    return <span key={b.key} role="button" tabIndex={0} className={'cursor-pointer rounded px-0.5 transition-colors ' + (b.karaoke ? 'bg-amber-200/90 text-slate-900 font-medium' : 'bg-indigo-50 text-[#4338CA] border-b-2 border-[#4338CA]')} onClick={(e) => { e.stopPropagation(); onMark(b.id); }} onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); onMark(b.id); } }}>{b.text}</span>;
                }
                return <span key={b.key} className={b.karaoke ? 'bg-amber-200/90 text-slate-900 font-medium rounded px-0.5 transition-colors' : ''} onClick={(e) => { e.stopPropagation(); onAdd(b.text); }}>{b.text}</span>;
            });
        };

        const PassageReader = ({ toast, onClose, onSave }) => {
            const fund = useFund();
            const [phase, setPhase] = useState('edit');
            const [draft, setDraft] = useState('');
            const [busy, setBusy] = useState(false);
            const [sentences, setSentences] = useState([]);
            const [words, setWords] = useState([]);
            const [preview, setPreview] = useState(false);
            const [index, setIndex] = useState(0);
            const [playing, setPlaying] = useState(false);
            const [speed, setSpeed] = useState(1);
            const [shadow, setShadow] = useState(false);
            const [waitUntil, setWaitUntil] = useState(0);
            const [charIndex, setCharIndex] = useState(-1);
            const [offer, setOffer] = useState(null);
            const [syncing, setSyncing] = useState(false);
            const tokenRef = useRef(0);
            const playRef = useRef(() => {});
            const indexRef = useRef(0);
            const sentencesRef = useRef([]);
            const speedRef = useRef(1);
            const shadowRef = useRef(false);
            const playingRef = useRef(false);
            const waitRef = useRef(0);
            const advanced = useRef(0);
            const now = useNow(200, phase === 'read' && !!waitUntil);
            sentencesRef.current = sentences;
            indexRef.current = index;
            speedRef.current = speed;
            shadowRef.current = shadow;
            playingRef.current = playing;
            waitRef.current = waitUntil;

            const stopSpeak = () => {
                tokenRef.current += 1;
                setPlaying(false);
                setWaitUntil(0);
                setCharIndex(-1);
                try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
            };
            const playAt = (i) => {
                const list = sentencesRef.current;
                if (!list.length || !window.speechSynthesis) {
                    toast('Trình duyệt này chưa đọc được tiếng Anh.', 'info');
                    return;
                }
                const n = Math.max(0, Math.min(list.length - 1, i));
                setIndex(n);
                indexRef.current = n;
                setCharIndex(-1);
                setWaitUntil(0);
                const token = ++tokenRef.current;
                try { window.speechSynthesis.cancel(); } catch (e) {}
                const u = new SpeechSynthesisUtterance(list[n]);
                u.lang = 'en-US';
                u.rate = speedRef.current;
                const voices = window.speechSynthesis.getVoices() || [];
                const voice = voices.filter(v => /en-US/i.test(v.lang))[0] || voices.filter(v => /^en/i.test(v.lang))[0];
                if (voice) u.voice = voice;
                u.onboundary = (ev) => {
                    if (token !== tokenRef.current || typeof ev.charIndex !== 'number') return;
                    setCharIndex(ev.charIndex);
                };
                u.onend = () => {
                    if (token !== tokenRef.current) return;
                    setPlaying(false);
                    setCharIndex(-1);
                    if (n >= list.length - 1) return;
                    if (shadowRef.current) setWaitUntil(Date.now() + 3500);
                    else playRef.current(n + 1);
                };
                u.onerror = () => { if (token === tokenRef.current) setPlaying(false); };
                setPlaying(true);
                window.setTimeout(() => {
                    if (token !== tokenRef.current) return;
                    try { window.speechSynthesis.speak(u); } catch (e) { setPlaying(false); }
                }, 50);
            };
            playRef.current = playAt;
            useEffect(() => () => { tokenRef.current += 1; try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {} }, []);
            useEffect(() => {
                if (!waitUntil || now < waitUntil || advanced.current === waitUntil) return;
                advanced.current = waitUntil;
                const next = indexRef.current + 1;
                setWaitUntil(0);
                if (next < sentencesRef.current.length) playRef.current(next);
            }, [now, waitUntil]);
            const onSpace = () => {
                if (waitRef.current) {
                    const next = indexRef.current + 1;
                    if (next >= sentencesRef.current.length) stopSpeak();
                    else playAt(next);
                    return;
                }
                if (playingRef.current) stopSpeak();
                else playAt(indexRef.current);
            };
            useHotkeys('passage', phase === 'read' ? {
                Space: { run: onSpace, overrideButton: true },
                r: { run: () => playAt(indexRef.current) },
                ArrowLeft: { run: () => playAt(indexRef.current) },
                ArrowRight: { run: () => { const next = indexRef.current + 1; if (next < sentencesRef.current.length) playAt(next); } }
            } : {}, { enabled: phase === 'read' });

            const analyze = async () => {
                setBusy(true);
                try {
                    const result = await AI.extractPassage(draft);
                    const lines = splitSentences(draft);
                    if (!result.words.length) {
                        toast('AI chưa tách được từ nào trong đoạn này.', 'info');
                        return;
                    }
                    affirmStudy(toast);
                    setSentences(lines);
                    setWords(result.words.map((w, i) => ({
                        id: 'p' + i,
                        word: w.word,
                        wordType: w.wordType,
                        ipa: w.ipa,
                        meaning: w.meaning,
                        tip: w.tip,
                        sentence: w.sentence,
                        sentenceIndex: w.sentenceIndex >= 0 && w.sentenceIndex < lines.length ? w.sentenceIndex : sentenceIndexOf(lines, w.word, w.sentence),
                        checked: true
                    })));
                    setPreview(!!result.preview);
                    setOffer(null);
                    setIndex(0);
                    setPhase('read');
                } catch (e) {
                    if (e && e.code === 'ai-locked') setPhase('pay');
                    else toast((e && e.message) || 'Chưa quét được đoạn văn.', 'error');
                } finally {
                    setBusy(false);
                }
            };
            const toggleWord = (id) => setWords(list => list.map(w => (w.id === id ? Object.assign({}, w, { checked: !w.checked }) : w)));
            const addPlain = (surface) => {
                if (preview) return;
                const low = surface.toLowerCase();
                const hit = words.find(w => w.word.toLowerCase() === low);
                if (hit) { toggleWord(hit.id); return; }
                setWords(list => list.concat([{ id: 'm' + Date.now(), word: surface, wordType: '', ipa: '', meaning: '', tip: '', sentence: sentences[index] || '', sentenceIndex: index, checked: true }]));
            };
            const chosen = words.filter((w, i) => w.checked && !(preview && i >= 3));
            const allOn = words.length > 0 && words.every((w, i) => (preview && i >= 3) || w.checked);
            const saveChosen = () => {
                if (!chosen.length || preview) return;
                onSave(chosen.map(w => Sch.normalizeItem({
                    type: 'vocab',
                    group: 'Bài đọc',
                    questionOrWord: w.word,
                    wordType: w.wordType,
                    ipa: w.ipa,
                    answerOrMeaning: w.meaning,
                    explanationOrExample: sentences[w.sentenceIndex] || w.sentence || '',
                    exampleVi: w.tip,
                    keywords: w.tip ? [w.tip] : []
                })));
                stopSpeak();
                onClose();
            };
            const checkPay = () => {
                setSyncing(true);
                E.Quota.sync().then((r) => {
                    if (r.aiUnlocked || r.aiJustUnlocked || r.aiJustFunded) {
                        toast(r.added > 0 ? 'Đã cộng ' + r.added + ' lượt EOS và bật trợ lý AI.' : (r.aiJustFunded ? 'Đã cộng 500 lượt điền và 30 lượt quét.' : 'Đã bật trợ lý AI.'), 'success');
                        setPreview(false);
                        setOffer(null);
                        if (phase === 'pay') setPhase('edit');
                    } else toast('Chưa thấy giao dịch mới cho nội dung ' + E.Quota.memoOf(r.code) + '.', 'info');
                }).catch((e) => toast(e.message || 'Chưa kiểm tra được thanh toán.', 'error')).finally(() => setSyncing(false));
            };
            const payBox = () => {
                const pack = offer === 'basic' ? E.Quota.packs.find(p => p.id === 'basic') : E.Quota.vocab;
                if (offer && pack) {
                    return (
                        <PayGate>
                        <div className="mt-3 flex flex-wrap items-center gap-4">
                            <img src={E.Quota.qrUrl(pack.price, fund.code)} alt={'VietQR ' + pack.price + ' đồng'} className="h-36 w-36 rounded-xl border border-line bg-white object-contain" />
                            <div className="min-w-0 flex-1 text-sm text-ink2">
                                <p className="font-semibold text-ink">{pack.name}</p>
                                <p className="tnum mt-1">Số tiền: <b className="text-ink">{vnd(pack.price)}</b></p>
                                <p className="tnum">Nội dung: <b className="text-ink">{E.Quota.memoOf(fund.code)}</b></p>
                                <button type="button" className="btn btn-primary mt-3" disabled={syncing} onClick={checkPay}>{syncing ? 'Đang kiểm tra…' : 'Kiểm tra chuyển khoản'}</button>
                                <button type="button" className="btn btn-ghost btn-sm mt-1" onClick={() => setOffer(null)}>Chọn lại</button>
                            </div>
                        </div>
                        </PayGate>
                    );
                }
                return (
                    <div>
                        <button type="button" className="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-[#4338CA] px-6 py-3 font-semibold text-white shadow-sm transition-all hover:bg-[#3730A3]" onClick={() => setOffer('vocab')}>Mở khóa ngay — 29.000đ (Quét QR tự động 3s)<Icon name="arrow" size={16} /></button>
                        <button type="button" className="mt-2 block w-full text-center text-xs text-slate-400 underline underline-offset-2" onClick={() => setOffer('basic')}>Sinh viên FPT cần thi EOS? Chọn Gói Cơ Bản (100k - 20 lượt EOS + Tặng Free gói AI này) ↗</button>
                    </div>
                );
            };
            const speeds = [0.8, 1, 1.25];
            const leftMs = waitUntil ? Math.max(0, waitUntil - now) : 0;
            return (
                <Modal title="AI Quét bài đọc" badge={fund.aiUnlocked && !(fund.aiCredits > 0) ? 'Tối đa 15 lượt quét mỗi ngày' : ('Còn ' + Math.max(0, 2 + (fund.scanGrant || 0) - (fund.scans || 0)) + ' lượt quét')} onClose={() => { stopSpeak(); onClose(); }} size="xl">
                    {phase === 'edit' && (
                        <div className="space-y-3">
                            <p className="text-sm text-ink2">Dán bài đọc IELTS, đề thi hoặc slide. Hai lần đầu trừ vào 100 lượt AI miễn phí. Lần sau chỉ hiện 3 từ mẫu, không gọi AI.</p>
                            <textarea value={draft} onChange={(e) => setDraft(e.target.value.slice(0, 2500))} maxLength={2500} rows={10} data-autofocus className="w-full min-h-[220px] outline-none focus:outline-none border border-slate-200 focus:border-[#4338CA] focus:ring-4 focus:ring-[#4338CA]/10 rounded-xl p-4 text-slate-700 transition-all" placeholder="Dán đoạn tiếng Anh vào đây…" aria-label="Đoạn văn cần quét" />
                            <p className="text-right text-xs text-slate-400">{draft.length}/2500</p>
                            <button type="button" className="btn btn-primary" disabled={busy || draft.trim().length < 40} onClick={analyze}><Icon name="sparkles" size={16} /> {busy ? 'Đang phân tích…' : 'Phân tích & Highlight từ vựng'}</button>
                        </div>
                    )}
                    {phase === 'pay' && (
                        <div className="mx-auto max-w-md space-y-3">
                            <p className="text-sm text-ink2">Bạn đã dùng hết lượt quét thử. Mở khóa một lần để quét bài đọc và tự điền không giới hạn.</p>
                            {payBox()}
                        </div>
                    )}
                    {phase === 'read' && (
                        <div className="grid items-start gap-4 lg:grid-cols-5">
                            <div className="lg:col-span-3 space-y-3">
                                <div>
                                    <div className="mb-1 flex items-center justify-between text-xs text-slate-400">
                                        <span>Câu {index + 1} / {sentences.length}</span>
                                    </div>
                                    <div className="h-1.5 overflow-hidden rounded-full bg-slate-100">
                                        <div className="h-full rounded-full bg-[#4338CA] transition-all" style={{ width: sentences.length ? ((index + 1) / sentences.length * 100) + '%' : '0%' }} />
                                    </div>
                                    {leftMs > 0 && (
                                        <div className="mt-2">
                                            <p className="text-xs text-slate-500">Đến lượt bạn đọc nhại lại... (Bấm Space để qua câu tiếp)</p>
                                            <div className="mt-1 h-0.5 overflow-hidden rounded-full bg-slate-100">
                                                <div className="h-full bg-[#4338CA]" style={{ width: (leftMs / 3500 * 100) + '%' }} />
                                            </div>
                                        </div>
                                    )}
                                    <p className="mt-2 text-xs text-slate-400">[Space]: Tạm dừng / Tiếp tục · [R] hoặc [←]: Nghe lại câu này · [→]: Câu tiếp</p>
                                </div>
                                <div className="flex flex-wrap items-center gap-2">
                                    <button type="button" className="inline-flex items-center gap-2 rounded-xl border border-line px-3 min-h-[36px] text-sm font-medium" onClick={onSpace}><Icon name={playing ? 'pause' : 'play'} size={14} /> {playing ? 'Dừng' : 'Nghe'}</button>
                                    <div className="inline-flex rounded-full bg-surface2 p-0.5" role="group" aria-label="Tốc độ đọc">
                                        {speeds.map(s => (
                                            <button key={s} type="button" className={'rounded-full px-2.5 min-h-[32px] text-xs font-medium ' + (speed === s ? 'bg-white text-ink shadow-sm' : 'text-slate-400')} onClick={() => { setSpeed(s); speedRef.current = s; if (playingRef.current) playAt(indexRef.current); }}>{s === 1 ? '1.0x' : s + 'x'}</button>
                                        ))}
                                    </div>
                                    <button type="button" aria-pressed={shadow} className={'inline-flex items-center gap-2 rounded-xl border px-3 min-h-[36px] text-sm font-medium ' + (shadow ? 'border-[#4338CA]/30 bg-[#4338CA]/10 text-[#4338CA]' : 'border-line text-ink2')} onClick={() => setShadow(v => !v)}><Icon name="mic" size={14} /> Tự dừng mỗi câu</button>
                                </div>
                                <div className="max-h-[48vh] space-y-1 overflow-y-auto text-[15px] leading-7 text-ink">
                                    {sentences.map((line, i) => (
                                        <p key={i} className={'cursor-pointer rounded px-1 ' + (i === index ? 'bg-slate-100/80' : '')} onClick={() => playAt(i)}>
                                            {renderSentence(line, i === index, i === index ? charIndex : -1, preview ? words.slice(0, 3) : words, toggleWord, addPlain)}
                                        </p>
                                    ))}
                                </div>
                                <button type="button" className="text-xs text-slate-400 underline underline-offset-2" onClick={() => { stopSpeak(); setPhase('edit'); }}>Dán đoạn khác</button>
                            </div>
                            <div className="lg:col-span-2 flex max-h-[68vh] flex-col">
                                <div className="mb-2 flex justify-end">
                                    <button type="button" className="text-xs text-slate-400 underline underline-offset-2" onClick={() => setWords(list => list.map((w, i) => (preview && i >= 3 ? w : Object.assign({}, w, { checked: !allOn }))))}>{allOn ? 'Bỏ chọn tất cả' : 'Chọn tất cả'}</button>
                                </div>
                                <div className="relative min-h-0 flex-1 space-y-2 overflow-y-auto pr-1">
                                    {words.map((w, i) => {
                                        const locked = preview && i >= 3;
                                        const reading = Sch.readingOf({ ipa: w.ipa });
                                        return (
                                            <article key={w.id} className={'relative rounded-xl border p-3 ' + (locked ? 'blur-[4px] select-none pointer-events-none border-line' : w.checked ? 'border-[#4338CA]/40 bg-white' : 'border-line opacity-50')} onClick={() => { if (!locked) toggleWord(w.id); }}>
                                                {w.checked && !locked && <Icon name="check" size={14} className="absolute right-2 top-2 text-[#4338CA]" />}
                                                {w.word === 'locked' ? (
                                                    <div className="space-y-2 py-1" aria-hidden="true"><div className="h-3 w-24 rounded bg-slate-200" /><div className="h-3 w-40 rounded bg-slate-100" /></div>
                                                ) : (
                                                    <>
                                                        <p className="pr-5 font-semibold">{w.word} {w.wordType && <span className="text-xs font-medium text-slate-400">{w.wordType}</span>}</p>
                                                        {(w.ipa || reading) && <p className="mt-1 text-xs text-ink2">{w.ipa}{reading ? ' · ' + reading : ''}</p>}
                                                        {w.meaning && <p className="mt-1 text-sm">{w.meaning}</p>}
                                                        {w.tip && <p className="mt-1 text-xs text-slate-400">{w.tip}</p>}
                                                    </>
                                                )}
                                            </article>
                                        );
                                    })}
                                    {preview && (
                                        <div className="sticky bottom-0 rounded-xl bg-white/95 p-3 shadow-sm">
                                            {payBox()}
                                        </div>
                                    )}
                                </div>
                                {!preview && (
                                    <button type="button" className="btn btn-primary mt-3 w-full" disabled={!chosen.length} onClick={saveChosen}>Lưu {chosen.length} từ đã chọn vào Kho</button>
                                )}
                            </div>
                        </div>
                    )}
                </Modal>
            );
        };

        const START_ANCHOR = '__start';
        const DRAFT_KEY = 'libDrafts';
        const loadDrafts = () => {
            const d = Store.prefs.get(DRAFT_KEY, null);
            if (!d || !Array.isArray(d.list) || !d.list.length || typeof d.group !== 'string') return null;
            const list = d.list.slice(0, 200).map(x => Object.assign(newDraft(), {
                questionOrWord: String(x.questionOrWord || ''), answerOrMeaning: String(x.answerOrMeaning || ''), wordType: String(x.wordType || ''),
                ipa: String(x.ipa || ''), explanationOrExample: String(x.explanationOrExample || ''), exampleVi: String(x.exampleVi || '')
            }));
            return { anchor: typeof d.anchor === 'string' ? d.anchor : START_ANCHOR, group: d.group.slice(0, 80), list };
        };
        const startDrafts = (group, anchor) => ({ anchor: anchor || START_ANCHOR, group: group || 'Unit 1', list: [newDraft(), newDraft(), newDraft()] });
        /* Tên nhóm kế tiếp: Unit lớn nhất + 1, không có thì "Unit <số nhóm + 1>". */
        const nextUnitName = (groups) => {
            let top = 0;
            (groups || []).forEach(([k]) => { const m = /^unit\s*(\d+)/i.exec(String(k || '')); if (m) top = Math.max(top, Number(m[1])); });
            return 'Unit ' + ((top || (groups || []).filter(([k]) => k && k !== '__none').length) + 1);
        };
        /* Tiến độ 1 từ gọn thành 1 nhãn: chưa luyện / đang nhớ / đã thuộc. */
        const learnState = (t) => {
            const right = t.correctCount || 0;
            const tries = right + (t.wrongCount || 0);
            if (!tries && !(t.reviewCount || 0)) return { key: 'new', label: 'Mới' };
            if (right >= 3 && !Sch.isWeak(t)) return { key: 'done', label: 'Đã thuộc' };
            return { key: 'mid', label: 'Đang nhớ' };
        };
        const LibraryView = ({ items, setItems, groups, groupFilter, setGroupFilter, onPractice, onWeak, onStudyFrom, onQuickVote, toast, mergeItems }) => {
            const [quick, setQuick] = useState(false);
            const [importBatches, setImportBatches] = useState(null);
            const [editing, setEditing] = useState(null);
            const [sel, setSel] = useState(() => new Set());
            const [bulkGroup, setBulkGroup] = useState('');
            const [search, setSearch] = useState('');
            const [typeFilter, setTypeFilter] = useState('all');
            const [shown, setShown] = useState(150);
            const [aiAll, setAiAll] = useState(null);
            const [aiRow, setAiRow] = useState(null);
            const [tease, setTease] = useState(null);
            const [passage, setPassage] = useState(() => takeGo('reading'));
            useEffect(() => {
                const open = () => setPassage(true);
                window.addEventListener('edu-reading', open);
                return () => window.removeEventListener('edu-reading', open);
            }, []);
            const [importHint, setImportHint] = useState(() => takeGo('import'));
            const [menu, setMenu] = useState(null);
            const [filterOpen, setFilterOpen] = useState(false);
            const [drafts, setDrafts] = useState(() => loadDrafts() || (items.length ? null : startDrafts()));
            const [draftSavedAt, setDraftSavedAt] = useState(0);
            const [savedGroups, setSavedGroups] = useState(null);
            /* Nháp trong bảng nhập tự lưu (mất điện, đóng tab vẫn còn), có nhãn "Đã tự lưu". */
            useEffect(() => {
                const typed = drafts && drafts.list.some(x => x.questionOrWord.trim() || x.answerOrMeaning.trim() || x.explanationOrExample.trim());
                if (!typed) { Store.prefs.remove(DRAFT_KEY); setDraftSavedAt(0); return undefined; }
                const t = window.setTimeout(() => { if (Store.prefs.set(DRAFT_KEY, drafts)) setDraftSavedAt(Date.now()); }, 500);
                return () => window.clearTimeout(t);
            }, [drafts]);
            /* Mục trong sổ vừa ghi xuống IndexedDB: nhãn "Đã tự lưu" ở đầu nhóm trong 2.5 giây. */
            useEffect(() => {
                let t = 0;
                const on = (e) => {
                    window.clearTimeout(t);
                    setSavedGroups(new Set((e.detail && e.detail.groups) || []));
                    t = window.setTimeout(() => setSavedGroups(null), 2500);
                };
                window.addEventListener('edu-items-saved', on);
                return () => { window.removeEventListener('edu-items-saved', on); window.clearTimeout(t); };
            }, []);
            /* Chốt phiếu khi sổ còn trống: không mở màn luyện tập rỗng, đưa con trỏ vào dòng 1. */
            const voteOrStart = () => {
                if (items.length) { onQuickVote && onQuickVote(); return; }
                const el = document.querySelector('.batch-add input[aria-label="Từ tiếng Anh, dòng 1"]');
                if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.focus({ preventScroll: true }); }
                toast('Thêm nhanh 1 từ đầu tiên để chốt phiếu hôm nay nhé!', 'info');
            };
            const menuBox = useRef(null);
            /* Sổ trống: luôn có sẵn nhóm "Unit 1" với 3 dòng trống để gõ ngay. Có từ thật (lưu, dán, Excel) thì dọn khung trống đi. */
            useEffect(() => {
                if (!items.length && !drafts) setDrafts(startDrafts());
                if (items.length && drafts && drafts.anchor === START_ANCHOR && !drafts.list.some(x => x.questionOrWord.trim() || x.answerOrMeaning.trim())) setDrafts(null);
            }, [items.length, drafts]);
            useEffect(() => {
                if (!menu) return undefined;
                const close = (e) => { if (menuBox.current && !menuBox.current.contains(e.target)) setMenu(null); };
                const onKey = (e) => { if (e.key === 'Escape') setMenu(null); };
                document.addEventListener('mousedown', close);
                document.addEventListener('keydown', onKey);
                return () => { document.removeEventListener('mousedown', close); document.removeEventListener('keydown', onKey); };
            }, [menu]);
            const voteSummary = useVoteSummary();
            const fund = useFund();
            const obsidian = obsidianOf(fund);
            const teaseTimer = useRef(0);
            const anchor = useRef(0);
            const dragging = useRef(false);
            const fileRef = useRef(null);

            useEffect(() => {
                const up = () => { dragging.current = false; };
                window.addEventListener('mouseup', up);
                return () => { window.removeEventListener('mouseup', up); window.clearTimeout(teaseTimer.current); };
            }, []);
            useEffect(() => { setSel(new Set()); setShown(150); }, [groupFilter, typeFilter, search]);

            const pulse = habitPulse(voteSummary);

            const q = search.trim().toLowerCase();
            const rows = items.filter(t => Sch.inGroup(t, groupFilter) && (typeFilter === 'all' || t.type === typeFilter) &&
                (!q || (t.questionOrWord || '').toLowerCase().indexOf(q) >= 0 || (t.answerOrMeaning || '').toLowerCase().indexOf(q) >= 0));
            const studyable = Sch.byGroup(items, groupFilter);
            const weakCount = studyable.filter(t => Sch.isWeak(t)).length;
            const mcqPool = asMcqPool(studyable);

            const update = (id, patch) => setItems(prev => prev.map(t => (t.id === id ? Object.assign({}, t, patch) : t)));
            const selectRange = (a, b) => { const lo = Math.min(a, b); const hi = Math.max(a, b); setSel(new Set(flat.slice(lo, hi + 1).map(r => r.id))); };
            const bulkSetGroup = (name) => { if (!sel.size) return; setItems(prev => prev.map(t => (sel.has(t.id) ? Object.assign({}, t, { group: name }) : t))); };
            /* Mạch bài học tăng dần: nhóm tạo trước nằm trên, trong nhóm từ thêm trước nằm trên. */
            const ordered = rows.map((t, k) => [t, k]).sort((x, y) => {
                const a1 = x[0].createdAt || '';
                const b1 = y[0].createdAt || '';
                if (a1 !== b1) return a1 < b1 ? -1 : 1;
                return String(x[0].id).localeCompare(String(y[0].id), undefined, { numeric: true }) || x[1] - y[1];
            }).map(z => z[0]);
            const sections = [];
            const secByKey = new Map();
            ordered.forEach(t => {
                const key = t.group || '';
                let sec = secByKey.get(key);
                if (!sec) { sec = { key: key, label: key || 'Chưa có nhóm', rows: [], sample: key.indexOf('Thẻ mẫu · ') === 0 }; secByKey.set(key, sec); sections.push(sec); }
                sec.rows.push(t);
            });
            /* Accordion: mặc định chỉ mở nhóm mới nhất (hoặc nhóm vừa thao tác); đang tìm kiếm thì mở mọi nhóm có kết quả. */
            const [openGroups, setOpenGroups] = useState(null);
            const newestKey = sections.length ? sections[sections.length - 1].key : null;
            useEffect(() => { if (openGroups === null && newestKey !== null) setOpenGroups(new Set([newestKey])); }, [newestKey, openGroups]);
            const openGroup = (key) => setOpenGroups(prev => { const n = new Set(prev || []); n.add(key); return n; });
            const toggleGroup = (key) => setOpenGroups(prev => { const n = new Set(prev || []); if (n.has(key)) n.delete(key); else n.add(key); return n; });
            sections.forEach(sec => { sec.open = q ? true : !!(openGroups && openGroups.has(sec.key)); });
            const flat = sections.filter(sec => sec.open).reduce((acc, sec) => acc.concat(sec.rows), []);
            const flatIndex = new Map(flat.map((t, k) => [t.id, k]));
            const lastUserGroup = (() => { for (let k = sections.length - 1; k >= 0; k -= 1) if (!sections[k].sample) return sections[k].key; return ''; })();
            const wide = useMedia('(min-width: 768px)');
            /* Bảng rộng 1080px cuộn ngang: thẻ nhập nhanh trong bảng được ghim đúng bề ngang khung nhìn. */
            const tableBox = useRef(null);
            const [boxW, setBoxW] = useState(0);
            useEffect(() => {
                const el = tableBox.current;
                if (!el) return undefined;
                setBoxW(el.clientWidth);
                if (!window.ResizeObserver) return undefined;
                const ro = new ResizeObserver(() => setBoxW(el.clientWidth));
                ro.observe(el);
                return () => ro.disconnect();
            }, [wide]);
            const pinned = (node) => (node ? <div className="batch-pin" style={boxW ? { width: boxW - 24 } : undefined}>{node}</div> : null);

            /* Thêm nhanh nối vào cuối một nhóm. drafts = { anchor: nhóm đang hiện thẻ, group: nhóm sẽ lưu vào, list }. */
            const addRowTo = (key) => {
                const g = key != null ? key : (groupFilter !== 'all' && groupFilter !== '__none' ? groupFilter : lastUserGroup);
                if (typeFilter === 'mcq') {
                    const t = Object.assign(Sch.normalizeItem({ type: 'vocab', group: g }), { type: 'mcq', options: ['', '', '', ''], answerOrMeaning: 'A' });
                    setItems(prev => prev.concat([t]));
                    openGroup(g);
                    setEditing(t);
                    return;
                }
                openGroup(g);
                setDrafts(d => (d && d.anchor === g ? Object.assign({}, d, { list: d.list.concat([newDraft()]) }) : { anchor: g, group: g, list: [newDraft()] }));
            };
            const addRow = () => addRowTo(null);
            const newGroup = () => {
                const typed = drafts && drafts.list.some(x => x.questionOrWord.trim() || x.answerOrMeaning.trim());
                if (typed) { toast('Lưu hoặc bỏ các dòng đang nhập trước khi tạo nhóm mới', 'info'); return; }
                setDrafts(startDrafts(nextUnitName(groups), '__new'));
                window.setTimeout(() => { const el = document.querySelector('.batch-add'); if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 60);
            };
            const setDraftList = (fn) => setDrafts(d => (d ? Object.assign({}, d, { list: typeof fn === 'function' ? fn(d.list) : fn }) : d));
            const saveDrafts = () => {
                if (!drafts) return;
                const g = drafts.group.trim();
                const made = drafts.list.filter(x => x.questionOrWord.trim()).map(x => Sch.normalizeItem({
                    type: 'vocab', group: g, questionOrWord: x.questionOrWord, answerOrMeaning: x.answerOrMeaning, wordType: x.wordType,
                    ipa: x.ipa, vietSub: Sch.ipaToVi(x.ipa) || '', explanationOrExample: x.explanationOrExample, exampleVi: x.exampleVi, keywords: x.keywords
                }));
                if (!made.length) return;
                setItems(prev => prev.concat(made));
                openGroup(g);
                setDrafts(null);
                toast('Đã thêm ' + made.length + ' từ' + (g ? ' vào ' + g : ''), 'success');
            };
            const cancelDrafts = () => {
                const typed = (drafts ? drafts.list : []).some(x => x.questionOrWord.trim() || x.answerOrMeaning.trim());
                if (typed && !confirm('Bỏ các dòng đang nhập?')) return;
                setDrafts(items.length ? null : startDrafts());
            };
            const batchCard = drafts ? (
                <BatchAdd drafts={drafts.list} setDrafts={setDraftList} group={drafts.group} groups={groups} autoFocus={!(drafts.anchor === START_ANCHOR && !items.length)} savedAt={draftSavedAt}
                    onGroup={(v) => setDrafts(d => Object.assign({}, d, { group: v }))} onAI={(t) => aiDraft(t)} onSave={saveDrafts} onCancel={items.length ? cancelDrafts : null} />
            ) : null;
            const draftsLoose = drafts && !secByKey.has(drafts.anchor);
            const groupHead = (sec) => (
                <button type="button" className="grp-head" aria-expanded={sec.open} onClick={() => toggleGroup(sec.key)} disabled={!!q}>
                    <Icon name={sec.open ? 'chevronDown' : 'right'} size={16} />
                    <span className="grp-dot" style={{ background: sec.key ? Sch.groupColor(sec.key) : 'var(--border)' }} aria-hidden="true" />
                    <span className="min-w-0 flex-1 truncate text-left">{sec.label}<span className="grp-inline-count tnum"> · {sec.rows.length} mục</span></span>
                    {sec.sample && <span className="chip bg-surface2 text-muted">mẫu</span>}
                    {savedGroups && savedGroups.has(sec.key || '') && <span className="saved-tag"><Icon name="check" size={12} /> Đã tự lưu</span>}
                </button>
            );
            const groupFoot = (sec) => (drafts && drafts.anchor === sec.key ? batchCard : (sec.sample ? null : (
                <button type="button" className="grp-add" onClick={() => addRowTo(sec.key)}><Icon name="plus" size={14} /> Thêm dòng vào {sec.key ? 'nhóm này' : 'đây'}</button>
            )));
            const removeRow = (id) => { if (confirm('Xóa mục này?')) setItems(prev => prev.filter(t => t.id !== id)); };
            const removeAll = () => {
                if (!items.length) return;
                if (!confirm('Xóa hết ' + items.length + ' mục trong Sổ từ? Không hoàn tác được. Nên "Tải kho về Excel" trước để sao lưu.')) return;
                setItems([]); setSel(new Set());
                toast('Đã xóa hết Sổ từ', 'success');
            };
            const removeSelected = () => { if (sel.size && confirm('Xóa ' + sel.size + ' mục đã chọn?')) { setItems(prev => prev.filter(t => !sel.has(t.id))); setSel(new Set()); } };

            const applyEnrich = (map) => setItems(prev => prev.map(t => (map[t.id] ? mergeEnrich(t, map[t.id]) : t)));

            /* AI cho bản nháp (form sửa, dòng thêm nhanh): trả về phần AI điền, không ghi vào Sổ từ. */
            const aiDraft = async (t) => {
                if (!AI.ready()) { toast('AI chỉ chạy khi mở trang qua web, không mở file trực tiếp.', 'info'); return null; }
                if (!String(t.questionOrWord || '').trim()) { toast('Nhập từ trước đã', 'error'); return null; }
                if (t.type !== 'mcq' && !E.Quota.aiFillAllowed()) { openBilling('ai'); return null; }
                try {
                    if (t.type === 'mcq') {
                        const ex = await AI.explain(t);
                        noteStudyDay();
                        return ex ? { explanationOrExample: ex } : null;
                    }
                    const id = t.id || 'draft';
                    const map = await AI.enrichVocab([Object.assign({}, t, { id: id })]);
                    const e = map[id] || null;
                    if (e) { noteStudyDay(); toast('AI đã điền: ' + t.questionOrWord.slice(0, 40), 'success'); }
                    else toast('AI chưa trả kết quả, thử lại sau', 'error');
                    return e;
                } catch (e) {
                    if (e && e.code === 'ai-locked' && t.type !== 'mcq') { openBilling('ai'); return null; }
                    toast(e.message, 'error');
                    return null;
                }
            };

            const armTease = (id) => {
                window.clearTimeout(teaseTimer.current);
                setTease({ id: id, phase: 'load' });
                teaseTimer.current = window.setTimeout(() => setTease({ id: id, phase: 'blur' }), 400);
            };
            const aiOne = async (t) => {
                if (!AI.ready()) { toast('AI chỉ chạy khi mở trang qua web, không mở file trực tiếp.', 'info'); return; }
                if (!t.questionOrWord) { toast('Nhập nội dung trước đã', 'error'); return; }
                if (t.type !== 'mcq' && !E.Quota.aiFillAllowed()) { armTease(t.id); return; }
                setAiRow(t.id);
                try {
                    if (t.type === 'mcq') {
                        const ex = await AI.explain(t);
                        if (ex && (!t.explanationOrExample || confirm('Thay lời giải hiện có bằng lời giải AI?'))) update(t.id, { explanationOrExample: ex });
                    } else {
                        applyEnrich(await AI.enrichVocab([t]));
                    }
                    toast('AI xong: ' + t.questionOrWord.slice(0, 40), 'success');
                    noteStudyDay();
                } catch (e) {
                    if (e && e.code === 'ai-locked' && t.type !== 'mcq') { armTease(t.id); return; }
                    toast(e.message, 'error');
                } finally {
                    setAiRow(null);
                }
            };

            const aiEverything = async () => {
                if (!AI.ready()) { toast('AI chỉ chạy khi mở trang qua web, không mở file trực tiếp.', 'info'); return; }
                if (!E.Quota.aiFillAllowed()) { openBilling('ai'); return; }
                const need = items.filter(t => t.type === 'vocab' && t.questionOrWord && (!t.ipa || !t.explanationOrExample || !t.answerOrMeaning));
                if (!need.length) { toast('Tất cả từ đã đủ thông tin', 'info'); return; }
                if (!confirm('AI bổ sung thông tin cho ' + need.length + ' từ?')) return;
                let done = 0;
                setAiAll({ done: 0, total: need.length });
                for (let i = 0; i < need.length; i += 10) {
                    const chunk = need.slice(i, i + 10);
                    try { applyEnrich(await AI.enrichVocab(chunk)); } catch (e) { if (e && e.code === 'ai-locked') openBilling('ai'); else toast(e.message, 'error'); break; }
                    done += chunk.length;
                    setAiAll({ done, total: need.length });
                }
                setAiAll(null);
                if (done > 0) noteStudyDay();
                toast('AI đã xử lý ' + done + ' từ', 'success');
            };

            const exportExcel = () => {
                if (!items.length || !window.XLSX) return;
                const clean = Sec.stripSecrets(items);
                const data = [Sch.EXCEL_HEADERS].concat(clean.map(Sch.toExcelRow));
                const ws = XLSX.utils.aoa_to_sheet(data);
                ws['!cols'] = [6, 10, 22, 7, 50, 9, 16, 28, 28, 28, 28, 30, 50, 40, 30, 16, 7, 7, 8].map(w => ({ wch: w }));
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Kho học');
                XLSX.writeFile(wb, 'kho-hoc-' + todayIso() + '.xlsx');
                toast('Đã tải ' + items.length + ' mục về file Excel', 'success');
            };

            const readFiles = async (files) => {
                const batches = [];
                for (const f of files) {
                    const name = Sec.cleanText(f.name, 120);
                    const label = name.replace(/\.(xlsx|xls|csv)$/i, '').replace(/[_]+/g, ' ').trim() || 'Nhóm mới';
                    if (!/\.(xlsx|xls|csv)$/i.test(name)) throw new Error('Chỉ nhận file Excel (.xlsx, .xls) hoặc CSV');
                        if (!window.XLSX) throw new Error('Thư viện Excel chưa tải xong');
                        const wb = XLSX.read(await Sec.readBuffer(f), { type: 'array', cellFormula: false, cellHTML: false });
                        const rowsX = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
                        batches.push({ label, defaultGroup: label, items: Sch.fromExcelRows(rowsX) });
                }
                const total = batches.reduce((n, b) => n + b.items.length, 0);
                Sec.guardCount(total, 0);
                if (!total) throw new Error('File không có mục hợp lệ');
                return batches;
            };

            const pickFiles = async (e) => {
                const files = Array.from(e.target.files || []);
                e.target.value = '';
                if (!files.length) return;
                try { setImportBatches(await readFiles(files)); } catch (err) { toast(err.message || 'File không hợp lệ', 'error'); }
            };

            const confirmImport = async ({ items: incoming, mode }) => {
                try {
                    Sec.guardCount(incoming.length, mode === 'replace' ? 0 : items.length);
                    const space = await Sec.ensureStorage(JSON.stringify(incoming).length * 2);
                    if (!space.ok) { toast('Bộ nhớ trình duyệt sắp đầy — hãy tải kho về Excel để sao lưu rồi xóa bớt.', 'error'); return; }
                    mergeItems(incoming, mode);
                    setImportBatches(null);
                    Store.requestPersist();
                    const g = Array.from(new Set(incoming.map(t => t.group).filter(Boolean)));
                    toast('Đã nhập ' + incoming.length + ' mục' + (g.length === 1 ? ' · nhóm "' + g[0] + '"' : ''), 'success');
                } catch (e) {
                    toast(e.message, 'error');
                }
            };

            const filterCount = (groupFilter !== 'all' ? 1 : 0) + (typeFilter !== 'all' ? 1 : 0);
            const runMenu = (fn) => { setMenu(null); fn(); };
            const groupSelect = (
                <select value={groupFilter} onChange={(e) => setGroupFilter(e.target.value)} className="field" aria-label="Nhóm">
                    <option value="all">Tất cả nhóm ({items.length})</option>
                    {groups.map(([k, n]) => <option key={k} value={k}>{Sch.groupLabel(k)} ({n})</option>)}
                </select>
            );
            const typeSelect = (
                <select value={typeFilter} onChange={(e) => setTypeFilter(e.target.value)} className="field" aria-label="Loại">
                    <option value="all">Tất cả loại</option><option value="vocab">Từ vựng</option><option value="mcq">Trắc nghiệm</option>
                </select>
            );

            return (
                <div>
                    {/* Đầu trang gọn: tiêu đề + 2 nút (Thêm từ, •••). Luyện tập đầy đủ nằm ở tab Luyện tập. */}
                    <div className="mb-3 flex items-center justify-between gap-2" ref={menuBox}>
                        <div className="min-w-0">
                            <h1 className="whitespace-nowrap text-xl font-bold tracking-tight sm:text-2xl">Sổ từ<span className="hidden sm:inline"> của tôi</span></h1>
                            <p className="truncate text-sm text-muted"><b className="tnum font-semibold text-ink2">{items.length}</b> mục{groups.length ? ' · ' + groups.length + ' nhóm' : ''}{rows.length !== items.length ? ' · đang lọc ' + rows.length : ''}</p>
                        </div>
                        <div className="relative flex shrink-0 items-center gap-2">
                            {groupFilter !== 'all' && <button type="button" onClick={() => onPractice(studyable, 'flash', Sch.groupLabel(groupFilter))} disabled={!studyable.length} className="btn btn-secondary btn-sm hidden sm:inline-flex"><Icon name="layers" size={14} /> Luyện nhóm này</button>}
                            <button type="button" onClick={newGroup} className="btn btn-primary btn-sm whitespace-nowrap"><Icon name="plus" size={15} /> Tạo nhóm mới</button>
                            <button type="button" onClick={() => setMenu(m => (m === 'more' ? null : 'more'))} aria-expanded={menu === 'more'} aria-haspopup="menu" aria-label="Tùy chọn khác" className="btn btn-secondary btn-sm btn-icon !w-10">•••</button>
                            {menu && (
                                <div role="menu" className="lib-menu">
                                    {menu === 'more' && (
                                        <>
                                            <button type="button" role="menuitem" disabled={!!aiAll || !items.length} onClick={() => runMenu(aiEverything)}><Icon name="sparkles" size={16} /><span><b>{aiAll ? 'AI ' + aiAll.done + '/' + aiAll.total : 'AI bổ sung tất cả'}</b><small>Điền nghĩa, IPA, ví dụ còn thiếu</small></span></button>
                                            <button type="button" role="menuitem" disabled={!items.length} onClick={() => runMenu(exportExcel)}><Icon name="sheet" size={16} /><span><b>Tải kho về Excel</b><small>Sao lưu toàn bộ kho</small></span></button>
                                            <button type="button" role="menuitem" onClick={() => runMenu(downloadSample)}><Icon name="download" size={16} /><span><b>Tải file Excel mẫu</b><small>3 cột: Từ, Nghĩa, Ví dụ</small></span></button>

                    {items.length === 0 && batchCard}

                    <div className={'md:hidden' + (items.length === 0 ? ' !hidden' : '')}>

                            <div className="flex flex-col gap-2">

                                                <div className="flex items-start gap-2">
                                                    <button type="button" className="lib-word" onClick={() => setEditing(t)}>

                                                    </button>
                                                    <div className="ml-auto flex shrink-0 items-center gap-1">
                                                        {!mcq && t.questionOrWord && <button type="button" onClick={() => speak(t.questionOrWord, 0.7)} className="lib-act" aria-label={'Nghe ' + t.questionOrWord}><Icon name="volume" size={15} /></button>}
                                                        <button type="button" onClick={() => onStudyFrom(t)} disabled={!t.questionOrWord} className="lib-act" aria-label="Học từ này"><Icon name="play" size={15} /></button>
                                                        <button type="button" onClick={() => setEditing(t)} className="lib-act" aria-label="Sửa"><Icon name="pen" size={15} /></button>
                                                    </div>

                                                <div className="mt-0.5 flex items-start gap-2">
                                                    <p className={'lib-mean min-w-0 flex-1 ' + (meaning ? '' : 'text-muted')}>{meaning || 'Chưa có nghĩa · chạm để thêm'}</p>
                                                </div>
                                            </div>
                                        </li>
                                    );
                                                })}
                                            </ul>
                                        )}

                                    </section>
                                ))}
                            </div>

                    </div>

                    <div className={'card hidden overflow-hidden pb-24' + (items.length === 0 ? '' : ' md:block')}>
                        <div className="overflow-x-auto" ref={tableBox}>
                            <table className="w-full min-w-[820px] text-sm border-collapse">

                                        <th scope="col" className="min-w-[200px] px-3 py-2 text-left">Từ / Câu hỏi</th>
                                        <th scope="col" className="px-3 py-2 text-left w-56">Nghĩa / Đáp án</th>
                                        <th scope="col" className="col-example min-w-[200px] px-3 py-2 text-left">Ví dụ / Giải thích</th>
                                        <th scope="col" className="w-auto whitespace-nowrap px-3 py-2 text-left">Tiến độ</th>
                                        <th scope="col" className="w-px whitespace-nowrap px-3 py-2 text-left">Thao tác</th>

                                        {items.length > 0 && wide && draftsLoose && <tbody><tr><td colSpan="7" className="p-3">{pinned(batchCard)}</td></tr></tbody>}
