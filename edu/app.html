<html lang="vi">
<head>
    <meta charset="UTF-8">

    <script crossorigin="anonymous" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js" integrity="sha384-x/ilTFv/u/eu6YSmkFDZl5V5Mm/pkxxcVv2cVJOrr1J0rvILhMvRBCy6yA75wYBj"></script>
    <script crossorigin="anonymous" src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js" integrity="sha384-QCIdq2UMVEoSRhR3ZWZwdz2/pivLowr+eokFMdYyukq7qI26VYRxFa4Nl6FKetmL"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        canvas: 'var(--bg)', surface: 'var(--surface)', surface2: 'var(--surface-2)', line: 'var(--border)',
                        ink: 'var(--ink)', ink2: 'var(--ink-2)', muted: 'var(--muted)',
                        primary: 'var(--primary)', 'primary-hover': 'var(--primary-hover)', 'primary-soft': 'var(--primary-soft)',
                        success: 'var(--success)', 'success-soft': 'var(--success-soft)',
                        danger: 'var(--danger)', 'danger-soft': 'var(--danger-soft)',
                        warn: 'var(--warn)', 'warn-soft': 'var(--warn-soft)',
                        eos: 'var(--eos-head)'
                    },
                    fontFamily: {
                        sans: ['"Be Vietnam Pro"', 'system-ui', 'Segoe UI', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'ui-monospace', 'Consolas', 'monospace']
                    }
                }
            }
        };
    </script>
    <style>
        :root {
            --bg: #E2E8F0; --surface: #FFFFFF; --surface-2: #F1F5F9; --border: #DCE0E8;
            --ink: #111827; --ink-2: #374151; --muted: #5B6474;
            --primary: #4338CA; --primary-hover: #3730A3; --primary-soft: #EEF0FF;
            --success: #047857; --success-soft: #ECFDF5;
            --danger: #BE123C; --danger-soft: #FFF1F2;
            --warn: #B45309; --warn-soft: #FFFBEB;
            --mark: #FDE68A; --eos-head: #1E3A8A;
        }
        html { -webkit-text-size-adjust: 100%; }
        .cmd-card { position: relative; overflow: hidden; border-radius: 24px; background: linear-gradient(135deg, #312E81 0%, #4338CA 55%, #6366F1 100%); color: #fff; box-shadow: 0 24px 40px -24px rgba(49, 46, 129, .75), 0 0 0 1px rgba(255, 255, 255, .06) inset; }
        .cmd-card::after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 999px; background: rgba(255, 255, 255, .08); pointer-events: none; }
        .cmd-pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; }
        .cmd-slot { flex: 1 1 0; min-width: 0; border-radius: 12px; padding: 8px 6px; text-align: center; font-size: 12px; font-weight: 700; background: rgba(255, 255, 255, .12); color: #E0E7FF; }
        .cmd-slot.is-done { background: #10B981; color: #fff; }
        .cmd-slot.is-now { background: #fff; color: #312E81; box-shadow: 0 6px 16px -8px rgba(0, 0, 0, .5); }
        .cmd-go { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: 16px; background: #fff; color: #312E81; font-weight: 800; font-size: 16px; box-shadow: 0 10px 22px -12px rgba(0, 0, 0, .6); transition: transform .15s ease; }
        .cmd-go:hover { transform: translateY(-1px); }
        .cmd-go:disabled { opacity: .6; cursor: not-allowed; transform: none; }
        .cmd-go.is-first { box-shadow: 0 0 0 4px rgba(255, 255, 255, .18), 0 12px 26px -12px rgba(0, 0, 0, .65); }
        .cmd-sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; overflow: hidden; border-radius: 14px; background: rgba(255, 255, 255, .14); }
        .cmd-sum > div { padding: 10px 12px; background: rgba(15, 12, 60, .28); }
        .cmd-sum dt { font-size: 11px; font-weight: 500; line-height: 1.3; color: #C7D2FE; }
        .cmd-sum dd { margin-top: 2px; font-size: 18px; font-weight: 700; color: #fff; }
        .cmd-link { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-radius: 12px; font-size: 14px; font-weight: 600; color: #E0E7FF; }
        .cmd-link:hover { background: rgba(255, 255, 255, .12); color: #fff; }
        .cmd-alt { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 18px; border-radius: 16px; background: rgba(255, 255, 255, .12); color: #fff; font-weight: 700; font-size: 15px; border: 1px solid rgba(255, 255, 255, .3); transition: background .15s ease; }
        .cmd-alt:hover { background: rgba(255, 255, 255, .22); }
        .slot-path { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
        .slot-path::before { content: ""; position: absolute; left: 16.66%; right: 16.66%; top: 17px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .22); }
        .slot-node { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; }
        .slot-dot { width: 36px; height: 36px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; background: #3F3B9A; color: #C7D2FE; box-shadow: 0 0 0 3px rgba(255, 255, 255, .16); }
        .slot-node.is-done .slot-dot { background: #10B981; color: #fff; box-shadow: 0 0 0 3px rgba(16, 185, 129, .35); }
        .slot-node.is-now .slot-dot { background: #fff; color: #312E81; animation: nowRing 1.8s ease-in-out infinite; }
        .slot-node.is-off .slot-dot { opacity: .45; }
        .slot-time { margin-top: 6px; font-size: 13px; font-weight: 700; color: #fff; }
        .slot-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; font-weight: 500; color: #C7D2FE; }
        @keyframes nowRing { 0%, 100% { box-shadow: 0 0 0 4px rgba(255, 255, 255, .35); } 50% { box-shadow: 0 0 0 9px rgba(255, 255, 255, .06); } }
        .pillar { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; height: 100%; text-align: left; border-radius: 20px; padding: 16px; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 1px 2px rgba(15, 23, 42, .04); transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
        .pillar:hover { transform: translateY(-2px); box-shadow: 0 16px 30px -20px rgba(15, 23, 42, .4); border-color: #C7D2FE; }
        .pillar-ic { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
        .pillar-go { margin-top: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; }
        .app-side { display: none; }
        @media (min-width: 1024px) {
            .app-side { position: sticky; top: 65px; display: flex; flex-direction: column; flex-shrink: 0; width: 232px; height: calc(100vh - 65px); padding: 20px 12px 16px; border-right: 1px solid var(--border); overflow-y: auto; }
        }
        body:has(.eos-shell) .app-side:not(.is-drawer) { display: none; }
        /* Menu trượt trên điện thoại: cùng nội dung sidebar, phủ trên nội dung. */
        .side-scrim { position: fixed; inset: 0; z-index: 66; background: rgba(15, 23, 42, .45); animation: scrim-in .2s ease-out; }
        .app-side.is-drawer { display: flex; flex-direction: column; position: absolute; top: 0; bottom: 0; left: 0; width: min(300px, 86vw); padding: 12px 12px calc(16px + env(safe-area-inset-bottom)); overflow-y: auto; background: #EEF2F7; border-right: 1px solid var(--border); box-shadow: 18px 0 40px -18px rgba(15, 23, 42, .45); animation: drawer-in .24s cubic-bezier(.2, .8, .2, 1); }
        .app-side.is-drawer[data-tier="obsidian"] { background: linear-gradient(180deg, #0B0B0E 0%, #0C0C0F 40%, #09090B 100%); border-right: 1px solid rgba(232, 205, 150, .12); box-shadow: 18px 0 50px -16px rgba(0, 0, 0, .7); color-scheme: dark; }
        .side-drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 52px; margin-bottom: 8px; padding: 0 4px 0 6px; }
        .side-close { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 12px; color: var(--ink-2); }
        .side-close:hover { background: rgba(255, 255, 255, .6); }
        .app-side.is-drawer[data-tier="obsidian"] .side-close { color: #A39D90; }
        .app-side.is-drawer[data-tier="obsidian"] .side-close:hover { background: rgba(255, 255, 255, .05); color: #F2DDA4; }
        .ob-chip.is-wide { display: inline-flex; justify-content: center; margin: 0 0 12px; min-height: 40px; --ob-gold: #D9B871; --ob-gold-hi: #F2DDA4; }
        .top-plan { display: inline-flex; align-items: center; gap: 5px; min-height: 34px; padding: 0 11px 0 9px; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: #4F46E5; background: #EEF2FF; box-shadow: inset 0 0 0 1px #C7D2FE; white-space: nowrap; }
        .top-plan:hover { background: #E0E7FF; }
        @keyframes drawer-in { from { transform: translateX(-100%); } to { transform: none; } }
        @keyframes scrim-in { from { opacity: 0; } to { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) { .side-scrim, .app-side.is-drawer { animation: none; } }
        .side-link { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 0 12px; border-radius: 12px; font-size: 14px; font-weight: 600; color: var(--ink-2); transition: background .15s ease, color .15s ease; }
        .side-link svg { color: var(--muted); flex-shrink: 0; }
        .side-link:hover:not([aria-current="page"]) { background: rgba(255, 255, 255, .55); color: var(--ink); }
        /* Mục đang chọn: nền trắng đổ bóng nhẹ + vạch tím mảnh bên trái, không viền dày. */
        .side-link[aria-current="page"] { background: #FFFFFF; color: #4F46E5; box-shadow: 0 1px 3px rgba(15, 23, 42, .08); }
        .side-link[aria-current="page"] svg { color: #4F46E5; }
        .side-link[aria-current="page"]::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: #4F46E5; }
        .side-link:focus { outline: none; }
        .side-link:focus-visible { outline: none; box-shadow: 0 0 0 2px rgba(79, 70, 229, .35); }
        .side-link[aria-current="page"]:focus-visible { box-shadow: 0 1px 3px rgba(15, 23, 42, .08), 0 0 0 2px rgba(79, 70, 229, .35); }
        /* Obsidian: menu dọc tối liền với topbar, vùng nội dung bên phải vẫn sáng. */
        .side-sub { min-height: 38px; gap: 8px; font-weight: 500; font-size: 13px; }
        .side-code { flex-shrink: 0; padding: 2px 6px; border-radius: 6px; background: var(--primary-soft); color: var(--primary); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; font-weight: 700; }
        .side-sub[aria-current="page"] .side-code { background: var(--primary); color: #fff; }
        .my-pack { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; min-height: 40px; padding: 0 12px 0 8px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; font-weight: 600; color: var(--ink); }
        .my-pack:hover { border-color: var(--primary); }
        .side-dot { width: 8px; height: 8px; border-radius: 999px; background: #EF4444; flex-shrink: 0; }
        .side-head { margin: 20px 12px 6px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
        .top-contact { align-items: center; gap: 2px; padding: 3px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); }
        .top-contact a { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
        .top-contact a:hover { background: var(--surface); color: var(--primary); }
        .top-contact.is-dark { background: #202637; border-color: #2A3142; }
        .top-contact.is-dark a { color: #C6CBD4; }
        .top-contact.is-dark a:hover { background: #F8F9FC; color: #0B192C; }
        .nav-dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 999px; background: #EF4444; box-shadow: 0 0 0 2px var(--surface-2); }
        .bnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: rgba(255, 255, 255, .96); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
        .bnav button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 58px; font-size: 11px; font-weight: 600; color: var(--muted); }
        .bnav button[aria-current="page"] { color: var(--primary); }
        .bnav button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--primary); }
        .bnav .nav-dot { top: 8px; right: calc(50% - 18px); box-shadow: 0 0 0 2px #fff; }
        @media (min-width: 1024px) { .bnav { display: none; } }
        @media (max-width: 1023px) { body .help-dock { bottom: calc(70px + env(safe-area-inset-bottom)); } }
        body:has(.eos-shell) .bnav { display: none; }
        .id-invite { display: inline-flex; align-items: center; gap: 4px; min-height: 34px; padding: 0 12px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); border: 1px dashed var(--primary); font-size: 13px; font-weight: 700; white-space: nowrap; transition: background .15s ease, color .15s ease; }
        .id-invite:hover { background: var(--primary); color: #fff; }
        .fund-strip { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; margin-bottom: 12px; padding: 0 6px 0 6px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; color: var(--ink-2); text-align: left; white-space: nowrap; overflow: hidden; }
        .fund-strip svg { color: var(--muted); flex-shrink: 0; }
        .fund-code { align-items: center; gap: 6px; min-height: 30px; padding: 0 8px; border-radius: 8px; color: var(--ink-2); }
        .fund-code:hover { background: var(--surface-2); color: var(--ink); }
        /* Pill phiếu hôm nay */
        .mission { position: relative; overflow: hidden; width: 100%; margin-bottom: 12px; padding: 10px 14px 12px; border-radius: 16px; color: #0F172A; background: linear-gradient(135deg, #FFFFFF 0%, #EEF2FF 100%); border: 1px solid #C7D2FE; box-shadow: 0 4px 16px -4px rgba(79, 70, 229, .12); animation: mission-in .35s ease-out; isolation: isolate; }
        .mission.is-late { border-color: #FCD34D; }
        .mission-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .mission-label { display: inline-flex; align-items: center; gap: 7px; min-width: 0; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #475569; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mission-dot { width: 6px; height: 6px; flex-shrink: 0; border-radius: 999px; background: #F97316; animation: mission-breathe 2.4s ease-in-out infinite; }
        .mission-clock { flex-shrink: 0; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 18px; color: #B45309; background: #FEF3C7; border: 1px solid #FDE68A; font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; }
        .mission-body { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
        .mission-duck { position: relative; display: inline-flex; width: 72px; height: 72px; flex-shrink: 0; }
        .mission-face { display: block; width: 72px; height: 72px; overflow: hidden; border-radius: 12px; border: 1.5px solid #C7D2FE; background: #E0E7FF; transition: transform .2s ease; }
        .mission-face img { display: block; width: 100%; height: 100%; object-fit: cover; }
        .mission:has(.mission-cta:hover) .mission-face, .mission:has(.mission-cta:focus-visible) .mission-face { transform: rotate(-6deg) scale(1.05); }
        .mission-badge { position: absolute; right: -6px; bottom: -4px; padding: 0 5px; border-radius: 999px; font-size: 10.5px; font-weight: 700; line-height: 16px; color: #78350F; background: #FBBF24; border: 2px solid #fff; font-variant-numeric: tabular-nums; }
        .mission-copy { min-width: 0; flex: 1; }
        .mission-name { font-size: 16px; font-weight: 600; line-height: 1.3; color: #0F172A; letter-spacing: -.01em; text-wrap: balance; overflow-wrap: anywhere; }
        .mission-sub { margin-top: 2px; font-size: 12.5px; line-height: 1.35; color: #475569; text-wrap: balance; }
        .mission-cta { position: relative; overflow: hidden; display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 11px; font-size: 14px; font-weight: 600; color: #fff; white-space: nowrap; background: #4F46E5; box-shadow: 0 6px 14px -6px rgba(79, 70, 229, .6); transition: transform .12s ease, background .15s ease; }
        .mission-cta:hover { background: #4338CA; }
        .mission-cta:active { transform: scale(.98); }
        .mission-cta:focus-visible { outline: 2px solid #A5B4FC; outline-offset: 2px; }
        .mission[data-tier="obsidian"] { color: #F8FAFC; background: linear-gradient(160deg, #121524 0%, #0B0D14 100%); border-color: rgba(255, 255, 255, .12); box-shadow: 0 12px 30px -10px rgba(11, 13, 20, .45); }
        .mission[data-tier="obsidian"]::before { content: ''; position: absolute; z-index: -1; top: -60%; right: -10%; width: 70%; height: 180%; background: radial-gradient(closest-side, rgba(245, 158, 11, .16), rgba(129, 140, 248, .10) 55%, transparent 75%); pointer-events: none; }
        .mission[data-tier="obsidian"].is-late { border-color: rgba(245, 158, 11, .35); }
        .mission[data-tier="obsidian"] .mission-label { color: #94A3B8; }
        .mission-star { font-style: normal; font-size: 11px; line-height: 1; color: #FBBF24; animation: mission-breathe 2.4s ease-in-out infinite; }
        .mission[data-tier="obsidian"] .mission-clock { padding: 0; color: #FBBF24; background: none; border: 0; }
        .mission[data-tier="obsidian"] .mission-face { border: 1px solid rgba(255, 255, 255, .2); background: #1E2235; box-shadow: 0 4px 12px rgba(0, 0, 0, .4); }
        .mission[data-tier="obsidian"] .mission-badge { border-color: #0B0D14; }
        .mission[data-tier="obsidian"] .mission-name { color: #F8FAFC; }
        .mission[data-tier="obsidian"] .mission-sub { color: #94A3B8; }
        .mission[data-tier="obsidian"] .mission-cta { color: #0F172A; background: linear-gradient(180deg, #FFFFFF 0%, #EEF2FF 100%); box-shadow: 0 1px 0 rgba(255, 255, 255, .6) inset, 0 6px 16px -6px rgba(0, 0, 0, .5); }
        .mission[data-tier="obsidian"] .mission-cta svg { color: #4338CA; }
        .mission[data-tier="obsidian"] .mission-cta::after { content: ''; position: absolute; top: 0; bottom: 0; left: -40%; width: 30%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .95), transparent); transform: skewX(-18deg); animation: mission-shimmer 6s ease-in-out infinite; pointer-events: none; }
        .mission[data-tier="obsidian"] .mission-cta:focus-visible { outline-color: #FBBF24; }
        @media (max-width: 767px) {
            .mission-body { flex-wrap: wrap; row-gap: 10px; }
            .mission-name { font-size: 15px; }
            .mission-cta { width: 100%; }
        }
        @keyframes mission-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
        @keyframes mission-breathe { 0%, 100% { opacity: .55; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.15); } }
        @keyframes mission-shimmer { 0%, 78% { left: -40%; } 92%, 100% { left: 120%; } }

        /* ===== Obsidian Noir: đen quyền lực + vàng champagne. Chỉ khung điều hướng tối; vùng học vẫn sáng (giấy ngà) để đọc lâu không mỏi. ===== */
        .app-root[data-tier="obsidian"] { --ob-ink: #08080A; --ob-panel: #0C0C0F; --ob-line: rgba(232, 205, 150, .12); --ob-line-2: rgba(232, 205, 150, .22); --ob-gold: #D9B871; --ob-gold-hi: #F2DDA4; --ob-gold-lo: #A8884A; --ob-text: #EFEBE2; --ob-soft: #A39D90; --ob-mute: #6E695F; }

        const FLAME = <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8.6 1.2c.3 2.1-.6 3.3-1.6 4.4C6 6.7 5 7.8 5 9.6 5 11.5 6.4 13 8 13c1.7 0 3-1.4 3-3.2 0-.9-.3-1.6-.7-2.2.9.3 1.6 1 2 1.9.3-.6.5-1.3.5-2C12.8 4.8 11 2.6 8.6 1.2Z" fill="currentColor" /><path d="M8 13c-1 0-1.8-.8-1.8-1.9 0-1 .7-1.6 1.3-2.2.3.7.9 1 1.4 1.2.5.2.9.6.9 1.1C9.8 12.2 9 13 8 13Z" fill="#FDE68A" /></svg>;
        const Toasts = ({ list }) => (

        const Progress = ({ value, max, tone = 'primary', label }) => {

        const Empty = ({ icon = 'info', title, children }) => (

        let heldUtterance = null;
        if (window.speechSynthesis) {
            try { window.speechSynthesis.getVoices(); } catch (e) {}

                window.speechSynthesis.addEventListener('voiceschanged', () => {
                    try { window.speechSynthesis.getVoices(); } catch (err) {}
                });
            } catch (e) {}
        }
        const englishVoice = () => {
            const list = (window.speechSynthesis && window.speechSynthesis.getVoices()) || [];
            return list.filter(v => /^en-GB/i.test(v.lang))[0]
                || list.filter(v => /^en-US/i.test(v.lang))[0]
                || list.filter(v => /^en/i.test(v.lang))[0]
                || null;
        };
        const speak = (text, rate) => {
            const synth = window.speechSynthesis;
            if (!text || !synth) return;
            const run = () => {
                const u = new SpeechSynthesisUtterance(String(text));
                const voice = englishVoice();
                if (voice) {
                    u.voice = voice;
                    u.lang = voice.lang;
                } else {
                    u.lang = 'en-US';
                }
                u.rate = rate || 0.8;
                u.volume = 1;
                heldUtterance = u;
                try { synth.resume(); } catch (e) {}
                try { synth.speak(u); } catch (e) {}
            };
            try { synth.resume(); } catch (e) {}
            if (synth.speaking || synth.pending) {
                try { synth.cancel(); } catch (e) {}
                setTimeout(run, 80);
                return;
            }
            run();
        };

        const downloadBlob = (blob, filename) => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.rel = 'noopener';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        };

        const copyText = (text) => {
            const viaBox = () => {
                const area = document.createElement('textarea');
                area.value = text;
                area.setAttribute('readonly', '');
                area.style.position = 'fixed';
                area.style.left = '-9999px';
                document.body.appendChild(area);
                area.select();
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
                area.remove();
                return ok ? Promise.resolve() : Promise.reject(new Error('no-clipboard'));
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text).catch(viaBox);
            }
            return viaBox();
        };

        const openLegal = (tab) => {
            try { window.dispatchEvent(new CustomEvent('fpass-legal', { detail: { tab: tab || 'id' } })); } catch (e) {}
        };
        const openSupport = () => {
            try { window.dispatchEvent(new CustomEvent('fpass-support')); } catch (e) {}
        };

        const todayIso = () => new Date().toISOString().split('T')[0];

        /* Biến từ vựng thành câu trắc nghiệm nghĩa (để vào EOS / luyện nhanh khi kho chỉ có vocab). */
        const vocabAsMcq = (list) => {
            const vocab = list.filter(t => t.type === 'vocab' && t.questionOrWord && t.answerOrMeaning);
            if (vocab.length < 4) return [];
            return vocab.map(t => {
                const others = Sch.shuffle(vocab.filter(o => o.id !== t.id && o.answerOrMeaning !== t.answerOrMeaning)).slice(0, 3).map(o => o.answerOrMeaning);
                const pos = Math.floor(Math.random() * 4);
                const opts = others.slice();
                opts.splice(pos, 0, t.answerOrMeaning);
                return Object.assign({}, t, {
                    type: 'mcq',
                    questionOrWord: '"' + t.questionOrWord + '"' + (t.wordType ? ' (' + t.wordType + ')' : '') + ' nghĩa là gì?',
                    options: opts.slice(0, 4),
                    answerOrMeaning: Sch.LETTERS[pos],
                    explanationOrExample: t.explanationOrExample ? t.explanationOrExample + (t.exampleVi ? ' — ' + t.exampleVi : '') : ''
                });
            });
        };

        const asMcqPool = (list) => {
            const mcq = list.filter(t => t.type === 'mcq' && t.answerOrMeaning && t.options.filter(Boolean).length >= 2);
            return mcq.concat(vocabAsMcq(list));

        const vnd = (n) => Number(n || 0).toLocaleString('vi-VN') + 'đ';
        const useFund = () => {

            useEffect(() => E.Quota.subscribe(setFund), []);
            return fund;

        const requireTurns = (toast, quiet) => {

                E.Quota.openShop();
                return false;

        const chargeTurn = (toast, note) => E.Quota.spend(note).then((next) => {

            if (next.balance < 5) toast('Đã trừ 1 lượt. Mã này còn ' + next.balance + ' lượt trên mọi máy.', 'info');

        }).catch((e) => {

        window.EDU.chargeTurn = chargeTurn;

        /* ---------- Tài khoản Google, cổng thanh toán, video hướng dẫn ---------- */
        const readAccount = () => {
            const user = Store.prefs.get('googleUser', null);
            return user && user.email && Store.prefs.get('googleToken', '') ? user : null;
        };
        const useAccount = () => {
            const [account, setAccount] = useState(readAccount);
            useEffect(() => {
                const sync = () => setAccount(readAccount());
                window.addEventListener('edu-account', sync);
                return () => window.removeEventListener('edu-account', sync);
            }, []);
            return account;
        };
        const noteAccount = () => window.dispatchEvent(new CustomEvent('edu-account'));
        const askLogin = (reason) => window.dispatchEvent(new CustomEvent('edu-login', { detail: { reason: reason || '' } }));
        /* Lệnh đi thẳng tới một tính năng từ trang chủ (/app?go=...). Component nào cần thì lấy một lần. */
        const takeGo = (want) => {
            if (window.__fpassGo !== want) return false;

        /* Mã QR chỉ hiện khi đã đăng nhập Google. Máy chủ trả mã quỹ của tài khoản, nên nội dung chuyển khoản luôn cộng lượt vào đúng tài khoản. */
        const PayGate = ({ children, compact }) => {
            const account = useAccount();
            const [state, setState] = useState(account ? 'checking' : 'login');
            const [note, setNote] = useState('');
            const [round, setRound] = useState(0);
            const [moved, setMoved] = useState(null);
            const asked = useRef(false);
            useEffect(() => {
                if (!account) {
                    setState('login');
                    if (!asked.current) { asked.current = true; askLogin('pay'); }
                    return undefined;
                }
                let alive = true;
                setState('checking');
                fetch('/api/fund?action=pay', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', Accept: 'application/json', Authorization: 'Bearer ' + googleToken() },
                    body: JSON.stringify({ fundCode: (E.Quota.read() || {}).code || '' })
                }).then(async (res) => {
                    const data = await res.json().catch(() => ({}));
                    if (!alive) return;
                    if (res.status === 401) {
                        Store.prefs.remove('googleToken');
                        noteAccount();
                        setState('login');
                        return;
                    }
                    if (!res.ok || !data.fundCode) {
                        setNote(data.error || 'Chưa kiểm tra được tài khoản.');
                        setState('error');
                        return;
                    }
                    if (data.fundCode !== (E.Quota.read() || {}).code) {
                        try { E.Quota.setCode(data.fundCode); } catch (e) {}
                        E.Quota.sync().catch(() => {});
                    }
                    if (data.sharedCode) setMoved({ shared: data.sharedCode, own: data.fundCode });
                    setState('ready');
                }).catch(() => {
                    if (!alive) return;
                    setNote('Mất kết nối. Kiểm tra mạng rồi thử lại.');
                    setState('error');
                });
                return () => { alive = false; };
            }, [account && account.email, round]);
            if (state === 'ready') {

                        </div>
                        {children}

            if (state === 'checking') return <div className="pay-gate text-sm text-ink2" role="status">Đang kiểm tra tài khoản…</div>;

                            </div>

                    </ol>

        /* Thẻ đầu màn hình Hôm nay: giờ tới ca kế, trạng thái khóa lịch, một nút học. */
        /* Chỉ mở sau khi đăng nhập Google: chọn giờ cho 3 ca, số thẻ mỗi ca và nhóm thẻ. */
        const SetupWizard = ({ week, groups, onSave, onClose }) => {
            const base = (week && week.days && week.days.monday) || Plan.defaultWeek().days.monday;
            const [rows, setRows] = useState(() => base.map(s => ({ time: s.time, label: s.anchorLabel })));

            const [group, setGroup] = useState(() => (base[0] && base[0].group) || 'all');

            const setRow = (i, key, value) => setRows(list => list.map((r, n) => (n === i ? Object.assign({}, r, { [key]: value }) : r)));

                const days = {};

                });
                onSave({ version: 2, title: 'Lịch của tôi', days });

            return (
                <Modal title="Đặt lịch học của bạn" onClose={onClose} footer={<><button type="button" className="btn btn-secondary" onClick={onClose}>Để sau</button><button type="button" className="btn btn-primary" onClick={save}>Lưu lịch</button></>}>
                    <p className="text-sm text-ink2">Chọn 3 lúc bạn chắc chắn rảnh mỗi ngày, ví dụ sau giờ ăn sáng, giờ nghỉ trưa, trước khi ngủ. Đến giờ, thẻ sẽ tự bật lên.</p>
                    <div className="mt-4 space-y-2">
                        {rows.map((r, i) => (
                            <div key={i} className="flex items-center gap-2 rounded-xl border border-line p-2">

                                <input type="time" value={r.time} onChange={(e) => setRow(i, 'time', e.target.value)} className="field w-32 tnum" aria-label={'Giờ ca ' + (i + 1)} />
                                <input value={r.label} maxLength={40} onChange={(e) => setRow(i, 'label', e.target.value)} className="field min-w-0 flex-1" aria-label={'Tên ca ' + (i + 1)} placeholder="Sau bữa trưa" />
                            </div>
                        ))}
                    </div>
                    <div className="mt-4 grid gap-3 sm:grid-cols-2">

                                {[5, 8, 12, 20].map(v => <option key={v} value={v}>{v} thẻ{v === 8 ? ' (gợi ý)' : ''}</option>)}

                            <select value={group} onChange={(e) => setGroup(e.target.value)} className="field">
                                <option value="all">Tất cả thẻ trong kho</option>
                                {groups.map(([k]) => <option key={k} value={k}>{Sch.groupLabel(k)}</option>)}
                            </select>
                        </label>
                    </div>
                    {error && <p className="mt-3 text-sm text-danger" role="alert">{error}</p>}
                    <p className="mt-3 text-xs text-muted">Hôm nay chưa học ca nào thì lịch mới áp dụng ngay. Nếu đã học, lịch mới bắt đầu từ ngày mai để giữ cam kết hôm nay.</p>
                </Modal>
            );
        };

        const WORD_TYPES = ['n', 'v', 'adj', 'adv', 'prep', 'conj', 'pron', 'phr', 'idiom'];
        /* Thanh trạng thái quỹ 1 dòng cho Sổ từ: bấm vào mới mở chi tiết đổi mã / nâng cấp. */
        const AI_SCARCE = 15;
        /* Thanh trạng thái Sổ từ.
           - Phiếu hôm nay (hiệu ứng Zeigarnik): chưa chốt thì pill sáng, có sóng radar và vệt sáng, bấm là vào học 30s; chốt rồi thì xanh lá, đứng yên.
           - Lượt AI (khan hiếm tăng dần): còn nhiều thì chỉ hiện "Gói AI 29k"; còn <= 15 lượt thì hiện cảnh báo cam cạnh nút Nâng cấp. */
        const FundStrip = ({ onOpen, onQuickVote }) => {
            const skinPref = useSkinPref();
            const fund = useFund();
            const ai = useAiLeft();
            const votes = useVoteSummary();
            const due = !!votes && !votes.confirmedToday;
            const scarce = !ai.on && ai.left <= AI_SCARCE;
            const streak = votes ? (votes.streak || 0) : 0;
            const name = identityName(useIdentity());
            const slipped = !!votes && votes.missedOnce;
            const mission = useMission();
            const day = useDayLeft();
            /* Vừa chốt phiếu (đang "Còn 1 phiếu" chuyển sang "Đã chốt"): chạy hiệu ứng mừng một lần. */
            const wasDue = useRef(false);
            const [fresh, setFresh] = useState(false);
            useEffect(() => {
                if (!votes) return undefined;
                /* Chốt phiếu ở màn khác (đang học) thì về Sổ từ vẫn thấy Banner thu gọn. */
                let pending = false;
                if (votes.confirmedToday) {
                    try { pending = sessionStorage.getItem('edu.missionDone') === '1'; if (pending) sessionStorage.removeItem('edu.missionDone'); } catch (e) {}
                }
                if ((wasDue.current || pending) && votes.confirmedToday) {
                    setFresh(true);
                    const t = window.setTimeout(() => setFresh(false), 2400);
                    wasDue.current = false;
                    return () => window.clearTimeout(t);
                }
                wasDue.current = !votes.confirmedToday;
                return undefined;
            }, [votes && votes.confirmedToday]);
            const tier = skinOf(fund, skinPref);
            if (due) {
                const late = day.hour >= 21;
                return (
                    <section className={'mission' + (late ? ' is-late' : '')} data-tier={tier} aria-label="Phiếu bản sắc hôm nay">
                        <div className="mission-head">
                            <span className="mission-label">{tier !== 'eco'
                                ? <><i className="mission-star" aria-hidden="true">✦</i>Obsidian Pass · chưa đóng dấu</>
                                : <><i className="mission-dot" aria-hidden="true" />Phiếu bản sắc · chưa đóng dấu</>}</span>
                            <MissionClock />
                        </div>
                        <div className="mission-body">
                            <span className="mission-duck">
                                <span className="mission-face"><img src={DUCK_SRC} alt="Con vịt đang chờ bạn chốt phiếu" width="72" height="72" decoding="async" /></span>
                                <b className="mission-badge tnum" aria-label={'Đã lật ' + mission + ' trên ' + MISSION_GOAL + ' thẻ'}>{mission}/{MISSION_GOAL}</b>
                            </span>
                            <div className="mission-copy">
                                <p className="mission-name">{duckLine(day.hour, name)}</p>
                                <p className="mission-sub">{mission > 0 ? 'Còn 1 thẻ nữa là đuổi được con vịt này đi.' : 'Lật nhanh 2 thẻ (30s) để đuổi con vịt này đi.'}</p>
                            </div>
                            <button type="button" className="mission-cta" onClick={onQuickVote}>
                                <Icon name="zap" size={15} /> {mission > 0 ? 'Chốt nốt 1 thẻ' : 'Chốt phiếu 30s'} <span aria-hidden="true">→</span>
                            </button>
                        </div>
                    </section>
                );
            }
            return (
                <div className={'fund-strip' + (fresh ? ' is-collapse' : '')} data-tier={tier}>
                    {!votes ? (
                        <span className="ticket is-idle">
                            <svg className="ticket-ic" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.5" stroke="currentColor" strokeWidth="1.5" /></svg>
                            <span>Phiếu hôm nay</span>
                        </span>
                    ) : due ? (
                        <button type="button" className={'ticket is-due' + (slipped ? ' is-slipped' : '')} onClick={onQuickVote}
                            aria-label={slipped ? 'Hôm qua lỡ nhịp. Bấm để học nhanh 30 giây, chốt phiếu và quay lại chuỗi' : 'Giữ chất ' + name + '. Bấm để học nhanh 30 giây và chốt phiếu hôm nay'}
                            title="Học nhanh 30 giây để chốt phiếu hôm nay">
                            <svg className="ticket-ic" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                <circle cx="8" cy="8" r="6.5" stroke="currentColor" strokeWidth="1.5" />
                                <circle className="ticket-pulse" cx="8" cy="8" r="2.5" fill="currentColor" />
                                <circle cx="8" cy="8" r="2.5" fill="currentColor" />
                            </svg>
                            {slipped ? (
                                <><span className="ticket-text">Hôm qua lỡ nhịp</span><span className="ticket-go">· <span className="sm:hidden">Quay lại</span><span className="hidden sm:inline">Chốt để quay lại</span></span></>
                            ) : (
                                <><span className="ticket-text">Giữ chất <b>{name}</b></span><span className="ticket-go">· Chốt<span className="hidden sm:inline"> phiếu</span></span></>
                            )}
                            <svg className="ticket-chev" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" /></svg>
                        </button>
                    ) : (
                        <span className={'ticket is-done' + (fresh ? ' is-fresh' : '')} role="status"
                            title={'Đã đóng dấu ' + name + ' hôm nay · chuỗi ' + streak + ' ngày. Mai quay lại để giữ chuỗi.'}>
                            <span className="ticket-check is-seal" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none">
                                    <circle cx="12" cy="12" r="11" fill="#FFFBEB" stroke="#C08A2E" strokeWidth="1.2" />
                                    <circle cx="12" cy="12" r="8.6" stroke="#C08A2E" strokeWidth=".8" strokeDasharray="1.4 1.6" />
                                    <circle cx="12" cy="12" r="6.6" fill="url(#seal-g)" />
                                    <path className="ticket-tick" d="M9.2 12.2 11.2 14.1 14.9 10.3" stroke="#FFFFFF" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" />
                                    <defs><linearGradient id="seal-g" x1="5" y1="5" x2="19" y2="19"><stop stopColor="#2DD4BF" /><stop offset="1" stopColor="#0F766E" /></linearGradient></defs>
                                </svg>
                            </span>
                            <span className="ticket-text">Đã đóng dấu<span className="hidden sm:inline"> · <b>{name}</b></span></span>
                            <span className="ticket-streak" aria-label={'Chuỗi ' + streak + ' ngày'}>
                                {FLAME}
                                <b className="tnum">{streak}</b><span className="hidden sm:inline">&nbsp;ngày</span>
                            </span>
                        </span>
                    )}
                    <span className="ml-auto flex shrink-0 items-center gap-1.5">
                        {scarce && (
                            <button type="button" className="fund-warn" onClick={onOpen} aria-label={'AI còn ' + ai.left + ' lượt, mở gói AI'}>
                                <span aria-hidden="true">⚠️</span> <span className="hidden sm:inline">AI còn </span><b className="tnum">{ai.left}</b><span className="hidden sm:inline"> lượt</span>
                            </button>
                        )}
                        {ai.on ? <button type="button" className="fund-cta is-soft" onClick={onOpen}>Chi tiết ›</button>
                            : <button type="button" className={'fund-cta ' + (scarce ? 'is-hot' : 'is-soft')} onClick={onOpen}><Icon name="zap" size={12} /> {scarce ? 'Nâng cấp 29k' : 'Gói AI 29k'}</button>}
                    </span>
                </div>
            );
        };
        /* Gói cước & Nhập mã: một Modal trung tâm cho gói AI 29k / PRO, lượt EOS, nhập mã và ví nhóm.
           Mọi nút nâng cấp, nạp lượt, nhập mã đều mở đúng tab của Modal này. */
        const openBilling = (tab) => window.dispatchEvent(new CustomEvent('edu-billing', { detail: { tab: tab || 'ai' } }));
        const BILL_TABS = [
            ['ai', 'Gói AI & PRO', 'AI & PRO'],
            ['eos', 'Lượt thi EOS', 'Lượt EOS'],
            ['code', 'Nhập mã & Ví nhóm', 'Nhập mã']
        ];
        const cleanRedeem = (raw) => String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 24);
        /* Hỏi máy chủ mã thuộc loại nào. Mạng lỗi thì đoán theo độ dài: mã quỹ tối đa 12 ký tự. */
        const classifyCode = async (code) => {
            try {
                const res = await fetch('/api/fund?action=classify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                    body: JSON.stringify({ code })
                });
                const data = await res.json().catch(() => ({}));
                if (res.status === 429) { const e = new Error(data.error || 'Nhập mã quá nhiều lần. Chờ 15 phút rồi thử lại.'); e.stop = true; throw e; }
                if (res.ok && ['pro', 'fund', 'new', 'unknown'].indexOf(data.kind) >= 0) return data.kind;
            } catch (e) { if (e.stop) throw e; }
            return code.length > 12 ? 'pro' : 'offline';
        };
        const BillingHub = ({ toast, tab: start = 'ai', onClose }) => {
            const fund = useFund();
            const account = useAccount();
            const [tab, setTab] = useState(start);
            useEffect(() => { setTab(start); }, [start]);
            const [picked, setPicked] = useState(null);
            const [syncing, setSyncing] = useState(false);
            const [entry, setEntry] = useState('');
            const [busy, setBusy] = useState(false);
            const [loginFor, setLoginFor] = useState('');
            const [confirmNew, setConfirmNew] = useState('');
            const [note, setNote] = useState(null);
            const [showCode, setShowCode] = useState(false);
            const entryRef = useRef(null);
            const aiCap = fund.aiLimit || E.Quota.AI_FREE;
            const aiLeft = Math.max(0, aiCap - (fund.aiUsed || 0));
            const vocabOn = (fund.aiCredits || 0) > 0;
            const pro = proLive(fund);
            const bank = E.Quota.BANK;
            const memo = E.Quota.memoOf(fund.code);
            const pack = picked === 'vocab' ? E.Quota.vocab : E.Quota.packs.find(p => p.id === picked);
            const when = (t) => new Date(t).toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
            const pickTab = (id) => { setTab(id); setPicked(null); };
            const goCode = () => { pickTab('code'); window.setTimeout(() => { if (entryRef.current) entryRef.current.focus(); }, 40); };
            const checkPay = (quiet) => {
                setSyncing(true);
                return E.Quota.sync().then((r) => {
                    if (r.aiJustFunded) toast('Đã cộng 500 lượt điền thẻ và 30 lượt quét bài đọc.', 'success');
                    else if (r.aiJustUnlocked && !(r.added > 0)) toast('Đã bật trợ lý AI.', 'success');
                    else if (r.added > 0) toast('Đã cộng ' + r.added + ' lượt EOS. Hiện có ' + r.balance + ' lượt.', 'success');
                    else if (!quiet) toast('Chưa thấy giao dịch mới với nội dung ' + E.Quota.memoOf(r.code) + '.', 'info');
                }).catch((e) => {
                    if (!quiet) toast(e.message || 'Chưa kiểm tra được thanh toán.', 'error');
                }).finally(() => setSyncing(false));
            };
            useEffect(() => {
                if (!picked) return undefined;
                checkPay(true);
                const id = setInterval(() => checkPay(true), 12000);
                return () => clearInterval(id);
            }, [picked, fund.code]);
            const copyShared = () => {
                copyText(fund.code).then(() => toast('Đã copy mã dùng chung ' + fund.code + '.', 'success')).catch(() => toast('Không copy được. Hãy chọn mã và copy tay.', 'error'));
            };
            const proDone = (gift) => {
                setEntry(''); setLoginFor('');
                const text = gift.proUntil === -1 ? 'Đã mở Obsidian PRO vĩnh viễn cho tài khoản này.' : 'Đã mở Obsidian PRO cho tài khoản này.';
                setNote({ tone: 'ok', text });
                toast(text, 'success');
            };
            const linkFund = (text) => {
                let saved;
                try { saved = /^EDUF1\./i.test(text) ? E.Quota.importCode(text) : E.Quota.setCode(text); }
                catch (e) { setNote({ tone: 'err', text: e.message || 'Mã dùng chung không hợp lệ.' }); return; }
                setEntry(''); setConfirmNew('');
                setNote({ tone: 'info', text: 'Đang đồng bộ lượt của mã ' + saved.code + '…' });
                checkPay(true).then(() => {
                    const now = E.Quota.read();
                    setNote({ tone: 'ok', text: 'Đã liên kết mã dùng chung ' + now.code + ': ' + now.balance + ' lượt EOS, trừ chung với cả nhóm.' });
                    toast('Đã liên kết mã dùng chung ' + now.code + '.', 'success');
                });
            };
            const redeemPro = async (code) => {
                if (!googleToken()) { setLoginFor(code); return; }
                try { proDone(await redeemGiftCode(code)); }
                catch (e) {
                    if (e.needLogin) setLoginFor(code);
                    else setNote({ tone: 'err', text: e.message });
                }
            };
            /* Tự nhận diện: mã PRO / voucher thì kích hoạt PRO, mã quỹ thì chuyển máy sang quỹ đó và đồng bộ lượt. */
            const apply = async (e) => {
                if (e) e.preventDefault();
                const text = entry.trim();
                if (!text || busy) return;
                setNote(null); setLoginFor(''); setConfirmNew('');
                if (/^EDUF1\./i.test(text)) { linkFund(text); return; }
                const code = cleanRedeem(text);
                if (code.length < 4) { setNote({ tone: 'err', text: 'Mã cần từ 4 chữ hoặc số.' }); return; }
                if (code === fund.code) { setNote({ tone: 'info', text: 'Máy này đang dùng đúng mã này rồi.' }); return; }
                setBusy(true);
                try {
                    const kind = await classifyCode(code);
                    if (kind === 'pro') await redeemPro(code);
                    else if (kind === 'fund') linkFund(code);
                    else if (kind === 'new' || kind === 'offline') setConfirmNew({ code, offline: kind === 'offline' });
                    else setNote({ tone: 'err', text: 'Không tìm thấy mã này. Kiểm tra lại từng ký tự, hoặc liên hệ hỗ trợ.' });
                } catch (err) {
                    setNote({ tone: 'err', text: err.message || 'Chưa kiểm tra được mã.' });
                } finally {
                    setBusy(false);
                }
            };
            const afterLogin = async (user, err) => {
                if (err) { toast(err.message, 'error'); return; }
                const code = loginFor;
                if (!code) return;
                setBusy(true);
                try { proDone(await redeemGiftCode(code)); }
                catch (e) { setLoginFor(''); setNote({ tone: 'err', text: e.message }); }
                finally { setBusy(false); }
            };
            const codeLink = (
                <p className="bill-foot">
                    <button type="button" onClick={goCode}><Icon name="key" size={14} /> Bạn đã có mã kích hoạt / mã dùng chung? <b>Nhập tại đây</b></button>
                </p>
            );
            const payBox = pack && (
                <PayGate>
                    <div className="mt-4 flex flex-wrap items-center gap-4 rounded-2xl border border-line p-4">
                        <img src={E.Quota.qrUrl(pack.price, fund.code)} alt={'VietQR ' + bank.name + ' ' + bank.account} className="h-40 w-40 rounded-xl border border-line bg-white object-contain" />
                        <div className="min-w-0 flex-1 text-sm text-ink2">
                            <p className="font-semibold text-ink">Chuyển khoản {pack.name}</p>
                            <p className="mt-1">{bank.name} · {bank.bin}</p>
                            <p className="tnum">Số tài khoản: <b className="text-ink">{bank.account}</b></p>
                            <p>Chủ tài khoản: <b className="text-ink">{bank.holder}</b></p>
                            <p className="tnum">Số tiền: <b className="text-ink">{vnd(pack.price)}</b></p>
                            <p className="tnum">Nội dung: <b className="text-ink">{memo}</b></p>
                            <p className="mt-2 text-xs text-muted">{pack.id === 'vocab' ? 'Tự cộng 500 lượt điền thẻ và 30 lượt quét bài đọc khi tiền vào đúng 29.000đ và đúng nội dung.' : 'Tự cộng đúng ' + pack.turns + ' lượt EOS và bật trợ lý AI khi tiền vào đúng số tiền và nội dung.'}</p>
                            <p className="mt-2 flex flex-wrap gap-x-3 gap-y-1 text-xs">
                                <button type="button" className="font-semibold text-primary underline underline-offset-2" onClick={() => openLegal('pay')}>Chính sách thanh toán</button>
                                <button type="button" className="font-semibold text-primary underline underline-offset-2" onClick={openSupport}>Ghi sai nội dung? Liên hệ hỗ trợ</button>
                            </p>
                            <button type="button" className="btn btn-primary mt-3" disabled={syncing} onClick={() => checkPay(false)}>{syncing ? 'Đang kiểm tra…' : 'Kiểm tra chuyển khoản'}</button>
                        </div>
                    </div>
                </PayGate>
            );
            const aiStatus = pro ? 'AI không giới hạn' : fund.aiUnlocked ? 'Trợ lý AI đang mở' : vocabOn ? 'Còn ' + aiLeft + ' lượt AI' : 'Còn ' + aiLeft + '/' + aiCap + ' lượt AI miễn phí';
            const tabAi = (
                <div>
                    <div className="bill-stat is-wrap">
                        <span className="bill-stat-ic"><Icon name="sparkles" size={18} /></span>
                        <span className="min-w-0 flex-1">
                            <b className="block text-ink">{aiStatus}</b>
                            <span className="text-xs text-ink2">{account ? 'Gắn với tài khoản ' + account.email : 'Đang lưu tạm trên máy này. Đăng nhập Google để giữ quyền lợi khi đổi máy.'}</span>
                        </span>
                        {pro ? <span className="eos-pro">PRO</span> : !account ? <button type="button" className="btn btn-secondary btn-sm bill-stat-btn" onClick={() => askLogin('save')}>Đăng nhập Google</button> : null}
                    </div>
                    {pro ? (
                        <div className="mt-4 rounded-2xl border border-[#D8C7A0]/60 bg-[#10141F] p-4 text-white">
                            <p className="flex items-center gap-2 font-semibold text-[#E7C56A]"><Icon name="gem" size={16} /> Obsidian PRO đang hoạt động</p>
                            <p className="mt-1 text-sm text-slate-300">{fund.proUntil === -1 ? 'Vĩnh viễn' : fund.proUntil ? 'Đến ' + new Date(fund.proUntil).toLocaleDateString('vi-VN') : 'Đang mở'} · AI điền thẻ và quét bài đọc không giới hạn, giao diện thành viên Obsidian.</p>
                        </div>
                    ) : (
                        <div className="bill-plans">
                            <div className={'bill-plan is-main' + (picked === 'vocab' ? ' is-on' : '')}>
                                <span className="bill-tag">Trọn học kỳ · tiết kiệm 50%</span>
                                <p className="mt-2 font-bold text-ink">Gói AI Từ vựng & Đọc hiểu</p>
                                <p className="mt-1 flex flex-wrap items-baseline gap-x-2"><span className="text-2xl font-bold tnum text-ink">29.000đ</span><span className="text-sm text-slate-400 line-through tnum">59.000đ</span></p>
                                <ul className="bill-perks">
                                    <li><Icon name="check" size={14} />+500 lượt AI tự điền thẻ (nghĩa, ví dụ, IPA, mẹo nhớ)</li>
                                    <li><Icon name="check" size={14} />+30 lượt AI quét bài đọc / đề thi</li>
                                    <li><Icon name="check" size={14} />Giao diện thành viên Obsidian</li>
                                </ul>
                                {vocabOn ? <span className="plan-cta is-on">Đã kích hoạt</span>
                                    : fund.aiUnlocked ? <span className="plan-cta is-on">Đã có AI từ gói EOS</span>
                                    : <button type="button" className={'plan-cta ' + (picked === 'vocab' ? 'is-on' : 'is-featured')} onClick={() => setPicked('vocab')}>{picked === 'vocab' ? 'Đã chọn · quét QR bên dưới' : 'Thanh toán 29.000đ'}</button>}
                            </div>
                            <div className="bill-plan is-dark">
                                <span className="bill-tag is-gold">Thành viên</span>
                                <p className="mt-2 flex items-center gap-1.5 font-bold text-white"><Icon name="gem" size={15} className="text-[#E7C56A]" /> Obsidian PRO</p>
                                <p className="mt-1 text-sm text-slate-300">AI không giới hạn, mở bằng mã thành viên hoặc voucher do admin cấp.</p>
                                <ul className="bill-perks is-dark">
                                    <li><Icon name="check" size={14} />AI điền thẻ và quét bài không giới hạn</li>
                                    <li><Icon name="check" size={14} />Gắn với tài khoản Google, đổi máy vẫn còn</li>
                                </ul>
                                <button type="button" className="plan-cta is-gold" onClick={goCode}>Nhập mã PRO</button>
                            </div>
                        </div>

                if (mq.addEventListener) mq.addEventListener('change', apply);
                else mq.addListener(apply);

                    if (mq.removeEventListener) mq.removeEventListener('change', apply);
                    else mq.removeListener(apply);

                if (narrow) document.body.style.overflow = 'hidden';
                const onDown = (e) => {
                    const t = e.target;
                    if (node && node.contains(t)) return;
                    if (t && t.closest && t.closest('[data-help-open]')) return;
                    onClose();
                };
                document.addEventListener('mousedown', onDown);
                return () => {
                    alive.current = false;
                    document.removeEventListener('mousedown', onDown);
                    if (narrow) document.body.style.overflow = prevOverflow;
                    const el = back && document.contains(back) ? back : document.querySelector('.help-launch');
                    if (el && el.focus) el.focus();
                };
            }, []);
            const trap = (e) => {
                if (e.key !== 'Tab' || !box.current) return;
                const els = Array.from(box.current.querySelectorAll('a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])'));
                if (!els.length) return;
                const first = els[0];
                const last = els[els.length - 1];
                if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
                else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
            };
            const mark = (key) => {
                setCopied(key);
                window.setTimeout(() => { if (alive.current) setCopied(cur => (cur === key ? '' : cur)); }, 2000);
            };
            const copyValue = (text, key) => {
                copyText(text).then(() => mark(key)).catch(() => toast('Không tự sao chép được. Hãy chép tay.', 'error', 2500));
            };
            const chatZalo = () => {
                const pending = copyText(code);
                window.open(SUPPORT.zalo, '_blank', 'noopener,noreferrer');
                pending.then(() => toast('Đã sao chép mã ' + code + '. Dán vào Zalo và gửi kèm ảnh biên lai nhé.', 'success', 2500))
                    .catch(() => toast('Không tự sao chép được, bạn hãy chép mã ' + code + ' thủ công.', 'error', 2500));
            };
            return (
                <div ref={box} id="fpass-help" role="dialog" aria-modal={touch ? 'true' : 'false'} aria-labelledby="fpass-help-title" className="help-pop" onKeyDown={trap}>
                    <div className="help-grab" aria-hidden="true"><span /></div>
                    <div className="help-body">
                        <div className="flex items-start justify-between gap-2">
                            <h2 id="fpass-help-title" className="text-lg font-semibold leading-snug pt-1">Cần hỗ trợ?</h2>
                            <button type="button" className="help-x -mr-2 -mt-1" onClick={onClose} aria-label="Đóng"><Icon name="x" /></button>
                        </div>
                        <p className="help-quiet text-sm leading-relaxed">Phản hồi trong khoảng {SUPPORT.replyMinutes} phút · {hours} hằng ngày</p>
                        <p className="mt-2 flex items-center gap-2 text-sm">
                            <span className={'help-dot' + (online ? ' on' : '')} aria-hidden="true" />
                            <span className={online ? 'text-[#BBF7D0]' : 'help-quiet'}>{online ? 'Đang trực tuyến' : ('Ngoài giờ, trả lời vào ' + supportHourLabel(SUPPORT.hours.start) + ' sáng mai')}</span>
                        </p>
                        <div className="mt-3 border-t border-white/10">
                            {SUPPORT.faq.map((item, i) => {
                                const pid = 'fpass-faq-' + i;
                                const on = faq === i;
                                return (
                                    <div key={item.q} className="border-b border-white/10">
                                        <button type="button" className="help-faq" aria-expanded={on} aria-controls={pid} onClick={() => setFaq(on ? -1 : i)}>
                                            <span>{item.q}</span>
                                            <span style={{ display: 'inline-flex', transform: on ? 'rotate(90deg)' : 'none' }}><Icon name="right" size={16} /></span>
                                        </button>
                                        <p id={pid} hidden={!on} className="help-quiet text-sm leading-relaxed pb-3">{item.a}</p>
                                    </div>
                                );
                            })}
                        </div>
                        <div className="mt-4">
                            <p className="text-sm font-semibold">Mã của bạn</p>
                            <div className="mt-1 flex items-center justify-between gap-2">
                                <p className="tnum text-3xl font-semibold tracking-wide">{code}</p>
                                <button type="button" className="help-mini" onClick={() => copyValue(code, 'code')}>{copied === 'code' ? 'Đã chép' : 'Sao chép'}</button>
                            </div>
                            <p className="help-quiet text-xs leading-relaxed">Mã này giúp chúng tôi tìm đúng giao dịch của bạn.</p>
                        </div>
                        <button type="button" data-autofocus className="help-go mt-4" aria-describedby="fpass-help-receipt" onClick={chatZalo}>Chat Zalo (tự sao chép mã)</button>
                        <p id="fpass-help-receipt" className="help-quiet text-xs leading-relaxed mt-2">Nhớ gửi kèm ảnh chụp biên lai chuyển khoản.</p>
                        <p className="help-quiet mt-3 flex flex-wrap items-center text-xs leading-relaxed">
                            <span>Hoặc gọi {SUPPORT.phoneDisplay}</span>
                            {touch
                                ? <a className="help-mini help-link" href={'tel:' + SUPPORT.phone}>Gọi</a>
                                : <button type="button" className="help-mini" onClick={() => copyValue(SUPPORT.phone, 'phone')}>{copied === 'phone' ? 'Đã chép' : 'Sao chép số'}</button>}
                        </p>
                        <p className="help-quiet flex flex-wrap items-center text-xs leading-relaxed">
                            <span>Hoặc gửi email: <a className="help-link underline" href={mailHref}>{SUPPORT.email}</a></span>
                            {!touch && <button type="button" className="help-mini" onClick={() => copyValue(SUPPORT.email, 'email')}>{copied === 'email' ? 'Đã chép' : 'Sao chép email'}</button>}
                        </p>
                        <button type="button" className="mt-4 w-full min-h-[44px] rounded-xl border border-white/15 bg-white/5 px-3 py-3 text-left text-sm leading-snug text-[#E2E8F0] hover:bg-white/10" onClick={onFeedback}>🐛 Phát hiện lỗi đề thi hoặc có ý tưởng mới? → Gửi góp ý ngay</button>
                    </div>
                </div>
            );
        };

        const SupportDock = ({ open, toast, returnTo, onOpen, onClose, onFeedback }) => (
            <>
                {open && <div className="help-scrim" onMouseDown={onClose} />}
                <div className="help-dock">
                    {open && <SupportPanel toast={toast} onClose={onClose} returnTo={returnTo} onFeedback={onFeedback} />}
                </div>
            </>
        );
        /* ===================== PRACTICE ENGINES: Flashcard · Băng đạn 5 câu · EOS ===================== */
        const ItemPrompt = ({ t, hl, big }) => {
            if (!t) return null;
            const text = t.type === 'mcq' ? t.questionOrWord : Sch.recallPromptOf(t);
            return (
                <p className={'text-flow reading font-semibold text-ink ' + (big ? 'text-xl sm:text-2xl' : 'text-lg sm:text-xl')}>
                    <Hl text={text} keywords={t.keywords} on={hl} />
                </p>
            );
        };

        const ItemAnswer = ({ t, hl, compact }) => {
            if (!t) return null;
            if (t.type === 'mcq') {
                return (
                    <p className="text-flow font-semibold text-success">
                        <span className="tnum mr-1">{t.answerOrMeaning}.</span>
                        <Hl text={Sch.correctText(t)} keywords={t.keywords} on={hl} />
                    </p>
                );
            }
            return (
                <div className="text-flow">
                    <span className="font-semibold text-success text-lg">{t.questionOrWord}</span>
                    {t.ipa && <span className="ml-2 text-sm text-ink2">{t.ipa}</span>}
                    {!compact && Sch.readingOf(t) && <span className="ml-2 text-sm text-muted">{Sch.readingOf(t)}</span>}
                </div>
            );
        };

        const Elapsed = ({ startedAt, limitMin }) => {
            const now = useNow(1000);
            const ms = now - startedAt;
            const over = limitMin && ms > limitMin * 60000;
            return (
                <span className={'chip tnum ' + (over ? 'bg-warn-soft text-warn' : 'bg-surface2 text-ink2')}>
                    <Icon name="timer" size={14} />
                    {Plan.fmtCountdown(ms)}{limitMin ? ' / ' + limitMin + ':00' : ''}
                </span>
            );
        };

        const JACK_STAGES = [
            { kind: 'stage1', src: '/public/stickers/jack-stage1.png', label: 'Nhập môn ngơ ngác' },
            { kind: 'stage2', src: '/public/stickers/jack-stage2.png', label: 'Tự tin 5+5=8' },
            { kind: 'stage3', src: '/public/stickers/jack-stage3.png', label: 'Càn quét đề thi' },
            { kind: 'stage4', src: '/public/stickers/jack-stage4.png', label: 'Bá chủ phòng thi!' }
        ];
        const JACK_SRC = {
            question: '/public/stickers/jack-question.png',
            wrong: '/public/stickers/jack-wrong.png'
        };
        const jackTier = (pct) => (pct >= 100 ? 3 : pct >= 60 ? 2 : pct >= 25 ? 1 : 0);

        const JackFace = ({ kind }) => {
            const mood = kind === 'wrong' ? 'M3 16 Q12 22 21 16' : kind === 'stage4' ? 'M4 15 Q12 20 20 15' : 'M5 16 Q12 19 19 16';
            const eyes = kind === 'wrong'
                ? <><circle cx="8" cy="11" r="2.2" /><circle cx="16" cy="11" r="2.2" /></>
                : <><circle cx="8.5" cy="12" r="1.3" /><circle cx="15.5" cy="12" r="1.3" /></>;
            return (
                <svg className="jack-face" viewBox="0 0 24 24" aria-hidden="true">
                    <rect width="24" height="24" rx="6" fill={kind === 'wrong' ? '#FEE2E2' : kind === 'stage4' ? '#FEF3C7' : '#EEF0FF'} />
                    <circle cx="12" cy="13" r="6.2" fill="#FDBA74" />
                    <path d="M6 8 L4 4 L9 7" fill="#FDBA74" />
                    <path d="M18 8 L20 4 L15 7" fill="#FDBA74" />
                    {eyes}
                    <path d={mood} fill="none" stroke="#9A3412" strokeWidth="1.2" strokeLinecap="round" />
                </svg>
            );
        };

        const knockBlack = (img) => {
            const nw = img.naturalWidth || 1;
            const nh = img.naturalHeight || 1;
            const max = 960;
            const scale = Math.min(1, max / Math.max(nw, nh));
            const w = Math.max(1, Math.round(nw * scale));
            const h = Math.max(1, Math.round(nh * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const pen = canvas.getContext('2d', { willReadFrequently: true });
            pen.imageSmoothingEnabled = true;
            pen.imageSmoothingQuality = 'high';
            pen.drawImage(img, 0, 0, w, h);
            const frame = pen.getImageData(0, 0, w, h);
            const px = frame.data;
            for (let i = 0; i < px.length; i += 4) {
                if (px[i] < 24 && px[i + 1] < 24 && px[i + 2] < 24) px[i + 3] = 0;
            }
            pen.putImageData(frame, 0, 0);
            let minX = w, minY = h, maxX = -1, maxY = -1;
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    if (px[(y * w + x) * 4 + 3] < 16) continue;
                    if (x < minX) minX = x;
                    if (y < minY) minY = y;
                    if (x > maxX) maxX = x;
                    if (y > maxY) maxY = y;
                }
            }
            if (maxX < minX) return canvas.toDataURL('image/png');
            const cw = maxX - minX + 1;
            const ch = maxY - minY + 1;
            const trimmed = document.createElement('canvas');
            trimmed.width = cw;
            trimmed.height = ch;
            trimmed.getContext('2d').drawImage(canvas, minX, minY, cw, ch, 0, 0, cw, ch);
            return trimmed.toDataURL('image/png');
        };

        const JackSticker = ({ kind, src }) => {
            const [missing, setMissing] = useState(false);
            const [cut, setCut] = useState('');
            useEffect(() => { setMissing(false); setCut(''); }, [src]);
            if (missing || !src) return <JackFace kind={kind} />;
            return (
                <img src={cut || src} alt=""
                    onLoad={(e) => {
                        if (cut || String(e.currentTarget.src).indexOf('data:') === 0) return;
                        try { setCut(knockBlack(e.currentTarget)); } catch (err) {}
                    }}
                    onError={() => { if (!cut) setMissing(true); }} />
            );
        };

        const JackCorner = ({ wrong }) => (
            <div className="jack-corner">
                <span className="jack-sticker">
                    <JackSticker kind={wrong ? 'wrong' : 'question'} src={wrong ? JACK_SRC.wrong : JACK_SRC.question} />
                </span>
                {!wrong && <p className="jack-tip">Câu này chọn gì đây ta...</p>}
            </div>
        );

        const JackEvolveBar = ({ value, max }) => {
            const pct = max > 0 ? Math.max(0, Math.min(100, Math.round((value / max) * 100))) : 0;
            const tier = jackTier(pct);
            const stage = JACK_STAGES[tier];
            const [pop, setPop] = useState(0);
            const prev = useRef(tier);
            useEffect(() => {
                if (tier === prev.current) return;
                prev.current = tier;
                setPop((n) => n + 1);
            }, [tier]);
            return (
                <div className="jack-evo">
                    <div className="jack-evo-top">
                        <span className="text-xs font-semibold text-ink">{stage.label}</span>
                        <span className="tnum text-xs text-muted">{pct}%</span>
                    </div>
                    <div className="jack-track" role="progressbar" aria-valuenow={pct} aria-valuemin={0} aria-valuemax={100} aria-label={'Jack: ' + stage.label}>
                        <div className="jack-fill" style={{ width: pct + '%' }} />
                        {[0, 25, 60, 100].map((mark) => <span key={mark} className={'jack-mark' + (pct >= mark ? ' on' : '')} style={{ left: mark + '%' }} />)}
                        <span key={stage.kind + '-' + pop} className={'jack-runner' + (pop ? ' jack-evolve' : '')} style={{ left: pct + '%' }}>
                            <span className="jack-sticker"><JackSticker kind={stage.kind} src={stage.src} /></span>
                        </span>
                    </div>
                    <div className="jack-labels">
                        {JACK_STAGES.map((item, i) => <span key={item.kind} className={i === tier ? 'is-now' : ''}>{item.label}</span>)}
                    </div>
                </div>
            );
        };

        /* Ba chế độ xem câu hỏi: Tiếng Việt / English (khi đề song ngữ) và Keyword (nhấn mạnh từ khóa, phím H). */
        const HighlightButton = ({ on, onToggle, locked, bilingual }) => {
            const [lang, setLang] = useQLang();
            const tone = (active) => 'btn btn-sm ' + (active ? 'btn-primary' : 'btn-secondary');
            return (
                <div className="inline-flex flex-wrap items-center gap-1" role="group" aria-label="Chế độ xem câu hỏi">
                    {bilingual ? (
                        <>
                            <button type="button" onClick={() => setLang('vi')} aria-pressed={lang === 'vi'} className={tone(lang === 'vi')} title="Xem câu hỏi, lựa chọn và lời giải bằng tiếng Việt">Tiếng Việt</button>
                            <button type="button" onClick={() => setLang('en')} aria-pressed={lang === 'en'} className={tone(lang === 'en')} title="Xem câu hỏi, lựa chọn và lời giải bằng tiếng Anh">English</button>
                        </>
                    ) : null}
                    <button type="button" onClick={onToggle} aria-pressed={on} className={tone(on)} title="Nhấn mạnh từ khóa ăn điểm (phím H)">
                        <Icon name={locked ? 'lock' : 'highlighter'} size={14} /> Keyword <Kbd>H</Kbd>
                    </button>
                </div>
            );
        };

        /* Lời giải của câu trắc nghiệm, hiện ngay sau khi chọn đáp án. */
        const Explain = ({ t, hl }) => (t && t.type === 'mcq' && t.explanationOrExample
            ? <p className="mt-2 text-sm text-ink2 text-flow reading"><b className="text-ink">Giải thích: </b><Hl text={t.explanationOrExample} keywords={t.keywords} on={hl} /></p>
            : null);

        const InsightCard = ({ item }) => {
            if (!item) return null;
            const all = Array.isArray(item.keywords) ? item.keywords.filter(Boolean) : [];
            /* Đề song ngữ: chỉ nhắc từ khóa có trong chữ đang hiện (tiếng Việt hoặc tiếng Anh). */
            const shown = item.type === 'mcq' ? [item.questionOrWord, item.explanationOrExample].concat(item.options || []).join(' ').toLowerCase() : '';
            const inText = shown ? all.filter(k => shown.indexOf(k.toLowerCase()) >= 0) : all;
            const keys = inText.length ? inText : all;
            const example = item.type === 'mcq' ? '' : (item.explanationOrExample || '');
            const vi = item.exampleVi || '';
            const ipa = item.type === 'mcq' ? '' : (item.ipa || '');
            const word = item.type === 'mcq' ? '' : (item.questionOrWord || '');
            if (!ipa && !example && !vi && !keys.length && !word) return null;
            return (
                <div className="mt-3 rounded-xl border border-line bg-surface px-3 py-2 text-left">
                    <p className="text-[11px] font-semibold uppercase tracking-wide text-muted">Củng cố trí nhớ</p>
                    {ipa ? <p className="mt-1 text-sm font-medium">{ipa}</p> : null}
                    {word ? <button type="button" className="btn btn-secondary btn-sm mt-2" onClick={() => speak(word)}><Icon name="volume" size={14} /> Nghe</button> : null}
                    {example ? <p className="mt-2 text-sm italic text-ink2 text-flow">{example}</p> : null}
                    {vi ? <p className="text-sm text-muted text-flow">{vi}</p> : null}
                    {keys.length ? <p className="mt-1 text-sm text-ink2">Gợi nhớ: {keys.join(', ')}</p> : null}
                </div>
            );
        };

        /* ---------------------------------------------------------------
         * BurstSession — Băng đạn 5 câu
         * --------------------------------------------------------------- */
        const BurstSession = ({ itemsById: rawById, ids, title, subtitle, canHighlight = true, highlightLockedMsg, onReview, onFinish, onExit, canExplain, toast, timerMin, renderDone, skipPreview, sessionId, voteType, slotId }) => {
            const [qlang] = useQLang();
            const itemsById = useMemo(() => langMap(rawById, qlang), [rawById, qlang]);
            const bilingual = useMemo(() => ids.some(id => Sch.hasVi(rawById.get(id))), [rawById]);
            const [s, dispatch] = useReducer(Burst.reduce, ids, (x) => Burst.init(x.filter(id => itemsById.has(id)), { skipPreview }));
            const [fb, setFb] = useState(null);
            const [input, setInput] = useState('');
            const [hl, setHl] = useState(false);
            const [now, setNow] = useState(Date.now());
            const [explained, setExplained] = useState({});
            const [explaining, setExplaining] = useState(false);
            const lock = useRef(false);
            const composing = useRef(false);
            const inputRef = useRef(null);
            const cardRef = useRef(null);
            const finished = useRef(false);
            const mounted = useMounted();
            const orders = useMemo(() => {
                const m = {};
                ids.forEach(id => {
                    const t = itemsById.get(id);
                    if (t && t.type === 'mcq') m[id] = Sch.shuffle([0, 1, 2, 3].filter(i => t.options[i]));
                });
                return m;
            }, []);

            const batch = s.batches[s.b] || [];
            const head = Burst.head(s, now);
            const cur = head.id != null ? itemsById.get(head.id) : null;
            const waiting = s.phase === 'drill' && head.waitMs > 0;

            useEffect(() => {
                if (s.phase !== 'preview') return undefined;
                const t = setTimeout(() => dispatch({ type: 'START_DRILL' }), Burst.PREVIEW_MS);
                return () => clearTimeout(t);
            }, [s.phase, s.b]);

            useEffect(() => {
                if (!waiting) return undefined;
                const t = setTimeout(() => setNow(Date.now()), Math.min(250, head.waitMs));
                return () => clearTimeout(t);
            }, [waiting, now]);

            useEffect(() => {
                if (!fb || !cur || cur.type !== 'vocab') return undefined;
                speak(cur.questionOrWord);
                return undefined;
            }, [fb && fb.id]);

            useEffect(() => {
                if (s.phase === 'done' && !finished.current) {
                    finished.current = true;
                    const st = Burst.stats(s);
                    affirmStudy();
                    castSessionVote({ id: sessionId, voteType: voteType, slotId: slotId }, st.answered, toast);
                    if (onFinish) onFinish(st);
                }
            }, [s.phase]);

            useEffect(() => {
                if (s.phase !== 'drill' || !cur || waiting) return;
                if (cur.type === 'vocab' && inputRef.current) inputRef.current.focus();
                else if (cardRef.current) cardRef.current.focus();
            }, [s.phase, head.id, waiting]);

            const answer = (ok, chosen) => {
                if (lock.current || !cur || waiting || fb) return;
                lock.current = true;
                const id = cur.id;
                setFb({ ok, chosen, id });
                if (ok) Sfx.correct(); else Sfx.wrong();
