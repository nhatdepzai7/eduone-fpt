                                    </div>
                                ))}
                                <div className="flex flex-wrap gap-2 pt-1">
                                    <button type="button" className="btn btn-ghost btn-sm" onClick={() => setHarvest(harvest.concat({ term: '', meaning: '' }))}><Icon name="plus" size={14} /> Thêm dòng</button>
                                    <button type="button" className="btn btn-primary ml-auto" onClick={submitHarvest}>Nạp vào kho & chốt ca</button>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-2">
                                {sentences.map((s, i) => (
                                    <textarea key={i} aria-label={'Câu ' + (i + 1)} value={s} maxLength={500} onChange={(e) => setSentences(sentences.map((x, j) => j === i ? e.target.value : x))} rows={3} placeholder={'Câu ' + (i + 1) + ' bằng tiếng Anh'} className="field py-2" />
                                ))}
                                <button type="button" disabled={busy} onClick={submitSentences} className="btn btn-primary">{busy ? 'AI đang chấm…' : 'Gửi câu để AI chấm'}</button>
                            </div>
                        )}
                        {err && <p className="text-sm text-danger mt-3 text-flow" role="alert">{err}</p>}
                    </div>
                </div>
            );
        };

        /* ---------- Sửa lịch tuần: mọi thay đổi chỉ áp dụng từ 00:00 ngày mai ---------- */
        const PlanEditor = ({ week, nextWeek, groups, onSave, toast }) => {
            const base = Plan.isValidWeek(nextWeek) ? nextWeek : week;
            const [draft, setDraft] = useState(() => (base ? JSON.parse(JSON.stringify(base)) : null));
            const [day, setDay] = useState(() => { const d = new Date(); d.setDate(d.getDate() + 1); return Plan.weekdayOf(d); });
            const fileRef = useRef(null);
            const keys = groups.map(([k]) => k);
            if (!draft) return null;
            const slots = draft.days[day] || [];
            const edit = (id, fn) => setDraft(Object.assign({}, draft, { days: Object.assign({}, draft.days, { [day]: slots.map(s => (s.id === id ? fn(s) : s)) }) }));

            const exportPlan = () => downloadBlob(new Blob([JSON.stringify(draft, null, 2)], { type: 'application/json' }), 'ke-hoach-tuan.json');
            const importPlan = async (file) => {
                try {
                    const data = Sec.safeJSONParse(await Sec.readText(file, 512 * 1024), 512 * 1024);
                    if (!Plan.isValidWeek(data)) { toast('File chưa đủ 7 ngày, mỗi ngày 3 ca', 'error'); return; }
                    const w = Plan.normWeek(data);
                    setDraft(w);
                    onSave(w);
                } catch (e) {
                    toast(e.message || 'Không đọc được file', 'error');
                }
            };

            return (
                <div className="text-left mt-4 card p-5 space-y-4">
                    <p className="text-sm text-muted flex items-start gap-2"><Icon name="lock" size={16} className="mt-0.5" /> Khóa plan trong ngày: sửa giờ, nhóm, thêm việc chỉ có hiệu lực từ 00:00 ngày mai. Hôm nay giữ nguyên.</p>
                    <div className="flex flex-wrap gap-1" role="tablist" aria-label="Ngày">
                        {Plan.WEEK.map(k => <button type="button" role="tab" aria-selected={day === k} key={k} onClick={() => setDay(k)} className="tab">{Plan.WEEK_LABEL[k]}</button>)}
                    </div>
                    {slots.map(s => {
                        const p1 = s.phase1_inApp || {};
                        const p2 = s.phase2_externalTask || {};
                        const p3 = s.phase3_verificationGate || {};
                        return (
                            <fieldset key={s.id} className={'border border-line rounded-xl p-3 space-y-2 ' + (s.nghi ? 'bg-surface2' : '')}>
                                <legend className="sr-only">Ca {s.id}</legend>
                                <div className="flex flex-wrap items-center justify-between gap-2">
                                    <span className="text-sm font-semibold">Ca {s.id} · {s.time} · {s.anchorLabel}</span>
                                    <button type="button" aria-pressed={!!s.nghi} onClick={() => edit(s.id, x => Object.assign({}, x, { nghi: !x.nghi }))} className={'btn btn-sm ' + (s.nghi ? 'btn-primary' : 'btn-secondary')}>{s.nghi ? 'Bỏ nghỉ' : 'Nghỉ ca này'}</button>
                                </div>
                                {s.nghi ? <p className="text-sm text-muted">Ca này nghỉ. Không nhắc giờ và không mở thẻ.</p> : (
                                    <div className="space-y-2">
                                        <label className="block"><span className="label">Nhóm học</span>
                                            <select value={Sch.matchGroup(p1.group, keys)} onChange={(e) => edit(s.id, x => Object.assign({}, x, { group: e.target.value, phase1_inApp: Object.assign({}, p1, { group: e.target.value }) }))} className="field">
                                                <option value="all">Tất cả</option>
                                                {groups.filter(([k]) => k !== '__none').map(([k, n]) => <option key={k} value={k}>{k} ({n})</option>)}
                                            </select>
                                        </label>
                                        <div className="grid sm:grid-cols-4 gap-2">
                                            <label><span className="label">Giờ</span><input type="time" value={s.time} onChange={(e) => edit(s.id, x => Object.assign({}, x, { time: e.target.value }))} className="field" /></label>
                                            <label><span className="label">Nhãn</span><input value={s.anchorLabel} maxLength={60} onChange={(e) => edit(s.id, x => Object.assign({}, x, { anchorLabel: e.target.value }))} className="field" /></label>
                                            <label><span className="label">Kiểu học</span>
                                                <select value={p1.mode || 'flashcard'} onChange={(e) => edit(s.id, x => Object.assign({}, x, { phase1_inApp: Object.assign({}, p1, { mode: e.target.value }) }))} className="field">
                                                    {Plan.SLOT_MODES.map(m => <option key={m} value={m}>{Plan.MODE_LABEL[m]}</option>)}
                                                </select>
                                            </label>
                                            <label><span className="label">Số thẻ</span><input type="number" min="1" max="40" value={p1.cardCount || 8} onChange={(e) => edit(s.id, x => Object.assign({}, x, { phase1_inApp: Object.assign({}, p1, { cardCount: Number(e.target.value) || 1 }) }))} className="field" /></label>
                                        </div>
                                        <div className="grid sm:grid-cols-3 gap-2">
                                            <label className="sm:col-span-2"><span className="label">Sách ngoài đời (để trống nếu chỉ học app)</span><input value={p2.bookTitle || ''} maxLength={120} onChange={(e) => edit(s.id, x => Object.assign({}, x, { phase2_externalTask: Object.assign({}, p2, { hasExternal: !!e.target.value.trim(), bookTitle: e.target.value, durationMinutes: p2.durationMinutes || 25 }) }))} className="field" /></label>
                                            <label><span className="label">Phút đọc</span><input type="number" min="5" max="180" value={p2.durationMinutes || 25} onChange={(e) => edit(s.id, x => Object.assign({}, x, { phase2_externalTask: Object.assign({}, p2, { durationMinutes: Number(e.target.value) || 25 }) }))} className="field" /></label>
                                        </div>
                                        <label className="block"><span className="label">Việc cần làm với sách</span><input value={p2.taskDetail || ''} maxLength={300} onChange={(e) => edit(s.id, x => Object.assign({}, x, { phase2_externalTask: Object.assign({}, p2, { taskDetail: e.target.value }) }))} className="field" /></label>
                                        <div className="grid sm:grid-cols-3 gap-2">
                                            <label><span className="label">Cổng kiểm chứng</span>
                                                <select value={p3.gateType || 'sentence_creation'} onChange={(e) => edit(s.id, x => Object.assign({}, x, { phase3_verificationGate: Object.assign({}, p3, { gateType: e.target.value }) }))} className="field">
                                                    <option value="harvest_words">Nhập 2 thuật ngữ mới</option>
                                                    <option value="sentence_creation">Viết câu cho AI chấm</option>
                                                </select>
                                            </label>
                                            <label><span className="label">Số câu</span><input type="number" min="1" max="3" value={p3.sentenceCount || 1} onChange={(e) => edit(s.id, x => Object.assign({}, x, { phase3_verificationGate: Object.assign({}, p3, { sentenceCount: Number(e.target.value) || 1 }) }))} className="field" /></label>
                                            <label><span className="label">Lời nhắc cổng</span><input value={p3.prompt || ''} maxLength={300} onChange={(e) => edit(s.id, x => Object.assign({}, x, { phase3_verificationGate: Object.assign({}, p3, { prompt: e.target.value }) }))} className="field" /></label>
                                        </div>
                                        <label className="block"><span className="label">Ghi chú lớp</span><input value={p2.classSyncNote || ''} maxLength={200} onChange={(e) => edit(s.id, x => Object.assign({}, x, { phase2_externalTask: Object.assign({}, p2, { classSyncNote: e.target.value }) }))} className="field" /></label>
                                    </div>
                                )}
                            </fieldset>
                        );
                    })}
                    <div className="flex flex-wrap gap-2">
                        <button type="button" onClick={() => onSave(draft)} className="btn btn-primary"><Icon name="calendar" /> Lưu cho ngày mai</button>
                        <button type="button" onClick={exportPlan} className="btn btn-secondary"><Icon name="download" /> Xuất JSON</button>
                        <button type="button" onClick={() => fileRef.current && fileRef.current.click()} className="btn btn-secondary"><Icon name="upload" /> Nhập JSON</button>
                        <input ref={fileRef} type="file" accept="application/json,.json" className="hidden" onChange={(e) => { if (e.target.files && e.target.files[0]) importPlan(e.target.files[0]); e.target.value = ''; }} />
                    </div>
                </div>
            );
        };

        /* ---------- Tổng quan (Home Dashboard) ----------
           Mở /app là thấy toàn cảnh: thẻ tâm điểm ca học (đồng hồ + khóa lịch + 2 lựa chọn), 3 bước cho người mới,
           4 lối vào các trụ cột. Màn lật thẻ chỉ mở khi người dùng bấm bắt đầu, và luôn có nút về Tổng quan. */
        const greetOf = (d) => { const h = d.getHours(); return h < 11 ? 'Chào buổi sáng' : h < 14 ? 'Chào buổi trưa' : h < 18 ? 'Chào buổi chiều' : 'Chào buổi tối'; };

        /* Nguồn câu hỏi cho ca học và câu khởi động: Sổ từ của bạn, Kho đề EOS (đề hệ thống) hoặc trộn cả 2. */
        const SLOT_SOURCES = [
            { key: 'vocab', label: 'Sổ từ', icon: 'book' },
            { key: 'eos', label: 'Kho đề EOS', icon: 'monitor' },
            { key: 'mix', label: 'Cả 2', icon: 'shuffle' }
        ];
        const readSource = () => { const v = Store.prefs.get('slotSource', 'mix'); return SLOT_SOURCES.some(s => s.key === v) ? v : 'mix'; };
        const SourcePicker = ({ value, onChange, bankCount, dark }) => (
            <div className={'src-pick' + (dark ? ' is-dark' : '')} role="radiogroup" aria-label="Nguồn câu hỏi">
                {SLOT_SOURCES.map(s => {
                    const off = s.key === 'eos' && !bankCount;
                    return (
                        <button key={s.key} type="button" role="radio" aria-checked={value === s.key} disabled={off} title={off ? 'Kho đề EOS chưa tải xong' : undefined}
                            onClick={() => onChange(s.key)} className={'src-opt' + (value === s.key ? ' is-on' : '')}>
                            <Icon name={s.icon} size={14} /> {s.label}
                        </button>
                    );
                })}
            </div>
        );

        /* Câu khởi động khi đến giờ ca (tâm lý học dòng chảy: 1 câu dễ để vào guồng, rồi mới vào ca).
           Hiện tự động, không mở cả màn học. Trả lời xong mới chọn học đủ ca hay Chạm đáy. */
        const FlowKick = ({ slot, kind, warm, source, bankCount, onSource, onAnswer, onStart, onLater, cardCount }) => {
            const [picked, setPicked] = useState(null);
            const [shown, setShown] = useState(false);
            useEffect(() => { setPicked(null); setShown(false); }, [warm && warm.item.id]);
            const t = warm ? warm.item : null;
            const isMcq = !!(t && t.type === 'mcq');
            const answered = picked != null;
            const right = isMcq ? picked === t.answerOrMeaning : picked === 'ok';
            const choose = (val) => { if (answered) return; setPicked(val); onAnswer(warm, isMcq ? val === t.answerOrMeaning : val === 'ok'); };
            const late = kind === 'LATE_RECOVERY';
            return (
                <Modal title={'Đến giờ ca ' + slot.id + ' · ' + slot.anchorLabel} onClose={onLater} badge={late ? 'Trễ giờ' : 'Câu khởi động'}>
                    <p className="text-sm leading-6 text-ink2">Trả lời 1 câu để vào guồng. Đầu đã chạy rồi thì học tiếp cả ca dễ hơn nhiều.</p>
                    <div className="mt-3"><SourcePicker value={source} onChange={onSource} bankCount={bankCount} /></div>
                    {!t ? (
                        <p className="mt-4 rounded-2xl bg-surface2 p-4 text-sm text-ink2">Nguồn này chưa có câu nào. Đổi nguồn khác, hoặc thêm vài thẻ vào Sổ từ.</p>
                    ) : (
                        <div className="mt-4 rounded-2xl border border-line p-4">
                            <p className="text-[11px] font-semibold uppercase tracking-[0.12em] text-muted">{warm.bank ? 'Kho đề EOS · ' + warm.bank.code : 'Sổ từ · ' + Sch.groupLabel(t.group)}</p>
                            <p className="mt-1.5 text-base font-semibold leading-7 text-ink text-flow">{t.questionOrWord}</p>
                            {isMcq ? (
                                <div className="mt-3 grid gap-2">
                                    {t.options.map((o, i) => {
                                        if (!o) return null;
                                        const letter = 'ABCDEF'[i];
                                        const good = answered && letter === t.answerOrMeaning;
                                        const bad = answered && letter === picked && !good;
                                        return (
                                            <button key={letter} type="button" disabled={answered} onClick={() => choose(letter)}
                                                className={'warm-opt' + (good ? ' is-good' : '') + (bad ? ' is-bad' : '')}>
                                                <b className="shrink-0">{letter}.</b> <span className="text-flow">{o}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            ) : !shown ? (
                                <button type="button" className="btn btn-secondary mt-3" onClick={() => setShown(true)}><Icon name="eye" size={15} /> Hiện nghĩa</button>
                            ) : (
                                <>
                                    <p className="mt-3 rounded-xl bg-surface2 px-3 py-2 text-sm text-ink text-flow">{t.answerOrMeaning}</p>
                                    {!answered && (
                                        <div className="mt-3 flex gap-2">
                                            <button type="button" className="btn btn-danger btn-sm" onClick={() => choose('no')}>Quên</button>
                                            <button type="button" className="btn btn-success btn-sm" onClick={() => choose('ok')}>Đã nhớ</button>
                                        </div>
                                    )}
                                </>
                            )}
                            {answered && <p className={'mt-3 text-sm font-semibold ' + (right ? 'text-success' : 'text-warn')}>{right ? 'Chuẩn! Đang vào guồng rồi, đi tiếp luôn.' : (warm.bank ? 'Câu này đã vào Sổ từ để ôn lại. Vào ca gỡ điểm nhé.' : 'Không sao, ca này sẽ nhắc lại.')}</p>}
                        </div>
                    )}
                    <div className="mt-4 flex flex-wrap gap-2">
                        <button type="button" className="btn btn-primary" onClick={() => onStart(false)}><Icon name="play" size={15} /> {answered ? 'Học tiếp ca ' + slot.id : 'Vào ca ' + slot.id}{cardCount ? ' · ' + cardCount + ' thẻ' : ''}</button>
                        <button type="button" className="btn btn-secondary" onClick={() => onStart(true)}><Icon name="zap" size={15} /> Chạm đáy 30s · 2 thẻ</button>
                        <button type="button" className="btn btn-ghost" onClick={onLater}>Để sau</button>
                    </div>
                </Modal>
            );
        };

        /* Chọn hoặc tự đặt bản sắc (Atomic Habits: mỗi ca học là một phiếu bầu cho con người bạn muốn trở thành). */
        const IdentityPicker = ({ onClose }) => {
            const label = useIdentity();
            const obsidian = obsidianOf(useFund());
            const preset = IDENTITIES.some(o => o.name === label);
            const [custom, setCustom] = useState(preset ? '' : label);
            const choose = (option, locked) => pickIdentity(option, locked, onClose);
            const saveCustom = (e) => {
                e.preventDefault();
                if (!custom.trim()) return;
                saveIdentity(custom);
                onClose();
            };
            return (
                <Modal title="Bản sắc học tập" onClose={onClose}>
                    <p className="text-sm leading-6 text-ink2">Đừng đặt mục tiêu, hãy chọn con người bạn muốn trở thành. Mỗi ca học xong là <b className="text-ink">một phiếu bầu</b> cho bản sắc đó.</p>
                    <div className="mt-4"><IdentityMenu current={label} obsidian={obsidian} dark={false} onChoose={choose} /></div>
                    <form onSubmit={saveCustom} className="mt-4">
                        <label htmlFor="identity-custom" className="text-xs font-semibold text-ink2">Hoặc tự đặt</label>
                        <div className="mt-1 flex gap-2">
                            <input id="identity-custom" value={custom} maxLength={48} onChange={(e) => setCustom(e.target.value)} className="field min-w-0 flex-1" placeholder="VD: Người nói tiếng Anh tự tin" />
                            <button type="submit" className="btn btn-primary shrink-0" disabled={!custom.trim()}>Lưu</button>
                        </div>
                    </form>
                    {label && <button type="button" className="mt-4 text-sm font-medium text-muted underline-offset-2 hover:underline" onClick={() => { saveIdentity(''); onClose(); }}>Bỏ bản sắc</button>}
                </Modal>
            );
        };

        /* Lời chào đầu trang: có bản sắc thì chào bằng bản sắc, chưa có thì mời chọn ngay cạnh tên. */
        const IdentityGreeting = ({ greet, name }) => {
            const label = useIdentity();
            const [open, setOpen] = useState(false);
            return (
                <div className="flex flex-wrap items-center gap-x-2 gap-y-1.5">
                    <h1 className="min-w-0 text-2xl font-extrabold tracking-tight text-ink sm:text-3xl">
                        {greet}{label ? ', ' : (name ? ', ' + name : '')}{label && <span className="text-primary">{label}</span>}
                        {label && <button type="button" onClick={() => setOpen(true)} className="id-edit" aria-label="Đổi bản sắc học tập" title="Đổi bản sắc"><Icon name="pen" size={16} /></button>}
                    </h1>
                    {!label && <button type="button" onClick={() => setOpen(true)} className="id-invite"><Icon name="plus" size={14} /> Chọn bản sắc học tập</button>}
                    {open && <IdentityPicker onClose={() => setOpen(false)} />}
                </div>
            );
        };

        /* Thanh chỉ số trên thẻ tâm điểm: phiếu bản sắc · chuỗi ngày · ca hôm nay. Phiếu mới bầu thì pill nảy "+1". */
        const HeroStats = ({ done, total }) => {
            const summary = useVoteSummary();
            const [bump, setBump] = useState(false);
            useEffect(() => {
                if (!summary) return undefined;
                let pending = false;
                try { pending = sessionStorage.getItem('edu.voteBump') === '1'; sessionStorage.removeItem('edu.voteBump'); } catch (e) {}
                if (!pending) return undefined;
                setBump(true);
                const id = setTimeout(() => setBump(false), 1800);
                return () => clearTimeout(id);
            }, [summary && summary.total]);
            const votes = summary ? summary.total : 0;
            const streak = summary ? summary.streak : 0;
            const voted = !!(summary && summary.confirmedToday);
            return (
                <ul className="flex flex-wrap items-center gap-1.5" aria-label="Chỉ số hôm nay">
                    <li className={'stat-pill is-vote' + (voted ? ' is-on' : '') + (bump ? ' is-bump' : '')} title="Phiếu bầu bản sắc đã tích lũy" aria-live="polite">
                        <Icon name="check" size={14} /><b className="tnum">{votes}</b> phiếu bản sắc
                        {bump && <span className="vote-plus" aria-hidden="true">+1</span>}
                    </li>
                    <li className={'stat-pill is-streak' + (streak > 0 ? ' is-on' : '')} title="Chuỗi ngày học liên tiếp">
                        <Icon name="flame" size={14} /><b className="tnum">{streak}</b> ngày
                    </li>
                    <li className={'stat-pill is-slot' + (total && done >= total ? ' is-on' : '')} title="Ca học hôm nay">
                        <Icon name="clock" size={14} />Ca <b className="tnum">{done}/{total}</b>
                    </li>
                </ul>
            );
        };

        const SlotPath = ({ slots, activeId }) => (
            <ol className="slot-path" aria-label="Các ca hôm nay">
                {slots.map(s => {
                    const done = s.status === 'done';
                    const now = !done && !s.nghi && s.id === activeId;
                    return (
                        <li key={s.id} className={'slot-node' + (done ? ' is-done' : '') + (now ? ' is-now' : '') + (s.nghi ? ' is-off' : '')} aria-current={now ? 'step' : undefined}>
                            <span className="slot-dot">{done ? <Icon name="check" size={16} stroke={3} /> : s.nghi ? <Icon name="x" size={14} /> : s.id}</span>
                            <span className="slot-time tnum">{s.nghi ? 'Nghỉ' : Plan.hhmmOf(Plan.triggerMin(s))}</span>
                            <span className="slot-name">{s.anchorLabel}{done ? ' · xong' : ''}</span>
                        </li>
                    );
                })}
            </ol>
        );

        const FocusCard = ({ plan, cur, now, cardCount, onStart, onStudyNow, onSnooze, onBonus, onReceipt, onGate }) => {
            const slot = cur.slot;
            const nowD = new Date(now);
            const msUntil = (s) => { const d = new Date(nowD); d.setHours(0, 0, 0, 0); return Math.max(0, d.getTime() + Plan.triggerMin(s) * 60000 - nowD.getTime()); };
            const live = cur.kind === 'ON_TIME_ACTIVE' || cur.kind === 'LATE_RECOVERY';
            const late = cur.kind === 'LATE_RECOVERY';
            const firstSlot = plan.slots.find(s => !s.nghi);
            let label = '';
            let big = '';
            if (cur.kind === 'ALL_DONE') {
                label = 'Hôm nay đã xong cả ' + plan.slots.filter(s => !s.nghi).length + ' ca';
                big = 'Hoàn thành';
            } else if (cur.kind === 'GATE') {
                label = 'Ca ' + slot.id + ' · ' + slot.anchorLabel + ' · bước đọc sách cuối ca';
                big = 'Pha 2';
            } else if (live) {
                label = 'Ca ' + slot.id + ' · ' + slot.anchorLabel;
            } else if (slot) {
                label = 'Ca ' + slot.id + ' · ' + slot.anchorLabel + ' bắt đầu sau';
                big = Plan.fmtCountdown(msUntil(slot));
            }
            const full = slot ? Plan.cardLimit(slot, live ? cur.kind : 'ON_TIME_ACTIVE', false) : 0;
            const lean = slot ? Math.min(2, slot.baseCardCount || 8) : 2;
            const quick = Math.min(8, Math.max(cardCount, 1));
            const resume = live && slot.deckIds && slot.deckIds.length && !slot.cardsDone;
            /* Đang trong ca: tiêu đề chữ (không dùng font đồng hồ), kèm thời gian còn lại hoặc đã trễ bao lâu. */
            const startMin = slot ? Plan.triggerMin(slot) : 0;
            const nowMin = nowD.getHours() * 60 + nowD.getMinutes();
            const lateBy = Math.max(0, nowMin - startMin);
            const lateText = lateBy >= 60 ? Math.floor(lateBy / 60) + ' giờ' + (lateBy % 60 ? ' ' + (lateBy % 60) + ' phút' : '') : lateBy + ' phút';
            const onTimeLeft = live && !late ? Math.max(0, (startMin + 30) * 60000 - (nowD.getTime() - new Date(nowD).setHours(0, 0, 0, 0))) : 0;
            return (
                <section className="cmd-card p-5 text-left sm:p-7" aria-label="Ca học hôm nay">
                    <div className="relative z-10">
                        <div className="flex flex-wrap items-center gap-2">
                            <span className="cmd-pill bg-white/15 text-white"><Icon name="lock" size={13} /> Lịch hôm nay đã khóa</span>
                            <span className="text-xs text-indigo-200">Sửa lịch chỉ áp dụng từ 00:00 ngày mai</span>
                        </div>
                        <p className="mt-5 flex flex-wrap items-center gap-2 text-sm font-semibold text-indigo-100">
                            {live && <span className="h-2.5 w-2.5 shrink-0 rounded-full bg-[#F87171] pulse-rec" aria-hidden="true" />}
                            {label}
                            {live && <span className={'cmd-pill ' + (late ? 'bg-amber-300/20 text-amber-100' : 'bg-emerald-300/20 text-emerald-100')}>{late ? 'Trễ ' + lateText : 'Đúng giờ'}</span>}
                        </p>
                        {live ? (
                            <>
                                <h2 className="mt-2 text-3xl font-extrabold leading-tight tracking-tight sm:text-4xl">{late ? 'Vẫn kịp gỡ ca này' : 'Đến giờ học rồi'}</h2>
                                <p className="mt-2 text-sm leading-6 text-indigo-100">
                                    {late
                                        ? 'Ca bắt đầu lúc ' + Plan.hhmmOf(startMin) + '. Học bù bản rút gọn ' + full + ' thẻ là xong ca.'
                                        : <>Còn <b className="tnum font-semibold text-white">{Plan.fmtCountdown(onTimeLeft)}</b> trong khung đúng giờ · {full} thẻ</>}
                                </p>
                            </>
                        ) : (
                            <p className="tnum mt-1 text-5xl font-semibold tracking-tight sm:text-6xl" role="timer" aria-live="off">{big}</p>
                        )}
                        {cur.kind === 'ALL_DONE' && firstSlot && <p className="mt-1 text-sm text-indigo-100">Ca đầu tiên ngày mai lúc {firstSlot.time}. Không nợ thẻ sang mai.</p>}
                        <div className="mt-6"><SlotPath slots={plan.slots} activeId={slot && slot.id} /></div>

                        <div className="mt-6 flex flex-col gap-2 sm:flex-row sm:flex-wrap sm:items-center">
                            {live && (
                                <>
                                    <button type="button" className="cmd-go" onClick={() => onStart(false)}><Icon name="play" size={18} /> {resume ? 'Học tiếp' : 'Học đủ'} ca {slot.id} · {full} thẻ</button>
                                    <button type="button" className="cmd-alt" onClick={() => onStart(true)}><Icon name="zap" size={17} /> Chạm đáy 30s · {lean} thẻ</button>
                                </>
                            )}
                            {cur.kind === 'GATE' && <button type="button" className="cmd-go" onClick={onGate}><Icon name="book" size={18} /> Tiếp tục pha 2</button>}
                            {cur.kind === 'ALL_DONE' && (
                                <>
                                    <button type="button" className="cmd-go" onClick={onBonus} disabled={!cardCount}><Icon name="plus" size={18} /> Còn hứng? Thêm 5 thẻ</button>
                                    <button type="button" className="cmd-alt" onClick={onReceipt}><Icon name="copy" size={16} /> Copy phiếu hoàn thành</button>
                                </>
                            )}
                            {!live && slot && cur.kind !== 'GATE' && cur.kind !== 'ALL_DONE' && (
                                <button type="button" className="cmd-go" onClick={onStudyNow} disabled={!cardCount}>
                                    <Icon name="play" size={18} /> {!cardCount ? 'Kho chưa có thẻ' : cur.early ? 'Vào sớm ca ' + slot.id + ' · ' + full + ' thẻ' : 'Học ngay ' + quick + ' thẻ'}
                                </button>
                            )}
                            {cur.kind === 'ON_TIME_ACTIVE' && !slot.snoozedOnce && <button type="button" className="cmd-link" onClick={() => onSnooze(slot.id)}><Icon name="clock" size={15} /> Đang dở tay? Lùi 15 phút</button>}
                        </div>
                        <p className="mt-3 text-xs leading-5 text-indigo-200">
                            {live ? 'Bận quá thì bấm Chạm đáy: ' + lean + ' thẻ trong 30 giây vẫn tính là giữ chuỗi hôm nay.'
                                : cur.kind === 'ALL_DONE' ? 'Điểm dừng rõ ràng. Mai app sẽ gõ chuông đúng giờ.'
                                    : cur.kind === 'GATE' ? 'Đọc xong phần sách của ca rồi quay lại kiểm tra nhanh.'
                                        : 'Đến giờ, app gõ chuông và nháy tiêu đề tab để nhắc. Có thể treo tab cả ngày.'}
                        </p>
                    </div>
                </section>
            );
        };

        /* 3 bước cho người mới: học thử, thi thử EOS, đăng nhập lưu tiến độ. Ẩn được, tự ẩn khi xong cả 3. */
        const StarterSteps = ({ studied, triedEos, account, onStudy, onEos, onLogin, onHide }) => {
            const steps = [
                { done: studied, title: 'Học thử 8 thẻ mẫu', desc: 'Lật thẻ, chấm Nhớ / Quên. Mất khoảng 1 phút.', cta: 'Học thử', run: onStudy, icon: 'layers' },
                { done: triedEos, title: 'Thi thử EOS 10 câu', desc: 'Giao diện như phòng thi thật, miễn phí, không cần đăng nhập.', cta: 'Vào phòng thi', run: onEos, icon: 'monitor' },
                { done: !!account, title: 'Đăng nhập Google', desc: 'Lưu kho từ, chuỗi ngày học và đặt giờ 3 ca của riêng bạn.', cta: 'Đăng nhập', run: onLogin, icon: 'shield' }
            ];
            const n = steps.filter(s => s.done).length;
            return (
                <section className="card h-full p-5" aria-label="Bắt đầu với FPass">
                    <div className="flex items-start justify-between gap-3">
                        <div>
                            <p className="text-xs font-semibold uppercase tracking-[0.14em] text-primary">Lần đầu dùng FPass?</p>
                            <h2 className="mt-1 text-lg font-bold text-ink">Bắt đầu trong 3 bước</h2>
                        </div>
                        <button type="button" className="btn btn-ghost btn-sm -mr-2 text-muted" onClick={onHide}>Ẩn</button>
                    </div>
                    <div className="mt-3 flex items-center gap-3" aria-label={'Đã xong ' + n + ' trên 3 bước'}>
                        <div className="h-2 flex-1 overflow-hidden rounded-full bg-surface2"><div className="h-full rounded-full bg-primary transition-all" style={{ width: (n / 3 * 100) + '%' }} /></div>
                        <span className="tnum text-xs font-semibold text-ink2">{n}/3</span>
                    </div>
                    <ol className="mt-4 space-y-2">
                        {steps.map((s, i) => (
                            <li key={i} className={'flex flex-wrap items-center gap-3 rounded-2xl border p-3 ' + (s.done ? 'border-green-200 bg-success-soft' : 'border-line bg-surface')}>
                                <span className={'flex h-9 w-9 shrink-0 items-center justify-center rounded-xl ' + (s.done ? 'bg-success text-white' : 'bg-primary-soft text-primary')}>
                                    <Icon name={s.done ? 'check' : s.icon} size={17} stroke={s.done ? 3 : 2} />
                                </span>
                                <span className="min-w-[55%] flex-1">
                                    <span className={'block text-sm font-semibold ' + (s.done ? 'text-success' : 'text-ink')}>{s.title}</span>
                                    <span className="block text-xs leading-5 text-ink2">{s.desc}</span>
                                </span>
                                {!s.done && <button type="button" className="btn btn-secondary btn-sm ml-12 shrink-0 min-[440px]:ml-0" onClick={s.run}>{s.cta}</button>}
                            </li>
                        ))}
                    </ol>
                </section>
            );
        };

        const TodayStats = ({ plan, items, queued }) => {
            const active = plan.slots.filter(s => !s.nghi);
            const done = active.filter(s => s.status === 'done').length;
            const cards = plan.slots.reduce((a, s) => a + (s.cardsDone || 0), 0);
            const filled = items.filter(Sch.isFilled).length;
            const weak = items.filter(t => Sch.isFilled(t) && Sch.isWeak(t)).length;
            const box = (value, text, tone) => (
                <div className={'rounded-2xl p-4 ' + tone}>
                    <p className="tnum text-3xl font-bold leading-none">{value}</p>
                    <p className="mt-2 text-xs font-medium text-ink2">{text}</p>
                </div>
            );
            return (
                <section className="card h-full p-5" aria-label="Số liệu hôm nay">
                    <p className="text-xs font-semibold uppercase tracking-[0.14em] text-muted">Hôm nay</p>
                    <div className="mt-3 grid grid-cols-2 gap-3">
                        {box(done + '/' + active.length, 'ca đã hoàn thành', 'bg-primary-soft text-primary')}
                        {box(cards, 'lượt thẻ đã học', 'bg-success-soft text-success')}
                        {box(filled, 'thẻ trong sổ từ', 'bg-surface2 text-ink')}
                        {box(queued + weak, 'câu sai / từ yếu chờ ôn', 'bg-warn-soft text-warn')}
                    </div>
                </section>
            );
        };

        const PILLARS = [
            { key: 'eos', short: 'Bấm giờ · song ngữ · keyword', icon: 'monitor', tone: 'bg-indigo-100 text-indigo-700', go: 'text-indigo-700', title: 'Phòng thi giả lập EOS', desc: 'Bấm giờ, nộp bài như thật. Dịch song ngữ và gợi ý keyword ngay trên câu hỏi.', tag: 'Thi thử 10 câu miễn phí', cta: 'Vào phòng thi' },
            { key: 'vocab', short: 'Lọc từ · IPA · Excel', icon: 'sparkles', tone: 'bg-emerald-100 text-emerald-700', go: 'text-emerald-700', title: 'Sổ từ & AI quét bài đọc', desc: 'Dán bài đọc, AI lọc từ mới kèm phát âm IPA. Nhập / xuất Excel.', tag: 'Tự tạo thẻ', cta: 'Mở sổ từ' },
            { key: 'bank', short: 'Đề theo môn · lý thuyết', icon: 'layers', tone: 'bg-amber-100 text-amber-700', go: 'text-amber-700', title: 'Kho đề & lý thuyết theo môn', desc: 'Đề bám sát cấu trúc từng môn FPT, chia chặng, câu sai tự vào thẻ ôn.', tag: 'Lý thuyết: đang biên soạn', cta: 'Xem kho đề' },
            { key: 'video', short: 'Xem cách dùng app', icon: 'play', tone: 'bg-rose-100 text-rose-700', go: 'text-rose-700', title: 'Video hướng dẫn', desc: 'Vài phút để biết hết cách dùng: lịch 3 ca, phòng thi, sổ từ AI.', tag: 'Xem lúc nào cũng được', cta: 'Xem video' }
        ];

        const PillarGrid = ({ onOpen }) => (
            <div>
                <div className="grid grid-cols-2 gap-3">
                    {PILLARS.map(p => (
                        <button key={p.key} type="button" className="pillar" onClick={() => onOpen(p.key)}>
                            <span className="flex w-full items-center justify-between gap-2">
                                <span className={'pillar-ic ' + p.tone}><Icon name={p.icon} size={22} /></span>
                                <span className="hidden rounded-full bg-surface2 px-2.5 py-1 text-[11px] font-semibold text-ink2 sm:inline">{p.tag}</span>
                            </span>
                            <span>
                                <span className="block text-[15px] font-bold leading-snug text-ink sm:text-base">{p.title}</span>
                                <span className="mt-1 hidden text-sm leading-6 text-ink2 sm:block">{p.desc}</span>
                                <span className="mt-1 block text-xs leading-5 text-ink2 sm:hidden">{p.short}</span>
                            </span>
                            <span className={'pillar-go ' + p.go}>{p.cta} <Icon name="arrow" size={15} /></span>
                        </button>
                    ))}
                </div>
            </div>
        );

        const ScheduleCard = ({ plan, cur, week, nextWeek, groups, saveWeek, toast, askNotify, onSetup, account, setupDone, editOpen, setEditOpen, editRef, source, onSource, bankCount }) => {
            const slot = cur.slot;
            const p2 = (slot && slot.phase2_externalTask) || {};
            const perm = window.Notification ? Notification.permission : 'denied';
            return (
                <section className="card p-4 scroll-mt-24 sm:p-5" aria-label="Lịch tuần" ref={editRef}>
                    <p className="text-xs font-semibold uppercase tracking-[0.14em] text-muted">Lịch học</p>
                    <div className="my-2 grid grid-cols-7 gap-1 text-center text-xs" aria-label="Ngày trong tuần">
                        {Plan.WEEK.map(k => (
                            <span key={k} aria-current={k === plan.dayKey ? 'date' : undefined} className={'rounded-full py-1 ' + (k === plan.dayKey ? 'bg-ink font-semibold text-white' : 'text-muted')}>
                                {String(Plan.WEEK_LABEL[k] || '').replace('Thứ ', 'T').replace('Chủ nhật', 'CN')}
                            </span>
                        ))}
                    </div>
                    {slot && cur.kind !== 'ALL_DONE' && (
                        <div className="rounded-2xl bg-surface2 px-4 py-3">
                            <p className="text-xs font-semibold text-muted">Ca {slot.id} · {Plan.MODE_LABEL[slot.mode]} · {slot.baseCardCount} thẻ</p>
                            <p className="mt-0.5 font-semibold text-ink">{Plan.hhmmOf(Plan.triggerMin(slot))} · {slot.anchorLabel} · {Sch.groupLabel(slot.group)}</p>
                            <p className="mt-0.5 text-sm text-ink2 text-flow">{p2.hasExternal ? (p2.bookTitle + ' — ' + p2.taskDetail) : (p2.classSyncNote || 'Ca này chỉ học trên app')}</p>
                        </div>
                    )}
                    <div className="mt-3">
                        <p className="mb-1.5 text-xs font-semibold text-ink2">Câu hỏi trong ca lấy từ</p>
                        <SourcePicker value={source} onChange={onSource} bankCount={bankCount} />
                    </div>
                    {plan.slots.some(s => s.dienTam) && <p className="mt-3 text-sm text-warn text-flow">Một vài phần sách hôm nay đang là buổi ôn tạm. Sửa lịch ngày mai nếu khác.</p>}
                    <div className="mt-4 flex flex-wrap gap-2">
                        {!setupDone && <button type="button" className="btn btn-primary btn-sm" onClick={onSetup}><Icon name="calendar" size={14} /> {account ? 'Đặt giờ 3 ca của bạn' : 'Đăng nhập để đặt giờ riêng'}</button>}
                        <button type="button" onClick={() => setEditOpen(v => !v)} aria-expanded={editOpen} className="btn btn-secondary btn-sm"><Icon name="pen" size={14} /> Sửa lịch tuần</button>
                        {perm === 'default' && <button type="button" onClick={askNotify} className="btn btn-ghost btn-sm"><Icon name="bell" size={14} /> Bật nhắc khi đến giờ</button>}
                    </div>
                    {!account && <p className="mt-3 text-xs text-muted">Đang dùng lịch mẫu 3 ca. Đăng nhập Google để đặt giờ riêng và giữ lịch trên mọi máy.</p>}
                    {editOpen && <div className="mt-4"><PlanEditor week={week} nextWeek={nextWeek} groups={groups} onSave={saveWeek} toast={toast} /></div>}
                </section>
            );
        };

        const TodayView = (p) => {
            const { plan, planReady, week, nextWeek, now, items, itemsById, groups, session, cur, saveWeek, addItems, finishGate, snooze, askNotify, bonus, closeSession, startSession, review, patch, toast, finishSlot, onBurst, onStudyNow, onStart, onPillar, onLogin, onSetup, account, setupDone, source, onSource, bankCount } = p;
            const [editOpen, setEditOpen] = useState(() => takeGo('plan'));
            const [starterHidden, setStarterHidden] = useState(() => !!Store.prefs.get('starterHidden', false));
            const editRef = useRef(null);
            useEffect(() => { if (editOpen && editRef.current) editRef.current.scrollIntoView({ block: 'start', behavior: 'smooth' }); }, [planReady, editOpen]);
            if (!planReady || !plan) return <p className="text-center text-muted py-16">Đang mở ngày hôm nay…</p>;
            const slot = cur.slot;
            const filled = items.filter(Sch.isFilled).length;

            /* Ca lấy câu từ Kho đề EOS: các câu đó không nằm trong Sổ từ, đi kèm phiên trong session.extra. */
            const extra = session && Array.isArray(session.extra) && session.extra.length ? session.extra : null;
            const renderSession = () => {
                if (session.mode === 'burst') {
                    const byIdAll = extra ? new Map(Array.from(itemsById.entries()).concat(extra.map(t => [t.id, t]))) : itemsById;
                    return (
                        <BurstSession key={session.id} itemsById={byIdAll} ids={session.ids} title={session.title} subtitle={session.slotId ? 'Pha 1 · Băng đạn 5 câu' : 'Băng đạn 5 câu'} sessionId={session.id} voteType={session.voteType} slotId={session.slotId}
                            onReview={(id, ok) => review(id, ok)} toast={toast}
                            onFinish={(st) => { if (session.slotId) finishSlot({ slotId: session.slotId, cardsDone: st.total, remembered: st.firstTryCorrect }); }}
                            renderDone={session.slotId ? () => null : undefined} onExit={session.slotId ? undefined : closeSession} />
                    );
                }
                return <FlashSession key={session.id} items={extra ? items.concat(extra) : items} session={session} onReview={review} onPatch={patch} onFinish={finishSlot} onClose={closeSession} onRestart={startSession} toast={toast} />;
            };

            /* Màn học: chỉ mở khi người dùng bấm bắt đầu. Luôn có nút về Tổng quan; ca đang dở thì quay lại học tiếp được. */
            const studying = session && session.mode !== 'eos' && ((session.slotId && slot && session.slotId === slot.id && cur.kind !== 'GATE') || session.home);
            if (studying) {
                const inSlot = !!session.slotId;
                return (
                    <div className="max-w-3xl mx-auto">
                        <div className="mb-4 flex flex-wrap items-center gap-2 rounded-2xl bg-[#312E81] px-2 py-2 text-sm text-white shadow-sm sm:px-3" role="status">
                            <button type="button" onClick={closeSession} className="inline-flex min-h-[40px] items-center gap-1.5 rounded-xl bg-white/15 px-3 font-semibold hover:bg-white/25"><Icon name="back" size={15} /> Tổng quan</button>
                            {inSlot && <span className="ml-1 h-2.5 w-2.5 rounded-full bg-[#F87171] pulse-rec" aria-hidden="true" />}
                            <b className="min-w-0 truncate">{inSlot ? 'Ca ' + slot.id + ' · ' + slot.anchorLabel + (session.lean ? ' · Chạm đáy' : '') : session.title}</b>
                            {inSlot && <span className="ml-auto hidden items-center gap-1.5 pr-2 text-indigo-200 sm:inline-flex"><Icon name="lock" size={13} /> Lịch hôm nay đã khóa</span>}
                        </div>
                        {inSlot && (
                            <div className="flex flex-wrap items-center justify-center gap-2 mb-4">
                                <span className="chip bg-surface2 text-ink2">Pha 1 · {session.ids.length} thẻ · {Sch.groupLabel(slot.group)}</span>
                                {cur.kind === 'LATE_RECOVERY' && <span className="chip bg-warn-soft text-warn"><Icon name="alert" size={12} /> Trễ giờ · rút gọn còn {session.ids.length} thẻ</span>}
                                {!session.lean && session.ids.length > 2 && <button type="button" onClick={() => onStart(true)} className="btn btn-ghost btn-sm"><Icon name="zap" size={14} /> Chạm đáy: chỉ 2 thẻ</button>}
                            </div>
                        )}
                        {renderSession()}
                    </div>
                );
            }

            const receipt = () => {
                const total = plan.slots.reduce((a, s) => a + (s.cardsDone || 0), 0);
                const kept = plan.slots.reduce((a, s) => a + (s.remembered || 0), 0);
                const text = [
                    'Phiếu hoàn thành ' + plan.date + ' · ' + (Plan.WEEK_LABEL[plan.dayKey] || ''),
                    ...plan.slots.map(s => {
                        if (s.nghi) return s.id + '. Nghỉ · ' + s.anchorLabel;
                        const at = s.finishedAt ? new Date(s.finishedAt) : null;
                        const hhmm = at ? Plan.hhmmOf(at.getHours() * 60 + at.getMinutes()) : s.time;
                        const book = s.phase2_externalTask && s.phase2_externalTask.hasExternal ? ' · ' + s.phase2_externalTask.bookTitle : '';
                        return s.id + '. ' + hhmm + ' · ' + s.anchorLabel + ' · ' + (Plan.MODE_LABEL[s.mode] || s.mode) + ' · ' + Sch.groupLabel(s.group) + ' · ' + (s.cardsDone || 0) + ' thẻ' + book;
                    }),
                    'Tổng: ' + total + ' lượt thẻ, ' + kept + ' câu/từ đã nạp vào não'
                ].join('\n');
                copyText(text).then(() => toast('Đã copy phiếu hoàn thành', 'success')).catch(() => toast('Trình duyệt chặn clipboard', 'error'));
            };
            const studied = items.some(t => (t.reviewCount || 0) > 0) || plan.slots.some(s => s.cardsDone > 0);
            const triedEos = !!Store.prefs.get('eosTried', false);
            const showStarter = !starterHidden && !(studied && triedEos && account);
            const hideStarter = () => { Store.prefs.set('starterHidden', true); setStarterHidden(true); };
            const active = plan.slots.filter(s => !s.nghi);
            const doneCount = active.filter(s => s.status === 'done').length;
            const dateText = new Date(now).toLocaleDateString('vi-VN', { weekday: 'long', day: '2-digit', month: '2-digit' });
            const name = account && account.name ? String(account.name).split(' ').slice(-1)[0] : '';

            return (
                <div className="mx-auto max-w-6xl">
                    <div className="mb-4 flex flex-wrap items-end justify-between gap-2">
                        <div>
                            <p className="text-sm font-medium capitalize text-muted">{dateText}</p>
                            <div className="mt-0.5"><IdentityGreeting greet={greetOf(new Date(now))} name={name} /></div>
                        </div>
                        <HeroStats done={doneCount} total={active.length} />
                    </div>
                    {/* Màn đầu (above the fold): ca học bên trái, Bản sắc + Lịch học bên phải. */}
                    <div className="grid gap-4 lg:grid-cols-12">
                        <div className="lg:col-span-7 [&>section]:h-full">
                            <FocusCard plan={plan} cur={cur} now={now} cardCount={filled} onStart={onStart} onStudyNow={onStudyNow} onSnooze={snooze} onBonus={bonus} onReceipt={receipt}
                                onGate={() => { const el = document.getElementById('flow-bridge'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }} />
                        </div>
                        <div className="flex flex-col gap-4 lg:col-span-5">
                            <IdentityToday canBurst={filled >= 5} onBurst={onBurst} />
                            <ScheduleCard plan={plan} cur={cur} week={week} nextWeek={nextWeek} groups={groups} saveWeek={saveWeek} toast={toast} askNotify={askNotify}
                                onSetup={onSetup} account={account} setupDone={setupDone} editOpen={editOpen} setEditOpen={setEditOpen} editRef={editRef}
                                source={source} onSource={onSource} bankCount={bankCount} />
                        </div>
                    </div>
                    {cur.kind === 'GATE' && slot && (
                        <div id="flow-bridge" className="mx-auto mt-6 max-w-xl scroll-mt-24">
                            <FlowBridge slot={slot} items={items} addItems={addItems} finishGate={finishGate} toast={toast} now={now} />
                        </div>
                    )}
                    <section aria-labelledby="pillars-title" className="mt-8">
                        <h2 id="pillars-title" className="mb-3 text-lg font-bold text-ink sm:text-xl">Mọi thứ để qua môn, ở một chỗ</h2>
                        <div className="grid gap-4 lg:grid-cols-12">
                            <div className="lg:col-span-7"><PillarGrid onOpen={onPillar} /></div>
                            <div className="lg:col-span-5 [&>section]:h-full">
                                {showStarter
                                    ? <StarterSteps studied={studied} triedEos={triedEos} account={account} onStudy={onStudyNow} onEos={() => onPillar('eos')} onLogin={onLogin} onHide={hideStarter} />
                                    : <TodayStats plan={plan} items={items} queued={(Store.prefs.get(EOS_QUEUE, []) || []).length} />}
                            </div>
                        </div>
                    </section>
                </div>
            );
        };

        /* ---------- Import / Paste / Edit dialogs ---------- */
        const ImportDialog = ({ batches, existingCount, onConfirm, onClose }) => {
            const single = batches.length === 1;
            const [group, setGroup] = useState(single ? (batches[0].defaultGroup || '') : '');
            const [mode, setMode] = useState('append');
            const all = batches.reduce((a, b) => a.concat(b.items), []);
            const vocab = all.filter(t => t.type === 'vocab').length;
            const ungrouped = all.filter(t => !t.group).length;
            const confirmIt = () => {
                const out = [];
                batches.forEach(b => {
                    const g = single ? Sec.cleanText(group, 80) : b.defaultGroup;
                    b.items.forEach(t => out.push(t.group || !g ? t : Object.assign({}, t, { group: g })));
                });
                onConfirm({ items: out, mode });
            };
            return (
                <Modal title={'Nhập ' + all.length + ' mục'} onClose={onClose}
                    footer={<><button type="button" className="btn btn-secondary" onClick={onClose}>Hủy</button><button type="button" className={'btn ' + (mode === 'replace' ? 'btn-danger' : 'btn-primary')} onClick={confirmIt} disabled={!all.length}>{mode === 'replace' ? 'Ghi đè ' + existingCount + ' mục cũ' : 'Nối tiếp vào kho'}</button></>}>
                    <div className="flex flex-wrap gap-2 mb-4">
                        <span className="chip bg-primary-soft text-primary">{vocab} từ vựng</span>
                        <span className="chip bg-surface2 text-ink2">{all.length - vocab} trắc nghiệm</span>
                        {!single && batches.map((b, i) => <span key={i} className="chip bg-surface2 text-ink2">{b.label}: {b.items.length}</span>)}
                    </div>
                    {single && ungrouped > 0 && (
                        <label className="block mb-4"><span className="label">Gắn nhóm cho {ungrouped} mục chưa có nhóm</span><input value={group} maxLength={80} onChange={(e) => setGroup(e.target.value)} className="field" data-autofocus /></label>
                    )}
                    {!single && <p className="text-sm text-muted mb-4">Mục chưa có nhóm sẽ được gắn theo tên file.</p>}
                    {existingCount > 0 && (
                        <fieldset>
                            <legend className="label">Cách nhập</legend>
                            <div className="grid sm:grid-cols-2 gap-2">
                                {[['append', 'Nối tiếp', 'Giữ ' + existingCount + ' mục cũ'], ['replace', 'Ghi đè', 'Xóa toàn bộ kho cũ']].map(([k, l, d]) => (
                                    <label key={k} className={'rounded-xl border-2 p-3 cursor-pointer ' + (mode === k ? (k === 'replace' ? 'border-danger bg-danger-soft' : 'border-primary bg-primary-soft') : 'border-line')}>
                                        <input type="radio" name="import-mode" className="sr-only" checked={mode === k} onChange={() => setMode(k)} />
                                        <span className="font-semibold block">{l}</span><span className="text-xs text-ink2">{d}</span>
                                    </label>
                                ))}
                            </div>
                        </fieldset>
                    )}
                    <p className="text-xs text-muted mt-4 flex items-start gap-1.5"><Icon name="shield" size={14} className="mt-0.5" /> Dữ liệu đã được kiểm schema, cắt độ dài và hiển thị dạng văn bản thuần — mã HTML/script trong file không thể chạy.</p>
                </Modal>
            );
        };

        const PasteCodeDialog = ({ onParsed, onClose, toast }) => {
            const [code, setCode] = useState('');
            const parse = () => {
                try {
                    const s = code.trim();
                    if (!s) return;
                    if (s.length > Sec.LIMITS.shareCodeChars) throw new Error('Mã chia sẻ quá lớn');
                    const json = b64DecodeUtf8(s.indexOf('EDU2:') === 0 ? s.slice(5) : s);
                    const data = Sec.safeJSONParse(json, Sec.LIMITS.shareCodeChars);
                    const items = Sch.itemsFromJSON(data).map(t => Object.assign({}, t, { id: Sch.newId('it') })).filter(Sch.isFilled);
                    if (!items.length) throw new Error('Mã không có mục nào');
                    onParsed([{ label: 'Mã chia sẻ', items, defaultGroup: 'Nhóm mới' }]);
                } catch (e) {
                    toast(e.message && e.message.length < 120 ? 'Mã không hợp lệ: ' + e.message : 'Mã không hợp lệ', 'error');
                }
            };
            return (
                <Modal title="Dán mã chia sẻ" onClose={onClose} footer={<><button type="button" className="btn btn-secondary" onClick={onClose}>Hủy</button><button type="button" className="btn btn-primary" onClick={parse} disabled={!code.trim()}>Đọc mã</button></>}>
                    <textarea value={code} onChange={(e) => setCode(e.target.value)} rows={7} className="field py-2 tnum text-xs" placeholder="EDU2:eyJ2Ijoy…" aria-label="Mã chia sẻ" data-autofocus />
                </Modal>
            );
        };

        const ShareCodeDialog = ({ code, onClose }) => (
            <Modal title="Mã chia sẻ" onClose={onClose} footer={<button type="button" className="btn btn-primary" onClick={onClose}>Xong</button>}>
                <p className="text-sm text-ink2 mb-2">Trình duyệt chặn copy tự động. Chọn toàn bộ và copy thủ công:</p>
                <textarea readOnly value={code} rows={7} className="field py-2 tnum text-xs" onFocus={(e) => e.target.select()} data-autofocus aria-label="Mã chia sẻ" />
                <p className="text-xs text-muted mt-2">Mã chỉ chứa nội dung học. API key và tiến độ cá nhân đã được loại bỏ.</p>
            </Modal>
        );

        /* Ghép kết quả AI vào một mục: chỉ điền ô còn trống, IPA lấy bản AI nếu có. */
        const mergeEnrich = (t, e) => (e ? Object.assign({}, t, {
            wordType: t.wordType || e.wordType || '',
            answerOrMeaning: t.answerOrMeaning || e.answerOrMeaning || '',
            explanationOrExample: t.explanationOrExample || e.explanationOrExample || '',
            exampleVi: t.exampleVi || e.exampleVi || '',
            ipa: e.ipa || t.ipa || '',
            vietSub: Sch.ipaToVi(e.ipa || t.ipa) || t.vietSub || '',
            keywords: (t.keywords && t.keywords.length) ? t.keywords : (e.keywords || [])
        }) : t);

        /* Nút AI nhỏ ghim ở góc phải bên trong ô nhập. */
        const AiPin = ({ onClick, busy, disabled, label = 'AI điền', mini }) => (
            <button type="button" className={'ai-pin' + (mini ? ' is-mini' : '')} onClick={onClick} disabled={busy || disabled} aria-label={label} title={label}>
                <Icon name="sparkles" size={12} /><span>{busy ? '…' : (mini ? 'AI' : label)}</span>
            </button>
        );

        const ItemEditor = ({ item, groups, onSave, onClose, onAI }) => {
            const [d, setD] = useState(() => Object.assign({}, item, { keywordsText: (item.keywords || []).join(', ') }));
            const [busy, setBusy] = useState(false);
            const set = (k, v) => setD(x => Object.assign({}, x, { [k]: v }));
            const mcq = d.type === 'mcq';
            const save = () => {
                const out = Sch.normalizeItem(Object.assign({}, d, { keywords: d.keywordsText, options: mcq ? d.options : [] }), { source: item.source });
                onSave(Object.assign({}, item, out, { id: item.id }));
            };
            /* AI điền thẳng vào bản nháp trong form; bấm Lưu mới ghi vào Sổ từ. */
            const fill = async () => {
                setBusy(true);
                try {
                    const patch = await onAI(Object.assign({}, d, { keywords: d.keywordsText ? d.keywordsText.split(',').map(s => s.trim()).filter(Boolean) : [] }));
                    if (!patch) return;
                    if (mcq) {
                        if (patch.explanationOrExample && (!d.explanationOrExample || confirm('Thay lời giải hiện có bằng lời giải AI?'))) set('explanationOrExample', patch.explanationOrExample);
                    } else {
                        setD(x => {
                            const m = mergeEnrich(Object.assign({}, x, { keywords: x.keywordsText ? x.keywordsText.split(',').map(s => s.trim()).filter(Boolean) : [] }), patch);
                            return Object.assign({}, m, { keywordsText: (m.keywords || []).join(', ') });
                        });
                    }
                } finally {
                    setBusy(false);
                }
            };
            return (
                <Modal title={mcq ? 'Sửa câu trắc nghiệm' : 'Sửa từ vựng'} size="lg" onClose={onClose}
                    footer={<div className="flex w-full flex-nowrap items-center justify-end gap-2">
                        <button type="button" className="btn btn-secondary flex-1 sm:flex-none" onClick={onClose}>Hủy</button>
                        <button type="button" className="btn btn-primary flex-1 whitespace-nowrap sm:flex-none" onClick={save}>Lưu thay đổi</button>
                    </div>}>
                    <div className="grid grid-cols-[1fr_1.4fr_0.8fr] gap-2">
                        <label className="min-w-0"><span className="label">Loại</span>
                            <select className="field" value={d.type} onChange={(e) => setD(x => Object.assign({}, x, { type: e.target.value, options: e.target.value === 'mcq' ? (x.options && x.options.length ? x.options : ['', '', '', '']) : [], answerOrMeaning: e.target.value === 'mcq' ? 'A' : '' }))}>
                                <option value="vocab">Từ vựng</option><option value="mcq">Trắc nghiệm</option>
                            </select>
                        </label>
                        <label className="min-w-0"><span className="label">Nhóm</span><input className="field" list="group-list" value={d.group} maxLength={80} placeholder="Unit…" onChange={(e) => set('group', e.target.value)} /></label>
                        <label className="min-w-0"><span className="label">Chặng</span>
                            <select className="field" value={d.checkpoint} onChange={(e) => set('checkpoint', Number(e.target.value))}><option value={1}>1</option><option value={2}>2</option><option value={3}>3</option></select>
                        </label>
                    </div>
                    <datalist id="group-list">{groups.filter(([k]) => k !== '__none').map(([k]) => <option key={k} value={k} />)}</datalist>
                    <label className="block mt-3"><span className="label">{mcq ? 'Câu hỏi' : 'Từ / cụm từ tiếng Anh'}</span>
                        <span className="ai-field">
                            <textarea className="field py-2" rows={mcq ? 3 : 1} value={d.questionOrWord} maxLength={mcq ? 1500 : 400} onChange={(e) => set('questionOrWord', e.target.value)} data-autofocus />
                            <AiPin onClick={fill} busy={busy} disabled={!String(d.questionOrWord || '').trim()} label={mcq ? 'AI giải thích' : 'AI điền'} />
                        </span>
                    </label>
                    {mcq ? (
                        <fieldset className="mt-3">
                            <legend className="label">Lựa chọn — bấm chữ cái để chọn đáp án đúng</legend>
                            <div className="space-y-2">
                                {[0, 1, 2, 3].map(i => (
                                    <div key={i} className="flex gap-2 items-start">
                                        <button type="button" aria-pressed={d.answerOrMeaning === Sch.LETTERS[i]} onClick={() => set('answerOrMeaning', Sch.LETTERS[i])} className={'btn btn-icon shrink-0 ' + (d.answerOrMeaning === Sch.LETTERS[i] ? 'btn-success' : 'btn-secondary')} aria-label={'Chọn ' + Sch.LETTERS[i] + ' là đáp án đúng'}>{Sch.LETTERS[i]}</button>
                                        <textarea className="field py-2" rows={1} maxLength={500} value={(d.options || [])[i] || ''} onChange={(e) => set('options', [0, 1, 2, 3].map(j => (j === i ? e.target.value : ((d.options || [])[j] || ''))))} aria-label={'Lựa chọn ' + Sch.LETTERS[i]} />
                                    </div>
                                ))}
                            </div>
                        </fieldset>
                    ) : (
                        <>
                            <div className="grid grid-cols-2 gap-2 mt-3">
                                <label className="min-w-0"><span className="label">Từ loại</span><input className="field" value={d.wordType} maxLength={24} onChange={(e) => set('wordType', e.target.value)} placeholder="n / v / adj…" /></label>
                                <label className="min-w-0"><span className="label">IPA</span><input className="field" value={d.ipa} maxLength={80} onChange={(e) => set('ipa', e.target.value)} placeholder="/əˈkaʊntənt/" /></label>
                            </div>
                            <label className="block mt-3"><span className="label">Nghĩa tiếng Việt</span><input className="field" value={d.answerOrMeaning} maxLength={1500} onChange={(e) => set('answerOrMeaning', e.target.value)} /></label>
                        </>
                    )}
                    <label className="block mt-3"><span className="label">{mcq ? 'Giải thích' : 'Câu ví dụ (EN)'}</span><textarea className="field py-2" rows={2} maxLength={2500} value={d.explanationOrExample} onChange={(e) => set('explanationOrExample', e.target.value)} /></label>
                    {!mcq && <label className="block mt-3"><span className="label">Dịch câu ví dụ</span><textarea className="field py-2" rows={1} maxLength={1500} value={d.exampleVi} onChange={(e) => set('exampleVi', e.target.value)} /></label>}
                    <label className="block mt-3"><span className="label">Từ khóa ăn điểm (phím H) — cách nhau bằng dấu phẩy</span><input className="field" value={d.keywordsText} maxLength={1200} onChange={(e) => set('keywordsText', e.target.value)} /></label>
                    <div className="grid grid-cols-4 gap-2 mt-4 text-center">
                        {[['Đúng', item.correctCount, 'text-success'], ['Sai', item.wrongCount, 'text-danger'], ['Lần ôn', item.reviewCount, 'text-primary'], ['Phát âm', item.pronounceCount, 'text-ink2']].map(([l, v, c]) => (
                            <div key={l} className="rounded-xl bg-surface2 p-2"><p className={'text-xl font-bold tnum ' + c}>{v || 0}</p><p className="text-xs text-ink2">{l}</p></div>
                        ))}
                    </div>
                    {Sch.reviewNote(item) && <p className="text-sm text-muted mt-2">Lịch ôn: {Sch.reviewNote(item)}</p>}
                </Modal>
            );
        };

        /* Thêm nhanh nhiều dòng ngay đầu danh sách, kiểu Quizlet: gõ từ, Enter, gõ nghĩa, Enter là sang dòng mới. */
        const newDraft = () => ({ key: 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), questionOrWord: '', answerOrMeaning: '', wordType: '', ipa: '', explanationOrExample: '', exampleVi: '', keywords: [], open: false });
        const BatchAdd = ({ drafts, setDrafts, group, onSave, onCancel, onAI }) => {
            const refs = useRef({});
            const [focusKey, setFocusKey] = useState(() => (drafts[0] ? drafts[0].key : null));
            const [busyKey, setBusyKey] = useState(null);
            useEffect(() => {
                if (!focusKey) return;
                const el = refs.current[focusKey];
                if (el) { el.focus(); el.scrollIntoView({ block: 'nearest' }); }
                setFocusKey(null);
            }, [focusKey, drafts.length]);
            const patch = (key, p) => setDrafts(list => list.map(x => (x.key === key ? Object.assign({}, x, p) : x)));
            const addNext = () => { const n = newDraft(); setDrafts(list => list.concat([n])); setFocusKey(n.key); };
            const drop = (key) => setDrafts(list => { const next = list.filter(x => x.key !== key); return next.length ? next : [newDraft()]; });
            const fill = async (x) => {
                setBusyKey(x.key);
                try {
                    const e = await onAI(Object.assign({ id: 'draft-' + x.key, type: 'vocab' }, x));
                    if (e) setDrafts(list => list.map(y => (y.key === x.key ? Object.assign(mergeEnrich(y, e), { open: true }) : y)));
                } finally {
                    setBusyKey(null);
                }
            };
            const ready = drafts.filter(x => x.questionOrWord.trim()).length;
            const enterTo = (e, next) => { if (e.key === 'Enter' && !e.shiftKey && !e.nativeEvent.isComposing) { e.preventDefault(); next(); } };
            return (
                <section className="batch-add card mb-3" aria-label="Thêm nhanh nhiều từ">
                    <div className="flex items-center gap-2 border-b border-line px-3 py-2.5 sm:px-4">
                        <p className="text-sm font-semibold">Thêm nhanh {drafts.length > 1 ? drafts.length + ' dòng' : ''}</p>
                        {group && <span className="chip bg-surface2 text-ink2 max-w-[10rem] truncate">{group}</span>}
                        <p className="ml-auto hidden text-xs text-muted md:block"><Kbd>Enter</Kbd> sang ô kế / dòng mới</p>
                    </div>
                    <ol className="divide-y divide-line">
                        {drafts.map((x, i) => (
                            <li key={x.key} className="batch-row">
                                <span className="batch-num tnum" aria-hidden="true">{i + 1}</span>
                                <div className="min-w-0 flex-1">
                                    <div className="grid gap-2 md:grid-cols-2">
                                        <span className="ai-field">
                                            <input ref={el => { refs.current[x.key] = el; }} className="field" value={x.questionOrWord} maxLength={400} placeholder="Từ tiếng Anh" aria-label={'Từ tiếng Anh, dòng ' + (i + 1)}
                                                onChange={(e) => patch(x.key, { questionOrWord: e.target.value })}
                                                onKeyDown={(e) => enterTo(e, () => { const m = refs.current[x.key + ':m']; if (m) m.focus(); })} />
                                            <AiPin mini onClick={() => fill(x)} busy={busyKey === x.key} disabled={!x.questionOrWord.trim()} label="AI điền từ loại, IPA, nghĩa, ví dụ" />
                                        </span>
                                        <input ref={el => { refs.current[x.key + ':m'] = el; }} className="field" value={x.answerOrMeaning} maxLength={1500} placeholder="Nghĩa tiếng Việt" aria-label={'Nghĩa tiếng Việt, dòng ' + (i + 1)}
                                            onChange={(e) => patch(x.key, { answerOrMeaning: e.target.value })}
                                            onKeyDown={(e) => enterTo(e, () => { const at = drafts.findIndex(y => y.key === x.key); const nx = drafts[at + 1]; if (nx) setFocusKey(nx.key); else addNext(); })} />
                                    </div>
                                    {x.open && (
                                        <div className="mt-2 grid gap-2 sm:grid-cols-[7rem_1fr]">
                                            <input className="field" value={x.wordType} maxLength={24} placeholder="Từ loại" aria-label="Từ loại" onChange={(e) => patch(x.key, { wordType: e.target.value })} />
                                            <input className="field" value={x.ipa} maxLength={80} placeholder="IPA /…/" aria-label="IPA" onChange={(e) => patch(x.key, { ipa: e.target.value })} />
                                            <textarea className="field py-2 sm:col-span-2" rows={1} value={x.explanationOrExample} maxLength={2500} placeholder="Câu ví dụ (EN)" aria-label="Câu ví dụ" onChange={(e) => patch(x.key, { explanationOrExample: e.target.value })} />
                                        </div>
                                    )}
                                </div>
                                <div className="flex shrink-0 flex-col gap-1">
                                    <button type="button" className="lib-act" aria-expanded={x.open} aria-label={x.open ? 'Thu gọn' : 'Thêm IPA, ví dụ'} title={x.open ? 'Thu gọn' : 'Thêm IPA, ví dụ'} onClick={() => patch(x.key, { open: !x.open })}><Icon name={x.open ? 'chevronUp' : 'chevronDown'} size={15} /></button>
                                    <button type="button" className="lib-act" aria-label={'Bỏ dòng ' + (i + 1)} title="Bỏ dòng" onClick={() => drop(x.key)}><Icon name="x" size={15} /></button>
                                </div>
                            </li>
                        ))}
                    </ol>
                    <div className="flex flex-wrap items-center gap-2 border-t border-line px-3 py-2.5 sm:px-4">
                        <button type="button" className="btn btn-ghost btn-sm" onClick={addNext}><Icon name="plus" size={14} /> Thêm dòng tiếp</button>
                        <div className="ml-auto flex items-center gap-2">
                            <button type="button" className="btn btn-secondary btn-sm" onClick={onCancel}>Hủy</button>
                            <button type="button" className="btn btn-primary btn-sm whitespace-nowrap" disabled={!ready} onClick={onSave}>Lưu tất cả{ready ? ' (' + ready + ')' : ''}</button>
                        </div>
                    </div>
                </section>
            );
        };

        /* ---------- Quick Paste ---------- */
        const QuickPaste = ({ groups, onAdd, toast, onLocked }) => {
            const [text, setText] = useState('');
            const [group, setGroup] = useState('');
            const [preview, setPreview] = useState(null);
            const [busy, setBusy] = useState(false);
            const parseLocal = () => {
                const list = Sch.parseQuickPaste(text, group.trim());
                if (!list.length) { toast('Chưa tách được mục nào. Thử định dạng "word - nghĩa" hoặc câu có A. B. C. D.', 'info'); return; }
                setPreview(list);
            };
            const parseAI = async () => {
                if (!AI.ready()) { toast('AI chỉ chạy khi mở trang qua web, không mở file trực tiếp.', 'info'); return; }
                if (!E.Quota.aiFillAllowed()) { onLocked && onLocked(); return; }
                if (text.length > Sec.LIMITS.aiPasteChars) toast('Văn bản dài, AI chỉ đọc ' + Sec.LIMITS.aiPasteChars + ' ký tự đầu', 'info');
                setBusy(true);
                try {
                    const list = await AI.structurePaste(text, group.trim());
                    if (!list.length) toast('AI không tìm thấy mục nào', 'info');
                    else setPreview(list);
                } catch (e) {
                    if (e && e.code === 'ai-locked') { onLocked && onLocked(); return; }
                    toast(e.message, 'error');
                } finally {
                    setBusy(false);
                }
            };
            return (
                <section className="card p-4 sm:p-5 mb-4" aria-labelledby="qp-title">
                    <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <h3 id="qp-title" className="font-semibold flex items-center gap-2"><Icon name="clipboard" /> Ô nhập thông minh</h3>
                        <span className="text-xs text-muted">Dán danh sách từ hoặc cả đoạn câu hỏi trắc nghiệm</span>
                    </div>
                    {!preview ? (
                        <>
                            <textarea value={text} onChange={(e) => setText(e.target.value)} rows={6} maxLength={Sec.LIMITS.pasteChars} className="field py-2 font-mono text-[13px]" aria-label="Văn bản cần tách"
                                placeholder={'accountant - kế toán viên\nresign (v) - nghỉ việc\n\n1. Which testing technique is based on the specification?\nA. White-box\nB. Black-box\nC. Static analysis\nD. Code review\nĐáp án: B'} />
                            <div className="flex flex-wrap items-end gap-2 mt-3">
                                <label className="flex-1 min-w-[180px]"><span className="label">Nhóm</span><input className="field" list="qp-groups" value={group} maxLength={80} onChange={(e) => setGroup(e.target.value)} placeholder="Unit 1 - Jobs / SWT301 Ch.2" /></label>
                                <datalist id="qp-groups">{groups.filter(([k]) => k !== '__none').map(([k]) => <option key={k} value={k} />)}</datalist>
                                <button type="button" className="btn btn-secondary" onClick={parseLocal} disabled={!text.trim()}><Icon name="list" /> Tách nhanh</button>
                                <button type="button" className="btn btn-primary" onClick={parseAI} disabled={!text.trim() || busy}><Icon name="sparkles" /> {busy ? 'AI đang điền…' : 'AI điền tất cả'}</button>
                            </div>
                        </>
                    ) : (
                        <>
                            <p className="text-sm text-ink2 mb-2">Xem trước {preview.length} mục — bỏ mục sai trước khi thêm:</p>
                            <ul className="max-h-80 overflow-y-auto space-y-2 pr-1">
                                {preview.map(t => (
                                    <li key={t.id} className="rounded-xl border border-line p-3 flex gap-3 items-start">
                                        <span className={'chip shrink-0 ' + (t.type === 'mcq' ? 'bg-surface2 text-ink2' : 'bg-primary-soft text-primary')}>{t.type === 'mcq' ? 'MCQ' : 'Từ'}</span>
                                        <div className="min-w-0 flex-1 text-sm">
                                            <p className="font-semibold text-flow">{t.questionOrWord} {t.ipa && <span className="font-normal text-ink2">{t.ipa}</span>}</p>
                                            <p className="text-ink2 text-flow">{t.type === 'mcq' ? (t.answerOrMeaning ? t.answerOrMeaning + '. ' + Sch.correctText(t) : 'Chưa có đáp án') : (t.answerOrMeaning || 'Chưa có nghĩa')}</p>
                                            {t.keywords.length > 0 && <div className="flex flex-wrap gap-1 mt-1">{t.keywords.map(k => <span key={k} className="chip bg-warn-soft text-warn">{k}</span>)}</div>}
                                        </div>
                                        <button type="button" className="btn btn-ghost btn-sm btn-icon" onClick={() => setPreview(preview.filter(x => x.id !== t.id))} aria-label="Bỏ mục này"><Icon name="x" size={14} /></button>
                                    </li>
                                ))}
                            </ul>
                            <div className="flex flex-wrap gap-2 mt-3">
                                <button type="button" className="btn btn-secondary" onClick={() => setPreview(null)}><Icon name="back" /> Sửa văn bản</button>
                                <button type="button" className="btn btn-primary" disabled={!preview.length} onClick={() => { onAdd(preview); setPreview(null); setText(''); }}><Icon name="plus" /> Thêm {preview.length} mục vào kho</button>
                            </div>
                        </>
                    )}
                </section>
            );
        };

        /* ---------- Kho của tôi (bảng) ---------- */
        const splitSentences = (text) => {
            const clean = String(text || '').replace(/\s+/g, ' ').trim();
            if (!clean) return [];
            const parts = clean.split(/(?<=[.!?])\s+(?=[A-Z"“])/);
            return (parts.length > 1 ? parts : [clean]).map(s => s.trim()).filter(s => s.length > 1).slice(0, 30);
        };
        const sentenceIndexOf = (sentences, word, hint) => {
            const hinted = String(hint || '').toLowerCase();
            if (hinted) {
                const hit = sentences.findIndex(s => s.toLowerCase().indexOf(hinted.slice(0, 48)) >= 0);
                if (hit >= 0) return hit;
            }
            const low = String(word || '').toLowerCase();
            const i = sentences.findIndex(s => low && s.toLowerCase().indexOf(low) >= 0);
            return i >= 0 ? i : 0;
        };
        const markRanges = (sentence, words) => {
