                if (s.firstTry[id] === undefined && onReview) onReview(id, ok);
                if (inputRef.current) inputRef.current.blur();
            };
            const continueResult = () => {
                if (!fb || !cur) return;
                dispatch({ type: 'ANSWER', id: fb.id, correct: fb.ok, now: Date.now() });
                    setNow(Date.now());
                    setFb(null);
                    setInput('');
                    lock.current = false;
            };

            const pick = (di) => {
                if (s.phase !== 'drill' || !cur || cur.type !== 'mcq' || fb) return;
                const order = orders[cur.id] || [0, 1, 2, 3];
                if (di >= order.length) return;
                answer(Sch.LETTERS[order[di]] === cur.answerOrMeaning, di);
            };

            const matches = (v) => cur && Sch.normAnswer(v) !== '' && Sch.normAnswer(v) === Sch.normAnswer(cur.questionOrWord);

            const toggleHl = () => {
                if (!canHighlight) { if (toast) toast(highlightLockedMsg || 'Highlight chưa mở cho bộ này', 'info'); return; }
                setHl(v => !v);
            };

            const explainAI = async (t) => {
                if (!AI.ready()) { toast && toast('AI chỉ chạy khi mở trang qua web, không mở file trực tiếp.', 'info'); return; }
                setExplaining(true);
                try {
                    const txt = await AI.explain(t);
                    if (mounted.current) setExplained(m => Object.assign({}, m, { [t.id]: txt }));
                } catch (e) {
                    toast && toast(e.message, 'error');
                } finally {
                    if (mounted.current) setExplaining(false);
                }
            };

            useHotkeys('burst', {
                '1': () => pick(0), '2': () => pick(1), '3': () => pick(2), '4': () => pick(3),
                a: () => pick(0), b: () => pick(1), c: () => pick(2), d: () => pick(3),
                h: toggleHl,
                Enter: {
                    allowInInput: !!fb,
                    overrideButton: true,
                    run: () => {
                        if (fb) { continueResult(); return; }
                    if (s.phase === 'preview') dispatch({ type: 'START_DRILL' });
                    else if (s.phase === 'batchDone') dispatch({ type: 'NEXT_BATCH', skipPreview });
                    else return false;
                    }
                },
                Space: {
                    allowInInput: !!fb,
                    overrideButton: true,
                    run: () => {
                        if (fb) { continueResult(); return; }
                        if (s.phase === 'preview') dispatch({ type: 'START_DRILL' });
                        else if (s.phase === 'batchDone') dispatch({ type: 'NEXT_BATCH', skipPreview });
                        else return false;
                    }
                },
                Escape: () => { if (onExit) onExit(); }
            });

            const clearedN = batch.filter(id => s.cleared.indexOf(id) >= 0).length;
            const totalQ = s.batches.reduce((n, b) => n + b.length, 0);
            const header = (
                <div className="drill-head">
                    <div className="drill-head-row">
                    <div className="min-w-0">
                            <p className="text-[11px] font-semibold uppercase tracking-wider text-muted">{subtitle || 'Băng đạn 5 câu'}</p>
                            <h2 className="text-base font-bold text-flow truncate">{title}</h2>
                    </div>
                    <div className="flex flex-wrap items-center gap-2">
                        {timerMin ? <Elapsed startedAt={s.startedAt} limitMin={timerMin} /> : null}
                        <HighlightButton on={hl} onToggle={toggleHl} locked={!canHighlight} bilingual={bilingual} />
                        {onExit && <button type="button" className="btn btn-ghost btn-sm" onClick={onExit}><Icon name="x" size={14} /> Thoát <Kbd>Esc</Kbd></button>}
                    </div>
                </div>
                    <div className="drill-progress">
                        <span className="text-xs text-ink2 tnum">
                            Băng đạn <b className="text-ink">{s.b + 1}/{s.batches.length}</b> · Đã nắm <b className={clearedN === batch.length && batch.length ? 'text-success' : 'text-ink'}>{clearedN}/{batch.length}</b>
                    </span>
                        <JackEvolveBar value={s.cleared.length} max={totalQ} />
                    </div>
                </div>
            );

            if (!s.batches.length) {
                return <div className="card p-6">{header}<Empty title="Không có câu để luyện">Thêm câu vào kho hoặc chọn nhóm khác.</Empty></div>;
            }

            if (s.phase === 'done') {
                const st = Burst.stats(s);
                if (renderDone) return renderDone(st);
                const missed = st.missed.map(id => itemsById.get(id)).filter(Boolean);
                return (
                    <div className="card p-6 sm:p-8 enter">
                        <JackEvolveBar value={st.total} max={st.total || 1} />
                        <div className="w-12 h-12 rounded-2xl bg-success-soft text-success flex items-center justify-center mb-3 mt-4"><Icon name="trophy" size={24} /></div>
                        <h2 className="text-2xl font-bold">Sạch toàn bộ {st.total} câu</h2>
                        <p className="text-muted mt-1">Đúng ngay lần đầu {st.firstTryCorrect}/{st.total} · thời gian {Plan.fmtCountdown(st.elapsedMs)}</p>
                        {missed.length > 0 && (
                            <div className="mt-5 space-y-2">
                                <p className="text-sm font-semibold">Đã vào mục ôn câu yếu:</p>
                                {missed.map(t => (
                                    <div key={t.id} className="rounded-xl border border-line p-3">
                                        <ItemPrompt t={t} hl={hl} />
                                        <div className="mt-1"><ItemAnswer t={t} hl={hl} compact /></div>
                                    </div>
                                ))}
                            </div>
                        )}
                        {onExit && <div className="mt-6"><button type="button" className="btn btn-primary" onClick={onExit} data-autofocus>Xong</button></div>}
                    </div>
                );
            }

            if (s.phase === 'preview') {
                return (
                    <div className="drill-stage enter">
                        {header}
                        <div className="flex flex-wrap items-center justify-between gap-3 mb-3">
                            <p className="font-semibold flex items-center gap-2"><Icon name="eye" /> Vòng 1 · Nhìn lướt 15 giây</p>
                            <button type="button" className="btn btn-primary btn-sm" onClick={() => dispatch({ type: 'START_DRILL' })} autoFocus>
                                Vào phản xạ ngay <Kbd>Enter</Kbd>
                            </button>
                        </div>
                        <div className="h-1.5 rounded-full bg-surface2 overflow-hidden mb-5">
                            <div key={s.b} className="h-full bg-primary bar-run" style={{ animationDuration: Burst.PREVIEW_MS + 'ms' }} />
                        </div>
                        <ol className="space-y-3">
                            {batch.map((id, i) => {
                                const t = itemsById.get(id);
                                return (
                                    <li key={id} className="rounded-xl border border-line p-3 sm:p-4 flex gap-3">
                                        <span className="tnum text-xs font-semibold text-muted pt-1 w-6 shrink-0">s{i + 1}</span>
                                        <div className="min-w-0 flex-1 space-y-1">
                                            <ItemPrompt t={t} hl={hl} />
                                            <ItemAnswer t={t} hl={hl} />
                                        </div>
                                    </li>
                                );
                            })}
                        </ol>
                    </div>
                );
            }

            if (s.phase === 'batchDone') {
                return (
                    <div className="card p-6 sm:p-8 text-center enter">
                        {header}
                        <div className="mx-auto w-14 h-14 rounded-2xl bg-success text-white flex items-center justify-center mb-3 pop-ok"><Icon name="check" size={28} /></div>
                        <h3 className="text-xl font-bold">Sạch {batch.length}/{batch.length} — mở băng đạn tiếp theo</h3>
                        <p className="text-muted mt-1">Bấm tiếp khi sẵn sàng mở băng {s.b + 2}/{s.batches.length}.</p>
                        <button type="button" className="btn btn-primary mt-5" onClick={() => dispatch({ type: 'NEXT_BATCH', skipPreview })} autoFocus>Mở băng tiếp <Kbd>Enter</Kbd> <Kbd>Space</Kbd></button>
                    </div>
                );
            }

            if (waiting && cur) {
                return (
                    <div className="drill-stage enter">
                        {header}
                        <div className="rounded-2xl bg-warn-soft border border-amber-200 p-4 sm:p-5">
                            <p className="text-sm font-semibold text-warn flex items-center gap-2"><Icon name="rotate" size={16} /> Câu này quay lại sau <span className="tnum">{Math.ceil(head.waitMs / 1000)}s</span> — nhìn lại đáp án:</p>
                            <div className="mt-3 space-y-2">
                                <ItemPrompt t={cur} hl />
                                <ItemAnswer t={cur} hl />
                                {cur.explanationOrExample && <p className="text-sm text-ink2 text-flow reading">{cur.explanationOrExample}</p>}
                                {explained[cur.id] && <p className="text-sm text-ink2 text-flow reading border-t border-amber-200 pt-2">{explained[cur.id]}</p>}
                            </div>
                            {canExplain && cur.type === 'mcq' && !explained[cur.id] && (
                                <button type="button" className="btn btn-secondary btn-sm mt-3" disabled={explaining} onClick={() => explainAI(cur)}><Icon name="sparkles" size={14} /> {explaining ? 'AI đang giải…' : 'Lời giải AI'}</button>
                            )}
                        </div>
                    </div>
                );
            }

            if (!cur) return null;
            const order = orders[cur.id] || [0, 1, 2, 3];
            const showAnswer = fb && !fb.ok;

            const tone = fb ? (fb.ok ? ' ok' : ' bad') : '';
            const missed = !!(fb && !fb.ok);
            return (
                <div className="drill-stage">
                        {header}
                    <div ref={cardRef} tabIndex={-1} key={cur.id + ':' + (s.misses[cur.id] || 0)} className={'q-card' + (missed ? ' shake bad' : ' q-spring' + tone)}>
                        <div className="px-5 sm:px-8 pt-6 sm:pt-8 pb-6 sm:pb-8 flex items-start gap-3">
                            <div className="min-w-0 flex-1">
                                <div className="flex items-center gap-2 mb-3">
                                <span className="chip bg-surface2 text-ink2">{cur.type === 'mcq' ? 'Trắc nghiệm' : 'Gõ từ tiếng Anh'}</span>
                                {s.misses[cur.id] ? <span className="chip bg-danger-soft text-danger"><Icon name="rotate" size={12} /> làm lại</span> : null}
                            </div>
                            <ItemPrompt t={cur} hl={hl} big />
                            </div>
                            <JackCorner wrong={missed} />
                        </div>
                    </div>
                    {fb && fb.ok && (
                        <div className="callout ok" role="status">
                            <span className="callout-ico">✓</span>
                            <div className="min-w-0 flex-1">
                                <p className="font-semibold pt-0.5">Chính xác</p>
                                <Explain t={cur} hl={hl} />
                                <InsightCard item={cur} />
                            </div>
                        </div>
                    )}
                            {showAnswer && (
                        <div className="callout bad" role="alert">
                            <span className="callout-ico">✕</span>
                            <div className="min-w-0">
                                <p className="font-semibold mb-1">Alo tổng đài cứu nét! Sai rồi, nhai lại câu này ngay!</p>
                                    <ItemAnswer t={cur} hl />
                                <Explain t={cur} hl />
                                <InsightCard item={cur} />
                                </div>
                                </div>
                            )}
                    {fb && (
                        <div className="mt-3">
                            <button type="button" className="btn btn-primary" onClick={continueResult} autoFocus>Tiếp tục <Kbd>Enter</Kbd> <Kbd>Space</Kbd></button>
                        </div>
                    )}
                        {cur.type === 'vocab' && (
                            <div className="mt-4">
                                <label htmlFor="burst-input" className="label">Gõ từ tiếng Anh — khớp là tự chấm</label>
                                <input id="burst-input" ref={inputRef} value={input} autoComplete="off" autoCapitalize="off" spellCheck={false} disabled={!!fb}
                                    className="field text-lg min-h-[52px]" placeholder="Gõ đáp án…"
                                    onCompositionStart={() => { composing.current = true; }}
                                    onCompositionEnd={(e) => { composing.current = false; if (matches(e.currentTarget.value)) answer(true); }}
                                    onChange={(e) => {
                                        const v = e.target.value;
                                        setInput(v);
                                        if (!composing.current && !(e.nativeEvent && e.nativeEvent.isComposing) && matches(v)) answer(true);
                                    }}
                                    onKeyDown={(e) => {
                                        if (e.key !== 'Enter' || e.nativeEvent.isComposing || composing.current) return;
                                        e.preventDefault();
                                        answer(matches(input));
                                    }} />
                                <p className="text-xs text-muted mt-2">Bí thì nhấn <Kbd>Enter</Kbd> để xem đáp án — câu sẽ quay lại cuối băng sau 15 giây.</p>
                            </div>
                        )}
                    {cur.type === 'mcq' && (
                        <div className="choices safe-bottom" role="group" aria-label="Lựa chọn đáp án">
                                {order.map((oi, di) => {
                                    const isRight = Sch.LETTERS[oi] === cur.answerOrMeaning;
                                    const chosen = fb && fb.chosen === di;
                                const cls = fb ? (isRight ? 'choice right' : chosen ? 'choice wrong' : 'choice dim') : 'choice';
                                    return (
                                    <button key={oi} type="button" onClick={() => pick(di)} disabled={!!fb} className={cls}>
                                        <span className="keycap">{fb && isRight ? '✓' : (chosen && !fb.ok ? '✕' : di + 1)}</span>
                                        <span className="text-flow font-medium leading-snug">
                                                <Hl text={cur.options[oi]} keywords={fb && isRight ? cur.keywords : []} on={hl && !!fb} />
                                            </span>
                                        </button>
                                    );
                                })}
                        </div>
                    )}
                </div>
            );
        };

        /* ---------------------------------------------------------------
         * FlashSession — Flashcard / Điền từ / Nghe viết / Ghi âm (giữ nguyên tính năng bản cũ)
         * --------------------------------------------------------------- */
        const FlashSession = ({ items: rawItems, session, onReview, onPatch, onFinish, onClose, onRestart, toast }) => {
            const [qlang] = useQLang();
            const items = useMemo(() => langList(rawItems, qlang), [rawItems, qlang]);
            const bilingual = useMemo(() => rawItems.some(t => session.ids.indexOf(t.id) >= 0 && Sch.hasVi(t)), [rawItems]);
            const byId = useMemo(() => new Map(items.map(t => [t.id, t])), [items]);
            const ids = session.ids;
            const isSlot = !!session.slotId;
            const [index, setIndex] = useState(0);
            const [flipped, setFlipped] = useState(false);
            const [done, setDone] = useState(false);
            const [known, setKnown] = useState([]);
            const [forgot, setForgot] = useState([]);
            const [face, setFace] = useState('recall');
            const [mode, setMode] = useState(session.mode === 'test' ? 'test' : session.mode === 'listen' ? 'listen' : 'flash');
            const [typed, setTyped] = useState('');
            const [result, setResult] = useState(null);
            const [held, setHeld] = useState(false);
            const [hint, setHint] = useState(false);
            const [recording, setRecording] = useState(false);
            const [note, setNote] = useState('');
            const [preparing, setPreparing] = useState(false);
            const [hl, setHl] = useState(false);
            const recRef = useRef(null);
            const voted = useRef(false);
            const inputRef = useRef(null);
            const cardRef = useRef(null);
            const composing = useRef(false);
            const mounted = useMounted();
            const t = byId.get(ids[index]) || null;
            const isMcq = !!(t && t.type === 'mcq');

            useEffect(() => {
                setTyped('');
                setResult(null);
                setHeld(false);
                setHint(false);
                setFlipped(false);
            }, [index, mode]);

            useEffect(() => {
                const el = mode !== 'flash' && !isMcq ? inputRef.current : cardRef.current;
                if (el) el.focus();
            }, [index, mode, isMcq]);
            useEffect(() => {
                if (!done || voted.current) return;
                voted.current = true;
                affirmStudy();
                castSessionVote(session, known.length + forgot.length, toast);
            }, [done]);
            useEffect(() => {
                if (session && session.mission) noteMission((session.missionBase || 0) + known.length + forgot.length);
            }, [known.length, forgot.length]);

            useEffect(() => {
                const need = ids.map(id => byId.get(id)).filter(x => x && x.type === 'vocab' && x.questionOrWord && !x.recallPrompt).slice(0, 40);
                if (!need.length || !AI.ready()) return undefined;
                setPreparing(true);
                AI.recallPrompts(need)
                    .then(map => {
                        const patch = {};
                        Object.keys(map).forEach(id => { patch[id] = { recallPrompt: map[id] }; });
                        if (Object.keys(patch).length) onPatch(patch);
                    })
                    .catch(() => {})
                    .finally(() => { if (mounted.current) setPreparing(false); });
                return undefined;
            }, []);

            const allGraded = (k, f) => ids.length > 0 && ids.every(id => k.indexOf(id) >= 0 || f.indexOf(id) >= 0);

            const next = (counts) => {
                setNote('');
                setHeld(false);
                const knownNow = counts && Array.isArray(counts.k) ? counts.k : known;
                const forgotNow = counts && Array.isArray(counts.f) ? counts.f : forgot;
                if (index < ids.length - 1) { setIndex(index + 1); return; }
                if (!isSlot || allGraded(knownNow, forgotNow)) {
                    setDone(true);
                    if (onFinish && isSlot) {
                        /* onFinish đóng phiên ngay, effect [done] không kịp chạy: bỏ phiếu ca học ở đây. */
                        if (!voted.current) {
                            voted.current = true;
                            affirmStudy();
                            castSessionVote(session, knownNow.length + forgotNow.length, toast);
                        }
                        onFinish({ slotId: session.slotId, cardsDone: ids.length, remembered: knownNow.length });
                    }
                    return;
                }
                setNote('Ca này tính xong khi bạn chấm hết các thẻ.');
            };

            const prev = () => {
                setNote('');
                if (index > 0) { setIndex(index - 1); setDone(false); }
            };

            const mark = (id, ok) => {
                const k = ok ? (known.indexOf(id) >= 0 ? known : known.concat(id)) : known.filter(x => x !== id);
                const f = !ok ? (forgot.indexOf(id) >= 0 ? forgot : forgot.concat(id)) : forgot.filter(x => x !== id);
                setKnown(k);
                setForgot(f);
                return { k, f };
            };

            const gradeFlash = (ok) => {
                if (!t || done || held) return;
                onReview(t.id, ok);
                const counts = mark(t.id, ok);
                if (ok) {
                    next(counts);
                    return;
                }
                setNote('Thẻ này vào mục ôn yếu');
                setHeld(true);
                if (t.type !== 'mcq') speak(t.questionOrWord);
            };

            const settle = (ok, extra) => {
                setResult(Object.assign({ ok }, extra || {}));
                if (ok) Sfx.correct(); else Sfx.wrong();
                onReview(t.id, ok, extra && extra.kind);
                mark(t.id, ok);
                if (t.type !== 'mcq') speak(t.questionOrWord);
            };

            const checkTyped = (value, explicit) => {
                if (!t || result) return;
                const ok = Sch.normAnswer(value) !== '' && Sch.normAnswer(value) === Sch.normAnswer(t.questionOrWord);
                if (!ok && !explicit) return;
                settle(ok);
            };

            const pickMcq = (i) => {
                if (!t || !isMcq || mode === 'flash' || result) return;
                if (!t.options[i]) return;
                settle(Sch.LETTERS[i] === t.answerOrMeaning, { chosen: i });
            };

            const record = async () => {
                if (!t) return;
                toast('Chấm phát âm tự động chưa mở trên máy chủ dùng chung. Bạn vẫn gõ từ được.', 'info');
            };

            useHotkeys('flash', {
                Space: {
                    allowInInput: !!(result || held),
                    overrideButton: true,
                    run: () => {
                        if (result || held) { next(); return; }
                        if (mode === 'flash') setFlipped(v => !v);
                        else return false;
                    }
                },
                ArrowRight: next,
                ArrowLeft: prev,
                h: () => setHl(v => !v),
                Enter: {
                    allowInInput: !!(result || held),
                    overrideButton: true,
                    run: () => {
                        if (result || held) { next(); return; }
                        if (mode === 'flash') setFlipped(v => !v);
                        else return false;
                    }
                },
                '1': () => { if (result || held) return false; if (mode === 'flash') { if (flipped) gradeFlash(false); } else pickMcq(0); },
                '2': () => { if (result || held) return false; if (mode === 'flash') { if (flipped) gradeFlash(true); } else pickMcq(1); },
                '3': () => { if (result || held) return false; pickMcq(2); },
                '4': () => { if (result || held) return false; pickMcq(3); },
                a: () => { if (result || held) return false; pickMcq(0); },
                b: () => { if (result || held) return false; pickMcq(1); },
                c: () => { if (result || held) return false; pickMcq(2); },
                d: () => { if (result || held) return false; pickMcq(3); }
            });

            if (done) {
                const pending = ids.filter(id => known.indexOf(id) < 0 && forgot.indexOf(id) < 0).length;
                return (
                    <div className="card p-6 sm:p-8 max-w-2xl mx-auto enter">
                        <p className="text-sm text-muted">{session.title}</p>
                        <h2 className="text-2xl font-bold mb-5">Hết bộ thẻ</h2>
                        <div className="grid grid-cols-3 gap-3 mb-5">
                            <div className="rounded-xl bg-success-soft p-4 text-center"><div className="text-3xl font-bold text-success tnum">{known.length}</div><div className="text-sm text-ink2">Đã nhớ</div></div>
                            <div className="rounded-xl bg-danger-soft p-4 text-center"><div className="text-3xl font-bold text-danger tnum">{forgot.length}</div><div className="text-sm text-ink2">Cần ôn</div></div>
                            <div className="rounded-xl bg-surface2 p-4 text-center"><div className="text-3xl font-bold text-ink2 tnum">{pending}</div><div className="text-sm text-ink2">Chưa chấm</div></div>
                        </div>
                        {forgot.length > 0 && (
                            <div className="flex flex-wrap gap-2 mb-5">
                                {forgot.map(id => { const w = byId.get(id); return w ? <span key={id} className="chip bg-danger-soft text-danger">{w.type === 'mcq' ? w.questionOrWord.slice(0, 60) : w.questionOrWord}</span> : null; })}
                            </div>
                        )}
                        {!isSlot && (
                            <div className="flex flex-wrap gap-2">
                                {forgot.length > 0 && <button type="button" className="btn btn-danger" onClick={() => onRestart(forgot.slice(), 'flash', session.title.replace(/ · ôn lại$/, '') + ' · ôn lại', session.voteType === 'reviewWeak' ? 'reviewWeak' : 'flashcard')}><Icon name="rotate" /> Ôn lại thẻ chưa nhớ</button>}
                                <button type="button" className="btn btn-primary" onClick={() => onRestart(Sch.shuffle(ids), mode, session.title.replace(/ · ôn lại$/, ''), session.voteType || voteTypeFor(mode))}><Icon name="shuffle" /> Làm lại</button>
                                <button type="button" className="btn btn-secondary" onClick={onClose}>Đóng</button>
                            </div>
                        )}
                    </div>
                );
            }

            const cloze = t && !isMcq ? Sch.blankOut(t.explanationOrExample || '', t.questionOrWord) : '';
            const hasBlank = cloze.indexOf('_____') >= 0;
            const front = !t ? '' : isMcq ? t.questionOrWord : (face === 'recognize' ? t.questionOrWord : Sch.recallPromptOf(t));

            return (
                <div className="max-w-3xl mx-auto">
                    <div className="flex flex-wrap items-center justify-between gap-3 mb-3">
                        <div className="min-w-0">
                            <p className="text-sm text-muted text-flow">{session.title}</p>
                            <p className="font-semibold tnum">{ids.length ? Math.min(index + 1, ids.length) : 0} / {ids.length}</p>
                        </div>
                        <div className="flex flex-wrap gap-2 items-center">
                            {!isSlot && (
                                <div role="tablist" aria-label="Kiểu luyện" className="flex gap-1 p-1 rounded-xl bg-surface border border-line">
                                    {[['flash', 'Thẻ'], ['test', 'Điền / chọn'], ['listen', 'Nghe viết']].map(([k, label]) => (
                                        <button key={k} type="button" role="tab" aria-selected={mode === k} className="tab min-h-[36px]" onClick={() => setMode(k)}>{label}</button>
                                    ))}
                                </div>
                            )}
                            <HighlightButton on={hl} onToggle={() => setHl(v => !v)} bilingual={bilingual} />
                            {!isSlot && <button type="button" className="btn btn-ghost btn-sm" onClick={onClose}><Icon name="x" size={14} /> Kết thúc</button>}
                        </div>
                    </div>
                    <JackEvolveBar value={known.length + forgot.length} max={ids.length} />
                    <div className="h-4" />

                    {!t ? (
                        <div className="card p-8 text-center">
                            <p className="text-muted mb-4">Thẻ này không còn trong kho.</p>
                            <button type="button" className="btn btn-primary" onClick={next}>Bỏ qua</button>
                        </div>
                    ) : mode === 'flash' ? (
                        <div>
                            {!isMcq && (
                                <div className="flex flex-wrap justify-center gap-2 mb-3">
                                    <div role="tablist" aria-label="Mặt trước" className="flex gap-1 p-1 rounded-xl bg-surface border border-line">
                                        <button type="button" role="tab" aria-selected={face === 'recall'} className="tab min-h-[36px]" onClick={() => setFace('recall')}>Gợi nhớ</button>
                                        <button type="button" role="tab" aria-selected={face === 'recognize'} className="tab min-h-[36px]" onClick={() => setFace('recognize')}>Nhận mặt chữ</button>
                                    </div>
                                    {preparing && <span className="text-sm text-muted self-center">Đang soạn câu hỏi gợi nhớ…</span>}
                                </div>
                            )}
                            <div className="scene">
                                <div ref={cardRef} tabIndex={0} role="button" aria-label={flipped ? 'Mặt sau thẻ, nhấn để lật lại' : 'Mặt trước thẻ, nhấn để lật'}
                                    className={'card3d rounded-3xl ' + (flipped ? 'flipped' : '')} onClick={() => setFlipped(v => !v)}>
                                    <div className="face front card rounded-3xl overflow-hidden" style={{ boxShadow: '0 20px 25px -5px rgba(15,23,42,.08), 0 8px 10px -6px rgba(15,23,42,.04), 0 0 0 1px rgba(15,23,42,.06)' }}>
                                        <div className="h-1.5" style={{ background: Sch.groupColor(t.group || t.questionOrWord) }} />
                                        <div className="px-6 sm:px-10 pt-10 pb-8 flex flex-col items-center text-center">
                                            <p className="text-xs font-semibold uppercase tracking-wider text-muted mb-4 text-flow">{t.group || 'Chưa nhóm'} · {isMcq ? 'Câu hỏi' : face === 'recognize' ? 'Từ' : 'Gợi nhớ'}</p>
                                            <p className={'font-semibold text-ink text-flow reading ' + (!isMcq && face === 'recognize' ? 'text-4xl' : 'text-xl sm:text-2xl')}>
                                                <Hl text={front} keywords={t.keywords} on={hl} />
                                            </p>
                                            {isMcq && (
                                                <ol className="mt-5 w-full max-w-xl text-left space-y-1.5">
                                                    {t.options.map((o, i) => o ? <li key={i} className="text-flow text-ink2"><span className="tnum font-semibold mr-2">{Sch.LETTERS[i]}.</span>{o}</li> : null)}
                                                </ol>
                                            )}
                                            {!isMcq && face === 'recognize' && t.ipa && <p className="text-lg text-ink2 mt-3">{t.ipa}</p>}
                                            <p className="text-sm text-muted mt-8">Nhấn thẻ hoặc <Kbd>Space</Kbd> để lật</p>
                                        </div>
                                    </div>
                                    <div className="face back card rounded-3xl overflow-hidden" style={{ boxShadow: '0 20px 25px -5px rgba(15,23,42,.08), 0 8px 10px -6px rgba(15,23,42,.04), 0 0 0 1px rgba(15,23,42,.06)' }}>
                                        <div className="h-1.5 bg-success" />
                                        <div className="px-6 sm:px-10 py-8 text-center">
                                            {isMcq ? (
                                                <>
                                                    <p className="text-xs font-semibold uppercase tracking-wider text-muted mb-3">Đáp án</p>
                                                    <div className="text-2xl"><ItemAnswer t={t} hl={hl} /></div>
                                                    {t.explanationOrExample && <p className="mt-4 text-ink2 text-flow reading mx-auto">{t.explanationOrExample}</p>}
                                                </>
                                            ) : (
                                                <>
                                                    <p className="text-4xl font-semibold text-ink text-flow"><Hl text={t.questionOrWord} keywords={t.keywords} on={hl} /></p>
                                                    {t.ipa && <p className="text-ink2 mt-2">{t.ipa}</p>}
                                                    {Sch.readingOf(t) && <p className="text-muted text-sm">{Sch.readingOf(t)}</p>}
                                                    <button type="button" onClick={(e) => { e.stopPropagation(); speak(t.questionOrWord); }} className="btn btn-secondary btn-sm mt-4"><Icon name="volume" size={14} /> Nghe</button>
                                                    <p className="mt-5 text-lg text-ink text-flow">{t.answerOrMeaning}</p>
                                                    {t.explanationOrExample && <p className="mt-3 text-ink2 italic text-flow reading mx-auto"><Hl text={t.explanationOrExample} keywords={t.keywords} on={hl} /></p>}
                                                    {t.exampleVi && <p className="mt-1 text-sm text-muted text-flow">{t.exampleVi}</p>}
                                                </>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="flash-actions">
                                <button type="button" onClick={prev} disabled={index === 0} className="btn btn-secondary btn-icon" aria-label="Thẻ trước"><Icon name="left" /></button>
                                {flipped ? (
                                    <>
                                        <button type="button" onClick={() => gradeFlash(false)} className="btn btn-danger btn-lg" disabled={held}>Cần ôn <Kbd>1</Kbd></button>
                                        <button type="button" onClick={() => gradeFlash(true)} className="btn btn-success btn-lg" disabled={held}>Đã nhớ <Kbd>2</Kbd></button>
                                    </>
                                ) : (
                                    <p className="text-sm text-muted px-2 text-center"><Kbd>Space</Kbd> lật · <Kbd>1</Kbd> cần ôn · <Kbd>2</Kbd> đã nhớ · <Kbd>H</Kbd> highlight</p>
                                )}
                                <button type="button" onClick={next} className="btn btn-secondary btn-icon" aria-label="Thẻ sau"><Icon name="right" /></button>
                            </div>
                            {held && (
                                <div className="max-w-xl mx-auto mt-4">
                                    <InsightCard item={t} />
                                    <button type="button" className="btn btn-primary mt-3" onClick={next}>Câu tiếp theo <Kbd>Enter</Kbd> <Kbd>Space</Kbd></button>
                                </div>
                            )}
                            {note && <p className="text-center text-sm text-muted mt-3" role="status">{note}</p>}
                        </div>
                    ) : isMcq ? (
                        <div ref={cardRef} tabIndex={-1} className="drill-stage">
                            <div className={'q-card' + (result && !result.ok ? ' shake bad' : ' q-spring' + (result ? (result.ok ? ' ok' : '') : ''))}>
                                <div className="px-5 sm:px-8 pt-6 sm:pt-8 pb-6 sm:pb-8 flex items-start gap-3">
                                    <div className="min-w-0 flex-1"><ItemPrompt t={t} hl={hl} big /></div>
                                    <JackCorner wrong={!!(result && !result.ok)} />
                                </div>
                            </div>
                            {result && (
                                <div className={result.ok ? 'callout ok' : 'callout bad'} role="status">
                                    <span className="callout-ico">{result.ok ? '✓' : '✕'}</span>
                                    <div>
                                        <p className="font-semibold">{result.ok ? 'Chính xác' : 'Alo tổng đài cứu nét! Sai rồi, nhai lại câu này ngay!'}</p>
                                        {!result.ok && <div className="mt-1"><ItemAnswer t={t} hl={hl} /></div>}
                                        {!result.ok && t.explanationOrExample && <p className="text-sm mt-1 text-flow">{t.explanationOrExample}</p>}
                                        <InsightCard item={t} />
                                    </div>
                                </div>
                            )}
                            <div className="choices" role="group" aria-label="Lựa chọn đáp án">
                                {t.options.map((o, i) => {
                                    if (!o) return null;
                                    const right = Sch.LETTERS[i] === t.answerOrMeaning;
                                    const chosen = result && result.chosen === i;
                                    const cls = result ? (right ? 'choice right' : chosen ? 'choice wrong' : 'choice dim') : 'choice';
                                    return (
                                        <button key={i} type="button" disabled={!!result} onClick={() => pickMcq(i)} className={cls}>
                                            <span className="keycap">{result && right ? '✓' : (chosen && !result.ok ? '✕' : i + 1)}</span>
                                            <span className="text-flow font-medium leading-snug"><Hl text={o} keywords={result && right ? t.keywords : []} on={hl && !!result} /></span>
                                        </button>
                                    );
                                })}
                            </div>
                            <div className="flex justify-between mt-5">
                                <button type="button" onClick={prev} disabled={index === 0} className="btn btn-secondary">Trước</button>
                                <button type="button" onClick={next} className="btn btn-primary">{result ? <>Tiếp tục <Kbd>Enter</Kbd> <Kbd>Space</Kbd></> : 'Bỏ qua'}</button>
                            </div>
                        </div>
                    ) : (
                        <div className={'card p-5 sm:p-7 ' + (result ? (result.ok ? 'pop-ok' : 'shake') : '')}>
                            <div className="flex items-start gap-3 mb-3">
                                <h3 className="text-lg font-semibold min-w-0 flex-1">{mode === 'test' ? 'Điền từ' : 'Nghe và viết'}</h3>
                                <JackCorner wrong={!!(result && !result.ok)} />
                            </div>
                            {mode === 'test' ? (
                                <div className="rounded-xl bg-primary-soft border border-indigo-100 p-4 mb-4 text-lg text-flow reading">
                                    {hasBlank ? cloze : (t.answerOrMeaning || t.exampleVi || 'Gõ từ tiếng Anh')}
                                </div>
                            ) : (
                                <div className="text-center mb-4">
                                    <button type="button" onClick={() => speak(t.questionOrWord)} className="btn btn-primary btn-lg"><Icon name="volume" /> Phát âm từ</button>
                                    <p className="text-sm text-muted mt-2">Nghe rồi gõ. Từ được giấu đến khi chấm.</p>
                                </div>
                            )}
                            <div className="flex gap-2 mb-3">
                                <label htmlFor="typed" className="sr-only">Đáp án</label>
                                <input id="typed" ref={inputRef} value={typed} autoComplete="off" autoCapitalize="off" spellCheck={false}
                                    onCompositionStart={() => { composing.current = true; }}
                                    onCompositionEnd={(e) => { composing.current = false; checkTyped(e.currentTarget.value, false); }}
                                    onChange={(e) => { setTyped(e.target.value); if (!composing.current && !(e.nativeEvent && e.nativeEvent.isComposing)) checkTyped(e.target.value, false); }}
                                    onKeyDown={(e) => {
                                        if (e.key !== 'Enter' || e.nativeEvent.isComposing || composing.current) return;
                                        e.preventDefault();
                                        if (result) next(); else checkTyped(typed, true);
                                    }}
                                    placeholder="Gõ từ tiếng Anh… khớp là tự chấm" className="field flex-1 text-lg min-h-[52px]" />
                                {!result
                                    ? <button type="button" onClick={() => checkTyped(typed, true)} className="btn btn-success">Kiểm tra <Kbd>Enter</Kbd></button>
                                    : <button type="button" onClick={next} className="btn btn-primary">Tiếp tục <Kbd>Enter</Kbd> <Kbd>Space</Kbd></button>}
                            </div>
                            <div className="flex flex-wrap gap-2 mb-4">
                                <button type="button" onClick={() => setHint(v => !v)} className="btn btn-secondary btn-sm">Gợi ý</button>
                                {mode === 'listen' && (
                                    <button type="button" onClick={record} className={'btn btn-sm ' + (recording ? 'btn-danger pulse-rec' : 'btn-secondary')}>
                                        <Icon name={recording ? 'stop' : 'mic'} size={14} /> {recording ? 'Dừng ghi' : 'Ghi âm'}
                                    </button>
                                )}
                            </div>
                            {hint && (
                                <div className="rounded-xl bg-warn-soft border border-amber-200 p-3 mb-4 text-sm text-flow">
                                    {mode === 'listen' || !hasBlank ? 'Chữ đầu: ' + (t.questionOrWord || '?').charAt(0) : 'Nghĩa: ' + (t.answerOrMeaning || '—')}
                                </div>
                            )}
                            {result && (
                                <div className={'p-4 rounded-xl border-2 mb-4 text-flow ' + (result.ok ? 'bg-success-soft border-success' : 'bg-danger-soft border-danger')} role="status">
                                    <p className="font-bold text-lg mb-1">{result.ok ? 'Chính xác' : 'Alo tổng đài cứu nét! Sai rồi, nhai lại câu này ngay!'}</p>
                                    {result.heard && <p>Bạn nói: {result.heard}</p>}
                                    {!result.ok && <p>Đáp án: <strong>{t.questionOrWord}</strong></p>}
                                    {t.answerOrMeaning && <p className="mt-1">Nghĩa: {t.answerOrMeaning}</p>}
                                    <InsightCard item={t} />
                                </div>
                            )}
                            <div className="flex justify-between">
                                <button type="button" onClick={prev} disabled={index === 0} className="btn btn-secondary">Trước</button>
                                <button type="button" onClick={next} className="btn btn-secondary">Bỏ qua</button>
                            </div>
                            {note && <p className="text-sm text-muted mt-3">{note}</p>}
                        </div>
                    )}
                </div>
            );
        };

        /* ---------------------------------------------------------------
         * EOSSimulator — giả lập phần mềm EOS WinForms. Chỉ chế độ này dùng giao diện cổ điển.
         * --------------------------------------------------------------- */
        const eosExamCode = (title) => {
            const parts = String(title || 'TEST').split('·').map(s => s.trim()).filter(Boolean);
            const head = (parts[0] && parts[0].toUpperCase() !== 'EOS' ? parts[0] : parts[1]) || parts[0] || 'TEST';
            const slug = head.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/gi, 'd')
                .replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '').toUpperCase().slice(0, 18);
            const base = slug || 'TEST';
            return /FE$/.test(base) ? base : base + '_FE';
        };

        /* Bài đọc dài (có xuống dòng): phần trước dòng cuối là đoạn văn, dòng cuối là câu hỏi. Ngắn thì giữ một khối. */
        const eosSplit = (text) => {
            const s = String(text || '');
            if (s.length < 320 || s.indexOf('\n') < 0) return { passage: '', ask: s };
            const lines = s.split(/\n+/).map(x => x.trim()).filter(Boolean);
            if (lines.length < 2) return { passage: '', ask: s };
            const ask = lines.pop();
            return { passage: lines.join('\n'), ask };
        };
        /* Keyword của câu; câu chưa có keyword thì lấy cụm trong ngoặc kép (vd. "reluctant"). */
        const eosKeywords = (t) => {
            if (!t) return [];
            if (t.keywords && t.keywords.length) return t.keywords;
            return (String(t.questionOrWord || '').match(/[“"]([^”"]{2,40})[”"]/g) || []).map(q => q.slice(1, -1));
        };
        const EosMarked = ({ text, keywords, on }) => {
            const s = text == null ? '' : String(text);
            if (!on || !keywords || !keywords.length) return <>{s}</>;
            return <>{Sec.highlightSegments(s, keywords).map((x, i) => (x.hit ? <mark key={i} className="eos-mark">{x.t}</mark> : <React.Fragment key={i}>{x.t}</React.Fragment>))}</>;
        };

        const EOSSimulator = ({ title, items, count, minutes, onSubmit, onExit, onDrillWrong, onOpenSlots, canExplain, toast, trial }) => {
            const bilingual = useMemo(() => items.some(Sch.hasVi), [items]);
            const byId = useMemo(() => new Map(items.map(t => [t.id, t])), [items]);
            const [paper] = useState(() => EOS.build(items, count));
            const [answers, setAnswers] = useState({});
            const [flags, setFlags] = useState({});
            const [cur, setCur] = useState(0);
            const [tab, setTab] = useState('mcq');
            const [endAt] = useState(() => Date.now() + minutes * 60000);
            const [wantFinish, setWantFinish] = useState(false);
            const [confirming, setConfirming] = useState(false);
            const [result, setResult] = useState(null);
            const [timeUp, setTimeUp] = useState(false);
            const [reviewing, setReviewing] = useState(null);
            const [explained, setExplained] = useState({});
            const [explaining, setExplaining] = useState(null);
            const [openCode, setOpenCode] = useState('');
            const [fontSize, setFontSize] = useState(10);
            const [kwOn, setKwOn] = useState(false);
            const [showVi, setShowVi] = useState(() => readQLang() === 'vi');
            const startedAt = useRef(Date.now());
            const submitted = useRef(false);
            const charging = useRef(false);
            const [paying, setPaying] = useState(false);
            const now = useNow(1000, !result);
            const left = endAt - now;
            const examCode = useMemo(() => eosExamCode(title), [title]);
            const student = String(Store.prefs.get('student', '') || 'Student').slice(0, 40);
            const q = tab === 'mcq' ? paper[cur] : null;
            const t = q ? byId.get(q.id) : null;
            const answeredCount = Object.keys(answers).length;
            const flagCount = Object.keys(flags).filter(k => flags[k]).length;
            const blankCount = paper.length - answeredCount;

            const submit = async (auto) => {
                if (submitted.current || charging.current) return;
                charging.current = true;
                setPaying(true);
                const r = EOS.grade(paper, answers, byId);
                r.usedMs = Date.now() - startedAt.current;
                r.flaggedIds = paper.filter((_, i) => flags[i]).map(pq => pq.id);
                let paid = true;
                let out = null;
                if (onSubmit) {
                    try {
                        out = await onSubmit(r);
                        if (out === false) paid = false;
                    } catch (e) {
                        paid = false;
                    }
                }
                charging.current = false;
                setPaying(false);
                setConfirming(false);
                if (!paid) return;
                r.queued = (out && typeof out === 'object' && out.queued) || 0;
                submitted.current = true;
                setWantFinish(true);
                setReviewing(null);
                setTab('mcq');
                if (auto) setTimeUp(true);
                setResult(r);
                if (auto && toast) toast('Hết giờ — hệ thống đã tự nộp bài', 'info');
            };

            useEffect(() => { if (!submitted.current && left <= 0) submit(true); }, [left <= 0]);

            const choose = (di, toggle) => {
                if (result || !q || di >= q.order.length) return;
                setAnswers(a => {
                    const next = Object.assign({}, a);
                    if (toggle && next[cur] === di) delete next[cur];
                    else next[cur] = di;
                    return next;
                });
                Sfx.tap();
            };
            const toggleFlag = () => { if (!result && tab === 'mcq') setFlags(f => Object.assign({}, f, { [cur]: !f[cur] })); };
            const go = (i) => { setTab('mcq'); setCur(Math.max(0, Math.min(paper.length - 1, i))); };
            const showQuestion = () => {
                const n = parseInt(openCode, 10);
                if (n >= 1 && n <= paper.length) go(n - 1);
            };
            const setSize = (v) => setFontSize(Math.max(8, Math.min(28, v)));
            const leave = () => {
                if (!result && !confirm('Thoát phòng thi? Bài làm sẽ không được chấm.')) return;
                onExit();
            };
            const askFinish = () => { if (wantFinish && !result && !paying) setConfirming(true); };
            const toggleKw = () => {
                if (!kwOn && t && !eosKeywords(t).length && toast) toast('Câu này chưa có keyword. Thử câu khác nhé.', 'info');
                setKwOn(v => !v);
            };
            /* Sau khi nộp: bấm số câu trên bảng là mở thẳng lời giải câu đó. */
            const jumpReview = (i) => {
                setReviewing('all');
                setTimeout(() => { const el = document.getElementById('eos-r-' + i); if (el) el.scrollIntoView({ block: 'start' }); }, 30);
            };

            useHotkeys('eos', {
                '1': () => choose(0), '2': () => choose(1), '3': () => choose(2), '4': () => choose(3),
                a: () => choose(0), b: () => choose(1), c: () => choose(2), d: () => choose(3),
                f: toggleFlag,
                ArrowRight: () => go(cur + 1),
                ArrowLeft: () => go(cur - 1)
            }, { enabled: !result && !confirming });

            const rightOf = (it) => Sch.LETTERS.indexOf(it.answerOrMeaning);
            const chosenOf = (i) => (answers[i] != null && paper[i] ? paper[i].order[answers[i]] : null);
            const isRight = (i) => { const it = byId.get(paper[i].id); return !!it && chosenOf(i) === rightOf(it); };
            const wrongIds = result ? result.wrong.map(w => w.id).filter(id => byId.has(id)) : [];
            const explainOne = async (it) => {
                setExplaining(it.id);
                try {
                    const txt = await AI.explain(it);
                    setExplained(m => Object.assign({}, m, { [it.id]: txt }));
                } catch (e) { toast && toast(e.message, 'error'); }
                finally { setExplaining(null); }
            };
            const clock = Plan.fmtCountdown(Math.max(0, left));

            const palette = (
                <>
                    <div role="list" aria-label="Danh sách câu hỏi" className="eos-pal">
                        {paper.map((_, i) => {
                            const here = i === cur && tab === 'mcq' && !result;
                            const tone = result ? (isRight(i) ? ' ok' : ' bad') : (answers[i] != null ? ' done' : '') + (flags[i] ? ' flag' : '');
                            const label = 'Câu ' + (i + 1) + (result ? (isRight(i) ? ', đúng' : ', sai') : (answers[i] != null ? ', đã chọn' : ', chưa làm') + (flags[i] ? ', cắm cờ' : ''));
                            return (
                                <button key={i} type="button" role="listitem" onClick={() => (result ? jumpReview(i) : go(i))} aria-current={here ? 'true' : undefined}
                                    aria-label={label} className={'eos-q' + tone + (here ? ' here' : '')}>{i + 1}</button>
                            );
                        })}
                    </div>
                    <div className="eos-legend" aria-hidden="true">
                        {result ? (
                            <><span><i className="ok" />Đúng</span><span><i className="bad" />Sai / bỏ trống</span></>
                        ) : (
                            <><span><i />Chưa làm</span><span><i className="here" />Đang chọn</span><span><i className="done" />Đã chọn</span><span><i className="flag" />Cắm cờ</span></>
                        )}
                    </div>
                </>
            );

            const header = (
                <div className="eos-top">
                    <div className="eos-info">
                        <div className="eos-row" style={{ marginTop: 0, marginBottom: 4 }}>
                            <span style={{ color: '#FF0000', fontWeight: 700 }}>Updated 11/06/2012</span>
                            <span className="eos-paper-name">{title} · {paper.length} câu{trial ? ' · Thi thử miễn phí' : ''}</span>
                        </div>
                        <div className="eos-grid">
                            <span className="eos-minor">Machine:</span><b className="eos-val eos-minor">FPT-STUDENT-PC</b>
                            <span className="eos-minor">Student:</span><b className="eos-val eos-minor">{student}</b>
                            <span className="eos-minor">Server:</span><b className="eos-val eos-minor">Eng_EOS_Server</b>
                            <span>Exam Code:</span><b className="eos-val">{examCode}</b>
                            <span>Duration:</span><b className="eos-val">{minutes} minutes</b>
                            <span>Total Marks:</span><b className="eos-val">{paper.length}</b>
                        </div>
                        <div className="eos-row">
                            <label className="eos-minor" style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
                                Open Code:
                                <input className="eos-field" value={openCode} inputMode="numeric" maxLength={4} style={{ width: 64 }}
                                    onChange={(e) => setOpenCode(e.target.value.replace(/\D/g, '').slice(0, 4))}
                                    onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); showQuestion(); } }}
                                    aria-label="Open Code" />
                                <button type="button" className="eos-btn" onClick={showQuestion}>Show Question</button>
                            </label>
                            <label style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
                                Font Size:
                                <input className="eos-field" type="number" min="8" max="28" value={fontSize} style={{ width: 56 }}
                                    onChange={(e) => setSize(parseInt(e.target.value, 10) || 10)} aria-label="Font Size" />
                            </label>
                        </div>
                        <div className="eos-row" role="toolbar" aria-label="Công cụ học FPass">
                            <span className="eos-tools-label">Trợ lý FPass:</span>
                            <button type="button" className="eos-btn" aria-pressed={kwOn} onClick={toggleKw}>🖍 Keyword</button>
                            <button type="button" className="eos-btn" aria-pressed={showVi} disabled={!bilingual} onClick={() => setShowVi(v => !v)}
                                title={bilingual ? 'Hiện bản dịch tiếng Việt dưới câu hỏi và lựa chọn' : 'Đề này chưa có bản dịch tiếng Việt'}>VI / EN</button>
                            {result ? <b className="eos-val" style={{ fontSize: 16 }}>{timeUp ? 'Time is up. ' : ''}Examination Over!</b> : null}
                        </div>
                    </div>
                    <div className="eos-timer" role="timer" aria-label={'Còn ' + clock}>
                        <span>Time Left:</span>
                        <span className="eos-clock">{clock}</span>
                    </div>
                    <div className="eos-side">
                        <div className="eos-box">
                            <div>Multiple choice: {paper.length} question</div>
                            <div>Fill Blank: 0 question</div>
                            <div>Answered: {answeredCount}/{paper.length}{flagCount ? ' · Flag: ' + flagCount : ''}</div>
                        </div>
                        {palette}
                    </div>
                </div>
            );

            /* Bản dịch trùng nguyên văn (số liệu, tên riêng) thì không lặp thêm dòng. */
            const sameText = (a, b) => String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase();
            const viOf = (it, oi) => (showVi && it.optionsVi && it.optionsVi[oi] && !sameText(it.optionsVi[oi], it.options[oi]) ? <span className="eos-vi">{it.optionsVi[oi]}</span> : null);

            let body;
            if (!paper.length) {
                body = <div className="eos-sunken" style={{ flex: 1, padding: 16 }}>There is no question in this paper.</div>;
            } else if (result && reviewing) {
                const rows = paper.map((pq, i) => ({ i, pq, it: byId.get(pq.id) })).filter(x => x.it);
                const list = rows.filter(x => (reviewing === 'all' ? true : reviewing === 'flag' ? flags[x.i] : !isRight(x.i)));
                const filters = [['wrong', 'Câu sai', rows.filter(x => !isRight(x.i)).length], ['flag', 'Cắm cờ', rows.filter(x => flags[x.i]).length], ['all', 'Tất cả', rows.length]];
                body = (
                    <div className="eos-sunken eos-review">
                        <div className="eos-row" style={{ marginTop: 0, marginBottom: 8 }}>
                            <button type="button" className="eos-btn" onClick={() => setReviewing(null)}>Back</button>
                            <span role="group" aria-label="Lọc câu" style={{ display: 'inline-flex', flexWrap: 'wrap', gap: 4 }}>
                                {filters.map(([k, label, n]) => (
                                    <button key={k} type="button" className="eos-btn" aria-pressed={reviewing === k} onClick={() => setReviewing(k)}>{label} ({n})</button>
                                ))}
                            </span>
                        </div>
                        {!list.length ? <p style={{ padding: 8 }}>Không có câu nào trong mục này.</p> : list.map(({ i, pq, it }) => {
                            const right = rightOf(it);
                            const chosen = chosenOf(i);
                            const ok = chosen === right;
                            const split = eosSplit(it.questionOrWord);
                            const expl = showVi && it.explanationVi ? it.explanationVi : it.explanationOrExample;
                            return (
                                <div key={i} id={'eos-r-' + i} className="eos-r">
                                    <div>
                                        <b>Question {i + 1}</b>{' '}
                                        <span className={ok ? 'eos-ok' : 'eos-bad'}>{ok ? '✓ Đúng' : chosen == null ? '✗ Bỏ trống' : '✗ Sai'}</span>
                                        {flags[i] ? <span className="eos-flag-tag">⚑ Cắm cờ</span> : null}
                                    </div>
                                    {split.passage ? <details style={{ marginTop: 4 }}><summary>Xem đoạn văn</summary><div className="eos-passage-text">{split.passage}</div></details> : null}
                                    <div style={{ overflowWrap: 'anywhere', marginTop: 4 }}><EosMarked text={split.ask} keywords={eosKeywords(it)} on={kwOn} /></div>
                                    {showVi && it.questionVi ? <div className="eos-vi">{eosSplit(it.questionVi).ask}</div> : null}
                                    <ul className="eos-r-opts">
                                        {pq.order.map((oi, di) => (
                                            <li key={oi} className={oi === right ? 'is-right' : oi === chosen ? 'is-wrong' : ''}>
                                                <b>{Sch.LETTERS[di]}.</b> {it.options[oi]}
                                                {oi === right ? ' ✓ Đáp án đúng' : oi === chosen ? ' ← Bạn chọn' : ''}
                                                {viOf(it, oi)}
                                            </li>
                                        ))}
                                    </ul>
                                    {expl ? <div style={{ marginTop: 6, overflowWrap: 'anywhere' }}><b>Giải thích: </b>{expl}</div> : null}
                                    {explained[it.id] ? <div style={{ marginTop: 4, overflowWrap: 'anywhere' }}>{explained[it.id]}</div> : null}
                                    {canExplain && !explained[it.id] ? <button type="button" className="eos-btn" style={{ marginTop: 6 }} disabled={explaining === it.id} onClick={() => explainOne(it)}>{explaining === it.id ? 'Explaining…' : 'AI giải thích thêm'}</button> : null}
                                </div>
                            );
                        })}
                    </div>
                );
            } else if (result) {
                body = (
                    <div className="eos-sunken" style={{ flex: 1, minHeight: 240, padding: 16, background: '#ECE9D8' }}>
                        <fieldset style={{ border: '2px groove #fff', padding: '12px 16px', maxWidth: 640 }}>
                            <legend style={{ padding: '0 6px' }}>Result</legend>
                            <div className="eos-result-grid">
                                <span>Correct answers</span><b className="eos-val">{result.correct} / {result.total}</b>
                                <span>Mark ( /10 )</span><b className="eos-val">{result.score10.toFixed(1)}</b>
                                <span>Time used</span><b className="eos-val">{Plan.fmtCountdown(result.usedMs)}</b>
                                <span>Flagged</span><b className="eos-val">{flagCount}</b>
                            </div>
                            {result.queued ? (
                                <p className="eos-note">Đã đưa {result.queued} câu sai / cắm cờ vào thẻ ôn của Ca học 3 buổi. Các ca tới sẽ nhắc lại những câu này trước cho đến khi bạn nhớ chắc.</p>
                            ) : null}
                            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start', gap: 6, marginTop: 10 }}>
                                <button type="button" className="eos-btn" onClick={() => setReviewing(wrongIds.length ? 'wrong' : 'all')} data-autofocus>[ Xem đáp án đúng / sai & Giải thích ]</button>
                                {onDrillWrong && <button type="button" className="eos-btn" disabled={!wrongIds.length} onClick={() => onDrillWrong(wrongIds)}>[ Đẩy các câu sai vào Băng đạn 5 câu để cày lại ngay ]</button>}
                                {onOpenSlots && result.queued ? <button type="button" className="eos-btn" onClick={onOpenSlots}>[ Mở Ca học 3 buổi ]</button> : null}
                            </div>
                            {trial ? <p style={{ marginTop: 10 }}>Đây là bản thi thử 10 câu lấy từ Chặng 1. Đề đầy đủ 30–50 câu trộn cả 3 chặng dùng lượt EOS.</p> : null}
                        </fieldset>
                    </div>
                );
            } else if (tab === 'blank') {
                body = <div className="eos-sunken" style={{ flex: 1, minHeight: 240, padding: 16, background: '#fff' }}>There is no Fill Blank question in this paper.</div>;
            } else {
                const split = t ? eosSplit(t.questionOrWord) : { passage: '', ask: '' };
                const splitVi = t && t.questionVi ? eosSplit(t.questionVi) : { passage: '', ask: '' };
                const kws = eosKeywords(t);
                const ask = (
                    <>
                        {t && <p style={{ overflowWrap: 'anywhere', margin: 0 }}><EosMarked text={split.ask} keywords={kws} on={kwOn} /></p>}
                        {t && showVi && splitVi.ask ? <p className="eos-vi" style={{ margin: '4px 0 0' }}>{splitVi.ask}</p> : null}
                        <div style={{ marginTop: 16 }}>
                            {q && t && q.order.map((oi, di) => (
                                <button key={oi} type="button" className={'eos-hit' + (answers[cur] === di ? ' on' : '')} aria-pressed={answers[cur] === di} onClick={() => choose(di, false)}>
                                    <b>{Sch.LETTERS[di]}.</b> {t.options[oi]}
                                    {viOf(t, oi)}
                                </button>
                            ))}
                        </div>
                    </>
                );
                body = (
                    <div style={{ flex: 1, minHeight: 280, display: 'flex', flexDirection: 'column' }}>
                        <div style={{ color: '#0000FF', fontWeight: 700, padding: '4px 2px' }}>
                            Multiple choices {cur + 1}/{paper.length}
                            {flags[cur] ? <span className="eos-flag-tag">⚑ Đánh dấu xem lại</span> : null}
                        </div>
                        <div className="eos-sunken eos-work">
                            <div className="eos-answers">
                                <div style={{ fontWeight: 700, marginBottom: 8 }}>Answer</div>
                                <div role="group" aria-label={'Đáp án câu ' + (cur + 1)}>
                                    {q && q.order.map((oi, di) => (
                                        <label key={oi} style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 6, cursor: 'pointer' }}>
                                            <input type="checkbox" checked={answers[cur] === di} onChange={() => choose(di, true)} aria-label={Sch.LETTERS[di]} />
                                            <span>{Sch.LETTERS[di]}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>
                            <div className="eos-paper" style={{ fontSize: fontSize + 'pt' }}>
                                {split.passage ? (
                                    <div className="eos-read">
                                        <div className="eos-passage" tabIndex={0} role="region" aria-label="Đoạn văn">
                                            <div className="eos-passage-text"><EosMarked text={split.passage} keywords={kws} on={kwOn} /></div>
                                            {showVi && splitVi.passage ? <div className="eos-vi eos-passage-text" style={{ marginTop: 8 }}>{splitVi.passage}</div> : null}
                                        </div>
                                        <div>{ask}</div>
                                    </div>
                                ) : ask}
                            </div>
                        </div>
                        <div className="eos-nav">
                            <button type="button" className="eos-btn" onClick={() => go(cur - 1)} disabled={cur === 0}>‹ Câu trước</button>
                            <button type="button" className="eos-btn" aria-pressed={!!flags[cur]} onClick={toggleFlag}>⚑ {flags[cur] ? 'Bỏ cờ' : 'Cắm cờ xem lại'}</button>
                            <button type="button" className="eos-btn eos-next" onClick={() => go(cur + 1)} disabled={cur >= paper.length - 1}>Câu tiếp theo (Next) ›</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="eos-shell" role="region" aria-label="Phòng thi giả lập EOS">
                    <div className="eos-form">
                        <div className="eos-mbar" role="timer" aria-label={'Còn ' + clock}>
                            <b>{examCode}</b>
                            <span>{answeredCount}/{paper.length} câu</span>
                            <span className="eos-clock">{clock}</span>
                        </div>
                        {header}
                        <div style={{ display: 'flex', alignItems: 'flex-end', marginTop: 8 }}>
                            <button type="button" className="eos-tab" role="tab" aria-selected={tab === 'mcq' && !result} onClick={() => { setTab('mcq'); setReviewing(null); }}>Multiple Choices</button>
                            <button type="button" className="eos-tab" role="tab" aria-selected={tab === 'blank' && !result} onClick={() => { if (!result) setTab('blank'); }}>Fill Blank</button>
                        </div>
                        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', borderTop: '2px solid #fff', minHeight: 0 }}>{body}</div>
                        <div className="eos-foot">
                            <label style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
                                <input type="checkbox" checked={wantFinish} disabled={!!result} onChange={(e) => setWantFinish(e.target.checked)} />
                                I want to finish the exam.
                            </label>
                            <button type="button" className="eos-btn" disabled={!wantFinish || !!result || paying} onClick={askFinish}
                                style={wantFinish && !result && !paying ? { background: '#FFFF99' } : undefined}>{paying ? '…' : 'Nộp bài (Finish)'}</button>
                            <span className="eos-updated">Updated 01/10/2010</span>
                            <button type="button" className="eos-btn" onClick={leave}>Exit</button>
                        </div>
                    </div>
                    {confirming && !result && (
                        <div className="eos-overlay" onKeyDown={(e) => { if (e.key === 'Escape') setConfirming(false); }}>
                            <div className="eos-msg" role="alertdialog" aria-modal="true" aria-labelledby="eos-msg-title" aria-describedby="eos-msg-text">
                                <div className="eos-msg-bar" id="eos-msg-title">Xác nhận nộp bài</div>
                                <div className="eos-msg-body" id="eos-msg-text">
                                    <p>Bạn chắc chắn muốn nộp bài? Đã làm <b>{answeredCount}/{paper.length}</b> câu.</p>
                                    {blankCount ? <p style={{ color: '#C62828' }}>Còn {blankCount} câu chưa chọn đáp án.</p> : null}
                                    {flagCount ? <p>{flagCount} câu đang cắm cờ xem lại.</p> : null}
                                    <p>Nộp rồi không sửa được.{trial ? '' : ' Bài nộp trừ 1 lượt EOS.'}</p>
                                </div>
                                <div className="eos-msg-foot">
                                    <button type="button" className="eos-btn" onClick={() => submit(false)} disabled={paying}>{paying ? 'Đang nộp…' : 'Nộp bài'}</button>
                                    <button type="button" className="eos-btn" onClick={() => setConfirming(false)} autoFocus>Quay lại làm tiếp</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const EOSSetup = ({ max, onStart, onClose }) => {
            const sizes = [30, 40, 50].filter(n => n <= max);
            const [n, setN] = useState(sizes.length ? sizes[sizes.length > 1 ? 1 : 0] : max);
            const choices = sizes.length ? sizes : [max];
            return (
                <Modal title="Phòng thi giả lập EOS" onClose={onClose}
                    footer={<><button type="button" className="btn btn-secondary" onClick={onClose}>Hủy</button><button type="button" className="btn btn-primary" onClick={() => onStart(n, Math.max(5, Math.round(n * 1.2)))} data-autofocus><Icon name="play" /> Vào phòng thi</button></>}>
                    <p className="text-sm text-ink2 mb-3">Trộn ngẫu nhiên câu hỏi và thứ tự đáp án. Hết giờ hệ thống tự nộp bài. Câu sai và câu cắm cờ tự vào thẻ ôn của Ca học 3 buổi.</p>
                    <p className="label">Số câu</p>
                    <div className="flex flex-wrap gap-2" role="radiogroup" aria-label="Số câu">
                        {choices.map(c => (
                            <button key={c} type="button" role="radio" aria-checked={n === c} onClick={() => setN(c)} className={'btn ' + (n === c ? 'btn-primary' : 'btn-secondary')}>{c} câu · {Math.max(5, Math.round(c * 1.2))} phút</button>
                        ))}
                    </div>
                    {max < 30 && <p className="text-xs text-muted mt-3">Kho hiện có {max} câu trắc nghiệm nên đề chỉ gồm {max} câu.</p>}
                </Modal>
            );
        };
        /* ===================== MODE 1 · Sổ tay & Lịch học ===================== */
        const sessionModeOf = (m) => (m === 'test' ? 'test' : m === 'burst' ? 'burst' : 'flash');

        const b64EncodeUtf8 = (str) => {
            const bytes = new TextEncoder().encode(str);
            let bin = '';
            for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
            return btoa(bin);
        };
        const b64DecodeUtf8 = (b64) => {
            const bin = atob(String(b64).replace(/\s+/g, ''));
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new TextDecoder().decode(bytes);
        };

        const DayStrip = ({ dayKey }) => (
            <div className="flex flex-wrap justify-center gap-1 mb-4 text-xs" aria-label="Ngày trong tuần">
                {Plan.WEEK.map(k => (
                    <span key={k} aria-current={k === dayKey ? 'date' : undefined} className={'px-2.5 py-1 rounded-full ' + (k === dayKey ? 'bg-ink text-white font-semibold' : 'text-muted')}>{Plan.WEEK_LABEL[k]}</span>
                ))}
            </div>
        );

        const SlotTrack = ({ slots, activeId }) => (
            <ol className="grid grid-cols-3 gap-2 mb-5" aria-label="3 việc hôm nay">
                {slots.map(s => {
                    const done = s.status === 'done';
                    const gate = s.status === 'phase2';
                    const tone = s.nghi ? 'bg-surface2 text-muted border-line' : done ? 'bg-success-soft text-success border-green-200' : gate ? 'bg-warn-soft text-warn border-amber-200' : s.id === activeId ? 'bg-primary-soft text-primary border-indigo-200' : 'bg-surface text-ink2 border-line';
                    return (
                        <li key={s.id} className={'rounded-xl border px-3 py-2 text-left ' + tone}>
                            <p className="text-[11px] font-semibold uppercase tracking-wide flex items-center gap-1">
                                <Icon name={s.nghi ? 'x' : done ? 'check' : gate ? 'book' : 'clock'} size={12} />
                                {s.nghi ? 'Nghỉ' : done ? 'Xong' : gate ? 'Đọc sách' : Plan.hhmmOf(Plan.triggerMin(s))}
                            </p>
                            <p className="text-sm font-medium text-flow">{s.anchorLabel}</p>
                        </li>
                    );
                })}
            </ol>
        );

        /* ---------- Flow Bridge: 8 thẻ mồi → đồng hồ đọc sách ngoài đời → cổng kiểm chứng ---------- */
        const FlowBridge = ({ slot, items, addItems, finishGate, toast, now }) => {
            const p2 = slot.phase2_externalTask || {};
            const p3 = slot.phase3_verificationGate || {};
            const need = p3.gateType === 'harvest_words' ? 0 : (p3.sentenceCount || 1);
            const [sentences, setSentences] = useState(() => Array.from({ length: Math.max(1, need) }, () => ''));
            const [harvest, setHarvest] = useState([{ term: '', meaning: '' }, { term: '', meaning: '' }]);
            const [err, setErr] = useState('');
            const [busy, setBusy] = useState(false);
            const rang = useRef(false);
            const total = Math.max(1, p2.durationMinutes || 25) * 60000;
            const started = slot.phase2StartedAt ? new Date(slot.phase2StartedAt).getTime() : now;
            const left = Math.max(0, started + total - now);

            useEffect(() => {
                if (left === 0 && !rang.current) { rang.current = true; Sfx.knock(); }
            }, [left === 0]);

            const slotWords = () => {
                const byId = new Map(items.map(t => [t.id, t]));
                const fromDeck = (slot.deckIds || []).map(id => byId.get(id)).filter(Sch.isFilled);
                return fromDeck.length ? fromDeck : Sch.byGroup(items, slot.group);
            };

            const submitSentences = async () => {
