            const ranges = [];
            words.forEach(w => {
                const src = String(w.word || '').trim();
                if (src.length < 2) return;
                const re = new RegExp(src.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig');
                let m;
                while ((m = re.exec(sentence))) {
                    ranges.push({ start: m.index, end: m.index + m[0].length, wordId: w.id });
                    if (m.index === re.lastIndex) re.lastIndex += 1;
                }
            });
            ranges.sort((a, b) => a.start - b.start || b.end - a.end);
            const kept = [];
            let cursor = 0;
            ranges.forEach(r => {
                if (r.start < cursor) return;
                kept.push(r);
                cursor = r.end;
            });
            return kept;
        };
        const renderSentence = (sentence, active, charIndex, words, onMark, onAdd) => {
            const ranges = markRanges(sentence, words);
            const bits = [];
            const pushPlain = (from, to) => {
                const slice = sentence.slice(from, to);
                const re = /[A-Za-z]+(?:'[A-Za-z]+)?/g;
                let m;
                let last = 0;
                while ((m = re.exec(slice))) {
                    if (m.index > last) bits.push({ kind: 'gap', text: slice.slice(last, m.index), key: from + '-' + last });
                    const abs = from + m.index;
                    bits.push({ kind: 'tok', text: m[0], key: 't' + abs, karaoke: active && charIndex >= abs && charIndex < abs + m[0].length });
                    last = m.index + m[0].length;
                }
                if (last < slice.length) bits.push({ kind: 'gap', text: slice.slice(last), key: from + '-g' + last });
            };
            let at = 0;
            ranges.forEach(r => {
                if (r.start > at) pushPlain(at, r.start);
                bits.push({ kind: 'mark', text: sentence.slice(r.start, r.end), key: 'm' + r.start, id: r.wordId, karaoke: active && charIndex >= r.start && charIndex < r.end });
                at = r.end;
            });
            if (at < sentence.length) pushPlain(at, sentence.length);
            return bits.map(b => {
                if (b.kind === 'gap') return <span key={b.key}>{b.text}</span>;
                if (b.kind === 'mark') {
                    return <span key={b.key} role="button" tabIndex={0} className={'cursor-pointer rounded px-0.5 transition-colors ' + (b.karaoke ? 'bg-amber-200/90 text-slate-900 font-medium' : 'bg-indigo-50 text-[#4338CA] border-b-2 border-[#4338CA]')} onClick={(e) => { e.stopPropagation(); onMark(b.id); }} onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); onMark(b.id); } }}>{b.text}</span>;
                }
                return <span key={b.key} className={b.karaoke ? 'bg-amber-200/90 text-slate-900 font-medium rounded px-0.5 transition-colors' : ''} onClick={(e) => { e.stopPropagation(); onAdd(b.text); }}>{b.text}</span>;
            });
        };

        const PassageReader = ({ toast, onClose, onSave }) => {
            const fund = useFund();
            const [phase, setPhase] = useState('edit');
            const [draft, setDraft] = useState('');
            const [busy, setBusy] = useState(false);
            const [sentences, setSentences] = useState([]);
            const [words, setWords] = useState([]);
            const [preview, setPreview] = useState(false);
            const [index, setIndex] = useState(0);
            const [playing, setPlaying] = useState(false);
            const [speed, setSpeed] = useState(1);
            const [shadow, setShadow] = useState(false);
            const [waitUntil, setWaitUntil] = useState(0);
            const [charIndex, setCharIndex] = useState(-1);
            const [offer, setOffer] = useState(null);
            const [syncing, setSyncing] = useState(false);
            const tokenRef = useRef(0);
            const playRef = useRef(() => {});
            const indexRef = useRef(0);
            const sentencesRef = useRef([]);
            const speedRef = useRef(1);
            const shadowRef = useRef(false);
            const playingRef = useRef(false);
            const waitRef = useRef(0);
            const advanced = useRef(0);
            const now = useNow(200, phase === 'read' && !!waitUntil);
            sentencesRef.current = sentences;
            indexRef.current = index;
            speedRef.current = speed;
            shadowRef.current = shadow;
            playingRef.current = playing;
            waitRef.current = waitUntil;

            const stopSpeak = () => {
                tokenRef.current += 1;
                setPlaying(false);
                setWaitUntil(0);
                setCharIndex(-1);
                try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
            };
            const playAt = (i) => {
                const list = sentencesRef.current;
                if (!list.length || !window.speechSynthesis) {
                    toast('Trình duyệt này chưa đọc được tiếng Anh.', 'info');
                    return;
                }
                const n = Math.max(0, Math.min(list.length - 1, i));
                setIndex(n);
                indexRef.current = n;
                setCharIndex(-1);
                setWaitUntil(0);
                const token = ++tokenRef.current;
                try { window.speechSynthesis.cancel(); } catch (e) {}
                const u = new SpeechSynthesisUtterance(list[n]);
                u.lang = 'en-US';
                u.rate = speedRef.current;
                const voices = window.speechSynthesis.getVoices() || [];
                const voice = voices.filter(v => /en-US/i.test(v.lang))[0] || voices.filter(v => /^en/i.test(v.lang))[0];
                if (voice) u.voice = voice;
                u.onboundary = (ev) => {
                    if (token !== tokenRef.current || typeof ev.charIndex !== 'number') return;
                    setCharIndex(ev.charIndex);
                };
                u.onend = () => {
                    if (token !== tokenRef.current) return;
                    setPlaying(false);
                    setCharIndex(-1);
                    if (n >= list.length - 1) return;
                    if (shadowRef.current) setWaitUntil(Date.now() + 3500);
                    else playRef.current(n + 1);
                };
                u.onerror = () => { if (token === tokenRef.current) setPlaying(false); };
                setPlaying(true);
                window.setTimeout(() => {
                    if (token !== tokenRef.current) return;
                    try { window.speechSynthesis.speak(u); } catch (e) { setPlaying(false); }
                }, 50);
            };
            playRef.current = playAt;
            useEffect(() => () => { tokenRef.current += 1; try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {} }, []);
            useEffect(() => {
                if (!waitUntil || now < waitUntil || advanced.current === waitUntil) return;
                advanced.current = waitUntil;
                const next = indexRef.current + 1;
                setWaitUntil(0);
                if (next < sentencesRef.current.length) playRef.current(next);
            }, [now, waitUntil]);
            const onSpace = () => {
                if (waitRef.current) {
                    const next = indexRef.current + 1;
                    if (next >= sentencesRef.current.length) stopSpeak();
                    else playAt(next);
                    return;
                }
                if (playingRef.current) stopSpeak();
                else playAt(indexRef.current);
            };
            useHotkeys('passage', phase === 'read' ? {
                Space: { run: onSpace, overrideButton: true },
                r: { run: () => playAt(indexRef.current) },
                ArrowLeft: { run: () => playAt(indexRef.current) },
                ArrowRight: { run: () => { const next = indexRef.current + 1; if (next < sentencesRef.current.length) playAt(next); } }
            } : {}, { enabled: phase === 'read' });

            const analyze = async () => {
                setBusy(true);
                try {
                    const result = await AI.extractPassage(draft);
                    const lines = splitSentences(draft);
                    if (!result.words.length) {
                        toast('AI chưa tách được từ nào trong đoạn này.', 'info');
                        return;
                    }
                    affirmStudy(toast);
                    setSentences(lines);
                    setWords(result.words.map((w, i) => ({
                        id: 'p' + i,
                        word: w.word,
                        wordType: w.wordType,
                        ipa: w.ipa,
                        meaning: w.meaning,
                        tip: w.tip,
                        sentence: w.sentence,
                        sentenceIndex: w.sentenceIndex >= 0 && w.sentenceIndex < lines.length ? w.sentenceIndex : sentenceIndexOf(lines, w.word, w.sentence),
                        checked: true
                    })));
                    setPreview(!!result.preview);
                    setOffer(null);
                    setIndex(0);
                    setPhase('read');
                } catch (e) {
                    if (e && e.code === 'ai-locked') setPhase('pay');
                    else toast((e && e.message) || 'Chưa quét được đoạn văn.', 'error');
                } finally {
                    setBusy(false);
                }
            };
            const toggleWord = (id) => setWords(list => list.map(w => (w.id === id ? Object.assign({}, w, { checked: !w.checked }) : w)));
            const addPlain = (surface) => {
                if (preview) return;
                const low = surface.toLowerCase();
                const hit = words.find(w => w.word.toLowerCase() === low);
                if (hit) { toggleWord(hit.id); return; }
                setWords(list => list.concat([{ id: 'm' + Date.now(), word: surface, wordType: '', ipa: '', meaning: '', tip: '', sentence: sentences[index] || '', sentenceIndex: index, checked: true }]));
            };
            const chosen = words.filter((w, i) => w.checked && !(preview && i >= 3));
            const allOn = words.length > 0 && words.every((w, i) => (preview && i >= 3) || w.checked);
            const saveChosen = () => {
                if (!chosen.length || preview) return;
                onSave(chosen.map(w => Sch.normalizeItem({
                    type: 'vocab',
                    group: 'Bài đọc',
                    questionOrWord: w.word,
                    wordType: w.wordType,
                    ipa: w.ipa,
                    answerOrMeaning: w.meaning,
                    explanationOrExample: sentences[w.sentenceIndex] || w.sentence || '',
                    exampleVi: w.tip,
                    keywords: w.tip ? [w.tip] : []
                })));
                stopSpeak();
                onClose();
            };
            const checkPay = () => {
                setSyncing(true);
                E.Quota.sync().then((r) => {
                    if (r.aiUnlocked || r.aiJustUnlocked || r.aiJustFunded) {
                        toast(r.added > 0 ? 'Đã cộng ' + r.added + ' lượt EOS và bật trợ lý AI.' : (r.aiJustFunded ? 'Đã cộng 500 lượt điền và 30 lượt quét.' : 'Đã bật trợ lý AI.'), 'success');
                        setPreview(false);
                        setOffer(null);
                        if (phase === 'pay') setPhase('edit');
                    } else toast('Chưa thấy giao dịch mới cho nội dung ' + E.Quota.memoOf(r.code) + '.', 'info');
                }).catch((e) => toast(e.message || 'Chưa kiểm tra được thanh toán.', 'error')).finally(() => setSyncing(false));
            };
            const payBox = () => {
                const pack = offer === 'basic' ? E.Quota.packs.find(p => p.id === 'basic') : E.Quota.vocab;
                if (offer && pack) {
                    return (
                        <PayGate>
                        <div className="mt-3 flex flex-wrap items-center gap-4">
                            <img src={E.Quota.qrUrl(pack.price, fund.code)} alt={'VietQR ' + pack.price + ' đồng'} className="h-36 w-36 rounded-xl border border-line bg-white object-contain" />
                            <div className="min-w-0 flex-1 text-sm text-ink2">
                                <p className="font-semibold text-ink">{pack.name}</p>
                                <p className="tnum mt-1">Số tiền: <b className="text-ink">{vnd(pack.price)}</b></p>
                                <p className="tnum">Nội dung: <b className="text-ink">{E.Quota.memoOf(fund.code)}</b></p>
                                <button type="button" className="btn btn-primary mt-3" disabled={syncing} onClick={checkPay}>{syncing ? 'Đang kiểm tra…' : 'Kiểm tra chuyển khoản'}</button>
                                <button type="button" className="btn btn-ghost btn-sm mt-1" onClick={() => setOffer(null)}>Chọn lại</button>
                            </div>
                        </div>
                        </PayGate>
                    );
                }
                return (
                    <div>
                        <button type="button" className="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-[#4338CA] px-6 py-3 font-semibold text-white shadow-sm transition-all hover:bg-[#3730A3]" onClick={() => setOffer('vocab')}>Mở khóa ngay — 29.000đ (Quét QR tự động 3s)<Icon name="arrow" size={16} /></button>
                        <button type="button" className="mt-2 block w-full text-center text-xs text-slate-400 underline underline-offset-2" onClick={() => setOffer('basic')}>Sinh viên FPT cần thi EOS? Chọn Gói Cơ Bản (100k - 20 lượt EOS + Tặng Free gói AI này) ↗</button>
                    </div>
                );
            };
            const speeds = [0.8, 1, 1.25];
            const leftMs = waitUntil ? Math.max(0, waitUntil - now) : 0;
            return (
                <Modal title="AI Quét bài đọc" badge={fund.aiUnlocked && !(fund.aiCredits > 0) ? 'Tối đa 15 lượt quét mỗi ngày' : ('Còn ' + Math.max(0, 2 + (fund.scanGrant || 0) - (fund.scans || 0)) + ' lượt quét')} onClose={() => { stopSpeak(); onClose(); }} size="xl">
                    {phase === 'edit' && (
                        <div className="space-y-3">
                            <p className="text-sm text-ink2">Dán bài đọc IELTS, đề thi hoặc slide. Hai lần đầu trừ vào 100 lượt AI miễn phí. Lần sau chỉ hiện 3 từ mẫu, không gọi AI.</p>
                            <textarea value={draft} onChange={(e) => setDraft(e.target.value.slice(0, 2500))} maxLength={2500} rows={10} data-autofocus className="w-full min-h-[220px] outline-none focus:outline-none border border-slate-200 focus:border-[#4338CA] focus:ring-4 focus:ring-[#4338CA]/10 rounded-xl p-4 text-slate-700 transition-all" placeholder="Dán đoạn tiếng Anh vào đây…" aria-label="Đoạn văn cần quét" />
                            <p className="text-right text-xs text-slate-400">{draft.length}/2500</p>
                            <button type="button" className="btn btn-primary" disabled={busy || draft.trim().length < 40} onClick={analyze}><Icon name="sparkles" size={16} /> {busy ? 'Đang phân tích…' : 'Phân tích & Highlight từ vựng'}</button>
                        </div>
                    )}
                    {phase === 'pay' && (
                        <div className="mx-auto max-w-md space-y-3">
                            <p className="text-sm text-ink2">Bạn đã dùng hết lượt quét thử. Mở khóa một lần để quét bài đọc và tự điền không giới hạn.</p>
                            {payBox()}
                        </div>
                    )}
                    {phase === 'read' && (
                        <div className="grid items-start gap-4 lg:grid-cols-5">
                            <div className="lg:col-span-3 space-y-3">
                                <div>
                                    <div className="mb-1 flex items-center justify-between text-xs text-slate-400">
                                        <span>Câu {index + 1} / {sentences.length}</span>
                                    </div>
                                    <div className="h-1.5 overflow-hidden rounded-full bg-slate-100">
                                        <div className="h-full rounded-full bg-[#4338CA] transition-all" style={{ width: sentences.length ? ((index + 1) / sentences.length * 100) + '%' : '0%' }} />
                                    </div>
                                    {leftMs > 0 && (
                                        <div className="mt-2">
                                            <p className="text-xs text-slate-500">Đến lượt bạn đọc nhại lại... (Bấm Space để qua câu tiếp)</p>
                                            <div className="mt-1 h-0.5 overflow-hidden rounded-full bg-slate-100">
                                                <div className="h-full bg-[#4338CA]" style={{ width: (leftMs / 3500 * 100) + '%' }} />
                                            </div>
                                        </div>
                                    )}
                                    <p className="mt-2 text-xs text-slate-400">[Space]: Tạm dừng / Tiếp tục · [R] hoặc [←]: Nghe lại câu này · [→]: Câu tiếp</p>
                                </div>
                                <div className="flex flex-wrap items-center gap-2">
                                    <button type="button" className="inline-flex items-center gap-2 rounded-xl border border-line px-3 min-h-[36px] text-sm font-medium" onClick={onSpace}><Icon name={playing ? 'pause' : 'play'} size={14} /> {playing ? 'Dừng' : 'Nghe'}</button>
                                    <div className="inline-flex rounded-full bg-surface2 p-0.5" role="group" aria-label="Tốc độ đọc">
                                        {speeds.map(s => (
                                            <button key={s} type="button" className={'rounded-full px-2.5 min-h-[32px] text-xs font-medium ' + (speed === s ? 'bg-white text-ink shadow-sm' : 'text-slate-400')} onClick={() => { setSpeed(s); speedRef.current = s; if (playingRef.current) playAt(indexRef.current); }}>{s === 1 ? '1.0x' : s + 'x'}</button>
                                        ))}
                                    </div>
                                    <button type="button" aria-pressed={shadow} className={'inline-flex items-center gap-2 rounded-xl border px-3 min-h-[36px] text-sm font-medium ' + (shadow ? 'border-[#4338CA]/30 bg-[#4338CA]/10 text-[#4338CA]' : 'border-line text-ink2')} onClick={() => setShadow(v => !v)}><Icon name="mic" size={14} /> Tự dừng mỗi câu</button>
                                </div>
                                <div className="max-h-[48vh] space-y-1 overflow-y-auto text-[15px] leading-7 text-ink">
                                    {sentences.map((line, i) => (
                                        <p key={i} className={'cursor-pointer rounded px-1 ' + (i === index ? 'bg-slate-100/80' : '')} onClick={() => playAt(i)}>
                                            {renderSentence(line, i === index, i === index ? charIndex : -1, preview ? words.slice(0, 3) : words, toggleWord, addPlain)}
                                        </p>
                                    ))}
                                </div>
                                <button type="button" className="text-xs text-slate-400 underline underline-offset-2" onClick={() => { stopSpeak(); setPhase('edit'); }}>Dán đoạn khác</button>
                            </div>
                            <div className="lg:col-span-2 flex max-h-[68vh] flex-col">
                                <div className="mb-2 flex justify-end">
                                    <button type="button" className="text-xs text-slate-400 underline underline-offset-2" onClick={() => setWords(list => list.map((w, i) => (preview && i >= 3 ? w : Object.assign({}, w, { checked: !allOn }))))}>{allOn ? 'Bỏ chọn tất cả' : 'Chọn tất cả'}</button>
                                </div>
                                <div className="relative min-h-0 flex-1 space-y-2 overflow-y-auto pr-1">
                                    {words.map((w, i) => {
                                        const locked = preview && i >= 3;
                                        const reading = Sch.readingOf({ ipa: w.ipa });
                                        return (
                                            <article key={w.id} className={'relative rounded-xl border p-3 ' + (locked ? 'blur-[4px] select-none pointer-events-none border-line' : w.checked ? 'border-[#4338CA]/40 bg-white' : 'border-line opacity-50')} onClick={() => { if (!locked) toggleWord(w.id); }}>
                                                {w.checked && !locked && <Icon name="check" size={14} className="absolute right-2 top-2 text-[#4338CA]" />}
                                                {w.word === 'locked' ? (
                                                    <div className="space-y-2 py-1" aria-hidden="true"><div className="h-3 w-24 rounded bg-slate-200" /><div className="h-3 w-40 rounded bg-slate-100" /></div>
                                                ) : (
                                                    <>
                                                        <p className="pr-5 font-semibold">{w.word} {w.wordType && <span className="text-xs font-medium text-slate-400">{w.wordType}</span>}</p>
                                                        {(w.ipa || reading) && <p className="mt-1 text-xs text-ink2">{w.ipa}{reading ? ' · ' + reading : ''}</p>}
                                                        {w.meaning && <p className="mt-1 text-sm">{w.meaning}</p>}
                                                        {w.tip && <p className="mt-1 text-xs text-slate-400">{w.tip}</p>}
                                                    </>
                                                )}
                                            </article>
                                        );
                                    })}
                                    {preview && (
                                        <div className="sticky bottom-0 rounded-xl bg-white/95 p-3 shadow-sm">
                                            {payBox()}
                                        </div>
                                    )}
                                </div>
                                {!preview && (
                                    <button type="button" className="btn btn-primary mt-3 w-full" disabled={!chosen.length} onClick={saveChosen}>Lưu {chosen.length} từ đã chọn vào Kho</button>
                                )}
                            </div>
                        </div>
                    )}
                </Modal>
            );
        };

        const LibraryView = ({ items, setItems, groups, groupFilter, setGroupFilter, onPractice, onWeak, onStudyFrom, toast, mergeItems }) => {
            const [quick, setQuick] = useState(false);
            const [importBatches, setImportBatches] = useState(null);
            const [editing, setEditing] = useState(null);
            const [sel, setSel] = useState(() => new Set());
            const [bulkGroup, setBulkGroup] = useState('');
            const [search, setSearch] = useState('');
            const [typeFilter, setTypeFilter] = useState('all');
            const [shown, setShown] = useState(150);
            const [aiAll, setAiAll] = useState(null);
            const [aiRow, setAiRow] = useState(null);
            const [tease, setTease] = useState(null);
            const [paywall, setPaywall] = useState(false);
            const [passage, setPassage] = useState(() => takeGo('reading'));
            const [importHint, setImportHint] = useState(() => takeGo('import'));
            const [menu, setMenu] = useState(null);
            const [filterOpen, setFilterOpen] = useState(false);
            const [fundOpen, setFundOpen] = useState(false);
            const [drafts, setDrafts] = useState(null);
            const menuBox = useRef(null);
            useEffect(() => {
                if (!menu) return undefined;
                const close = (e) => { if (menuBox.current && !menuBox.current.contains(e.target)) setMenu(null); };
                const onKey = (e) => { if (e.key === 'Escape') setMenu(null); };
                document.addEventListener('mousedown', close);
                document.addEventListener('keydown', onKey);
                return () => { document.removeEventListener('mousedown', close); document.removeEventListener('keydown', onKey); };
            }, [menu]);
            const voteSummary = useVoteSummary();
            const fund = useFund();
            const obsidian = obsidianOf(fund);
            const teaseTimer = useRef(0);
            const anchor = useRef(0);
            const dragging = useRef(false);
            const fileRef = useRef(null);

            useEffect(() => {
                const up = () => { dragging.current = false; };
                window.addEventListener('mouseup', up);
                return () => { window.removeEventListener('mouseup', up); window.clearTimeout(teaseTimer.current); };
            }, []);
            useEffect(() => { setSel(new Set()); setShown(150); }, [groupFilter, typeFilter, search]);

            const pulse = habitPulse(voteSummary);

            const q = search.trim().toLowerCase();
            const rows = items.filter(t => Sch.inGroup(t, groupFilter) && (typeFilter === 'all' || t.type === typeFilter) &&
                (!q || (t.questionOrWord || '').toLowerCase().indexOf(q) >= 0 || (t.answerOrMeaning || '').toLowerCase().indexOf(q) >= 0));
            const studyable = Sch.byGroup(items, groupFilter);
            const weakCount = studyable.filter(t => Sch.isWeak(t)).length;
            const mcqPool = asMcqPool(studyable);

            const update = (id, patch) => setItems(prev => prev.map(t => (t.id === id ? Object.assign({}, t, patch) : t)));
            const selectRange = (a, b) => { const lo = Math.min(a, b); const hi = Math.max(a, b); setSel(new Set(rows.slice(lo, hi + 1).map(r => r.id))); };
            const bulkSetGroup = (name) => { if (!sel.size) return; setItems(prev => prev.map(t => (sel.has(t.id) ? Object.assign({}, t, { group: name }) : t))); };
            const draftGroup = groupFilter !== 'all' && groupFilter !== '__none' ? groupFilter : '';
            /* Từ vựng: mở khung thêm nhanh ngay đầu danh sách, không chặn màn hình.
               Đang lọc trắc nghiệm: thêm 1 câu rồi mở form vì câu hỏi cần 4 lựa chọn. */
            const addRow = () => {
                if (typeFilter === 'mcq') {
                    const t = Object.assign(Sch.normalizeItem({ type: 'vocab', group: draftGroup }), { type: 'mcq', options: ['', '', '', ''], answerOrMeaning: 'A' });
                    setItems(prev => [t].concat(prev));
                    setEditing(t);
                    return;
                }
                setDrafts(list => (list ? list.concat([newDraft()]) : [newDraft()]));
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };
            const saveDrafts = () => {
                const made = (drafts || []).filter(x => x.questionOrWord.trim()).map(x => Sch.normalizeItem({
                    type: 'vocab', group: draftGroup, questionOrWord: x.questionOrWord, answerOrMeaning: x.answerOrMeaning, wordType: x.wordType,
                    ipa: x.ipa, vietSub: Sch.ipaToVi(x.ipa) || '', explanationOrExample: x.explanationOrExample, exampleVi: x.exampleVi, keywords: x.keywords
                }));
                if (!made.length) return;
                setItems(prev => made.concat(prev));
                setDrafts(null);
                toast('Đã thêm ' + made.length + ' từ', 'success');
            };
            const cancelDrafts = () => {
                const typed = (drafts || []).some(x => x.questionOrWord.trim() || x.answerOrMeaning.trim());
                if (typed && !confirm('Bỏ các dòng đang nhập?')) return;
                setDrafts(null);
            };
            const removeRow = (id) => { if (confirm('Xóa mục này?')) setItems(prev => prev.filter(t => t.id !== id)); };
            const removeAll = () => {
                if (!items.length) return;
                if (!confirm('Xóa hết ' + items.length + ' mục trong Sổ từ? Không hoàn tác được. Nên "Tải kho về Excel" trước để sao lưu.')) return;
                setItems([]); setSel(new Set());
                toast('Đã xóa hết Sổ từ', 'success');
            };
            const removeSelected = () => { if (sel.size && confirm('Xóa ' + sel.size + ' mục đã chọn?')) { setItems(prev => prev.filter(t => !sel.has(t.id))); setSel(new Set()); } };

            const applyEnrich = (map) => setItems(prev => prev.map(t => (map[t.id] ? mergeEnrich(t, map[t.id]) : t)));

            /* AI cho bản nháp (form sửa, dòng thêm nhanh): trả về phần AI điền, không ghi vào Sổ từ. */
            const aiDraft = async (t) => {
                if (!AI.ready()) { toast('AI chỉ chạy khi mở trang qua web, không mở file trực tiếp.', 'info'); return null; }
                if (!String(t.questionOrWord || '').trim()) { toast('Nhập từ trước đã', 'error'); return null; }
                if (t.type !== 'mcq' && !E.Quota.aiFillAllowed()) { setPaywall(true); return null; }
                try {
                    if (t.type === 'mcq') {
                        const ex = await AI.explain(t);
                        noteStudyDay();
                        return ex ? { explanationOrExample: ex } : null;
                    }
                    const id = t.id || 'draft';
                    const map = await AI.enrichVocab([Object.assign({}, t, { id: id })]);
                    const e = map[id] || null;
                    if (e) { noteStudyDay(); toast('AI đã điền: ' + t.questionOrWord.slice(0, 40), 'success'); }
                    else toast('AI chưa trả kết quả, thử lại sau', 'error');
                    return e;
                } catch (e) {
                    if (e && e.code === 'ai-locked' && t.type !== 'mcq') { setPaywall(true); return null; }
                    toast(e.message, 'error');
                    return null;
                }
            };

            const armTease = (id) => {
                window.clearTimeout(teaseTimer.current);
                setTease({ id: id, phase: 'load' });
                teaseTimer.current = window.setTimeout(() => setTease({ id: id, phase: 'blur' }), 400);
            };
            const aiOne = async (t) => {
                if (!AI.ready()) { toast('AI chỉ chạy khi mở trang qua web, không mở file trực tiếp.', 'info'); return; }
                if (!t.questionOrWord) { toast('Nhập nội dung trước đã', 'error'); return; }
                if (t.type !== 'mcq' && !E.Quota.aiFillAllowed()) { armTease(t.id); return; }
                setAiRow(t.id);
                try {
                    if (t.type === 'mcq') {
                        const ex = await AI.explain(t);
                        if (ex && (!t.explanationOrExample || confirm('Thay lời giải hiện có bằng lời giải AI?'))) update(t.id, { explanationOrExample: ex });
                    } else {
                        applyEnrich(await AI.enrichVocab([t]));
                    }
                    toast('AI xong: ' + t.questionOrWord.slice(0, 40), 'success');
                    noteStudyDay();
                } catch (e) {
                    if (e && e.code === 'ai-locked' && t.type !== 'mcq') { armTease(t.id); return; }
                    toast(e.message, 'error');
                } finally {
                    setAiRow(null);
                }
            };

            const aiEverything = async () => {
                if (!AI.ready()) { toast('AI chỉ chạy khi mở trang qua web, không mở file trực tiếp.', 'info'); return; }
                if (!E.Quota.aiFillAllowed()) { setPaywall(true); return; }
                const need = items.filter(t => t.type === 'vocab' && t.questionOrWord && (!t.ipa || !t.explanationOrExample || !t.answerOrMeaning));
                if (!need.length) { toast('Tất cả từ đã đủ thông tin', 'info'); return; }
                if (!confirm('AI bổ sung thông tin cho ' + need.length + ' từ?')) return;
                let done = 0;
                setAiAll({ done: 0, total: need.length });
                for (let i = 0; i < need.length; i += 10) {
                    const chunk = need.slice(i, i + 10);
                    try { applyEnrich(await AI.enrichVocab(chunk)); } catch (e) { if (e && e.code === 'ai-locked') setPaywall(true); else toast(e.message, 'error'); break; }
                    done += chunk.length;
                    setAiAll({ done, total: need.length });
                }
                setAiAll(null);
                if (done > 0) noteStudyDay();
                toast('AI đã xử lý ' + done + ' từ', 'success');
            };

            const exportExcel = () => {
                if (!items.length || !window.XLSX) return;
                const clean = Sec.stripSecrets(items);
                const data = [Sch.EXCEL_HEADERS].concat(clean.map(Sch.toExcelRow));
                const ws = XLSX.utils.aoa_to_sheet(data);
                ws['!cols'] = [6, 10, 22, 7, 50, 9, 16, 28, 28, 28, 28, 30, 50, 40, 30, 16, 7, 7, 8].map(w => ({ wch: w }));
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Kho học');
                XLSX.writeFile(wb, 'kho-hoc-' + todayIso() + '.xlsx');
                toast('Đã tải ' + items.length + ' mục về file Excel', 'success');
            };

            const readFiles = async (files) => {
                const batches = [];
                for (const f of files) {
                    const name = Sec.cleanText(f.name, 120);
                    const label = name.replace(/\.(xlsx|xls|csv)$/i, '').replace(/[_]+/g, ' ').trim() || 'Nhóm mới';
                    if (!/\.(xlsx|xls|csv)$/i.test(name)) throw new Error('Chỉ nhận file Excel (.xlsx, .xls) hoặc CSV');
                        if (!window.XLSX) throw new Error('Thư viện Excel chưa tải xong');
                        const wb = XLSX.read(await Sec.readBuffer(f), { type: 'array', cellFormula: false, cellHTML: false });
                        const rowsX = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
                        batches.push({ label, defaultGroup: label, items: Sch.fromExcelRows(rowsX) });
                }
                const total = batches.reduce((n, b) => n + b.items.length, 0);
                Sec.guardCount(total, 0);
                if (!total) throw new Error('File không có mục hợp lệ');
                return batches;
            };

            const pickFiles = async (e) => {
                const files = Array.from(e.target.files || []);
                e.target.value = '';
                if (!files.length) return;
                try { setImportBatches(await readFiles(files)); } catch (err) { toast(err.message || 'File không hợp lệ', 'error'); }
            };

            const confirmImport = async ({ items: incoming, mode }) => {
                try {
                    Sec.guardCount(incoming.length, mode === 'replace' ? 0 : items.length);
                    const space = await Sec.ensureStorage(JSON.stringify(incoming).length * 2);
                    if (!space.ok) { toast('Bộ nhớ trình duyệt sắp đầy — hãy tải kho về Excel để sao lưu rồi xóa bớt.', 'error'); return; }
                    mergeItems(incoming, mode);
                    setImportBatches(null);
                    Store.requestPersist();
                    const g = Array.from(new Set(incoming.map(t => t.group).filter(Boolean)));
                    toast('Đã nhập ' + incoming.length + ' mục' + (g.length === 1 ? ' · nhóm "' + g[0] + '"' : ''), 'success');
                } catch (e) {
                    toast(e.message, 'error');
                }
            };

            const filterCount = (groupFilter !== 'all' ? 1 : 0) + (typeFilter !== 'all' ? 1 : 0);
            const runMenu = (fn) => { setMenu(null); fn(); };
            const groupSelect = (
                <select value={groupFilter} onChange={(e) => setGroupFilter(e.target.value)} className="field" aria-label="Nhóm">
                    <option value="all">Tất cả nhóm ({items.length})</option>
                    {groups.map(([k, n]) => <option key={k} value={k}>{Sch.groupLabel(k)} ({n})</option>)}
                </select>
            );
            const typeSelect = (
                <select value={typeFilter} onChange={(e) => setTypeFilter(e.target.value)} className="field" aria-label="Loại">
                    <option value="all">Tất cả loại</option><option value="vocab">Từ vựng</option><option value="mcq">Trắc nghiệm</option>
                </select>
            );

            return (
                <div>
                    {/* Đầu trang gọn: tiêu đề + 2 nút (Thêm từ, •••). Luyện tập đầy đủ nằm ở tab Luyện tập. */}
                    <div className="mb-3 flex items-center justify-between gap-2" ref={menuBox}>
                        <div className="min-w-0">
                            <h1 className="text-xl font-bold">Kho của tôi</h1>
                            <p className="truncate text-sm text-muted">{rows.length}/{items.length} mục · từ vựng & câu hỏi bạn tự ghi</p>
                        </div>
                        <div className="relative flex shrink-0 items-center gap-2">

                            <button type="button" onClick={() => setMenu(m => (m === 'add' ? null : 'add'))} aria-expanded={menu === 'add'} aria-haspopup="menu" className="btn btn-primary btn-sm"><Icon name="plus" size={15} /> Thêm từ</button>
                            <button type="button" onClick={() => setMenu(m => (m === 'more' ? null : 'more'))} aria-expanded={menu === 'more'} aria-haspopup="menu" aria-label="Tùy chọn khác" className="btn btn-secondary btn-sm btn-icon !w-10">•••</button>
                            {menu && (
                                <div role="menu" className="lib-menu">
                                    {menu === 'add' ? (
                                        <>
                                            <button type="button" role="menuitem" onClick={() => runMenu(() => setQuick(true))}><Icon name="clipboard" size={16} /><span><b>Dán nhanh</b><small>Dán danh sách "từ - nghĩa", mỗi dòng một từ</small></span></button>
                                            <button type="button" role="menuitem" onClick={() => runMenu(() => setPassage(true))}><Icon name="sparkles" size={16} /><span><b>AI quét bài đọc / đề thi</b><small>Dán bài, AI lọc từ mới kèm IPA</small></span></button>
                                            <button type="button" role="menuitem" onClick={() => runMenu(() => fileRef.current && fileRef.current.click())}><Icon name="upload" size={16} /><span><b>Nhập từ file Excel</b><small>.xlsx, .xls hoặc .csv, tên file thành tên nhóm</small></span></button>
                                            <button type="button" role="menuitem" onClick={() => runMenu(addRow)}><Icon name="plus" size={16} /><span><b>Thêm nhanh nhiều dòng</b><small>Gõ từ, Enter, gõ nghĩa, Enter sang dòng mới</small></span></button>
                                        </>
                                    ) : (
                                        <>
                                            <button type="button" role="menuitem" disabled={!!aiAll || !items.length} onClick={() => runMenu(aiEverything)}><Icon name="sparkles" size={16} /><span><b>{aiAll ? 'AI ' + aiAll.done + '/' + aiAll.total : 'AI bổ sung tất cả'}</b><small>Điền nghĩa, IPA, ví dụ còn thiếu</small></span></button>
                                            <button type="button" role="menuitem" disabled={!items.length} onClick={() => runMenu(exportExcel)}><Icon name="sheet" size={16} /><span><b>Tải kho về Excel</b><small>Sao lưu toàn bộ kho</small></span></button>
                                            <button type="button" role="menuitem" onClick={() => runMenu(() => window.dispatchEvent(new CustomEvent('edu-contribute')))}><Icon name="share" size={16} /><span><b>Gửi đề cho admin</b><small>Góp đề để mọi người cùng ôn</small></span></button>
                                            <button type="button" role="menuitem" className="is-danger" disabled={!items.length} onClick={() => runMenu(removeAll)}><Icon name="trash" size={16} /><span><b>Xóa hết từ trong bảng</b><small>Xóa toàn bộ {items.length} mục, không hoàn tác</small></span></button>
                                        </>
                                    )}
                                </div>
                            )}
                            <input ref={fileRef} type="file" multiple accept=".xlsx,.xls,.csv" className="hidden" onChange={pickFiles} />
                        </div>
                    </div>

                    <FundStrip onOpen={() => setFundOpen(true)} />
                    {fundOpen && <Modal title="Mã quỹ & gói AI" onClose={() => setFundOpen(false)} size="lg"><FundBody toast={toast} kind="vocab" compact items={items} /></Modal>}

                    {quick && <QuickPaste groups={groups} toast={toast} onLocked={() => setPaywall(true)} onAdd={(list) => confirmImport({ items: list, mode: 'append' })} />}

                    <div className="mb-3">
                        <div className="flex items-center gap-2">
                            <div className="relative min-w-0 flex-1"><Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-muted" /><input value={search} onChange={(e) => setSearch(e.target.value)} className="field pl-9" placeholder="Tìm từ, câu hỏi, nghĩa…" aria-label="Tìm trong kho" /></div>
                            <div className="hidden w-52 md:block">{groupSelect}</div>
                            <div className="hidden w-40 md:block">{typeSelect}</div>
                            <button type="button" onClick={() => setFilterOpen(v => !v)} aria-expanded={filterOpen} className={'btn btn-secondary shrink-0 md:hidden' + (filterCount ? ' !border-primary !text-primary' : '')}><Icon name="sliders" size={16} /> Bộ lọc{filterCount ? ' · ' + filterCount : ''}</button>
                        </div>
                        {filterOpen && (
                            <div className="mt-2 grid grid-cols-2 gap-2 md:hidden">
                                {groupSelect}
                                {typeSelect}
                                {groupFilter !== 'all' && <button type="button" onClick={() => onPractice(studyable, 'flash', Sch.groupLabel(groupFilter))} disabled={!studyable.length} className="btn btn-secondary btn-sm col-span-2"><Icon name="layers" size={14} /> Luyện nhóm này ({studyable.length})</button>}
                            </div>
                        )}
                    </div>
                    {(pulse.neverMiss || importHint) && <div className="card mb-3">
                        {pulse.neverMiss && (
                            <p className="px-3 py-3 text-sm leading-5 text-ink2 sm:px-4">Không sao, đừng bỏ lỡ hai ngày liên tiếp.</p>
                        )}
                        {importHint && (
                            <div className="m-3 rounded-2xl border-2 border-primary/30 bg-primary-soft p-4 sm:mx-4" role="region" aria-label="Nhập từ vựng từ Excel">
                                <p className="font-semibold text-ink">Nhập từ vựng từ file Excel</p>
                                <p className="mt-1 text-sm text-ink2">Mỗi dòng một từ. Cột đầu là từ hoặc câu hỏi, cột hai là nghĩa hoặc đáp án. Có thể thêm cột ví dụ, IPA, loại từ. Tên file thành tên nhóm.</p>
                                <div className="mt-3 flex flex-wrap gap-2">
                                    <button type="button" className="btn btn-primary" onClick={() => fileRef.current && fileRef.current.click()}><Icon name="upload" /> Chọn file .xlsx / .csv</button>
                                    <button type="button" className="btn btn-ghost" onClick={() => setImportHint(false)}>Đóng</button>
                                </div>
                            </div>
                        )}
                    </div>}

                    {sel.size > 0 && (
                        <div className="sticky top-2 z-20 mb-3 rounded-xl bg-ink text-white px-4 py-2 flex flex-wrap items-center gap-2 shadow-lg">
                            <span className="text-sm">Đã chọn {sel.size} hàng · gán nhóm:</span>
                            <input list="bulk-groups" value={bulkGroup} onChange={(e) => { setBulkGroup(e.target.value); bulkSetGroup(e.target.value); }} placeholder="Unit 1 - Jobs" className="field !min-h-[36px] text-ink max-w-[240px]" aria-label="Nhóm cho các hàng đã chọn" />
                            <datalist id="bulk-groups">{groups.filter(([k]) => k !== '__none').map(([k]) => <option key={k} value={k} />)}</datalist>
                            <button type="button" className="btn btn-sm text-white hover:bg-white/10" onClick={removeSelected}><Icon name="trash" size={14} /> Xóa</button>
                            <button type="button" className="btn btn-sm text-white hover:bg-white/10 ml-auto" onClick={() => setSel(new Set())}>Bỏ chọn</button>
                        </div>
                    )}

                    {drafts && <BatchAdd drafts={drafts} setDrafts={setDrafts} group={draftGroup} onAI={aiDraft} onSave={saveDrafts} onCancel={cancelDrafts} />}

                    {/* Điện thoại (<768px): danh sách thẻ 2 dòng, chạm để sửa. Màn rộng giữ bảng đầy đủ. */}
                    <div className="card overflow-hidden md:hidden">
                        {rows.length === 0 ? (
                            <Empty icon="layers" title="Chưa có mục nào ở đây">Bấm "Thêm từ" để bắt đầu.</Empty>
                        ) : (
                            <ul className="divide-y divide-line">
                                {rows.slice(0, shown).map(t => {
                                    const mcq = t.type === 'mcq';
                                    const meaning = mcq ? (Sch.correctText(t) ? t.answerOrMeaning + '. ' + Sch.correctText(t) : '') : t.answerOrMeaning;
                                    return (
                                        <li key={t.id} className="lib-row">
                                            <span className="lib-bar" style={{ background: t.group ? Sch.groupColor(t.group) : 'var(--border)' }} aria-hidden="true" />
                                            <div className="min-w-0 flex-1">
                                                <div className="flex items-start gap-2">
                                                    <button type="button" className="lib-word" onClick={() => setEditing(t)}>
                                                        {t.questionOrWord || <span className="font-normal text-muted">{mcq ? 'Câu hỏi trống' : 'Từ trống'}</span>}
                                                        {mcq ? <span className="lib-tag">MCQ</span> : t.wordType ? <span className="lib-tag">{t.wordType}</span> : null}
                                                    </button>
                                                    <div className="ml-auto flex shrink-0 items-center gap-1">
                                                        {!mcq && t.questionOrWord && <button type="button" onClick={() => speak(t.questionOrWord, 0.7)} className="lib-act" aria-label={'Nghe ' + t.questionOrWord}><Icon name="volume" size={15} /></button>}
                                                        <button type="button" onClick={() => onStudyFrom(t)} disabled={!t.questionOrWord} className="lib-act" aria-label="Học từ này"><Icon name="play" size={15} /></button>
                                                        <button type="button" onClick={() => setEditing(t)} className="lib-act" aria-label="Sửa"><Icon name="pen" size={15} /></button>
                                                    </div>
                                                </div>
                                                <div className="mt-0.5 flex items-start gap-2">
                                                    <p className={'lib-mean min-w-0 flex-1 ' + (meaning ? '' : 'text-muted')}>{meaning || 'Chưa có nghĩa · chạm để thêm'}</p>
                                                    {t.group && <span className="lib-group" title={t.group}>{Sch.groupLabel(t.group)}</span>}
                                                </div>
                                            </div>
                                        </li>
                                    );
                                })}
                            </ul>
                        )}
                        {rows.length > shown && <div className="p-3 border-t border-line text-center"><button type="button" className="btn btn-secondary" onClick={() => setShown(shown + 300)}>Hiện thêm ({rows.length - shown} mục)</button></div>}
                    </div>

                    <div className="card hidden overflow-hidden pb-24 md:block">
                        <div className="overflow-x-auto">
                            <table className="w-full min-w-[1080px] text-sm border-collapse">
                                <caption className="sr-only">Bảng kho học</caption>
                                <thead className="bg-surface2 text-ink2 text-xs">
                                    <tr>
                                        <th scope="col" className="w-auto whitespace-nowrap px-2 py-2 text-left" title="Giữ chuột và kéo để chọn nhiều hàng">#</th>
                                        <th scope="col" className="px-3 py-2 text-left w-48">Nhóm</th>
                                        <th scope="col" className="w-auto whitespace-nowrap px-3 py-2 text-left">Loại</th>
                                        <th scope="col" className="min-w-[200px] px-3 py-2 text-left">Từ / Câu hỏi</th>
                                        <th scope="col" className="px-3 py-2 text-left w-56">Nghĩa / Đáp án</th>
                                        <th scope="col" className="col-example min-w-[240px] max-w-[320px] px-3 py-2 text-left">Ví dụ / Giải thích</th>
                                        <th scope="col" className="px-3 py-2 text-left w-40">Phát âm</th>
                                        <th scope="col" className="w-auto whitespace-nowrap px-3 py-2 text-left">Tiến độ</th>
                                        <th scope="col" className="px-3 py-2 text-left w-40">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {rows.length === 0 ? (
                                        <tr><td colSpan="9"><Empty icon="layers" title="Chưa có mục nào ở đây">Dùng "Dán nhanh" hoặc "Thêm dòng" để bắt đầu.</Empty></td></tr>
                                    ) : rows.slice(0, shown).map((t, i) => {
                                        const on = sel.has(t.id);
                                        const mcq = t.type === 'mcq';
                                        return (
                                            <tr key={t.id} className={'border-t border-line align-top ' + (on ? 'row-sel' : 'hover:bg-surface2')} onMouseEnter={() => { if (dragging.current) selectRange(anchor.current, i); }}>
                                                <td className="w-auto whitespace-nowrap p-0">
                                                    <button type="button" aria-pressed={on} aria-label={'Chọn hàng ' + (i + 1)} className={'w-full min-h-[40px] px-2 text-xs tnum cursor-crosshair ' + (on ? 'text-white' : 'text-muted')}
                                                        onMouseDown={(e) => { if (e.button !== 0) return; e.preventDefault(); const a = e.shiftKey ? anchor.current : i; if (!e.shiftKey) anchor.current = i; dragging.current = true; selectRange(a, i); }}
                                                        onKeyDown={(e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setSel(s => { const n = new Set(s); if (n.has(t.id)) n.delete(t.id); else n.add(t.id); return n; }); } }}>
                                                        {i + 1}
                                                    </button>
                                                </td>
                                                <td className="p-0">
                                                    <div className="flex items-stretch">
                                                        <span className="w-1 shrink-0" style={{ background: t.group ? Sch.groupColor(t.group) : 'var(--border)' }} />
                                                        <textarea rows={1} className="cell-ta" value={t.group} maxLength={80} aria-label="Nhóm" placeholder="Unit, chủ đề…"
                                                            onChange={(e) => { if (on) bulkSetGroup(e.target.value); else update(t.id, { group: e.target.value }); }} />
                                                    </div>
                                                </td>
                                                <td className="w-auto whitespace-nowrap p-2">
                                                    {/* Một ô chọn cho cả từ loại (n, v, adj…) và câu trắc nghiệm. */}
                                                    <select aria-label="Loại" className="field !min-h-[36px] min-w-[84px] text-xs px-2" value={mcq ? 'mcq' : (t.wordType || '')}
                                                        onChange={(e) => {
                                                            const v = e.target.value;
                                                            if (v === 'mcq') { if (!mcq) update(t.id, { type: 'mcq', options: t.options.length ? t.options : ['', '', '', ''], answerOrMeaning: 'A' }); }
                                                            else if (mcq) update(t.id, { type: 'vocab', options: [], answerOrMeaning: '', wordType: v });
                                                            else update(t.id, { wordType: v });
                                                        }}>
                                                        <option value="">Từ (—)</option>
                                                        {WORD_TYPES.map(w => <option key={w} value={w}>{w}</option>)}
                                                        {!mcq && t.wordType && WORD_TYPES.indexOf(t.wordType) < 0 && <option value={t.wordType}>{t.wordType}</option>}
                                                        <option value="mcq">MCQ</option>
                                                    </select>
                                                </td>
                                                <td className="p-0">
                                                    <textarea rows={1} className="cell-ta font-semibold text-primary" value={t.questionOrWord} maxLength={mcq ? 1500 : 400} aria-label={mcq ? 'Câu hỏi' : 'Từ vựng'} placeholder={mcq ? 'Câu hỏi…' : 'Nhập từ…'}
                                                        onChange={(e) => update(t.id, { questionOrWord: e.target.value })} onDoubleClick={() => setEditing(t)} />
                                                </td>
                                                <td className="p-0">
                                                    {mcq ? (
                                                        <div className="p-2 space-y-1">
                                                            <select aria-label="Đáp án đúng" className="field !min-h-[36px] text-xs" value={t.answerOrMeaning || 'A'} onChange={(e) => update(t.id, { answerOrMeaning: e.target.value })}>
                                                                {Sch.LETTERS.map(L => <option key={L} value={L}>Đáp án {L}</option>)}
                                                            </select>
                                                            <p className="text-xs text-ink2 text-flow">{Sch.correctText(t) || <button type="button" className="underline" onClick={() => setEditing(t)}>Nhập 4 lựa chọn</button>}</p>
                                                        </div>
                                                    ) : tease && tease.id === t.id ? (
                                                        <div className="relative min-h-[76px] px-2 py-2">
                                                            {tease.phase === 'load' ? <p className="text-xs text-muted">Đang điền…</p> : (
                                                                <>
                                                                    <p className="pointer-events-none select-none blur-[4px] text-ink">nghĩa tiếng Việt ngắn</p>
                                                                    <p className="pointer-events-none select-none blur-[4px] text-xs text-ink2">A clear example sentence. · /aɪˈpiːeɪ/</p>
                                                                    <button type="button" className="relative z-10 mt-1 rounded-lg bg-ink px-2 py-1 text-[11px] font-semibold text-white" onClick={() => setPaywall(true)}>🔒 Mở khóa kết quả (29k)</button>
                                                                </>
                                                            )}
                                                        </div>
                                                    ) : (
                                                        <textarea rows={1} className="cell-ta" value={t.answerOrMeaning} maxLength={1500} aria-label="Nghĩa" placeholder="Nghĩa…" onChange={(e) => update(t.id, { answerOrMeaning: e.target.value })} />
                                                    )}
                                                </td>
                                                <td className="col-example min-w-[240px] max-w-[320px] p-0">
                                                    <textarea rows={1} className="cell-ta" value={t.explanationOrExample} maxLength={2500} aria-label={mcq ? 'Giải thích' : 'Câu ví dụ'} placeholder={mcq ? 'Giải thích…' : 'Câu ví dụ…'} onChange={(e) => update(t.id, { explanationOrExample: e.target.value })} />
                                                </td>
                                                <td className="p-2">
                                                    {!mcq && (
                                                        <div className="flex items-start gap-2">
                                                            <button type="button" onClick={() => speak(t.questionOrWord, 0.7)} disabled={!t.questionOrWord} className="btn btn-secondary btn-sm btn-icon !w-9" aria-label={'Nghe ' + t.questionOrWord}><Icon name="volume" size={14} /></button>
                                                            <div className="text-xs text-flow">{t.ipa && <p className="text-ink2">{t.ipa}</p>}{Sch.readingOf(t) && <p className="text-muted">{Sch.readingOf(t)}</p>}</div>
                                                        </div>
                                                    )}
                                                </td>
                                                <td className="w-auto whitespace-nowrap p-2 text-xs">
                                                    <p className="tnum">Đ {t.correctCount || 0} · S {t.wrongCount || 0}</p>
                                                    <p className="tnum text-muted">Ôn {t.reviewCount || 0}</p>
                                                    {Sch.reviewNote(t) && <p className={Sch.isWeak(t) ? 'text-warn font-medium' : 'text-muted'}>{Sch.reviewNote(t)}</p>}
                                                </td>
                                                <td className="p-2">
                                                    <div className="flex flex-wrap gap-1">
                                                        <button type="button" onClick={() => aiOne(t)} disabled={!t.questionOrWord || aiRow === t.id} className={'btn btn-secondary btn-sm' + (obsidian ? ' border border-[#D8C7A0] shadow-sm' : '')} title={mcq ? 'AI giải thích' : 'AI bổ sung'}><Icon name="sparkles" size={14} />{aiRow === t.id ? '…' : 'AI'}</button>
                                                        <button type="button" onClick={() => onStudyFrom(t)} disabled={!t.questionOrWord} className="btn btn-secondary btn-sm">Học</button>
                                                        <button type="button" onClick={() => setEditing(t)} className="btn btn-secondary btn-sm btn-icon !w-9" aria-label="Sửa chi tiết"><Icon name="pen" size={14} /></button>
                                                        <button type="button" onClick={() => removeRow(t.id)} className="btn btn-danger btn-sm btn-icon !w-9" aria-label="Xóa"><Icon name="trash" size={14} /></button>
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                        {rows.length > shown && <div className="p-3 border-t border-line text-center"><button type="button" className="btn btn-secondary" onClick={() => setShown(shown + 300)}>Hiện thêm ({rows.length - shown} mục)</button></div>}
                    </div>

                    {importBatches && <ImportDialog batches={importBatches} existingCount={items.length} onClose={() => setImportBatches(null)} onConfirm={confirmImport} />}
                    {passage && <PassageReader toast={toast} onClose={() => setPassage(false)} onSave={(list) => confirmImport({ items: list, mode: 'append' })} />}
                    {editing && <ItemEditor item={editing} groups={groups}
                        onClose={() => setEditing(null)}
                        onAI={aiDraft} onSave={(t) => { setItems(prev => prev.map(x => (x.id === t.id ? t : x))); setEditing(null); toast('Đã lưu', 'success'); }} />}
                    {paywall && <AiUnlockModal toast={toast} onClose={() => setPaywall(false)} />}
                </div>
            );
        };

        /* ---------- Luyện tự do ---------- */
        const PracticeHub = ({ items, itemsById, groups, groupFilter, setGroupFilter, session, startSession, closeSession, review, patch, toast, onPractice, onWeak, queueEos, onOpenSlots }) => {
            const [eosSetup, setEosSetup] = useState(null);
            const pool = Sch.byGroup(items, groupFilter);
            const weakCount = pool.filter(t => Sch.isWeak(t)).length;
            const mcqPool = asMcqPool(pool);

            if (session && session.mode === 'eos') {
                return (
                    <EOSSimulator key={session.id} title={session.title} items={session.pool} count={session.count} minutes={session.minutes} toast={toast} canExplain={AI.ready()}
                        onSubmit={async (r) => {
                            const paid = await window.EDU.chargeTurn(toast, 'Nộp ' + session.title);
                            if (!paid) return false;
                            r.wrong.forEach(w => review(w.id, false));
                            return { queued: queueEos ? queueEos(r.wrong.map(w => ({ id: w.id })).concat(r.flaggedIds.map(id => ({ id })))) : 0 };
                        }}
                        onDrillWrong={(ids) => startSession(ids, 'burst', 'Nhồi lại câu sai EOS', '')}
                        onOpenSlots={onOpenSlots}
                        onExit={closeSession} />
                );
            }
            if (session && session.mode === 'burst') {
                return <BurstSession key={session.id} itemsById={itemsById} ids={session.ids} title={session.title} sessionId={session.id} voteType={session.voteType} onReview={(id, ok) => review(id, ok)} onExit={closeSession} toast={toast} canExplain={AI.ready()} />;
            }
            if (session) {
                return <FlashSession key={session.id} items={items} session={session} onReview={review} onPatch={patch} onClose={closeSession} onRestart={startSession} toast={toast} />;
            }

            const cards = [
                { k: 'flash', icon: 'layers', title: 'Flashcard', body: pool.length + ' mục. Lật thẻ, tự nhớ, chấm Đã nhớ / Cần ôn.', run: () => onPractice(pool, 'flash', Sch.groupLabel(groupFilter)), off: !pool.length },
                { k: 'burst', icon: 'zap', title: 'Băng đạn 5 câu', body: 'Nhìn lướt 15s → phản xạ 1 chạm. Sai là nhồi lại cuối băng sau 15 giây.', run: () => onPractice(pool, 'burst', 'Băng đạn · ' + Sch.groupLabel(groupFilter)), off: !pool.length },
                { k: 'test', icon: 'pen', title: groupFilter === 'all' ? 'Test tất cả' : 'Test nhóm này', body: 'Điền từ / nghe viết / ghi âm. Gõ khớp là tự chấm, an toàn với Unikey/EVKey.', run: () => onPractice(pool, 'test', Sch.groupLabel(groupFilter)), off: !pool.length },
                { k: 'weak', icon: 'flame', title: 'Ôn từ yếu (' + weakCount + ')', body: 'Hay sai, chưa ôn, hoặc đến hạn 1 / 3 / 7 / 14 ngày.', run: onWeak, off: false },
                { k: 'eos', icon: 'monitor', title: 'Thi thử EOS', body: mcqPool.length >= 5 ? mcqPool.length + ' câu trắc nghiệm có thể vào đề. Mỗi lần nộp trừ 1 lượt quỹ.' : 'Cần ít nhất 5 câu trắc nghiệm hoặc 4 từ có nghĩa.', run: () => { if (!requireTurns(toast)) return; setEosSetup(mcqPool); }, off: mcqPool.length < 5 }
            ];

            return (
                <div className="card p-5 sm:p-7">
                    <h1 className="text-xl font-bold">Luyện tự do</h1>
                    <p className="text-ink2 mt-1 mb-5">Chọn nhóm rồi chọn cách luyện. Mọi kiểu đều chạy 100% bằng bàn phím.</p>
                    <label className="block max-w-sm mb-5"><span className="label">Nhóm</span>
                        <select value={groupFilter} onChange={(e) => setGroupFilter(e.target.value)} className="field">
                            <option value="all">Tất cả nhóm ({items.length})</option>
                            {groups.map(([k, n]) => <option key={k} value={k}>{Sch.groupLabel(k)} ({n})</option>)}
                        </select>
                    </label>
                    <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
                        {cards.map(c => (
                            <button key={c.k} type="button" onClick={c.run} disabled={c.off} className="text-left rounded-2xl border-2 border-line p-5 hover:border-primary hover:bg-primary-soft disabled:opacity-50 disabled:hover:border-line disabled:hover:bg-transparent transition-colors">
                                <span className="w-10 h-10 rounded-xl bg-primary-soft text-primary flex items-center justify-center mb-3"><Icon name={c.icon} /></span>
                                <span className="block font-semibold">{c.title}</span>
                                <span className="block text-sm text-ink2 mt-1 text-flow">{c.body}</span>
                            </button>
                        ))}
                    </div>
                    {eosSetup && <EOSSetup max={eosSetup.length} onClose={() => setEosSetup(null)} onStart={(n, min) => { if (!requireTurns(toast, true)) return; onPractice(eosSetup, 'eos', 'EOS · ' + Sch.groupLabel(groupFilter), { count: n, minutes: min }); setEosSetup(null); }} />}
                </div>
            );
        };
        /* ===================== MODE 2 · Kho Src Qua Môn ===================== */
        const progKey = (packId, itemId) => packId + '|' + itemId;
        const isMastered = (rec) => !!(rec && rec.correctCount > 0);
        const isPackWeak = (rec, now) => !!(rec && rec.wrongCount > 0 && (rec.srsStage === 0 || Sch.isDue(rec, now)));
        const fmtLeft = (ms) => {
            const h = Math.floor(ms / 3600000);
            if (h >= 24) return Math.floor(h / 24) + ' ngày ' + (h % 24) + ' giờ';
            if (h >= 1) return h + ' giờ ' + Math.floor((ms % 3600000) / 60000) + ' phút';
            return Plan.fmtCountdown(ms);
        };

        const QrBox = () => {
            const [ok, setOk] = useState(true);
            if (ok) return <img src="assets/qr-ung-ho.png" alt="Mã QR ủng hộ team 39.000đ" className="w-40 h-40 rounded-xl border border-line object-contain bg-white" onError={() => setOk(false)} />;
            return (
                <div className="w-40 h-40 rounded-xl border-2 border-dashed border-line flex flex-col items-center justify-center text-muted text-xs text-center p-3">
                    <Icon name="qr" size={32} /><span className="mt-2">Team đặt ảnh QR tại edu/assets/qr-ung-ho.png</span>
                </div>
            );

        const inviteText = (pack) => 'Mình đang ôn ' + pack.code + ' bằng FPass — Chặng 1 (' + ((pack.stages && pack.stages[0] && pack.stages[0].count) || 35) +
            ' câu nền tảng) free 100%, có Băng đạn 5 câu và phòng thi giả lập EOS. Học chung cho đỡ sợ mùa thi nhé!' +
            (/^https?:/.test(location.protocol) ? ' ' + location.origin + location.pathname : '');

        const contributeTemplate = (pack) => ({
            id: 'ma-mon-cua-ban',
            code: (pack && pack.code) || 'MÃ MÔN',
            name: (pack && pack.name) || 'Tên môn',
            block: (pack && pack.block) || 'it',
            type: 'mcq',
            desc: 'Mô tả ngắn phạm vi bộ đề',
            stages: {
                '1': [{ q: 'Câu hỏi nền tảng?', o: ['Lựa chọn A', 'Lựa chọn B', 'Lựa chọn C', 'Lựa chọn D'], a: 'B', e: 'Giải thích ngắn bằng tiếng Việt', k: ['từ khóa ăn điểm'] }],
                '2': [],
                '3': []
            }

        const UnlockModal = ({ pack, onUnlock, onClose }) => {
            const [key, setKey] = useState('');

            const [busy, setBusy] = useState(false);
            const submit = async () => {
                setBusy(true);

                try {
                    await onUnlock(pack, key);

                    setBusy(false);

                        <input value={key} onChange={(e) => setKey(e.target.value.toUpperCase())} onKeyDown={(e) => { if (e.key === 'Enter' && !e.nativeEvent.isComposing) submit(); }}

                </Modal>
            );
        };

        const ContributeModal = ({ pack, onClose, toast }) => {
            const fundCode = (E.Quota && E.Quota.read) ? E.Quota.read().code : '';
            const [name, setName] = useState((pack && pack.name) || '');
            const [code, setCode] = useState((pack && pack.code) || '');
            const [subject, setSubject] = useState(pack && pack.type === 'vocab' ? 'vocab' : 'eos');
            const [quotaId, setQuotaId] = useState(fundCode || '');
            const [text, setText] = useState('');
            const [fileName, setFileName] = useState('');
            const [busy, setBusy] = useState(false);
            const readFile = async (file) => {
                if (!file) return;
                if (file.size > 400000) { toast('File lớn hơn 400KB', 'error'); return; }
                setText(await file.text());
                setFileName(file.name);
            };
            const send = async () => {
                if (!name.trim() || !code.trim() || !text.trim()) { toast('Điền tên đề, mã môn và nội dung', 'error'); return; }
                setBusy(true);
                try {
                    const res = await fetch('/api/contribute', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                        body: JSON.stringify({ name, code, subject, quotaId, text })
                    });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok) throw new Error(data.error || 'Chưa gửi được đề.');
                    toast('Đã gửi ' + (data.count || '') + ' câu cho admin. Khi được duyệt, đề hiện trong Đề hệ thống.', 'success');
                    onClose();
                } catch (e) {
                    toast(e.message || 'Chưa gửi được đề.', 'error');
