    <style type="text/tailwindcss">

            .chip { @apply inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-xs font-medium; max-width: 100%; white-space: normal; overflow-wrap: anywhere; }
            .field { @apply w-full rounded-xl px-3 min-h-[44px] text-sm; background: var(--surface); border: 1px solid var(--border); color: var(--ink); }

            return (

            );
        };

            const box = useRef(null);

            useHotkeys('modal', { Escape: { run: () => onClose && onClose(), allowInInput: true } }, { modal: true });
            useEffect(() => {
                const prev = document.activeElement;
                const el = box.current;
                const first = el && (el.querySelector('[data-autofocus]') || el.querySelector('input, textarea, select, button:not([data-close])'));
                if (first) first.focus();
                return () => { if (prev && prev.focus) prev.focus(); };
            }, []);
            const trap = (e) => {
                if (e.key !== 'Tab' || !box.current) return;
                const els = Array.from(box.current.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), select, textarea, [tabindex]:not([tabindex="-1"])'));
                if (!els.length) return;
                const first = els[0];
                const last = els[els.length - 1];
                if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
                else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
            };
            const width = size === 'lg' ? 'sm:max-w-3xl' : size === 'sm' ? 'sm:max-w-sm' : 'sm:max-w-lg';

                area.style.left = '-9999px';
                document.body.appendChild(area);
                area.select();
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
                area.remove();
                return ok ? Promise.resolve() : Promise.reject(new Error('no-clipboard'));

            if (navigator.clipboard && navigator.clipboard.writeText) {

            const vocab = list.filter(t => t.type === 'vocab' && t.questionOrWord && t.answerOrMeaning);
            if (vocab.length < 4) return [];
            return vocab.map(t => {
                const others = Sch.shuffle(vocab.filter(o => o.id !== t.id && o.answerOrMeaning !== t.answerOrMeaning)).slice(0, 3).map(o => o.answerOrMeaning);
                const pos = Math.floor(Math.random() * 4);
                const opts = others.slice();
                opts.splice(pos, 0, t.answerOrMeaning);
                return Object.assign({}, t, {
                    type: 'mcq',
                    questionOrWord: '"' + t.questionOrWord + '"' + (t.wordType ? ' (' + t.wordType + ')' : '') + ' nghĩa là gì?',
                    options: opts.slice(0, 4),
                    answerOrMeaning: Sch.LETTERS[pos],
                    explanationOrExample: t.explanationOrExample ? t.explanationOrExample + (t.exampleVi ? ' — ' + t.exampleVi : '') : ''

            useEffect(() => {

                setError('');
                try {
                    const res = await fetch('/api/feedback', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                        body: JSON.stringify({ kind, message, contact: contact.trim(), quotaId: code, screen, path, ua })
                    });
                    let data = {};
                    try { data = await res.json(); } catch (err) { data = {}; }
                    const reason = typeof data.error === 'string' ? data.error : (data.error && data.error.message) || '';
                    if (!res.ok) throw new Error(reason || 'Không gửi được. Thử lại sau.');
                    setDone(true);
                } catch (err) {
                    setError(err.message || 'Không gửi được. Thử lại sau.');
                    setBusy(false);
                }
            };
            return (
                <div className="fixed inset-0 z-[70] flex items-end sm:items-center justify-center bg-black/40 p-4" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
                    <div ref={box} role="dialog" aria-modal="true" aria-labelledby="fpass-feedback-title" onKeyDown={trap} className="card w-full sm:max-w-lg max-h-[92vh] flex flex-col rounded-2xl shadow-xl">
                        <div className="flex items-start justify-between gap-3 px-5 pt-4 pb-3 border-b border-line">
                            <div>
                                <h2 id="fpass-feedback-title" className="text-base font-semibold text-flow">Góp ý & Báo lỗi Hệ thống</h2>
                                <p className="text-xs text-slate-500 mt-1">Giúp FPass hoàn thiện trải nghiệm ôn thi và bộ đề tốt hơn mỗi ngày.</p>
                            </div>
                            <button type="button" className="btn btn-ghost btn-icon -mr-2 -mt-1" onClick={onClose} aria-label="Đóng"><Icon name="x" /></button>
                        </div>
                        {done ? (
                            <p className="px-5 py-8 text-sm font-medium text-ink" role="status">Đã ghi nhận! Cảm ơn bạn đã đóng góp cho FPass.</p>
                        ) : (
                            <form onSubmit={send} className="px-5 py-4 overflow-y-auto">
                                <div className="flex flex-wrap gap-2" role="radiogroup" aria-label="Phân loại góp ý">
                                    {FEEDBACK_KINDS.map(([id, icon, label]) => (
                                        <button key={id} type="button" role="radio" aria-checked={kind === id} className={'inline-flex min-h-[44px] items-center gap-1.5 rounded-xl px-3 text-sm font-medium transition-all ' + (kind === id ? 'bg-[#1E293B] text-white' : 'bg-slate-100 text-slate-600 hover:text-slate-800')} onClick={() => setKind(id)}>
                                            <Icon name={icon} size={15} stroke={1.5} />
                                            {label}
                                        </button>
                                    ))}
                                </div>
                                <label className="block mt-4 text-sm font-medium text-slate-700">Nội dung
                                    <textarea data-autofocus value={text} onChange={(e) => setText(e.target.value)} required maxLength={2000} rows={5} placeholder="Mô tả chi tiết lỗi bạn gặp phải (ví dụ: sai đáp án câu 12 môn SWT301) hoặc tính năng bạn mong muốn..." className="mt-1 w-full min-h-[120px] rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm text-slate-900 outline-none transition-all placeholder:text-slate-400 focus:border-[#0052CC] focus:ring-2 focus:ring-[#0052CC]/10" />
                                </label>
                                <label className="block mt-3 text-sm font-medium text-slate-700">Thông tin liên hệ <span className="font-normal text-slate-400">(không bắt buộc)</span>
                                    <input value={contact} onChange={(e) => setContact(e.target.value)} maxLength={120} placeholder="Số Zalo hoặc Email của bạn (để tụi mình phản hồi / cảm ơn khi cần)" className="mt-1 w-full min-h-[44px] rounded-xl border border-slate-200 bg-white px-3 text-sm text-slate-900 outline-none transition-all placeholder:text-slate-400 focus:border-[#0052CC] focus:ring-2 focus:ring-[#0052CC]/10" />
                                </label>
                                <p className="mt-3 flex items-center gap-1.5 text-xs text-slate-400" title={(screen || 'Trang học') + ' · ' + path + ' · ' + ua}>
                                    <Icon name="shield" size={14} stroke={1.5} />
                                    <span className="tnum">Phiên bản: Web · Mã định danh: {code || '—'}</span>
                                </p>
                                {error && <p className="text-sm text-rose-700 mt-3" role="alert">{error}</p>}
                                <button type="submit" disabled={busy || !text.trim()} className="mt-4 inline-flex w-full min-h-[48px] items-center justify-center gap-2 rounded-xl bg-[#0052CC] py-3 text-white font-medium shadow-sm transition-all hover:bg-[#004099] disabled:opacity-50">
                                    {busy ? <Icon name="loader" size={16} stroke={1.5} className="animate-spin" /> : null}
                                    <span>{busy ? 'Đang gửi...' : 'Gửi phản hồi'}</span>
                                    {busy ? null : <Icon name="arrow" size={16} stroke={1.5} />}
                                </button>
                            </form>
                        )}
                    </div>
                </div>
            );
        };

        const SupportPanel = ({ toast, onClose, returnTo, onFeedback }) => {
            const fund = useFund();
            const box = useRef(null);
            const alive = useRef(true);
            const now = useNow(30000);
            const touch = useHelpTouch();
            const [faq, setFaq] = useState(-1);
            const [copied, setCopied] = useState('');
            const code = fund.code || '';
            const online = supportOnline(new Date(now));
            const hours = supportHourLabel(SUPPORT.hours.start) + '–' + supportHourLabel(SUPPORT.hours.end);
            const mailHref = 'mailto:' + SUPPORT.email + '?subject=' + encodeURIComponent('Hỗ trợ - Mã ' + code);
            useHotkeys('support', { Escape: { run: onClose, allowInInput: true } }, { modal: true });
            useEffect(() => {
                const back = returnTo && returnTo.current;
                const node = box.current;
                const target = node && node.querySelector('[data-autofocus]');
                if (target) target.focus();
                const narrow = window.matchMedia('(max-width: 639px)').matches;
                const prevOverflow = document.body.style.overflow;
                if (narrow) document.body.style.overflow = 'hidden';
                const onDown = (e) => {
                    const t = e.target;
                    if (node && node.contains(t)) return;
                    if (t && t.closest && t.closest('[data-help-open]')) return;
                    onClose();
                };
                document.addEventListener('mousedown', onDown);
                return () => {
                    alive.current = false;
                    document.removeEventListener('mousedown', onDown);
                    if (narrow) document.body.style.overflow = prevOverflow;
                    const el = back && document.contains(back) ? back : document.querySelector('.help-launch');
                    if (el && el.focus) el.focus();
                };
            }, []);
            const trap = (e) => {
                if (e.key !== 'Tab' || !box.current) return;
                const els = Array.from(box.current.querySelectorAll('a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])'));
                if (!els.length) return;
                const first = els[0];
                const last = els[els.length - 1];
                if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
                else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
            };
            const mark = (key) => {
                setCopied(key);
                window.setTimeout(() => { if (alive.current) setCopied(cur => (cur === key ? '' : cur)); }, 2000);
            };
            const copyValue = (text, key) => {
                copyText(text).then(() => mark(key)).catch(() => toast('Không tự sao chép được. Hãy chép tay.', 'error', 2500));
            };
            const chatZalo = () => {
                const pending = copyText(code);
                window.open(SUPPORT.zalo, '_blank', 'noopener,noreferrer');
                pending.then(() => toast('Đã sao chép mã ' + code + '. Dán vào Zalo và gửi kèm ảnh biên lai nhé.', 'success', 2500))
                    .catch(() => toast('Không tự sao chép được, bạn hãy chép mã ' + code + ' thủ công.', 'error', 2500));
            };
            return (
                <div ref={box} id="fpass-help" role="dialog" aria-modal={touch ? 'true' : 'false'} aria-labelledby="fpass-help-title" className="help-pop" onKeyDown={trap}>
                    <div className="help-grab" aria-hidden="true"><span /></div>
                    <div className="help-body">
                        <div className="flex items-start justify-between gap-2">
                            <h2 id="fpass-help-title" className="text-lg font-semibold leading-snug pt-1">Cần hỗ trợ?</h2>
                            <button type="button" className="help-x -mr-2 -mt-1" onClick={onClose} aria-label="Đóng"><Icon name="x" /></button>
                        </div>
                        <p className="help-quiet text-sm leading-relaxed">Phản hồi trong khoảng {SUPPORT.replyMinutes} phút · {hours} hằng ngày</p>
                        <p className="mt-2 flex items-center gap-2 text-sm">
                            <span className={'help-dot' + (online ? ' on' : '')} aria-hidden="true" />
                            <span className={online ? 'text-[#BBF7D0]' : 'help-quiet'}>{online ? 'Đang trực tuyến' : ('Ngoài giờ, trả lời vào ' + supportHourLabel(SUPPORT.hours.start) + ' sáng mai')}</span>
                        </p>
                        <div className="mt-3 border-t border-white/10">
                            {SUPPORT.faq.map((item, i) => {
                                const pid = 'fpass-faq-' + i;
                                const on = faq === i;
                                return (
                                    <div key={item.q} className="border-b border-white/10">
                                        <button type="button" className="help-faq" aria-expanded={on} aria-controls={pid} onClick={() => setFaq(on ? -1 : i)}>
                                            <span>{item.q}</span>
                                            <span style={{ display: 'inline-flex', transform: on ? 'rotate(90deg)' : 'none' }}><Icon name="right" size={16} /></span>
                                        </button>
                                        <p id={pid} hidden={!on} className="help-quiet text-sm leading-relaxed pb-3">{item.a}</p>
                                    </div>
                                );
                            })}
                        </div>
                        <div className="mt-4">
                            <p className="text-sm font-semibold">Mã của bạn</p>
                            <div className="mt-1 flex items-center justify-between gap-2">
                                <p className="tnum text-3xl font-semibold tracking-wide">{code}</p>
                                <button type="button" className="help-mini" onClick={() => copyValue(code, 'code')}>{copied === 'code' ? 'Đã chép' : 'Sao chép'}</button>
                            </div>
                            <p className="help-quiet text-xs leading-relaxed">Mã này giúp chúng tôi tìm đúng giao dịch của bạn.</p>
                        </div>
                        <button type="button" data-autofocus className="help-go mt-4" aria-describedby="fpass-help-receipt" onClick={chatZalo}>Chat Zalo (tự sao chép mã)</button>
                        <p id="fpass-help-receipt" className="help-quiet text-xs leading-relaxed mt-2">Nhớ gửi kèm ảnh chụp biên lai chuyển khoản.</p>
                        <p className="help-quiet mt-3 flex flex-wrap items-center text-xs leading-relaxed">
                            <span>Hoặc gọi {SUPPORT.phoneDisplay}</span>
                            {touch
                                ? <a className="help-mini help-link" href={'tel:' + SUPPORT.phone}>Gọi</a>
                                : <button type="button" className="help-mini" onClick={() => copyValue(SUPPORT.phone, 'phone')}>{copied === 'phone' ? 'Đã chép' : 'Sao chép số'}</button>}
                        </p>
                        <p className="help-quiet flex flex-wrap items-center text-xs leading-relaxed">
                            <span>Hoặc gửi email: <a className="help-link underline" href={mailHref}>{SUPPORT.email}</a></span>
                            {!touch && <button type="button" className="help-mini" onClick={() => copyValue(SUPPORT.email, 'email')}>{copied === 'email' ? 'Đã chép' : 'Sao chép email'}</button>}
                        </p>
                        <button type="button" className="mt-4 w-full min-h-[44px] rounded-xl border border-white/15 bg-white/5 px-3 py-3 text-left text-sm leading-snug text-[#E2E8F0] hover:bg-white/10" onClick={onFeedback}>🐛 Phát hiện lỗi đề thi hoặc có ý tưởng mới? → Gửi góp ý ngay</button>
                    </div>
                </div>
            );
        };

        const SupportDock = ({ open, toast, returnTo, onOpen, onClose, onFeedback }) => (
            <>
                {open && <div className="help-scrim" onMouseDown={onClose} />}
                <div className="help-dock">
                    {open && <SupportPanel toast={toast} onClose={onClose} returnTo={returnTo} onFeedback={onFeedback} />}
                    <button type="button" className="help-launch" data-help-open aria-expanded={open} aria-controls="fpass-help" aria-haspopup="dialog" onClick={(e) => (open ? onClose() : onOpen(e.currentTarget))}>
                        <Icon name="headset" size={20} />
                        <span className="help-launch-label">Hỗ trợ</span>
                    </button>
                </div>
            </>
        );
    </script>

    <!-- ===================== PRACTICE ENGINES: Flashcard · Băng đạn 5 câu · EOS ===================== -->
    <script type="text/babel" data-presets="react">
        const ItemPrompt = ({ t, hl, big }) => {
            if (!t) return null;
            const text = t.type === 'mcq' ? t.questionOrWord : Sch.recallPromptOf(t);
            return (
                <p className={'text-flow reading font-semibold text-ink ' + (big ? 'text-xl sm:text-2xl' : 'text-lg sm:text-xl')}>
                    <Hl text={text} keywords={t.keywords} on={hl} />
                </p>
            );
        };

        const ItemAnswer = ({ t, hl, compact }) => {
            if (!t) return null;
            if (t.type === 'mcq') {
                return (
                    <p className="text-flow font-semibold text-success">
                        <span className="tnum mr-1">{t.answerOrMeaning}.</span>
                        <Hl text={Sch.correctText(t)} keywords={t.keywords} on={hl} />
                    </p>
                );
            }
            return (
                <div className="text-flow">
                    <span className="font-semibold text-success text-lg">{t.questionOrWord}</span>
                    {t.ipa && <span className="ml-2 text-sm text-ink2">{t.ipa}</span>}
                    {!compact && Sch.readingOf(t) && <span className="ml-2 text-sm text-muted">{Sch.readingOf(t)}</span>}
                </div>
            );
        };

        const Elapsed = ({ startedAt, limitMin }) => {
            const now = useNow(1000);
            const ms = now - startedAt;
            const over = limitMin && ms > limitMin * 60000;
            return (
                <span className={'chip tnum ' + (over ? 'bg-warn-soft text-warn' : 'bg-surface2 text-ink2')}>
                    <Icon name="timer" size={14} />
                    {Plan.fmtCountdown(ms)}{limitMin ? ' / ' + limitMin + ':00' : ''}
                </span>
            );
        };

        const JACK_STAGES = [
            { kind: 'stage1', src: 'public/stickers/jack-stage1.png', label: 'Nhập môn ngơ ngác' },
            { kind: 'stage2', src: 'public/stickers/jack-stage2.png', label: 'Tự tin 5+5=8' },
            { kind: 'stage3', src: 'public/stickers/jack-stage3.png', label: 'Càn quét đề thi' },
            { kind: 'stage4', src: 'public/stickers/jack-stage4.png', label: 'Bá chủ phòng thi!' }
        ];
        const JACK_SRC = {
            question: 'public/stickers/jack-question.png',
            wrong: 'public/stickers/jack-wrong.png'
        };
        const jackTier = (pct) => (pct >= 100 ? 3 : pct >= 60 ? 2 : pct >= 25 ? 1 : 0);

        const JackFace = ({ kind }) => {
            const mood = kind === 'wrong' ? 'M3 16 Q12 22 21 16' : kind === 'stage4' ? 'M4 15 Q12 20 20 15' : 'M5 16 Q12 19 19 16';
            const eyes = kind === 'wrong'
                ? <><circle cx="8" cy="11" r="2.2" /><circle cx="16" cy="11" r="2.2" /></>
                : <><circle cx="8.5" cy="12" r="1.3" /><circle cx="15.5" cy="12" r="1.3" /></>;
            return (
                <svg className="jack-face" viewBox="0 0 24 24" aria-hidden="true">
                    <rect width="24" height="24" rx="6" fill={kind === 'wrong' ? '#FEE2E2' : kind === 'stage4' ? '#FEF3C7' : '#EEF0FF'} />
                    <circle cx="12" cy="13" r="6.2" fill="#FDBA74" />
                    <path d="M6 8 L4 4 L9 7" fill="#FDBA74" />
                    <path d="M18 8 L20 4 L15 7" fill="#FDBA74" />
                    {eyes}
                    <path d={mood} fill="none" stroke="#9A3412" strokeWidth="1.2" strokeLinecap="round" />
                </svg>
            );
        };

        const knockBlack = (img) => {
            const nw = img.naturalWidth || 1;
            const nh = img.naturalHeight || 1;
            const max = 960;
            const scale = Math.min(1, max / Math.max(nw, nh));
            const w = Math.max(1, Math.round(nw * scale));
            const h = Math.max(1, Math.round(nh * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const pen = canvas.getContext('2d', { willReadFrequently: true });
            pen.imageSmoothingEnabled = true;
            pen.imageSmoothingQuality = 'high';
            pen.drawImage(img, 0, 0, w, h);
            const frame = pen.getImageData(0, 0, w, h);
            const px = frame.data;
            for (let i = 0; i < px.length; i += 4) {
                if (px[i] < 24 && px[i + 1] < 24 && px[i + 2] < 24) px[i + 3] = 0;
            }
            pen.putImageData(frame, 0, 0);
            let minX = w, minY = h, maxX = -1, maxY = -1;
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    if (px[(y * w + x) * 4 + 3] < 16) continue;
                    if (x < minX) minX = x;
                    if (y < minY) minY = y;
                    if (x > maxX) maxX = x;
                    if (y > maxY) maxY = y;
                }
            }
            if (maxX < minX) return canvas.toDataURL('image/png');
            const cw = maxX - minX + 1;
            const ch = maxY - minY + 1;
            const trimmed = document.createElement('canvas');
            trimmed.width = cw;
            trimmed.height = ch;
            trimmed.getContext('2d').drawImage(canvas, minX, minY, cw, ch, 0, 0, cw, ch);
            return trimmed.toDataURL('image/png');
        };

        const JackSticker = ({ kind, src }) => {
            const [missing, setMissing] = useState(false);
            const [cut, setCut] = useState('');
            useEffect(() => { setMissing(false); setCut(''); }, [src]);
            if (missing || !src) return <JackFace kind={kind} />;
            return (
                <img src={cut || src} alt=""
                    onLoad={(e) => {
                        if (cut || String(e.currentTarget.src).indexOf('data:') === 0) return;
                        try { setCut(knockBlack(e.currentTarget)); } catch (err) {}
                    }}
                    onError={() => { if (!cut) setMissing(true); }} />
            );
        };

        const JackCorner = ({ wrong }) => (
            <div className="jack-corner">
                <span className="jack-sticker">
                    <JackSticker kind={wrong ? 'wrong' : 'question'} src={wrong ? JACK_SRC.wrong : JACK_SRC.question} />
                </span>
                {!wrong && <p className="jack-tip">Câu này chọn gì đây ta...</p>}
            </div>
        );

        const JackEvolveBar = ({ value, max }) => {
            const pct = max > 0 ? Math.max(0, Math.min(100, Math.round((value / max) * 100))) : 0;
            const tier = jackTier(pct);
            const stage = JACK_STAGES[tier];
            const [pop, setPop] = useState(0);
            const prev = useRef(tier);
            useEffect(() => {
                if (tier === prev.current) return;
                prev.current = tier;
                setPop((n) => n + 1);
            }, [tier]);
            return (
                <div className="jack-evo">
                    <div className="jack-evo-top">
                        <span className="text-xs font-semibold text-ink">{stage.label}</span>
                        <span className="tnum text-xs text-muted">{pct}%</span>
                    </div>
                    <div className="jack-track" role="progressbar" aria-valuenow={pct} aria-valuemin={0} aria-valuemax={100} aria-label={'Jack: ' + stage.label}>
                        <div className="jack-fill" style={{ width: pct + '%' }} />
                        {[0, 25, 60, 100].map((mark) => <span key={mark} className={'jack-mark' + (pct >= mark ? ' on' : '')} style={{ left: mark + '%' }} />)}
                        <span key={stage.kind + '-' + pop} className={'jack-runner' + (pop ? ' jack-evolve' : '')} style={{ left: pct + '%' }}>
                            <span className="jack-sticker"><JackSticker kind={stage.kind} src={stage.src} /></span>
                        </span>
                    </div>
                    <div className="jack-labels">
                        {JACK_STAGES.map((item, i) => <span key={item.kind} className={i === tier ? 'is-now' : ''}>{item.label}</span>)}
                    </div>
                </div>
            );
        };

        const HighlightButton = ({ on, onToggle, locked }) => (
            <button type="button" onClick={onToggle} aria-pressed={on} className={'btn btn-sm ' + (on ? 'btn-primary' : 'btn-secondary')} title="Highlight từ khóa ăn điểm (phím H)">
                <Icon name={locked ? 'lock' : 'highlighter'} size={14} /> Highlight <Kbd>H</Kbd>
            </button>
        );

        /* ---------------------------------------------------------------
         * BurstSession — Băng đạn 5 câu
         * --------------------------------------------------------------- */
        const BurstSession = ({ itemsById, ids, title, subtitle, canHighlight = true, highlightLockedMsg, onReview, onFinish, onExit, canExplain, toast, timerMin, renderDone, skipPreview }) => {
            const [s, dispatch] = useReducer(Burst.reduce, ids, (x) => Burst.init(x.filter(id => itemsById.has(id)), { skipPreview }));
            const [fb, setFb] = useState(null);
            const [input, setInput] = useState('');
            const [hl, setHl] = useState(false);
            const [now, setNow] = useState(Date.now());
            const [explained, setExplained] = useState({});
            const [explaining, setExplaining] = useState(false);
            const lock = useRef(false);
            const composing = useRef(false);
            const inputRef = useRef(null);
            const cardRef = useRef(null);
            const finished = useRef(false);
            const mounted = useMounted();
            const orders = useMemo(() => {
                const m = {};
                ids.forEach(id => {
                    const t = itemsById.get(id);
                    if (t && t.type === 'mcq') m[id] = Sch.shuffle([0, 1, 2, 3].filter(i => t.options[i]));
                });
                return m;
            }, []);

            const batch = s.batches[s.b] || [];
            const head = Burst.head(s, now);
            const cur = head.id != null ? itemsById.get(head.id) : null;
            const waiting = s.phase === 'drill' && head.waitMs > 0;

            useEffect(() => {
                if (s.phase !== 'preview') return undefined;
                const t = setTimeout(() => dispatch({ type: 'START_DRILL' }), Burst.PREVIEW_MS);
                return () => clearTimeout(t);
            }, [s.phase, s.b]);

            useEffect(() => {
                if (!waiting) return undefined;
                const t = setTimeout(() => setNow(Date.now()), Math.min(250, head.waitMs));
                return () => clearTimeout(t);
            }, [waiting, now]);

            useEffect(() => {
                if (s.phase !== 'batchDone') return undefined;
                const t = setTimeout(() => dispatch({ type: 'NEXT_BATCH', skipPreview }), 1400);
                return () => clearTimeout(t);
            }, [s.phase, s.b]);

            useEffect(() => {
                if (s.phase === 'done' && !finished.current) {
                    finished.current = true;
                    if (onFinish) onFinish(Burst.stats(s));
                }
            }, [s.phase]);

            useEffect(() => {
                if (s.phase !== 'drill' || !cur || waiting) return;
                if (cur.type === 'vocab' && inputRef.current) inputRef.current.focus();
                else if (cardRef.current) cardRef.current.focus();
            }, [s.phase, head.id, waiting]);

            const answer = (ok, chosen) => {
                if (lock.current || !cur || waiting) return;
                lock.current = true;
                const id = cur.id;
                setFb({ ok, chosen, id });
                if (ok) Sfx.correct(); else Sfx.wrong();
                if (s.firstTry[id] === undefined && onReview) onReview(id, ok);
                setTimeout(() => {
                    if (!mounted.current) return;
                    dispatch({ type: 'ANSWER', id, correct: ok, now: Date.now() });
                    setNow(Date.now());
                    setFb(null);
                    setInput('');
                    lock.current = false;
                }, ok ? 200 : 1500);
            };

            const pick = (di) => {
                if (s.phase !== 'drill' || !cur || cur.type !== 'mcq' || fb) return;
                const order = orders[cur.id] || [0, 1, 2, 3];
                if (di >= order.length) return;
                answer(Sch.LETTERS[order[di]] === cur.answerOrMeaning, di);
            };

            const matches = (v) => cur && Sch.normAnswer(v) !== '' && Sch.normAnswer(v) === Sch.normAnswer(cur.questionOrWord);

            const toggleHl = () => {
                if (!canHighlight) { if (toast) toast(highlightLockedMsg || 'Highlight chưa mở cho bộ này', 'info'); return; }
                setHl(v => !v);
            };

            const explainAI = async (t) => {
                if (!AI.ready()) { toast && toast('AI chỉ chạy khi mở trang qua web, không mở file trực tiếp.', 'info'); return; }
                setExplaining(true);
                try {
                    const txt = await AI.explain(t);
                    if (mounted.current) setExplained(m => Object.assign({}, m, { [t.id]: txt }));
                } catch (e) {
                    toast && toast(e.message, 'error');
                } finally {
                    if (mounted.current) setExplaining(false);
                }
            };

            useHotkeys('burst', {
                '1': () => pick(0), '2': () => pick(1), '3': () => pick(2), '4': () => pick(3),
                a: () => pick(0), b: () => pick(1), c: () => pick(2), d: () => pick(3),
                h: toggleHl,
                Enter: () => {
                    if (s.phase === 'preview') dispatch({ type: 'START_DRILL' });
                    else if (s.phase === 'batchDone') dispatch({ type: 'NEXT_BATCH', skipPreview });
                    else return false;
                },
                Space: () => { if (s.phase === 'preview') dispatch({ type: 'START_DRILL' }); else return false; },
                Escape: () => { if (onExit) onExit(); }
            });

            const clearedN = batch.filter(id => s.cleared.indexOf(id) >= 0).length;
            const totalQ = s.batches.reduce((n, b) => n + b.length, 0);
            const header = (
                <div className="drill-head">
                    <div className="drill-head-row">
                        <div className="min-w-0">
                            <p className="text-[11px] font-semibold uppercase tracking-wider text-muted">{subtitle || 'Băng đạn 5 câu'}</p>
                            <h2 className="text-base font-bold text-flow truncate">{title}</h2>
                        </div>
                        <div className="flex flex-wrap items-center gap-2">
                            {timerMin ? <Elapsed startedAt={s.startedAt} limitMin={timerMin} /> : null}
                            <HighlightButton on={hl} onToggle={toggleHl} locked={!canHighlight} />
                            {onExit && <button type="button" className="btn btn-ghost btn-sm" onClick={onExit}><Icon name="x" size={14} /> Thoát <Kbd>Esc</Kbd></button>}
                        </div>
                    </div>
                    <div className="drill-progress">
                        <span className="text-xs text-ink2 tnum">
                            Băng đạn <b className="text-ink">{s.b + 1}/{s.batches.length}</b> · Đã nắm <b className={clearedN === batch.length && batch.length ? 'text-success' : 'text-ink'}>{clearedN}/{batch.length}</b>
                        </span>
                        <JackEvolveBar value={s.cleared.length} max={totalQ} />
                    </div>
                </div>
            );

            if (!s.batches.length) {
                return <div className="card p-6">{header}<Empty title="Không có câu để luyện">Thêm câu vào kho hoặc chọn nhóm khác.</Empty></div>;
            }

            if (s.phase === 'done') {
                const st = Burst.stats(s);
                if (renderDone) return renderDone(st);
                const missed = st.missed.map(id => itemsById.get(id)).filter(Boolean);
                return (
                    <div className="card p-6 sm:p-8 enter">
                        <JackEvolveBar value={st.total} max={st.total || 1} />
                        <div className="w-12 h-12 rounded-2xl bg-success-soft text-success flex items-center justify-center mb-3 mt-4"><Icon name="trophy" size={24} /></div>
                        <h2 className="text-2xl font-bold">Sạch toàn bộ {st.total} câu</h2>
                        <p className="text-muted mt-1">Đúng ngay lần đầu {st.firstTryCorrect}/{st.total} · thời gian {Plan.fmtCountdown(st.elapsedMs)}</p>
                        {missed.length > 0 && (
                            <div className="mt-5 space-y-2">
                                <p className="text-sm font-semibold">Đã vào mục ôn câu yếu:</p>
                                {missed.map(t => (
                                    <div key={t.id} className="rounded-xl border border-line p-3">
                                        <ItemPrompt t={t} hl={hl} />
                                        <div className="mt-1"><ItemAnswer t={t} hl={hl} compact /></div>
                                    </div>
                                ))}
                            </div>
                        )}
                        {onExit && <div className="mt-6"><button type="button" className="btn btn-primary" onClick={onExit} data-autofocus>Xong</button></div>}
                    </div>
                );
            }

            if (s.phase === 'preview') {
                return (
                    <div className="drill-stage enter">
                        {header}
                        <div className="flex flex-wrap items-center justify-between gap-3 mb-3">
                            <p className="font-semibold flex items-center gap-2"><Icon name="eye" /> Vòng 1 · Nhìn lướt 15 giây</p>
                            <button type="button" className="btn btn-primary btn-sm" onClick={() => dispatch({ type: 'START_DRILL' })} autoFocus>
                                Vào phản xạ ngay <Kbd>Enter</Kbd>
                            </button>
                        </div>
                        <div className="h-1.5 rounded-full bg-surface2 overflow-hidden mb-5">
                            <div key={s.b} className="h-full bg-primary bar-run" style={{ animationDuration: Burst.PREVIEW_MS + 'ms' }} />
                        </div>
                        <ol className="space-y-3">
                            {batch.map((id, i) => {
                                const t = itemsById.get(id);
                                return (
                                    <li key={id} className="rounded-xl border border-line p-3 sm:p-4 flex gap-3">
                                        <span className="tnum text-xs font-semibold text-muted pt-1 w-6 shrink-0">s{i + 1}</span>
                                        <div className="min-w-0 flex-1 space-y-1">
                                            <ItemPrompt t={t} hl={hl} />
                                            <ItemAnswer t={t} hl={hl} />
                                        </div>
                                    </li>
                                );
                            })}
                        </ol>
                    </div>
                );
            }

            if (s.phase === 'batchDone') {
                return (
                    <div className="card p-6 sm:p-8 text-center enter">
                        {header}
                        <div className="mx-auto w-14 h-14 rounded-2xl bg-success text-white flex items-center justify-center mb-3 pop-ok"><Icon name="check" size={28} /></div>
                        <h3 className="text-xl font-bold">Sạch {batch.length}/{batch.length} — mở băng đạn tiếp theo</h3>
                        <p className="text-muted mt-1">Băng {s.b + 2}/{s.batches.length} sẽ tự mở.</p>
                        <button type="button" className="btn btn-primary mt-5" onClick={() => dispatch({ type: 'NEXT_BATCH', skipPreview })} autoFocus>Mở ngay <Kbd>Enter</Kbd></button>
                    </div>
                );
            }

            if (waiting && cur) {
                return (
                    <div className="drill-stage enter">
                        {header}
                        <div className="rounded-2xl bg-warn-soft border border-amber-200 p-4 sm:p-5">
                            <p className="text-sm font-semibold text-warn flex items-center gap-2"><Icon name="rotate" size={16} /> Câu này quay lại sau <span className="tnum">{Math.ceil(head.waitMs / 1000)}s</span> — nhìn lại đáp án:</p>
                            <div className="mt-3 space-y-2">
                                <ItemPrompt t={cur} hl />
                                <ItemAnswer t={cur} hl />
                                {cur.explanationOrExample && <p className="text-sm text-ink2 text-flow reading">{cur.explanationOrExample}</p>}
                                {explained[cur.id] && <p className="text-sm text-ink2 text-flow reading border-t border-amber-200 pt-2">{explained[cur.id]}</p>}
                            </div>
                            {canExplain && cur.type === 'mcq' && !explained[cur.id] && (
                                <button type="button" className="btn btn-secondary btn-sm mt-3" disabled={explaining} onClick={() => explainAI(cur)}><Icon name="sparkles" size={14} /> {explaining ? 'AI đang giải…' : 'Lời giải AI'}</button>
                            )}
                        </div>
                    </div>
                );
            }

            if (!cur) return null;
            const order = orders[cur.id] || [0, 1, 2, 3];
            const showAnswer = fb && !fb.ok;

            const tone = fb ? (fb.ok ? ' ok' : ' bad') : '';
            const missed = !!(fb && !fb.ok);
            return (
                <div className="drill-stage">
                    {header}
                    <div ref={cardRef} tabIndex={-1} key={cur.id + ':' + (s.misses[cur.id] || 0)} className={'q-card' + (missed ? ' shake bad' : ' q-spring' + tone)}>
                        <div className="px-5 sm:px-8 pt-6 sm:pt-8 pb-6 sm:pb-8 flex items-start gap-3">
                            <div className="min-w-0 flex-1">
                                <div className="flex items-center gap-2 mb-3">
                                    <span className="chip bg-surface2 text-ink2">{cur.type === 'mcq' ? 'Trắc nghiệm' : 'Gõ từ tiếng Anh'}</span>
                                    {s.misses[cur.id] ? <span className="chip bg-danger-soft text-danger"><Icon name="rotate" size={12} /> làm lại</span> : null}
                                </div>
                                <ItemPrompt t={cur} hl={hl} big />
                            </div>
                            <JackCorner wrong={missed} />
                        </div>
                    </div>
                    {fb && fb.ok && (
                        <div className="callout ok" role="status">
                            <span className="callout-ico">✓</span>
                            <p className="font-semibold pt-0.5">Chính xác</p>
                        </div>
                    )}
                    {showAnswer && (
                        <div className="callout bad" role="alert">
                            <span className="callout-ico">✕</span>
                            <div className="min-w-0">
                                <p className="font-semibold mb-1">Alo tổng đài cứu nét! Sai rồi, nhai lại câu này ngay!</p>
                                <ItemAnswer t={cur} hl />
                                {cur.explanationOrExample && <p className="text-sm mt-1 text-flow">{cur.explanationOrExample}</p>}
                            </div>
                        </div>
                    )}
                    {cur.type === 'vocab' && (
                        <div className="mt-4">
                            <label htmlFor="burst-input" className="label">Gõ từ tiếng Anh — khớp là tự chấm</label>
                            <input id="burst-input" ref={inputRef} value={input} autoComplete="off" autoCapitalize="off" spellCheck={false} disabled={!!fb}
                                className="field text-lg min-h-[52px]" placeholder="Gõ đáp án…"
                                onCompositionStart={() => { composing.current = true; }}
                                onCompositionEnd={(e) => { composing.current = false; if (matches(e.currentTarget.value)) answer(true); }}
                                onChange={(e) => {
                                    const v = e.target.value;
                                    setInput(v);
                                    if (!composing.current && !(e.nativeEvent && e.nativeEvent.isComposing) && matches(v)) answer(true);
                                }}
                                onKeyDown={(e) => {
                                    if (e.key !== 'Enter' || e.nativeEvent.isComposing || composing.current) return;
                                    e.preventDefault();
                                    answer(matches(input));
                                }} />
                            <p className="text-xs text-muted mt-2">Bí thì nhấn <Kbd>Enter</Kbd> để xem đáp án — câu sẽ quay lại cuối băng sau 15 giây.</p>
                        </div>
                    )}
                    {cur.type === 'mcq' && (
                        <div className="choices safe-bottom" role="group" aria-label="Lựa chọn đáp án">
                            {order.map((oi, di) => {
                                const isRight = Sch.LETTERS[oi] === cur.answerOrMeaning;
                                const chosen = fb && fb.chosen === di;
                                const cls = fb ? (isRight ? 'choice right' : chosen ? 'choice wrong' : 'choice dim') : 'choice';
                                return (
                                    <button key={oi} type="button" onClick={() => pick(di)} disabled={!!fb} className={cls}>
                                        <span className="keycap">{fb && isRight ? '✓' : (chosen && !fb.ok ? '✕' : di + 1)}</span>
                                        <span className="text-flow font-medium leading-snug">
                                            <Hl text={cur.options[oi]} keywords={fb && isRight ? cur.keywords : []} on={hl && !!fb} />
                                        </span>
                                    </button>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        /* ---------------------------------------------------------------
         * FlashSession — Flashcard / Điền từ / Nghe viết / Ghi âm (giữ nguyên tính năng bản cũ)
         * --------------------------------------------------------------- */
        const FlashSession = ({ items, session, onReview, onPatch, onFinish, onClose, onRestart, toast }) => {
            const byId = useMemo(() => new Map(items.map(t => [t.id, t])), [items]);
            const ids = session.ids;
            const isSlot = !!session.slotId;
            const [index, setIndex] = useState(0);
            const [flipped, setFlipped] = useState(false);
            const [done, setDone] = useState(false);
            const [known, setKnown] = useState([]);
            const [forgot, setForgot] = useState([]);
            const [face, setFace] = useState('recall');
            const [mode, setMode] = useState(session.mode === 'test' ? 'test' : session.mode === 'listen' ? 'listen' : 'flash');
            const [typed, setTyped] = useState('');
            const [result, setResult] = useState(null);
            const [hint, setHint] = useState(false);
            const [recording, setRecording] = useState(false);
            const [note, setNote] = useState('');
            const [preparing, setPreparing] = useState(false);
            const [hl, setHl] = useState(false);
            const recRef = useRef(null);
            const inputRef = useRef(null);
            const cardRef = useRef(null);
            const composing = useRef(false);
            const mounted = useMounted();
            const t = byId.get(ids[index]) || null;
            const isMcq = !!(t && t.type === 'mcq');

            useEffect(() => {
                setTyped('');
                setResult(null);
                setHint(false);
                setFlipped(false);
            }, [index, mode]);

            useEffect(() => {
                const el = mode !== 'flash' && !isMcq ? inputRef.current : cardRef.current;
                if (el) el.focus();
            }, [index, mode, isMcq]);

            useEffect(() => {
                const need = ids.map(id => byId.get(id)).filter(x => x && x.type === 'vocab' && x.questionOrWord && !x.recallPrompt).slice(0, 40);
                if (!need.length || !AI.ready()) return undefined;
                setPreparing(true);
                AI.recallPrompts(need)
                    .then(map => {
                        const patch = {};
                        Object.keys(map).forEach(id => { patch[id] = { recallPrompt: map[id] }; });
                        if (Object.keys(patch).length) onPatch(patch);
                    })
                    .catch(() => { if (mounted.current) setNote('Không soạn được câu hỏi gợi nhớ, đang dùng nghĩa tiếng Việt.'); })
                    .finally(() => { if (mounted.current) setPreparing(false); });
                return undefined;
            }, []);

            const allGraded = (k, f) => ids.length > 0 && ids.every(id => k.indexOf(id) >= 0 || f.indexOf(id) >= 0);

            const next = () => {
                setNote('');
                if (index < ids.length - 1) setIndex(index + 1);
                else if (!isSlot) setDone(true);
                else if (allGraded(known, forgot)) setDone(true);
                else setNote('Ca này tính xong khi bạn chấm hết các thẻ.');
            };

            const prev = () => {
                setNote('');
                if (index > 0) { setIndex(index - 1); setDone(false); }
            };

            const mark = (id, ok) => {
                const k = ok ? (known.indexOf(id) >= 0 ? known : known.concat(id)) : known.filter(x => x !== id);
                const f = !ok ? (forgot.indexOf(id) >= 0 ? forgot : forgot.concat(id)) : forgot.filter(x => x !== id);
                setKnown(k);
                setForgot(f);
                return { k, f };
            };

            const finishIfComplete = (k, f) => {
                if (!allGraded(k, f)) return false;
                setDone(true);
                if (onFinish && isSlot) onFinish({ slotId: session.slotId, cardsDone: ids.length, remembered: k.length });
                return true;
            };

            const gradeFlash = (ok) => {
                if (!t || done) return;
                onReview(t.id, ok);
                const r = Sch.applyReview(t, ok);
                const m = mark(t.id, ok);
                setNote(ok ? 'Ôn lại sau ' + r.afterDays + ' ngày' : 'Thẻ này vào mục ôn yếu');
                if (finishIfComplete(m.k, m.f)) return;
                if (index < ids.length - 1) setIndex(index + 1);
            };

            const settle = (ok, extra) => {
                setResult(Object.assign({ ok }, extra || {}));
                if (ok) Sfx.correct(); else Sfx.wrong();
                onReview(t.id, ok, extra && extra.kind);
                const m = mark(t.id, ok);
                const complete = finishIfComplete(m.k, m.f);
                if (ok && !complete) setTimeout(() => { if (mounted.current) next(); }, 450);
            };

            const checkTyped = (value, explicit) => {
                if (!t || result) return;
                const ok = Sch.normAnswer(value) !== '' && Sch.normAnswer(value) === Sch.normAnswer(t.questionOrWord);
                if (!ok && !explicit) return;
                settle(ok);
            };

            const pickMcq = (i) => {
                if (!t || !isMcq || mode === 'flash' || result) return;
                if (!t.options[i]) return;
                settle(Sch.LETTERS[i] === t.answerOrMeaning, { chosen: i });
            };

            const record = async () => {
                if (!t) return;
                toast('Chấm phát âm tự động chưa mở trên máy chủ dùng chung. Bạn vẫn gõ từ được.', 'info');
            };

            useHotkeys('flash', {
                Space: () => { if (mode === 'flash') setFlipped(v => !v); else return false; },
                ArrowRight: next,
                ArrowLeft: prev,
                h: () => setHl(v => !v),
                Enter: () => { if (result) next(); else if (mode === 'flash') setFlipped(v => !v); else return false; },
                '1': () => { if (mode === 'flash') { if (flipped) gradeFlash(false); } else pickMcq(0); },
                '2': () => { if (mode === 'flash') { if (flipped) gradeFlash(true); } else pickMcq(1); },
                '3': () => pickMcq(2),
                '4': () => pickMcq(3),
                a: () => pickMcq(0), b: () => pickMcq(1), c: () => pickMcq(2), d: () => pickMcq(3)
            });

            if (done) {
                const pending = ids.filter(id => known.indexOf(id) < 0 && forgot.indexOf(id) < 0).length;
                return (
                    <div className="card p-6 sm:p-8 max-w-2xl mx-auto enter">
                        <p className="text-sm text-muted">{session.title}</p>
                        <h2 className="text-2xl font-bold mb-5">Hết bộ thẻ</h2>
                        <div className="grid grid-cols-3 gap-3 mb-5">
                            <div className="rounded-xl bg-success-soft p-4 text-center"><div className="text-3xl font-bold text-success tnum">{known.length}</div><div className="text-sm text-ink2">Đã nhớ</div></div>
                            <div className="rounded-xl bg-danger-soft p-4 text-center"><div className="text-3xl font-bold text-danger tnum">{forgot.length}</div><div className="text-sm text-ink2">Cần ôn</div></div>
                            <div className="rounded-xl bg-surface2 p-4 text-center"><div className="text-3xl font-bold text-ink2 tnum">{pending}</div><div className="text-sm text-ink2">Chưa chấm</div></div>
                        </div>
                        {forgot.length > 0 && (
                            <div className="flex flex-wrap gap-2 mb-5">
                                {forgot.map(id => { const w = byId.get(id); return w ? <span key={id} className="chip bg-danger-soft text-danger">{w.type === 'mcq' ? w.questionOrWord.slice(0, 60) : w.questionOrWord}</span> : null; })}
                            </div>
                        )}
                        {!isSlot && (
                            <div className="flex flex-wrap gap-2">
                                {forgot.length > 0 && <button type="button" className="btn btn-danger" onClick={() => onRestart(forgot.slice(), 'flash', session.title.replace(/ · ôn lại$/, '') + ' · ôn lại')}><Icon name="rotate" /> Ôn lại thẻ chưa nhớ</button>}
                                <button type="button" className="btn btn-primary" onClick={() => onRestart(Sch.shuffle(ids), mode, session.title.replace(/ · ôn lại$/, ''))}><Icon name="shuffle" /> Làm lại</button>
                                <button type="button" className="btn btn-secondary" onClick={onClose}>Đóng</button>
                            </div>
                        )}
                    </div>
                );
            }

            const cloze = t && !isMcq ? Sch.blankOut(t.explanationOrExample || '', t.questionOrWord) : '';
            const hasBlank = cloze.indexOf('_____') >= 0;
            const front = !t ? '' : isMcq ? t.questionOrWord : (face === 'recognize' ? t.questionOrWord : Sch.recallPromptOf(t));

            return (
                <div className="max-w-3xl mx-auto">
                    <div className="flex flex-wrap items-center justify-between gap-3 mb-3">
                        <div className="min-w-0">
                            <p className="text-sm text-muted text-flow">{session.title}</p>
                            <p className="font-semibold tnum">{ids.length ? Math.min(index + 1, ids.length) : 0} / {ids.length}</p>
                        </div>
                        <div className="flex flex-wrap gap-2 items-center">
                            {!isSlot && (
                                <div role="tablist" aria-label="Kiểu luyện" className="flex gap-1 p-1 rounded-xl bg-surface border border-line">
                                    {[['flash', 'Thẻ'], ['test', 'Điền / chọn'], ['listen', 'Nghe viết']].map(([k, label]) => (
                                        <button key={k} type="button" role="tab" aria-selected={mode === k} className="tab min-h-[36px]" onClick={() => setMode(k)}>{label}</button>
                                    ))}
                                </div>
                            )}
                            <HighlightButton on={hl} onToggle={() => setHl(v => !v)} />
                            {!isSlot && <button type="button" className="btn btn-ghost btn-sm" onClick={onClose}><Icon name="x" size={14} /> Kết thúc</button>}
                        </div>
                    </div>
                    <JackEvolveBar value={known.length + forgot.length} max={ids.length} />
                    <div className="h-4" />

                    {!t ? (
                        <div className="card p-8 text-center">
                            <p className="text-muted mb-4">Thẻ này không còn trong kho.</p>
                            <button type="button" className="btn btn-primary" onClick={next}>Bỏ qua</button>
                        </div>
                    ) : mode === 'flash' ? (
                        <div>
                            {!isMcq && (
                                <div className="flex flex-wrap justify-center gap-2 mb-3">
                                    <div role="tablist" aria-label="Mặt trước" className="flex gap-1 p-1 rounded-xl bg-surface border border-line">
                                        <button type="button" role="tab" aria-selected={face === 'recall'} className="tab min-h-[36px]" onClick={() => setFace('recall')}>Gợi nhớ</button>
                                        <button type="button" role="tab" aria-selected={face === 'recognize'} className="tab min-h-[36px]" onClick={() => setFace('recognize')}>Nhận mặt chữ</button>
                                    </div>
                                    {preparing && <span className="text-sm text-muted self-center">Đang soạn câu hỏi gợi nhớ…</span>}
                                </div>
                            )}
                            <div className="scene">
                                <div ref={cardRef} tabIndex={0} role="button" aria-label={flipped ? 'Mặt sau thẻ, nhấn để lật lại' : 'Mặt trước thẻ, nhấn để lật'}
                                    className={'card3d rounded-3xl ' + (flipped ? 'flipped' : '')} onClick={() => setFlipped(v => !v)}>
                                    <div className="face front card rounded-3xl overflow-hidden" style={{ boxShadow: '0 20px 25px -5px rgba(15,23,42,.08), 0 8px 10px -6px rgba(15,23,42,.04), 0 0 0 1px rgba(15,23,42,.06)' }}>
                                        <div className="h-1.5" style={{ background: Sch.groupColor(t.group || t.questionOrWord) }} />
                                        <div className="px-6 sm:px-10 pt-10 pb-8 flex flex-col items-center text-center">
                                            <p className="text-xs font-semibold uppercase tracking-wider text-muted mb-4 text-flow">{t.group || 'Chưa nhóm'} · {isMcq ? 'Câu hỏi' : face === 'recognize' ? 'Từ' : 'Gợi nhớ'}</p>
                                            <p className={'font-semibold text-ink text-flow reading ' + (!isMcq && face === 'recognize' ? 'text-4xl' : 'text-xl sm:text-2xl')}>
                                                <Hl text={front} keywords={t.keywords} on={hl} />
                                            </p>
                                            {isMcq && (
                                                <ol className="mt-5 w-full max-w-xl text-left space-y-1.5">
                                                    {t.options.map((o, i) => o ? <li key={i} className="text-flow text-ink2"><span className="tnum font-semibold mr-2">{Sch.LETTERS[i]}.</span>{o}</li> : null)}
                                                </ol>
                                            )}
                                            {!isMcq && face === 'recognize' && t.ipa && <p className="text-lg text-ink2 mt-3">{t.ipa}</p>}
                                            <p className="text-sm text-muted mt-8">Nhấn thẻ hoặc <Kbd>Space</Kbd> để lật</p>
                                        </div>
                                    </div>
                                    <div className="face back card rounded-3xl overflow-hidden" style={{ boxShadow: '0 20px 25px -5px rgba(15,23,42,.08), 0 8px 10px -6px rgba(15,23,42,.04), 0 0 0 1px rgba(15,23,42,.06)' }}>
                                        <div className="h-1.5 bg-success" />
                                        <div className="px-6 sm:px-10 py-8 text-center">
                                            {isMcq ? (
                                                <>
                                                    <p className="text-xs font-semibold uppercase tracking-wider text-muted mb-3">Đáp án</p>
                                                    <div className="text-2xl"><ItemAnswer t={t} hl={hl} /></div>
                                                    {t.explanationOrExample && <p className="mt-4 text-ink2 text-flow reading mx-auto">{t.explanationOrExample}</p>}
                                                </>
                                            ) : (
                                                <>
                                                    <p className="text-4xl font-semibold text-ink text-flow"><Hl text={t.questionOrWord} keywords={t.keywords} on={hl} /></p>
                                                    {t.ipa && <p className="text-ink2 mt-2">{t.ipa}</p>}
                                                    {Sch.readingOf(t) && <p className="text-muted text-sm">{Sch.readingOf(t)}</p>}
                                                    <button type="button" onClick={(e) => { e.stopPropagation(); speak(t.questionOrWord); }} className="btn btn-secondary btn-sm mt-4"><Icon name="volume" size={14} /> Nghe</button>
                                                    <p className="mt-5 text-lg text-ink text-flow">{t.answerOrMeaning}</p>
                                                    {t.explanationOrExample && <p className="mt-3 text-ink2 italic text-flow reading mx-auto"><Hl text={t.explanationOrExample} keywords={t.keywords} on={hl} /></p>}
                                                    {t.exampleVi && <p className="mt-1 text-sm text-muted text-flow">{t.exampleVi}</p>}
                                                </>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="flex items-center justify-center gap-3 mt-5">
                                <button type="button" onClick={prev} disabled={index === 0} className="btn btn-secondary btn-icon" aria-label="Thẻ trước"><Icon name="left" /></button>
                                {flipped ? (
                                    <>
                                        <button type="button" onClick={() => gradeFlash(false)} className="btn btn-danger btn-lg">Cần ôn <Kbd>1</Kbd></button>
                                        <button type="button" onClick={() => gradeFlash(true)} className="btn btn-success btn-lg">Đã nhớ <Kbd>2</Kbd></button>
                                    </>
                                ) : (
                                    <p className="text-sm text-muted px-2 text-center"><Kbd>Space</Kbd> lật · <Kbd>1</Kbd> cần ôn · <Kbd>2</Kbd> đã nhớ · <Kbd>H</Kbd> highlight</p>
                                )}
                                <button type="button" onClick={next} className="btn btn-secondary btn-icon" aria-label="Thẻ sau"><Icon name="right" /></button>
                            </div>
                            {note && <p className="text-center text-sm text-muted mt-3" role="status">{note}</p>}
                        </div>
                    ) : isMcq ? (
                        <div ref={cardRef} tabIndex={-1} className="drill-stage">
                            <div className={'q-card' + (result && !result.ok ? ' shake bad' : ' q-spring' + (result ? (result.ok ? ' ok' : '') : ''))}>
                                <div className="px-5 sm:px-8 pt-6 sm:pt-8 pb-6 sm:pb-8 flex items-start gap-3">
                                    <div className="min-w-0 flex-1"><ItemPrompt t={t} hl={hl} big /></div>
                                    <JackCorner wrong={!!(result && !result.ok)} />
                                </div>
                            </div>
                            {result && (
                                <div className={result.ok ? 'callout ok' : 'callout bad'} role="status">
                                    <span className="callout-ico">{result.ok ? '✓' : '✕'}</span>
                                    <div>
                                        <p className="font-semibold">{result.ok ? 'Chính xác' : 'Alo tổng đài cứu nét! Sai rồi, nhai lại câu này ngay!'}</p>
                                        {!result.ok && <div className="mt-1"><ItemAnswer t={t} hl={hl} /></div>}
                                        {!result.ok && t.explanationOrExample && <p className="text-sm mt-1 text-flow">{t.explanationOrExample}</p>}
                                    </div>
                                </div>
                            )}
                            <div className="choices" role="group" aria-label="Lựa chọn đáp án">
                                {t.options.map((o, i) => {
                                    if (!o) return null;
                                    const right = Sch.LETTERS[i] === t.answerOrMeaning;
                                    const chosen = result && result.chosen === i;
                                    const cls = result ? (right ? 'choice right' : chosen ? 'choice wrong' : 'choice dim') : 'choice';
                                    return (
                                        <button key={i} type="button" disabled={!!result} onClick={() => pickMcq(i)} className={cls}>
                                            <span className="keycap">{result && right ? '✓' : (chosen && !result.ok ? '✕' : i + 1)}</span>
                                            <span className="text-flow font-medium leading-snug"><Hl text={o} keywords={result && right ? t.keywords : []} on={hl && !!result} /></span>
                                        </button>
                                    );
                                })}
                            </div>
                            <div className="flex justify-between mt-5">
                                <button type="button" onClick={prev} disabled={index === 0} className="btn btn-secondary">Trước</button>
                                <button type="button" onClick={next} className="btn btn-secondary">{result ? <>Tiếp <Kbd>Enter</Kbd></> : 'Bỏ qua'}</button>
                            </div>
                        </div>
                    ) : (
                        <div className={'card p-5 sm:p-7 ' + (result ? (result.ok ? 'pop-ok' : 'shake') : '')}>
                            <div className="flex items-start gap-3 mb-3">
                                <h3 className="text-lg font-semibold min-w-0 flex-1">{mode === 'test' ? 'Điền từ' : 'Nghe và viết'}</h3>
                                <JackCorner wrong={!!(result && !result.ok)} />
                            </div>
                            {mode === 'test' ? (
                                <div className="rounded-xl bg-primary-soft border border-indigo-100 p-4 mb-4 text-lg text-flow reading">
                                    {hasBlank ? cloze : (t.answerOrMeaning || t.exampleVi || 'Gõ từ tiếng Anh')}
                                </div>
                            ) : (
                                <div className="text-center mb-4">
                                    <button type="button" onClick={() => speak(t.questionOrWord)} className="btn btn-primary btn-lg"><Icon name="volume" /> Phát âm từ</button>
                                    <p className="text-sm text-muted mt-2">Nghe rồi gõ. Từ được giấu đến khi chấm.</p>
                                </div>
                            )}
                            <div className="flex gap-2 mb-3">
                                <label htmlFor="typed" className="sr-only">Đáp án</label>
                                <input id="typed" ref={inputRef} value={typed} autoComplete="off" autoCapitalize="off" spellCheck={false}
                                    onCompositionStart={() => { composing.current = true; }}
                                    onCompositionEnd={(e) => { composing.current = false; checkTyped(e.currentTarget.value, false); }}
                                    onChange={(e) => { setTyped(e.target.value); if (!composing.current && !(e.nativeEvent && e.nativeEvent.isComposing)) checkTyped(e.target.value, false); }}
                                    onKeyDown={(e) => {
                                        if (e.key !== 'Enter' || e.nativeEvent.isComposing || composing.current) return;
                                        e.preventDefault();
                                        if (result) next(); else checkTyped(typed, true);
                                    }}
                                    placeholder="Gõ từ tiếng Anh… khớp là tự chấm" className="field flex-1 text-lg min-h-[52px]" />
                                {!result
                                    ? <button type="button" onClick={() => checkTyped(typed, true)} className="btn btn-success">Kiểm tra</button>
                                    : <button type="button" onClick={next} className="btn btn-primary">Tiếp</button>}
                            </div>
                            <div className="flex flex-wrap gap-2 mb-4">
                                <button type="button" onClick={() => setHint(v => !v)} className="btn btn-secondary btn-sm">Gợi ý</button>
                                {mode === 'listen' && (
                                    <button type="button" onClick={record} className={'btn btn-sm ' + (recording ? 'btn-danger pulse-rec' : 'btn-secondary')}>
                                        <Icon name={recording ? 'stop' : 'mic'} size={14} /> {recording ? 'Dừng ghi' : 'Ghi âm'}
                                    </button>
                                )}
                            </div>
                            {hint && (
                                <div className="rounded-xl bg-warn-soft border border-amber-200 p-3 mb-4 text-sm text-flow">
                                    {mode === 'listen' || !hasBlank ? 'Chữ đầu: ' + (t.questionOrWord || '?').charAt(0) : 'Nghĩa: ' + (t.answerOrMeaning || '—')}
                                </div>
                            )}
                            {result && (
                                <div className={'p-4 rounded-xl border-2 mb-4 text-flow ' + (result.ok ? 'bg-success-soft border-success' : 'bg-danger-soft border-danger')} role="status">
                                    <p className="font-bold text-lg mb-1">{result.ok ? 'Chính xác' : 'Alo tổng đài cứu nét! Sai rồi, nhai lại câu này ngay!'}</p>
                                    {result.heard && <p>Bạn nói: {result.heard}</p>}
                                    {!result.ok && <p>Đáp án: <strong>{t.questionOrWord}</strong></p>}
                                    {t.answerOrMeaning && <p className="mt-1">Nghĩa: {t.answerOrMeaning}</p>}
                                    {t.explanationOrExample && <p className="mt-2 italic text-ink2">{t.explanationOrExample}</p>}
                                    {t.exampleVi && <p className="text-sm text-muted">{t.exampleVi}</p>}
                                </div>
                            )}
                            <div className="flex justify-between">
                                <button type="button" onClick={prev} disabled={index === 0} className="btn btn-secondary">Trước</button>
                                <button type="button" onClick={next} className="btn btn-secondary">Bỏ qua</button>
                            </div>
                            {note && <p className="text-sm text-muted mt-3">{note}</p>}
                        </div>
                    )}
                </div>
            );
        };

        /* ---------------------------------------------------------------
         * EOSSimulator — giả lập phần mềm EOS WinForms. Chỉ chế độ này dùng giao diện cổ điển.
         * --------------------------------------------------------------- */
        const eosExamCode = (title) => {
            const parts = String(title || 'TEST').split('·').map(s => s.trim()).filter(Boolean);
            const head = (parts[0] && parts[0].toUpperCase() !== 'EOS' ? parts[0] : parts[1]) || parts[0] || 'TEST';
            const slug = head.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/gi, 'd')
                .replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '').toUpperCase().slice(0, 18);
            const base = slug || 'TEST';
            return /FE$/.test(base) ? base : base + '_FE';
        };

        const EOSSimulator = ({ title, items, count, minutes, onSubmit, onExit, onDrillWrong, canExplain, toast }) => {
            const byId = useMemo(() => new Map(items.map(t => [t.id, t])), [items]);
            const [paper] = useState(() => EOS.build(items, count));
            const [answers, setAnswers] = useState({});
            const [cur, setCur] = useState(0);
            const [tab, setTab] = useState('mcq');
            const [endAt] = useState(() => Date.now() + minutes * 60000);
            const [wantFinish, setWantFinish] = useState(false);
            const [result, setResult] = useState(null);
            const [timeUp, setTimeUp] = useState(false);
            const [reviewing, setReviewing] = useState(false);
            const [explained, setExplained] = useState({});
            const [explaining, setExplaining] = useState(null);
            const [openCode, setOpenCode] = useState('');
            const [fontSize, setFontSize] = useState(10);
            const startedAt = useRef(Date.now());
            const submitted = useRef(false);
            const charging = useRef(false);
            const [paying, setPaying] = useState(false);
            const now = useNow(1000, !result);
            const left = endAt - now;
            const examCode = useMemo(() => eosExamCode(title), [title]);
            const student = String(Store.prefs.get('student', '') || 'Student').slice(0, 40);
            const q = tab === 'mcq' ? paper[cur] : null;
            const t = q ? byId.get(q.id) : null;

            const submit = async (auto) => {
                if (submitted.current || charging.current) return;
                charging.current = true;
                setPaying(true);
                const r = EOS.grade(paper, answers, byId);
                r.usedMs = Date.now() - startedAt.current;
                let paid = true;
                if (onSubmit) {
                    try {
                        const out = await onSubmit(r);
                        if (out === false) paid = false;
                    } catch (e) {
                        paid = false;
                    }
                }
                charging.current = false;
                setPaying(false);
                if (!paid) return;
                submitted.current = true;
                setWantFinish(true);
                setReviewing(false);
                setTab('mcq');
                if (auto) setTimeUp(true);
                setResult(r);
                if (auto && toast) toast('Hết giờ — hệ thống đã tự nộp bài', 'info');
            };

            useEffect(() => { if (!submitted.current && left <= 0) submit(true); }, [left <= 0]);

            const choose = (di, toggle) => {
                if (result || !q || di >= q.order.length) return;
                setAnswers(a => {
                    const next = Object.assign({}, a);
                    if (toggle && next[cur] === di) delete next[cur];
                    else next[cur] = di;
                    return next;
                });
                Sfx.tap();
            };
            const go = (i) => { setTab('mcq'); setCur(Math.max(0, Math.min(paper.length - 1, i))); };
            const showQuestion = () => {
                const n = parseInt(openCode, 10);
                if (n >= 1 && n <= paper.length) go(n - 1);
            };
            const setSize = (v) => setFontSize(Math.max(8, Math.min(28, v)));
            const leave = () => {
                if (!result && !confirm('Thoát phòng thi? Bài làm sẽ không được chấm.')) return;
                onExit();
            };

            useHotkeys('eos', {
                '1': () => choose(0), '2': () => choose(1), '3': () => choose(2), '4': () => choose(3),
                a: () => choose(0), b: () => choose(1), c: () => choose(2), d: () => choose(3),
                ArrowRight: () => go(cur + 1),
                ArrowLeft: () => go(cur - 1)
            }, { enabled: !result });

            const answeredCount = Object.keys(answers).length;
            const wrongItems = result ? result.wrong.map(w => ({ w, t: byId.get(w.id) })).filter(x => x.t) : [];
            const explainOne = async (it) => {
                setExplaining(it.id);
                try {
                    const txt = await AI.explain(it);
                    setExplained(m => Object.assign({}, m, { [it.id]: txt }));
                } catch (e) { toast && toast(e.message, 'error'); }
                finally { setExplaining(null); }
            };
            const clock = Plan.fmtCountdown(Math.max(0, left));

            const header = (
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px 16px', alignItems: 'flex-start' }}>
                    <div style={{ flex: '1 1 520px', minWidth: 320 }}>
                        <div style={{ color: '#FF0000', fontWeight: 700, marginBottom: 4 }}>Updated 11/06/2012</div>
                        <div style={{ display: 'grid', gridTemplateColumns: 'auto auto auto auto', gap: '3px 16px', alignItems: 'center', justifyContent: 'start' }}>
                            <span>Machine:</span><b className="eos-val">FPT-STUDENT-PC</b>
                            <span>Student:</span><b className="eos-val">{student}</b>
                            <span>Server:</span><b className="eos-val">Eng_EOS_Server</b>
                            <span>Exam Code:</span><b className="eos-val">{examCode}</b>
                            <span>Duration:</span><b className="eos-val">{minutes} minutes</b>
                            <span>Total Marks:</span><b className="eos-val">{paper.length}</b>
                            <span>Q mark:</span><b className="eos-val">1</b>
                            <span />
                        </div>
                        <div style={{ display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: '6px 14px', marginTop: 6 }}>
                            <label style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
                                Open Code:
                                <input className="eos-field" value={openCode} inputMode="numeric" maxLength={4} style={{ width: 64 }}
                                    onChange={(e) => setOpenCode(e.target.value.replace(/\D/g, '').slice(0, 4))}
                                    onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); showQuestion(); } }}
                                    aria-label="Open Code" />
                                <button type="button" className="eos-btn" onClick={showQuestion}>Show Question</button>
                            </label>
                            <label style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
                                Font Size:
                                <input className="eos-field" type="number" min="8" max="28" value={fontSize} style={{ width: 56 }}
                                    onChange={(e) => setSize(parseInt(e.target.value, 10) || 10)} aria-label="Font Size" />
                            </label>
                            {result
                                ? <b className="eos-val" style={{ fontSize: 16 }}>{timeUp ? 'Time is up. ' : ''}Examination Over!</b>
                                : null}
                        </div>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 10, paddingTop: 14 }} role="timer" aria-label={'Còn ' + clock}>
