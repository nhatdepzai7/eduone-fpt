                                                        onChange={(e) => update(t.id, e.target.value === 'mcq' ? { type: 'mcq', options: t.options.length ? t.options : ['', '', '', ''], answerOrMeaning: 'A' } : { type: 'vocab', options: [], answerOrMeaning: '' })}>
                                                        <option value="vocab">Từ</option><option value="mcq">MCQ</option>
                                                    </select>
                                                </td>
                                                <td className="p-0">
                                                    <textarea rows={1} className="cell-ta font-semibold text-primary" value={t.questionOrWord} maxLength={mcq ? 1500 : 400} aria-label={mcq ? 'Câu hỏi' : 'Từ vựng'} placeholder={mcq ? 'Câu hỏi…' : 'Nhập từ…'}
                                                        onChange={(e) => update(t.id, { questionOrWord: e.target.value })} onDoubleClick={() => setEditing(t)} />
                                                    {!mcq && <input className="cell-ta !min-h-[32px] text-xs text-ink2 !py-1" value={t.wordType} maxLength={24} placeholder="từ loại: n / v…" aria-label="Từ loại" onChange={(e) => update(t.id, { wordType: e.target.value })} />}
                                                </td>
                                                <td className="p-0">
                                                    {mcq ? (
                                                        <div className="p-2 space-y-1">
                                                            <select aria-label="Đáp án đúng" className="field !min-h-[36px] text-xs" value={t.answerOrMeaning || 'A'} onChange={(e) => update(t.id, { answerOrMeaning: e.target.value })}>
                                                                {Sch.LETTERS.map(L => <option key={L} value={L}>Đáp án {L}</option>)}
                                                            </select>
                                                            <p className="text-xs text-ink2 text-flow">{Sch.correctText(t) || <button type="button" className="underline" onClick={() => setEditing(t)}>Nhập 4 lựa chọn</button>}</p>
                                                        </div>
                                                    ) : (
                                                        <textarea rows={1} className="cell-ta" value={t.answerOrMeaning} maxLength={1500} aria-label="Nghĩa" placeholder="Nghĩa…" onChange={(e) => update(t.id, { answerOrMeaning: e.target.value })} />
                                                    )}
                                                </td>
                                                <td className="p-0">
                                                    <textarea rows={1} className="cell-ta" value={t.explanationOrExample} maxLength={2500} aria-label={mcq ? 'Giải thích' : 'Câu ví dụ'} placeholder={mcq ? 'Giải thích…' : 'Câu ví dụ…'} onChange={(e) => update(t.id, { explanationOrExample: e.target.value })} />
                                                </td>
                                                <td className="p-2">
                                                    {!mcq && (
                                                        <div className="flex items-start gap-2">
                                                            <button type="button" onClick={() => speak(t.questionOrWord, 0.7)} disabled={!t.questionOrWord} className="btn btn-secondary btn-sm btn-icon !w-9" aria-label={'Nghe ' + t.questionOrWord}><Icon name="volume" size={14} /></button>
                                                            <div className="text-xs text-flow">{t.ipa && <p className="text-ink2">{t.ipa}</p>}{Sch.readingOf(t) && <p className="text-muted">{Sch.readingOf(t)}</p>}</div>
                                                        </div>
                                                    )}
                                                </td>
                                                <td className="p-2 text-xs">
                                                    <p className="tnum">Đ {t.correctCount || 0} · S {t.wrongCount || 0}</p>
                                                    <p className="tnum text-muted">Ôn {t.reviewCount || 0}</p>
                                                    {Sch.reviewNote(t) && <p className={Sch.isWeak(t) ? 'text-warn font-medium' : 'text-muted'}>{Sch.reviewNote(t)}</p>}
                                                </td>
                                                <td className="p-2">
                                                    <div className="flex flex-wrap gap-1">
                                                        <button type="button" onClick={() => aiOne(t)} disabled={!t.questionOrWord || aiRow === t.id} className="btn btn-secondary btn-sm" title={mcq ? 'AI giải thích' : 'AI bổ sung'}><Icon name="sparkles" size={14} />{aiRow === t.id ? '…' : 'AI'}</button>
                                                        <button type="button" onClick={() => onStudyFrom(t)} disabled={!t.questionOrWord} className="btn btn-secondary btn-sm">Học</button>
                                                        <button type="button" onClick={() => setEditing(t)} className="btn btn-secondary btn-sm btn-icon !w-9" aria-label="Sửa chi tiết"><Icon name="pen" size={14} /></button>
                                                        <button type="button" onClick={() => removeRow(t.id)} className="btn btn-danger btn-sm btn-icon !w-9" aria-label="Xóa"><Icon name="trash" size={14} /></button>
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                        {rows.length > shown && <div className="p-3 border-t border-line text-center"><button type="button" className="btn btn-secondary" onClick={() => setShown(shown + 300)}>Hiện thêm ({rows.length - shown} mục)</button></div>}
                    </div>

                    {importBatches && <ImportDialog batches={importBatches} existingCount={items.length} onClose={() => setImportBatches(null)} onConfirm={confirmImport} />}
                    {pasteOpen && <PasteCodeDialog toast={toast} onClose={() => setPasteOpen(false)} onParsed={(b) => { setPasteOpen(false); setImportBatches(b); }} />}
                    {shareCode && <ShareCodeDialog code={shareCode} onClose={() => setShareCode(null)} />}
                    {editing && <ItemEditor item={editing} groups={groups} aiBusy={aiRow === editing.id}
                        onClose={() => setEditing(null)} onStudy={(t) => { setEditing(null); onStudyFrom(t); }}
                        onAI={(t) => aiOne(t)} onSave={(t) => { setItems(prev => prev.map(x => (x.id === t.id ? t : x))); setEditing(null); toast('Đã lưu', 'success'); }} />}
                </div>
            );
        };

        /* ---------- Luyện tự do ---------- */
        const PracticeHub = ({ items, itemsById, groups, groupFilter, setGroupFilter, session, startSession, closeSession, review, patch, toast, onPractice, onWeak }) => {
            const [eosSetup, setEosSetup] = useState(null);
            const pool = Sch.byGroup(items, groupFilter);
            const weakCount = pool.filter(t => Sch.isWeak(t)).length;
            const mcqPool = asMcqPool(pool);

            if (session && session.mode === 'eos') {
                return (
                    <EOSSimulator key={session.id} title={session.title} items={session.pool} count={session.count} minutes={session.minutes} toast={toast} canExplain={AI.ready()}
                        onSubmit={async (r) => {
                            const paid = await window.EDU.chargeTurn(toast, 'Nộp ' + session.title);
                            if (!paid) return false;
                            r.wrong.forEach(w => review(w.id, false));
                            return true;
                        }}
                        onDrillWrong={(ids) => startSession(ids, 'burst', 'Nhồi lại câu sai EOS')}
                        onExit={closeSession} />
                );
            }
            if (session && session.mode === 'burst') {
                return <BurstSession key={session.id} itemsById={itemsById} ids={session.ids} title={session.title} onReview={(id, ok) => review(id, ok)} onExit={closeSession} toast={toast} canExplain={AI.ready()} />;
            }
            if (session) {
                return <FlashSession key={session.id} items={items} session={session} onReview={review} onPatch={patch} onClose={closeSession} onRestart={startSession} toast={toast} />;
            }

            const cards = [
                { k: 'flash', icon: 'layers', title: 'Flashcard', body: pool.length + ' mục. Lật thẻ, tự nhớ, chấm Đã nhớ / Cần ôn.', run: () => onPractice(pool, 'flash', Sch.groupLabel(groupFilter)), off: !pool.length },
                { k: 'burst', icon: 'zap', title: 'Băng đạn 5 câu', body: 'Nhìn lướt 15s → phản xạ 1 chạm. Sai là nhồi lại cuối băng sau 15 giây.', run: () => onPractice(pool, 'burst', 'Băng đạn · ' + Sch.groupLabel(groupFilter)), off: !pool.length },
                { k: 'test', icon: 'pen', title: groupFilter === 'all' ? 'Test tất cả' : 'Test nhóm này', body: 'Điền từ / nghe viết / ghi âm. Gõ khớp là tự chấm, an toàn với Unikey/EVKey.', run: () => onPractice(pool, 'test', Sch.groupLabel(groupFilter)), off: !pool.length },
                { k: 'weak', icon: 'flame', title: 'Ôn từ yếu (' + weakCount + ')', body: 'Hay sai, chưa ôn, hoặc đến hạn 1 / 3 / 7 / 14 ngày.', run: onWeak, off: false },
                { k: 'eos', icon: 'monitor', title: 'Thi thử EOS', body: mcqPool.length >= 5 ? mcqPool.length + ' câu trắc nghiệm có thể vào đề. Mỗi lần nộp trừ 1 lượt quỹ.' : 'Cần ít nhất 5 câu trắc nghiệm hoặc 4 từ có nghĩa.', run: () => { if (!requireTurns(toast)) return; setEosSetup(mcqPool); }, off: mcqPool.length < 5 }
            ];

            return (
                <div className="card p-5 sm:p-7">
                    <h1 className="text-xl font-bold">Luyện tự do</h1>
                    <p className="text-ink2 mt-1 mb-5">Chọn nhóm rồi chọn cách luyện. Mọi kiểu đều chạy 100% bằng bàn phím.</p>
                    <label className="block max-w-sm mb-5"><span className="label">Nhóm</span>
                        <select value={groupFilter} onChange={(e) => setGroupFilter(e.target.value)} className="field">
                            <option value="all">Tất cả nhóm ({items.length})</option>
                            {groups.map(([k, n]) => <option key={k} value={k}>{Sch.groupLabel(k)} ({n})</option>)}
                        </select>
                    </label>
                    <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
                        {cards.map(c => (
                            <button key={c.k} type="button" onClick={c.run} disabled={c.off} className="text-left rounded-2xl border-2 border-line p-5 hover:border-primary hover:bg-primary-soft disabled:opacity-50 disabled:hover:border-line disabled:hover:bg-transparent transition-colors">
                                <span className="w-10 h-10 rounded-xl bg-primary-soft text-primary flex items-center justify-center mb-3"><Icon name={c.icon} /></span>
                                <span className="block font-semibold">{c.title}</span>
                                <span className="block text-sm text-ink2 mt-1 text-flow">{c.body}</span>
                            </button>
                        ))}
                    </div>
                    {eosSetup && <EOSSetup max={eosSetup.length} onClose={() => setEosSetup(null)} onStart={(n, min) => { if (!requireTurns(toast, true)) return; onPractice(eosSetup, 'eos', 'EOS · ' + Sch.groupLabel(groupFilter), { count: n, minutes: min }); setEosSetup(null); }} />}
                </div>
            );
        };
    </script>

    <!-- ===================== MODE 2 · Kho Src Qua Môn ===================== -->
    <script type="text/babel" data-presets="react">
        const progKey = (packId, itemId) => packId + '|' + itemId;
        const isMastered = (rec) => !!(rec && rec.correctCount > 0);
        const isPackWeak = (rec, now) => !!(rec && rec.wrongCount > 0 && (rec.srsStage === 0 || Sch.isDue(rec, now)));
        const fmtLeft = (ms) => {
            const h = Math.floor(ms / 3600000);
            if (h >= 24) return Math.floor(h / 24) + ' ngày ' + (h % 24) + ' giờ';
            if (h >= 1) return h + ' giờ ' + Math.floor((ms % 3600000) / 60000) + ' phút';
            return Plan.fmtCountdown(ms);
        };

        const QrBox = () => {
            const [ok, setOk] = useState(true);
            if (ok) return <img src="assets/qr-ung-ho.png" alt="Mã QR ủng hộ team 39.000đ" className="w-40 h-40 rounded-xl border border-line object-contain bg-white" onError={() => setOk(false)} />;
            return (
                <div className="w-40 h-40 rounded-xl border-2 border-dashed border-line flex flex-col items-center justify-center text-muted text-xs text-center p-3">
                    <Icon name="qr" size={32} /><span className="mt-2">Team đặt ảnh QR tại edu/assets/qr-ung-ho.png</span>
                </div>
            );
        };

        const inviteText = (pack) => 'Mình đang ôn ' + pack.code + ' bằng FPass — Chặng 1 (' + ((pack.stages && pack.stages[0] && pack.stages[0].count) || 35) +
            ' câu nền tảng) free 100%, có Băng đạn 5 câu và phòng thi giả lập EOS. Học chung cho đỡ sợ mùa thi nhé!' +
            (/^https?:/.test(location.protocol) ? ' ' + location.origin + location.pathname : '');

        const contributeTemplate = (pack) => ({
            id: 'ma-mon-cua-ban',
            code: (pack && pack.code) || 'MÃ MÔN',
            name: (pack && pack.name) || 'Tên môn',
            block: (pack && pack.block) || 'it',
            type: 'mcq',
            desc: 'Mô tả ngắn phạm vi bộ đề',
            stages: {
                '1': [{ q: 'Câu hỏi nền tảng?', o: ['Lựa chọn A', 'Lựa chọn B', 'Lựa chọn C', 'Lựa chọn D'], a: 'B', e: 'Giải thích ngắn bằng tiếng Việt', k: ['từ khóa ăn điểm'] }],
                '2': [],
                '3': []
            }
        });

        const UnlockModal = ({ pack, onUnlock, onClose }) => {
            const [key, setKey] = useState('');
            const [err, setErr] = useState('');
            const [busy, setBusy] = useState(false);
            const submit = async () => {
                setBusy(true);
                setErr('');
                try {
                    await onUnlock(pack, key);
                    onClose();
                } catch (e) {
                    setErr(e.message || 'Không mở khóa được');
                } finally {
                    setBusy(false);
                }
            };
            return (
                <Modal title={'Mở khóa Chặng 2 & 3 · ' + pack.code} onClose={onClose}
                    footer={<><button type="button" className="btn btn-secondary" onClick={onClose}>Để sau</button><button type="button" className="btn btn-primary" onClick={submit} disabled={busy || key.trim().length < 8}><Icon name="unlock" /> {busy ? 'Đang giải mã…' : 'Mở khóa'}</button></>}>
                    <label className="block"><span className="label">Mã kích hoạt</span>
                        <input value={key} onChange={(e) => setKey(e.target.value.toUpperCase())} onKeyDown={(e) => { if (e.key === 'Enter' && !e.nativeEvent.isComposing) submit(); }}
                            className="field tnum tracking-wider" placeholder="EDU-XXXX-XXXX-XXXX" autoComplete="off" spellCheck={false} maxLength={40} data-autofocus />
                    </label>
                    {err && <p className="text-sm text-danger mt-2" role="alert">{err}</p>}
                    <p className="text-xs text-muted mt-3 flex items-start gap-1.5"><Icon name="shield" size={14} className="mt-0.5" /> Chặng 2–3 được mã hóa AES-GCM ngay trong file. Mã kích hoạt là chìa khóa giải mã (PBKDF2) — giải mã diễn ra trên máy bạn, không gửi mã đi đâu.</p>
                </Modal>
            );
        };

        const ContributeModal = ({ pack, onClose, toast }) => {
            const fundCode = (E.Quota && E.Quota.read) ? E.Quota.read().code : '';
            const [name, setName] = useState((pack && pack.name) || '');
            const [code, setCode] = useState((pack && pack.code) || '');
            const [subject, setSubject] = useState(pack && pack.type === 'vocab' ? 'vocab' : 'eos');
            const [quotaId, setQuotaId] = useState(fundCode || '');
            const [text, setText] = useState('');
            const [fileName, setFileName] = useState('');
            const [busy, setBusy] = useState(false);
            const readFile = async (file) => {
                if (!file) return;
                if (file.size > 400000) { toast('File lớn hơn 400KB', 'error'); return; }
                setText(await file.text());
                setFileName(file.name);
            };
            const send = async () => {
                if (!name.trim() || !code.trim() || !text.trim()) { toast('Điền tên đề, mã môn và nội dung', 'error'); return; }
                setBusy(true);
                try {
                    const res = await fetch('/api/contribute', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                        body: JSON.stringify({ name, code, subject, quotaId, text })
                    });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok) throw new Error(data.error || 'Chưa gửi được đề.');
                    toast('Đã gửi ' + (data.count || '') + ' câu cho admin. Khi được duyệt, đề hiện trong Đề hệ thống.', 'success');
                    onClose();
                } catch (e) {
                    toast(e.message || 'Chưa gửi được đề.', 'error');
                } finally {
                    setBusy(false);
                }
            };
            return (
                <Modal title="Gửi đề đóng góp cho admin" onClose={onClose} footer={<><button type="button" className="btn btn-secondary" onClick={onClose}>Đóng</button><button type="button" className="btn btn-primary" disabled={busy} onClick={send}>{busy ? 'Đang gửi…' : 'Gửi đề đóng góp cho admin'}</button></>}>
                    <div className="space-y-4 text-sm text-ink2">
                        <p className="text-flow">Đề gửi vào hàng chờ. Admin duyệt thì cả lớp thấy trong Đề hệ thống. File tự tải ở Kho của tôi vẫn chỉ nằm trên máy này.</p>
                        <div className="grid sm:grid-cols-2 gap-3">
                            <label className="block text-ink"><span className="label">Tên đề</span><input value={name} onChange={(e) => setName(e.target.value)} className="field" maxLength={80} /></label>
                            <label className="block text-ink"><span className="label">Mã môn</span><input value={code} onChange={(e) => setCode(e.target.value.toUpperCase())} className="field uppercase" maxLength={16} /></label>
                            <label className="block text-ink"><span className="label">Loại</span>
                                <select value={subject} onChange={(e) => setSubject(e.target.value)} className="field">
                                    <option value="eos">EOS</option><option value="fe">FE</option><option value="pt">PT</option><option value="vocab">Từ vựng</option><option value="other">Khác</option>
                                </select>
                            </label>
                            <label className="block text-ink"><span className="label">Mã quỹ để nhận lượt thưởng</span><input value={quotaId} onChange={(e) => setQuotaId(e.target.value.toUpperCase())} className="field uppercase" maxLength={12} /></label>
                        </div>
                        <label className="block text-ink"><span className="label">File JSON / TXT</span>
                            <input type="file" accept=".json,.txt,application/json,text/plain" className="block mt-1 text-sm" onChange={(e) => readFile(e.target.files && e.target.files[0])} />
                            {fileName && <span className="text-xs text-muted">{fileName}</span>}
                        </label>
                        <label className="block text-ink"><span className="label">Hoặc dán nội dung</span>
                            <textarea value={text} onChange={(e) => setText(e.target.value)} rows={6} className="field text-xs" placeholder="Dán JSON hoặc từng câu có A. B. C. D. và Đáp án" />
                        </label>
                        <button type="button" className="btn btn-secondary btn-sm" onClick={() => downloadBlob(new Blob([JSON.stringify(contributeTemplate(pack), null, 2)], { type: 'application/json' }), 'mau-gop-de.json')}><Icon name="download" size={14} /> Tải file mẫu</button>
                        {pack && pack.status === 'ready' && (
                            <div className="rounded-xl border border-line p-4">
                                <p className="font-semibold text-ink flex items-center gap-2"><Icon name="users" /> Chia sẻ cho bạn cùng lớp</p>
                                <p className="mt-2 rounded-lg bg-surface2 p-3 text-flow">{inviteText(pack)}</p>
                                <button type="button" className="btn btn-secondary btn-sm mt-3" onClick={() => copyText(inviteText(pack)).then(() => toast('Đã copy lời mời', 'success')).catch(() => toast('Trình duyệt chặn clipboard', 'error'))}><Icon name="copy" size={14} /> Copy lời mời</button>
                            </div>
                        )}
                    </div>
                </Modal>
            );
        };

        const PanicDivider = ({ pack, remaining, onSave, onSkip, onCancel }) => {
            const [days, setDays] = useState(3);
            const [hours, setHours] = useState(0);
            const hoursLeft = Math.max(1, (Number(days) || 0) * 24 + (Number(hours) || 0));
            const plan = Panic.plan({ remaining, hoursLeft });
            const quick = [['3 giờ', 0, 3], ['1 ngày', 1, 0], ['3 ngày', 3, 0], ['1 tuần', 7, 0], ['2 tuần', 14, 0]];
            const save = () => onSave({ examAt: Date.now() + hoursLeft * 3600000, createdAt: Date.now(), sessions: plan.sessions, perSession: plan.perSession, perDay: plan.perDay, sessionsDone: 0 });
            return (
                <section className="card p-5 sm:p-6 border-primary" aria-labelledby="panic-title">
                    <p className="text-xs font-semibold uppercase tracking-wider text-primary mb-1">Máy chia nhỏ nỗi sợ mùa thi</p>
                    <h2 id="panic-title" className="text-xl font-bold">Còn mấy ngày / giờ nữa bạn bước vào phòng thi?</h2>
                    <div className="flex flex-wrap gap-2 mt-4" role="group" aria-label="Chọn nhanh">
                        {quick.map(([l, d, h]) => (
                            <button key={l} type="button" aria-pressed={days === d && hours === h} onClick={() => { setDays(d); setHours(h); }} className={'btn btn-sm ' + (days === d && hours === h ? 'btn-primary' : 'btn-secondary')}>{l}</button>
                        ))}
                    </div>
                    <div className="grid grid-cols-2 gap-3 mt-3 max-w-xs">
                        <label><span className="label">Ngày</span><input type="number" min="0" max="120" value={days} onChange={(e) => setDays(Math.max(0, Math.min(120, Number(e.target.value) || 0)))} className="field tnum" /></label>
                        <label><span className="label">Giờ</span><input type="number" min="0" max="23" value={hours} onChange={(e) => setHours(Math.max(0, Math.min(23, Number(e.target.value) || 0)))} className="field tnum" /></label>
                    </div>
                    <div className="mt-4 rounded-xl bg-primary-soft p-4 text-ink" aria-live="polite">
                        <p className="font-semibold text-flow">Chia {remaining} câu còn lại thành <span className="tnum">{plan.sessions}</span> ca × 10 phút.</p>
                        <p className="text-sm text-ink2 mt-1 text-flow">
                            {hoursLeft >= 24
                                ? 'Mỗi ngày ' + plan.perDay + ' ca (~' + plan.minutesPerDay + ' phút), mỗi ca ' + plan.perSession + ' câu.'
                                : 'Khoảng ' + plan.gapMin + ' phút làm 1 ca, mỗi ca ' + plan.perSession + ' câu.'}
                        </p>
                        {plan.overload && <p className="text-sm text-warn mt-2 flex items-start gap-1.5"><Icon name="alert" size={14} className="mt-0.5" /> Hơi gấp. Ưu tiên Chặng 1 và câu sai, bỏ qua câu đã chắc — vẫn kịp nếu đều tay.</p>}
                    </div>
                    <div className="flex flex-wrap gap-2 mt-4">
                        <button type="button" className="btn btn-primary" onClick={save}><Icon name="calendar" /> Chốt lịch ôn</button>
                        {onSkip && <button type="button" className="btn btn-ghost" onClick={onSkip}>Học luôn 1 ca, tính sau</button>}
                        {onCancel && <button type="button" className="btn btn-ghost" onClick={onCancel}>Hủy</button>}
                    </div>
                </section>
            );
        };

        const Milestone = ({ pack, unlocked, onUnlock, onContribute, onLater, onContinue }) => {
            const locked = (pack.stages || []).filter(s => !s.free).reduce((n, s) => n + s.count, 0);
            useEffect(() => { Sfx.milestone(); }, []);
            return (
                <div className="max-w-3xl mx-auto space-y-4 enter">
                    <div className="card p-6 sm:p-8 text-center">
                        <div className="mx-auto w-16 h-16 rounded-2xl bg-success text-white flex items-center justify-center mb-4 pop-ok"><Icon name="trophy" size={30} /></div>
                        <p className="text-xs font-semibold uppercase tracking-wider text-success">Hoàn thành Chặng 1</p>
                        <h2 className="text-2xl sm:text-3xl font-bold mt-1 text-flow">Bạn đã nạp trọn {pack.stages[0].count} câu nền tảng {pack.code}</h2>
                        <p className="text-ink2 mt-2 text-flow">Chặng 1 là của bạn — ôn lại, thi thử miễn phí mãi mãi. Ghi nhận thật sự: phần cốt lõi của môn đã nằm trong đầu bạn.</p>
                        {unlocked && <button type="button" className="btn btn-primary mt-5" onClick={onContinue} data-autofocus>Học tiếp Chặng 2</button>}
                    </div>
                    {!unlocked && (
                        <>
                            <p className="text-center text-sm text-muted">Nếu muốn đi tiếp {locked} câu phân hóa cùng team, có 2 cách — chọn cách nào cũng được:</p>
                            <div className="grid md:grid-cols-2 gap-4">
                                <div className="card p-5">
                                    <p className="font-semibold flex items-center gap-2"><Icon name="heart" className="text-danger" /> Ủng hộ team 39k</p>
                                    <p className="text-sm text-ink2 mt-1 text-flow">Tiền ủng hộ giúp team soạn thêm môn và trả phí AI. Quét QR, nhận mã kích hoạt qua tin nhắn.</p>
                                    <div className="flex flex-wrap items-start gap-4 mt-4">
                                        <QrBox />
                                        <ul className="text-sm space-y-1.5 text-ink2 flex-1 min-w-[160px]">
                                            {['Chặng 2 & 3: ' + locked + ' câu phân hóa', 'Phím H — Highlight keyword', 'Lời giải AI từng câu', 'Phòng thi giả lập EOS'].map(x => <li key={x} className="flex items-start gap-1.5"><Icon name="check" size={14} className="text-success mt-0.5" />{x}</li>)}
                                        </ul>
                                    </div>
                                    <button type="button" className="btn btn-primary mt-4 w-full" onClick={onUnlock} data-autofocus><Icon name="key" /> Nhập mã kích hoạt</button>
                                </div>
                                <div className="card p-5">
                                    <p className="font-semibold flex items-center gap-2"><Icon name="users" /> Đồng môn góp sức</p>
                                    <p className="text-sm text-ink2 mt-1 text-flow">Đóng góp 1 bộ đề mới, hoặc chia sẻ cho 3 bạn cùng lớp — team gửi mã mở khóa free. Ai cũng có cách đi tiếp.</p>
                                    <button type="button" className="btn btn-secondary mt-4 w-full" onClick={onContribute}><Icon name="share" /> Góp đề / chia sẻ bạn bè</button>
                                </div>
                            </div>
                            <div className="text-center"><button type="button" className="btn btn-ghost" onClick={onLater}>Để sau — quay lại bộ đề</button></div>
                        </>
                    )}
                </div>
            );
        };

        const Storefront = ({ packs, block, setBlock, statsOf, unlockedIds, exams, openPack, onContribute, now }) => {
            const blocks = (Catalog.blocks || []).concat(packs.some(p => p.block === 'system') ? [{ id: 'system', name: 'Đề hệ thống' }] : []);
            const list = packs.filter(p => p.block === block);
            const onTabKey = (e) => {
                const i = blocks.findIndex(b => b.id === block);
                if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                    e.preventDefault();
                    const n = blocks[(i + (e.key === 'ArrowRight' ? 1 : blocks.length - 1)) % blocks.length];
                    setBlock(n.id);
                    const el = document.getElementById('blk-' + n.id);
                    if (el) el.focus();
                }
            };
            return (
                <div>
                    <div className="mb-5">
                        <h1 className="text-xl font-bold">Kho Src Qua Môn</h1>
                        <p className="text-sm text-ink2 mt-1 text-flow">Bộ Src ôn thi FE / EOS / PT do team biên soạn. Chặng 1 của mọi bộ đề: free 100% với đầy đủ Băng đạn 5 câu. Đề hệ thống là bản admin vừa đăng.</p>
                        <button type="button" className="btn btn-secondary btn-sm mt-3" onClick={() => onContribute(null)}><Icon name="share" size={14} /> Gửi đề đóng góp cho admin</button>
                    </div>
                    <div role="tablist" aria-label="Khối ngành" className="flex flex-wrap gap-1 p-1 rounded-2xl bg-surface border border-line mb-5" onKeyDown={onTabKey}>
                        {blocks.map(b => (
                            <button key={b.id} id={'blk-' + b.id} type="button" role="tab" aria-selected={block === b.id} tabIndex={block === b.id ? 0 : -1} onClick={() => setBlock(b.id)} className="tab text-flow">
                                {b.name} <span className="tnum text-xs opacity-70">{packs.filter(p => p.block === b.id).length}</span>
                            </button>
                        ))}
                    </div>
                    <div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-4" role="tabpanel">
                        {list.map(p => {
                            if (p.status !== 'ready') {
                                return (
                                    <div key={p.id} className="card p-5 bg-surface2/60 border-dashed">
                                        <div className="flex flex-wrap items-center gap-2"><span className="chip bg-surface text-ink2 tnum">{p.code}</span><span className="chip bg-surface text-muted">Đang biên soạn</span></div>
                                        <p className="font-semibold mt-3 text-flow">{p.name}</p>
                                        <button type="button" className="btn btn-ghost btn-sm mt-3 -ml-2" onClick={() => onContribute(p)}><Icon name="plus" size={14} /> Góp đề môn này</button>
                                    </div>
                                );
                            }
                            const st = statsOf(p);
                            const exam = exams[p.id];
                            const unlocked = unlockedIds.indexOf(p.id) >= 0;
                            return (
                                <button key={p.id} type="button" onClick={() => openPack(p.id)} className="card p-5 text-left hover:border-primary transition-colors flex flex-col">
                                    <div className="flex flex-wrap items-center gap-2">
                                        <span className="chip bg-primary-soft text-primary tnum font-semibold">{p.code}</span>
                                        <span className="chip bg-surface2 text-ink2">{p.type === 'mcq' ? 'Trắc nghiệm' : 'Từ vựng'}</span>
                                        {p.system
                                            ? <span className="chip bg-success-soft text-success">Đề hệ thống</span>
                                            : <span className={'chip ' + (unlocked ? 'bg-success-soft text-success' : 'bg-surface2 text-muted')}><Icon name={unlocked ? 'unlock' : 'lock'} size={12} /> {unlocked ? 'Đã mở 3 chặng' : 'Chặng 1 free'}</span>}
                                    </div>
                                    <p className="font-semibold mt-3 text-flow">{p.name}</p>
                                    <p className="text-sm text-ink2 mt-1 text-flow flex-1">{p.desc}</p>
                                    <div className="mt-4 space-y-1.5">
                                        <div className="flex justify-between text-xs text-ink2 tnum"><span>Chặng 1 · {st.m1}/{st.c1}</span><span>Tổng {st.mAll}/{p.total}</span></div>
                                        <Progress value={st.m1} max={st.c1} tone={st.m1 >= st.c1 ? 'success' : 'primary'} label={'Tiến độ chặng 1 ' + p.code} />
                                    </div>
                                    {exam && <p className="text-xs text-muted mt-2 flex items-center gap-1"><Icon name="clock" size={12} /> Thi sau {fmtLeft(Math.max(0, exam.examAt - now))}</p>}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const PackScreen = ({ pack, view, setView, progress, reviewPack, unlockedItems, onUnlock, exam, setExam, bumpSession, milestoneShown, markMilestone, toast, now }) => {
            const [unlockOpen, setUnlockOpen] = useState(false);
            const [contribOpen, setContribOpen] = useState(false);
            const [replan, setReplan] = useState(false);
            const [eosSetup, setEosSetup] = useState(null);
            const [run, setRun] = useState(null);
            const unlocked = !!unlockedItems || !!pack.system;
            const base = useMemo(() => pack.items.concat(unlockedItems || []), [pack, unlockedItems]);
            const rec = (t) => progress[progKey(pack.id, t.id)];
            const view$ = (t) => { const r = rec(t); return r ? Object.assign({}, t, { srsStage: r.srsStage, wrongCount: r.wrongCount, correctCount: r.correctCount, reviewCount: r.reviewCount, nextReview: r.nextReview, lastReview: r.lastReview }) : t; };
            const items = base.map(view$);
            const itemsById = new Map(items.map(t => [t.id, t]));
            const stage = (n) => items.filter(t => t.checkpoint === n);
            const c1 = stage(1);
            const m1 = c1.filter(t => isMastered(rec(t))).length;
            const mastered = items.filter(t => isMastered(rec(t))).length;
            const c1Done = c1.length > 0 && m1 >= c1.length;
            const weakIds = items.filter(t => isPackWeak(rec(t), now)).map(t => t.id);
            const remaining = Math.max(0, pack.total - mastered);
            const status = Panic.status(exam, now);
            const perSession = (exam && exam.perSession) || 15;

            const nextIds = () => {
                const pending = items.filter(t => !isMastered(rec(t)));
                let ids = pending.slice(0, perSession).map(t => t.id);
                if (ids.length < perSession) ids = ids.concat(weakIds.filter(id => ids.indexOf(id) < 0).slice(0, perSession - ids.length));
                if (!ids.length) ids = Sch.shuffle(items.map(t => t.id)).slice(0, perSession);
                return ids;
            };
            const startCa = () => { setRun({ kind: 'ca', ids: nextIds(), key: Date.now() }); setView('burst'); };
            const startWeak = () => { if (!weakIds.length) { toast('Chưa có câu yếu — làm 1 ca hoặc thi thử trước', 'info'); return; } setRun({ kind: 'weak', ids: weakIds.slice(0, 25), key: Date.now() }); setView('burst'); };
            const mcqPool = pack.type === 'mcq' ? items.filter(t => t.type === 'mcq') : vocabAsMcq(items);
            const openEOS = () => {
                if (mcqPool.length < 5) { toast('Cần ít nhất 5 câu để mở phòng thi EOS', 'info'); return; }
                if (!requireTurns(toast)) return;
                setEosSetup(mcqPool);
            };

            const backToPack = () => { setRun(null); setView('pack'); };
            const lockedMsg = 'Highlight keyword (phím H) mở cùng Chặng 2–3 — Chặng 1 vẫn học đầy đủ Băng đạn.';

            if (view === 'burst' && run) {
                return (
                    <BurstSession key={run.key} itemsById={itemsById} ids={run.ids} title={pack.code + ' · ' + (run.kind === 'ca' ? 'Ca 10 phút' : run.kind === 'eos' ? 'Nhồi lại câu sai EOS' : 'Ôn câu yếu')}
                        subtitle={pack.name} timerMin={run.kind === 'ca' ? 10 : undefined} canHighlight={unlocked} highlightLockedMsg={lockedMsg} canExplain={unlocked && AI.ready()} toast={toast}
                        onReview={(id, ok) => reviewPack(pack.id, id, ok)} onExit={backToPack}
                        onFinish={(st) => { if (run.kind === 'ca') bumpSession(pack.id); setRun(Object.assign({}, run, { stats: st })); setView('caDone'); }} renderDone={() => null} />
                );
            }

            if (view === 'eos' && run) {
                return (
                    <EOSSimulator key={run.key} title={pack.code + ' · ' + pack.name} items={run.pool} count={run.count} minutes={run.minutes} toast={toast} canExplain={AI.ready()}
                        onSubmit={async (r) => {
                            const paid = await window.EDU.chargeTurn(toast, 'Nộp ' + pack.code);
                            if (!paid) return false;
                            r.wrong.forEach(w => reviewPack(pack.id, w.id, false));
                            return true;
                        }}
                        onDrillWrong={(ids) => { setRun({ kind: 'eos', ids, key: Date.now() }); setView('burst'); }}
                        onExit={backToPack} />
                );
            }

            if (view === 'caDone' && run) {
                if (c1Done && !milestoneShown) {
                    return <Milestone pack={pack} unlocked={unlocked} onUnlock={() => setUnlockOpen(true)} onContribute={() => setContribOpen(true)}
                        onLater={() => { markMilestone(pack.id); backToPack(); }} onContinue={() => { markMilestone(pack.id); startCa(); }} />;
                }
                const st = run.stats || { total: 0, firstTryCorrect: 0, elapsedMs: 0 };
                const safe = !status || status.onTrack;
                return (
                    <div className="max-w-xl mx-auto card p-6 sm:p-8 text-center enter">
                        <div className={'mx-auto w-14 h-14 rounded-2xl flex items-center justify-center mb-4 ' + (safe ? 'bg-success text-white' : 'bg-warn-soft text-warn')}><Icon name={safe ? 'shield' : 'clock'} size={28} /></div>
                        <h2 className="text-2xl font-bold text-flow">{run.kind !== 'ca' ? 'Đã nhồi sạch câu yếu' : safe ? 'Ca này an toàn — Bạn đang đúng tiến độ qua môn!' : 'Ca này xong — còn ' + status.behind + ' ca để bắt kịp tiến độ'}</h2>
                        <p className="text-ink2 mt-2 tnum">Đúng ngay lần đầu {st.firstTryCorrect}/{st.total} · {Plan.fmtCountdown(st.elapsedMs)}</p>
                        {status && <p className="text-sm text-muted mt-1 tnum">Đã xong {status.done}/{status.total} ca · thi sau {fmtLeft(status.msLeft)}</p>}
                        <div className="flex flex-wrap justify-center gap-2 mt-6">
                            <button type="button" className="btn btn-primary" onClick={startCa} data-autofocus><Icon name="play" /> Làm tiếp 1 ca</button>
                            <button type="button" className="btn btn-secondary" onClick={backToPack}>Về bộ đề</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="space-y-4">
                    <div className="flex flex-wrap items-start gap-3">
                        <div className="min-w-0 flex-1">
                            <div className="flex flex-wrap gap-2 mb-1"><span className="chip bg-surface2 text-ink2">{pack.total} {pack.type === 'mcq' ? 'câu' : 'từ'}</span></div>
                            <h1 className="text-xl font-bold text-flow">{[pack.code, pack.name].filter(Boolean).join(' — ')}</h1>
                            {pack.desc && String(pack.desc).trim() ? <p className="text-sm text-ink2 text-flow mt-1">{pack.desc}</p> : null}
                        </div>
                    </div>

                    {(!exam || replan) ? (
                        <PanicDivider pack={pack} remaining={remaining} onSave={(e) => { setExam(pack.id, e); setReplan(false); toast('Đã chốt lịch ôn ' + e.sessions + ' ca', 'success'); }}
                            onSkip={!exam ? startCa : undefined} onCancel={replan ? () => setReplan(false) : undefined} />
                    ) : (
                        <section className="card p-5 sm:p-6 flex flex-wrap items-center gap-4">
                            <div className="flex-1 min-w-[220px]">
                                <p className={'text-sm font-semibold flex items-center gap-1.5 ' + (status.onTrack ? 'text-success' : 'text-warn')}><Icon name={status.onTrack ? 'shield' : 'alert'} size={16} /> {status.onTrack ? 'Đúng tiến độ qua môn' : 'Chậm ' + status.behind + ' ca so với lịch'}</p>
                                <p className="text-2xl font-bold tnum mt-1">Thi sau {fmtLeft(status.msLeft)}</p>
                                <p className="text-sm text-ink2 tnum">Đã xong {status.done}/{status.total} ca · mỗi ca {perSession} câu · {exam.perDay} ca/ngày</p>
                                <div className="mt-2 max-w-sm"><Progress value={status.done} max={status.total} tone={status.onTrack ? 'success' : 'warn'} label="Tiến độ ca" /></div>
                            </div>
                            <div className="flex flex-wrap gap-2">
                                <button type="button" className="btn btn-primary btn-lg" onClick={startCa} autoFocus><Icon name="play" /> Bắt đầu ca 10 phút</button>
                                <button type="button" className="btn btn-secondary btn-lg" onClick={openEOS} disabled={mcqPool.length < 5}><Icon name="monitor" /> Thi thử giao diện EOS</button>
                                <button type="button" className="btn btn-ghost" onClick={() => setReplan(true)}><Icon name="calendar" /> Đổi lịch thi</button>
                            </div>
                        </section>
                    )}

                    <section className="card p-5 sm:p-6" aria-labelledby="stage-title">
                        <h2 id="stage-title" className="font-semibold mb-3">Các chặng</h2>
                        <ol className="space-y-3">
                            {pack.stages.map(sg => {
                                const list = stage(sg.n);
                                const open = sg.free || unlocked;
                                const m = list.filter(t => isMastered(rec(t))).length;
                                return (
                                    <li key={sg.n} className="rounded-xl border border-line p-4 flex flex-wrap items-center gap-3">
                                        <span className={'w-10 h-10 rounded-xl flex items-center justify-center ' + (open ? 'bg-primary-soft text-primary' : 'bg-surface2 text-muted')}><Icon name={open ? (sg.free ? 'target' : 'unlock') : 'lock'} /></span>
                                        <div className="flex-1 min-w-[180px]">
                                            <p className="font-semibold">Chặng {sg.n} · {sg.count} {pack.type === 'mcq' ? 'câu' : 'từ'} {sg.free ? <span className="chip bg-success-soft text-success ml-1">FREE 100%</span> : null}</p>
                                            <p className="text-xs text-ink2 mt-0.5">{sg.n === 1 ? 'Nền tảng cốt lõi' : sg.n === 2 ? 'Câu phân hóa' : 'Câu khó sát đề thật'}</p>
                                            {open && <div className="mt-2 max-w-xs"><Progress value={m} max={list.length || sg.count} tone={m >= list.length && list.length ? 'success' : 'primary'} label={'Tiến độ chặng ' + sg.n} /></div>}
                                        </div>
                                        <span className="tnum text-sm text-ink2">{open ? m + '/' + (list.length || sg.count) : 'Đã mã hóa'}</span>
                                    </li>
                                );
                            })}
                        </ol>
                        {!unlocked && pack.locked && (
                            <div className="mt-4 flex flex-wrap gap-2">
                                <button type="button" className="btn btn-secondary" onClick={() => setUnlockOpen(true)}><Icon name="key" /> Nhập mã kích hoạt</button>
                                <button type="button" className="btn btn-ghost" onClick={() => setContribOpen(true)}><Icon name="users" /> Góp đề / chia sẻ để nhận mã free</button>
                            </div>
                        )}
                    </section>

                    <section className="grid sm:grid-cols-3 gap-3">
                        <button type="button" className="card p-4 text-left hover:border-primary" onClick={startWeak}>
                            <Icon name="flame" className="text-warn" /><p className="font-semibold mt-2">Ôn câu yếu ({weakIds.length})</p><p className="text-sm text-ink2">Câu sai trong ca hoặc EOS, nhồi lại bằng Băng đạn.</p>
                        </button>
                        <button type="button" className="card p-4 text-left hover:border-primary" onClick={openEOS} disabled={mcqPool.length < 5}>
                            <Icon name="monitor" className="text-eos" /><p className="font-semibold mt-2">Phòng thi giả lập EOS</p><p className="text-sm text-ink2">Làm ngay trên giao diện EOS cổ điển, trộn đề 30–50 câu.</p>
                        </button>
                        <div className="card p-4">
                            <Icon name="keyboard" className="text-ink2" /><p className="font-semibold mt-2">Zero-mouse</p><p className="text-sm text-ink2"><Kbd>1</Kbd>–<Kbd>4</Kbd> chọn đáp án · <Kbd>H</Kbd> highlight{unlocked ? '' : ' (mở ở Chặng 2)'} · <Kbd>Esc</Kbd> thoát</p>
                        </div>
                    </section>

                    {unlockOpen && <UnlockModal pack={pack} onUnlock={onUnlock} onClose={() => setUnlockOpen(false)} />}
                    {contribOpen && <ContributeModal pack={pack} toast={toast} onClose={() => setContribOpen(false)} />}
                    {eosSetup && <EOSSetup max={eosSetup.length} onClose={() => setEosSetup(null)} onStart={(n, min) => { if (!requireTurns(toast, true)) return; setRun({ kind: 'eos', pool: eosSetup, count: n, minutes: min, key: Date.now() }); setEosSetup(null); setView('eos'); }} />}
                </div>
            );
        };
    </script>

    <!-- ===================== APP ROOT ===================== -->
    <script type="text/babel" data-presets="react">
        const BASE_TITLE = 'FPass · Học đúng giờ, thi chắc qua';

        const promptOf = (t) => {
            if (!t) return '';
            const s = t.type === 'mcq' ? t.questionOrWord : Sch.recallPromptOf(t);
            return s.length > 90 ? s.slice(0, 88) + '…' : s;
        };

        const ModeSwitch = ({ mode, onChange, slotDue }) => {
            const opts = [
                { id: 'self', icon: 'pen', label: 'Sổ tay & Lịch học', short: 'Sổ tay', badge: 'Tự tạo thẻ · AI điền · Free' },
                { id: 'bank', icon: 'layers', label: 'Kho Src Qua Môn', short: 'Kho Src', badge: 'FE · EOS · PT · IELTS' }
            ];
            const onKey = (e) => {
                if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].indexOf(e.key) < 0) return;
                e.preventDefault();
                const next = mode === 'self' ? 'bank' : 'self';
                onChange(next);
                const el = document.getElementById('mode-' + next);
                if (el) el.focus();
            };
            return (
                <div role="radiogroup" aria-label="Chế độ học" onKeyDown={onKey} className="relative grid grid-cols-2 p-1 rounded-2xl bg-surface2 border border-line w-full sm:w-auto">
                    <span aria-hidden="true" className="absolute top-1 bottom-1 left-1 rounded-xl bg-surface shadow-sm border border-line transition-transform duration-200 ease-out" style={{ width: 'calc(50% - 4px)', transform: mode === 'bank' ? 'translateX(100%)' : 'none' }} />
                    {opts.map(o => (
                        <button key={o.id} id={'mode-' + o.id} type="button" role="radio" aria-checked={mode === o.id} tabIndex={mode === o.id ? 0 : -1} onClick={() => onChange(o.id)}
                            className={'relative z-10 flex items-center justify-center gap-2 px-3 sm:px-4 min-h-[44px] rounded-xl text-sm font-semibold transition-colors ' + (mode === o.id ? 'text-ink' : 'text-ink2 hover:text-ink')}>
                            <Icon name={o.icon} size={16} className={mode === o.id ? 'text-primary' : ''} />
                            <span className="text-left leading-tight">
                                <span className="hidden md:inline">{o.label}</span><span className="md:hidden">{o.short}</span>
                                <span className={'block text-[10px] font-medium ' + (mode === o.id ? 'text-primary' : 'text-muted')}>{o.badge}</span>
                            </span>
                            {o.id === 'self' && slotDue && <span className="absolute top-1 right-1.5 w-2.5 h-2.5 rounded-full bg-danger ring-2 ring-surface2" aria-hidden="true" />}
                            {o.id === 'self' && slotDue && <span className="sr-only">, có ca học đến giờ</span>}
                        </button>
                    ))}
                </div>
            );
        };

        const SettingsModal = ({ onClose, toast, muted, setMuted }) => {
            const [usage, setUsage] = useState(null);
            const [studentName, setStudentName] = useState(Store.prefs.get('student', '') || '');
            useEffect(() => { Store.estimate().then(setUsage); }, []);
            const save = () => {
                Store.prefs.set('student', Sec.cleanText(studentName, 40));
                toast('Đã lưu cài đặt', 'success');
                onClose();
            };
            const [perm, setPerm] = useState(window.Notification ? Notification.permission : 'unsupported');
            const permLabel = perm === 'granted' ? 'Đã bật' : perm === 'denied' ? 'Bị chặn' : perm === 'unsupported' ? 'Không hỗ trợ' : 'Bật';
            return (
                <Modal title="Cài đặt" onClose={onClose} footer={<><button type="button" className="btn btn-secondary" onClick={onClose}>Hủy</button><button type="button" className="btn btn-primary" onClick={save}>Lưu</button></>}>
                    <div className="space-y-3">
                        <label className="block"><span className="label">Tên hiển thị trong phòng thi EOS (Mã SV / Account FPT)</span>
                            <input value={studentName} onChange={(e) => setStudentName(e.target.value)} maxLength={40} placeholder="Ví dụ: SE123456" className="field" spellCheck={false} />
                        </label>
                        <label className="flex items-center justify-between gap-3 min-h-[44px]">
                            <span><span className="font-semibold text-sm block">Âm thanh phản hồi</span><span className="text-xs text-ink2">Ting khi đúng, âm trầm khi sai, gõ nhẹ khi đến giờ</span></span>
                            <input type="checkbox" className="w-5 h-5 accent-indigo-700" checked={!muted} onChange={(e) => setMuted(!e.target.checked)} />
                        </label>
                        <div className="flex items-center justify-between gap-3">
                            <span><span className="font-semibold text-sm block">Thông báo khi đến giờ</span><span className="text-xs text-ink2">{perm === 'denied' ? 'Bị chặn trong cài đặt trình duyệt' : 'Báo khi một ca học bắt đầu'}</span></span>
                            <button type="button" className="btn btn-secondary btn-sm" disabled={perm !== 'default'} onClick={() => Notification.requestPermission().then(setPerm)}><Icon name="bell" size={14} /> {permLabel}</button>
                        </div>
                        <p className="text-xs text-muted tnum">Dung lượng bộ nhớ trình duyệt: {usage && usage.quota ? (usage.usage / 1048576).toFixed(1) + ' MB / ' + (usage.quota / 1048576).toFixed(0) + ' MB' : 'trình duyệt không báo số liệu'}</p>
                    </div>
                </Modal>
            );
        };

        const App = () => {
            const [nav, dispatch] = useReducer(Nav.reduce, Store.prefs.get('mode', 'self'), Nav.initial);
            const [items, setItems] = useState([]);
            const [loaded, setLoaded] = useState(false);
            const [toasts, setToasts] = useState([]);
            const [groupFilter, setGroupFilter] = useState('all');
            const [session, setSession] = useState(null);
            const [plan, setPlan] = useState(null);
            const [week, setWeek] = useState(null);
            const [nextWeek, setNextWeek] = useState(null);
            const [planReady, setPlanReady] = useState(false);
            const [minimal, setMinimal] = useState(false);
            const [now, setNow] = useState(Date.now());
            const [hidden, setHidden] = useState(document.hidden);
            const [progress, setProgress] = useState({});
            const [licenses, setLicenses] = useState(() => Store.prefs.get('licenses', {}) || {});
            const [unlocked, setUnlocked] = useState({});
            const [exams, setExams] = useState(() => Store.prefs.get('exams', {}) || {});
            const [milestones, setMilestones] = useState(() => Store.prefs.get('milestones', {}) || {});
            const [settingsOpen, setSettingsOpen] = useState(false);
            const [fundShop, setFundShop] = useState(false);
            const [legalTab, setLegalTab] = useState(null);
            const [supportOpen, setSupportOpen] = useState(false);
            const [feedbackOpen, setFeedbackOpen] = useState(false);
            const helpReturn = useRef(null);
            const [systemPacks, setSystemPacks] = useState([]);
            const [contribOpen, setContribOpen] = useState(false);
            useEffect(() => {
                const open = () => setFundShop(true);
                const showLegal = (e) => {
                    setSupportOpen(false);
                    setLegalTab((e.detail && e.detail.tab) || 'id');
                };
                const showSupport = () => {
                    helpReturn.current = document.activeElement;
                    setLegalTab(null);
                    setFeedbackOpen(false);
                    setSupportOpen(true);
                };
                window.addEventListener('edu-fund-shop', open);
                window.addEventListener('fpass-legal', showLegal);
                window.addEventListener('fpass-support', showSupport);
                return () => {
                    window.removeEventListener('edu-fund-shop', open);
                    window.removeEventListener('fpass-legal', showLegal);
                    window.removeEventListener('fpass-support', showSupport);
                };
            }, []);
            useEffect(() => {
                let id = '';
                try {
                    id = localStorage.getItem('edu.visitor') || '';
                    if (!/^[a-f0-9]{16}$/.test(id)) {
                        const bytes = new Uint8Array(8);
                        crypto.getRandomValues(bytes);
                        id = Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
                        localStorage.setItem('edu.visitor', id);
                    }
                } catch (e) { id = ''; }
                if (!id) return undefined;
                fetch('/api/desk?action=visits', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                    body: JSON.stringify({ id })
                }).catch(() => {});
                return undefined;
            }, []);
            useEffect(() => {
                const quota = window.EDU && window.EDU.Quota;
                if (!quota || !quota.sync) return undefined;
                const pull = () => { quota.sync().catch(() => {}); };
                pull();
                const id = setInterval(pull, 15000);
                return () => clearInterval(id);
            }, []);
            useEffect(() => {
                let stop = false;
                const packFrom = (raw) => {
                    if (!raw || typeof raw.id !== 'string' || !Array.isArray(raw.items)) return null;
                    const items = raw.items.map(d => Sch.normalizeItem(d, { source: 'system:' + raw.id, group: raw.code || 'Hệ thống' })).filter(Sch.isFilled);
                    if (!items.length) return null;
                    return {
                        id: raw.id, code: raw.code || 'ĐỀ', name: raw.name || 'Đề hệ thống', block: 'system',
                        type: raw.type === 'vocab' ? 'vocab' : 'mcq',
                        desc: raw.desc || 'Đề hệ thống. Mọi máy mở trang đều thấy bản này.',
                        status: 'ready', system: true,
                        stages: [{ n: 1, count: items.length, free: true }], total: items.length, items
                    };
                };
                fetch('/api/exams', { headers: { Accept: 'application/json' } })
                    .then(r => r.ok ? r.json() : null)
                    .then(data => {
                        if (stop || !data || !Array.isArray(data.exams)) return;
                        setSystemPacks(data.exams.map(packFrom).filter(Boolean));
                    })
                    .catch(() => {});
                const openContrib = () => setContribOpen(true);
                window.addEventListener('edu-contribute', openContrib);
                return () => { stop = true; window.removeEventListener('edu-contribute', openContrib); };
            }, []);
            const [muted, setMutedState] = useState(Sfx.isMuted());
            const savedItems = useRef([]);
            const saveTimer = useRef(null);
            const alerted = useRef({});
            const dayRef = useRef(Plan.dayKeyOf(new Date()));
            const planBoot = useRef(false);
            const progressRef = useRef({});

            const toast = (message, type = 'success', ms) => {
                const id = Date.now() + Math.random();
                setToasts(l => l.concat({ id, message: String(message), type }).slice(-3));
                setTimeout(() => setToasts(l => l.filter(t => t.id !== id)), ms || (type === 'error' ? 4500 : 2600));
            };
            const setMuted = (v) => { Sfx.setMuted(v); setMutedState(v); };

            const catalogPacks = useMemo(() => (Catalog.packs || []).map(p => (p.status === 'ready'
                ? Object.assign({}, p, { items: (p.free || []).map(d => Sch.normalizeItem(d, { source: 'pack:' + p.id, group: p.code })) })
                : p)), []);
            const packs = useMemo(() => catalogPacks.concat(systemPacks), [catalogPacks, systemPacks]);
            const packById = useMemo(() => new Map(packs.map(p => [p.id, p])), [packs]);
            const itemsById = useMemo(() => new Map(items.map(t => [t.id, t])), [items]);

            /* ---------- Boot: migration → IndexedDB → plan ---------- */
            useEffect(() => {
                (async () => {
                    try {
                        const migrated = await Store.migrateLegacy();
                        const rows = (await Store.items.all()).map(d => Sch.normalizeItem(d));
                        savedItems.current = rows;
                        setItems(rows);
                        const prog = {};
                        (await Store.progress.all()).forEach(r => { prog[r.id] = r; });
                        progressRef.current = prog;
                        setProgress(prog);
                        if (migrated) toast('Đã chuyển ' + migrated + ' mục từ bản cũ sang IndexedDB', 'info');
                    } catch (e) {
                        toast('Không mở được kho dữ liệu: ' + e.message, 'error');
                    }
                    setLoaded(true);
                })();

                const today = Plan.dayKeyOf(new Date());
                const dayKey = Plan.weekdayOf(new Date());
                let w = Plan.normWeek(Store.prefs.get('weeklyPlan', null));
                const nx = Store.prefs.get('nextWeeklyPlan', null);
                const saved = Store.prefs.get('hybridToday', null);
                setWeek(w);
                Store.prefs.set('weeklyPlan', w);
                if (Plan.isValidWeek(nx)) setNextWeek(Plan.normWeek(nx));
                const keep = saved && saved.date === today && Array.isArray(saved.slots) && saved.slots.length === 3 && saved.slots[0] && saved.slots[0].phase1_inApp;
                if (keep) {
                    setPlan(Plan.buildDay(saved, today, saved.dayKey || dayKey, true));
                } else {
                    const src = Plan.isValidWeek(nx) ? Plan.normWeek(nx) : w;
                    setPlan(Plan.buildDay({ slots: src.days[dayKey] }, today, dayKey, false));
                    if (Plan.isValidWeek(nx)) {
                        setWeek(src);
                        Store.prefs.set('weeklyPlan', src);
                        Store.prefs.remove('nextWeeklyPlan');
                        setNextWeek(null);
                    }
                }
                setPlanReady(true);
            }, []);

            /* ---------- Persist: items (diff → IndexedDB), plan, mode ---------- */
            const flushItems = (list) => {
                clearTimeout(saveTimer.current);
                const prev = savedItems.current;
                savedItems.current = list;
                return Store.syncDiff(Store.items, prev, list).catch(e => {
                    savedItems.current = prev;
                    toast('Lỗi lưu dữ liệu: ' + (e && e.message), 'error');
                });
            };
            const latestItems = useRef(items);
            latestItems.current = items;
            useEffect(() => {
                if (!loaded) return;
                clearTimeout(saveTimer.current);
                saveTimer.current = setTimeout(() => flushItems(items), 300);
            }, [items, loaded]);
            useEffect(() => {
                const onHide = () => { if (document.hidden && loaded) flushItems(latestItems.current); };
                document.addEventListener('visibilitychange', onHide);
                window.addEventListener('pagehide', onHide);
                return () => { document.removeEventListener('visibilitychange', onHide); window.removeEventListener('pagehide', onHide); };
            }, [loaded]);

            useEffect(() => {
                if (!planBoot.current) { planBoot.current = true; return; }
                if (plan) Store.prefs.set('hybridToday', plan);
            }, [plan]);
            useEffect(() => { if (nextWeek && Plan.isValidWeek(nextWeek)) Store.prefs.set('nextWeeklyPlan', nextWeek); }, [nextWeek]);
            useEffect(() => { Store.prefs.set('mode', nav.mode); }, [nav.mode]);

            /* ---------- Giải mã các bộ đề đã có license ---------- */
            useEffect(() => {
                Object.keys(licenses).forEach(pid => {
                    const p = packById.get(pid);
                    if (!p || !p.locked || unlocked[pid]) return;
                    Vault.unlock(p, licenses[pid]).then(list => setUnlocked(u => Object.assign({}, u, { [pid]: list }))).catch(() => {});
                });
            }, []);

            /* ---------- Nhịp đồng hồ chống đóng băng tab nền ---------- */
            useEffect(() => {
                const stop = E.Engine.createTicker((t) => setNow(t));
                const onVis = () => setHidden(document.hidden);
                document.addEventListener('visibilitychange', onVis);
                return () => { stop(); document.removeEventListener('visibilitychange', onVis); document.title = BASE_TITLE; };
            }, []);

            /* ---------- Qua 00:00: áp plan ngày mai, không cộng dồn nợ ---------- */
            useEffect(() => {
                const d = new Date(now);
                const key = Plan.dayKeyOf(d);
                if (key === dayRef.current) return;
                dayRef.current = key;
                const dayKey = Plan.weekdayOf(d);
                const src = Plan.isValidWeek(nextWeek) ? Plan.normWeek(nextWeek) : week;
                if (Plan.isValidWeek(nextWeek)) {
                    setWeek(src);
                    Store.prefs.set('weeklyPlan', src);
                    Store.prefs.remove('nextWeeklyPlan');
                    setNextWeek(null);
                }
                if (Plan.isValidWeek(src)) setPlan(Plan.buildDay({ slots: src.days[dayKey] }, key, dayKey, false));
                setSession(s => (s && s.slotId ? null : s));
                setMinimal(false);
                alerted.current = {};
            }, [now]);

            /* ---------- Item operations ---------- */
            const review = (id, ok, kind) => setItems(prev => prev.map(t => (t.id === id ? Sch.applyReview(t, ok, kind).item : t)));
            const patch = (map) => setItems(prev => prev.map(t => (map[t.id] ? Object.assign({}, t, map[t.id]) : t)));
            const uniqueIds = (incoming, taken) => incoming.map(t => {
                let id = t.id;
                while (taken.has(id)) id = Sch.newId('it');
                taken.add(id);
                return id === t.id ? t : Object.assign({}, t, { id });
            });
            const mergeItems = (incoming, mode) => {
                if (mode === 'replace') setItems(uniqueIds(incoming, new Set()));
                else setItems(prev => prev.concat(uniqueIds(incoming, new Set(prev.map(t => t.id)))));
            };
            const addItems = (raws) => mergeItems(raws.map(r => Sch.normalizeItem(Object.assign({}, r, { id: undefined }))), 'append');

            /* ---------- Phiên học Mode 1 ---------- */
            const startPractice = (list, mode, title, opts) => {
                const pool = (list || []).filter(Sch.isFilled);
                if (!pool.length) { toast('Không có mục để luyện', 'error'); return; }
                if (mode === 'eos') {
                    if (!requireTurns(toast, true)) return;
                    const n = (opts && opts.count) || Math.min(40, pool.length);
                    setSession({ id: Date.now(), title, mode: 'eos', pool, count: n, minutes: (opts && opts.minutes) || Math.max(5, Math.round(n * 1.2)), ids: [] });
                } else {
                    setSession({ id: Date.now(), title, mode, ids: Sch.shuffle(pool.map(t => t.id)) });
                }
                dispatch({ type: 'TAB', tab: 'practice' });
            };
            const restartSession = (ids, mode, title) => setSession(s => ({ id: Date.now(), title, mode, ids, slotId: null }));
            const studyFrom = (t) => {
                const g = Sch.groupKey(t);
                const same = items.filter(x => Sch.groupKey(x) === g && Sch.isFilled(x));
                const i = Math.max(0, same.findIndex(x => x.id === t.id));
                setSession({ id: Date.now(), title: Sch.groupLabel(g), mode: 'flash', ids: same.slice(i).concat(same.slice(0, i)).map(x => x.id) });
                dispatch({ type: 'TAB', tab: 'practice' });
            };
            const startWeak = () => {
                const weak = Sch.byGroup(items, groupFilter).filter(t => Sch.isWeak(t)).sort((a, b) => Sch.weakScore(b) - Sch.weakScore(a)).slice(0, 20);
                if (!weak.length) { toast('Không có mục yếu hoặc đến hạn trong nhóm này', 'info'); return; }
                setSession({ id: Date.now(), title: 'Ôn từ yếu', mode: 'flash', ids: weak.map(t => t.id) });
                dispatch({ type: 'TAB', tab: 'practice' });
            };

            const groups = useMemo(() => {
                const m = new Map();
                items.forEach(t => { const k = Sch.groupKey(t); m.set(k, (m.get(k) || 0) + 1); });
                return Array.from(m.entries()).sort((a, b) => Sch.groupLabel(a[0]).localeCompare(Sch.groupLabel(b[0]), 'vi'));
            }, [items]);
            useEffect(() => { if (groupFilter !== 'all' && !groups.some(([k]) => k === groupFilter)) setGroupFilter('all'); }, [groups, groupFilter]);

            /* ---------- Kế hoạch ngày ---------- */
            const saveWeek = (w) => {
                const n = Plan.normWeek(w);
                setNextWeek(n);
                Store.prefs.set('nextWeeklyPlan', n);
                toast('Đã lưu. Thay đổi áp dụng từ 00:00 ngày mai', 'info');
            };
            const patchSlot = (id, fn) => setPlan(p => p && Object.assign({}, p, { slots: p.slots.map(s => (s.id === id ? fn(s) : s)) }));
            const snooze = (id) => {
                const d = new Date();
                const min = Math.min(d.getHours() * 60 + d.getMinutes() + 15, 23 * 60 + 59);
                patchSlot(id, s => Object.assign({}, s, { snoozedOnce: true, snoozeMin: min }));
                setSession(s => (s && s.slotId === id ? null : s));
                toast('Ca này lùi 15 phút — chỉ dùng được 1 lần', 'info');
            };
            const finishSlot = ({ slotId, cardsDone, remembered }) => {
                patchSlot(slotId, s => {
                    const book = s.phase2_externalTask && s.phase2_externalTask.hasExternal;
                    return Object.assign({}, s, {
                        status: book ? 'phase2' : 'done',
                        phase2StartedAt: book ? new Date().toISOString() : null,
                        finishedAt: book ? null : new Date().toISOString(),
                        cardsDone, remembered
                    });
                });
                setSession(null);
                setMinimal(false);
            };
            const finishGate = (slotId) => patchSlot(slotId, s => Object.assign({}, s, { status: 'done', finishedAt: new Date().toISOString() }));
            const deckFor = (slot, limit) => {
                let full = slot.deckIds;
                if (!full || !full.length) {
                    full = Plan.buildDeck(Object.assign({}, slot, { deckIds: null }), items, slot.baseCardCount || limit).map(t => t.id);
                    if (full.length) patchSlot(slot.id, s => Object.assign({}, s, { deckIds: full }));
                }
                return full.slice(0, limit);
            };
            const enterEarly = (slot) => {
                const ids = deckFor(slot, Plan.cardLimit(slot, 'ON_TIME_ACTIVE', false));
                if (!ids.length) { toast('Nhóm này chưa có thẻ', 'error'); return; }
                setSession({ id: Date.now(), title: 'Ca ' + slot.id + ' · ' + slot.anchorLabel, mode: sessionModeOf(slot.mode), ids, slotId: slot.id });
            };
            const bonus = () => {
                const ids = Sch.shuffle(items.filter(Sch.isFilled)).slice(0, 5).map(t => t.id);
                if (!ids.length) { toast('Chưa có thẻ để học thêm', 'error'); return; }
                setSession({ id: Date.now(), title: 'Thêm 5 thẻ', mode: 'flash', ids, slotId: null });
            };
            const askNotify = () => {
                if (!window.Notification) { toast('Trình duyệt này không có thông báo', 'error'); return; }
                Notification.requestPermission().then(q => toast(q === 'granted' ? 'Đã bật nhắc khi đến giờ' : 'Chưa bật được thông báo', q === 'granted' ? 'success' : 'info'));
            };

            const cur = plan ? Plan.currentSlot(plan.slots, new Date(now)) : { kind: 'NONE', slot: null };
            const live = plan && plan.date === Plan.dayKeyOf(new Date(now)) && (cur.kind === 'ON_TIME_ACTIVE' || cur.kind === 'LATE_RECOVERY');
            const liveLimit = live ? Plan.cardLimit(cur.slot, cur.kind, minimal) : 0;

            /* ---------- Zero-Click Entry: đến giờ là bung thẳng thẻ s1 ---------- */
            useEffect(() => {
                if (!live || !loaded) return;
                const slot = cur.slot;
                const ids = deckFor(slot, liveLimit);
                const first = itemsById.get(ids[0]);
                const key = plan.date + '-' + slot.id + '-' + (slot.snoozedOnce ? 's' + slot.snoozeMin : 'n') + '-' + cur.kind + '-' + liveLimit;
                if (!alerted.current[key]) {
                    alerted.current[key] = true;
                    Sfx.knock();
                    if (document.hidden && window.Notification && Notification.permission === 'granted' && first) {
                        try {
                            const n = new Notification('Đến giờ ca ' + slot.id + ' · ' + slot.anchorLabel, { body: '[1/' + ids.length + '] ' + promptOf(first), tag: 'ca-hoc-' + slot.id });
                            n.onclick = () => { window.focus(); n.close(); };
                        } catch (e) {}
                    }
                }
                if (!ids.length) return;
                const same = session && session.slotId === slot.id && session.ids.length === ids.length && session.ids[0] === ids[0];
                if (same) return;
                setSession({ id: Date.now(), title: 'Ca ' + slot.id + ' · ' + slot.anchorLabel, mode: sessionModeOf(slot.mode), ids, slotId: slot.id });
                dispatch({ type: 'ZERO_CLICK' });
            }, [now, plan, items, minimal, session, loaded]);

            /* ---------- Treo tab cả ngày: nháy document.title bằng nội dung thẻ s1 ---------- */
            const s1 = live ? itemsById.get(((cur.slot.deckIds && cur.slot.deckIds.length) ? cur.slot.deckIds : [])[0]) : null;
            const titleA = live && s1 ? '🔴 [1/' + liveLimit + '] ' + promptOf(s1) : '';
            const titleB = live ? '🔔 Đến giờ ca ' + cur.slot.id + ' · ' + cur.slot.anchorLabel : '';
            useEffect(() => {
                if (!hidden || !titleA) { document.title = BASE_TITLE; return undefined; }
                let flip = false;
                document.title = titleA;
                const id = setInterval(() => { flip = !flip; document.title = flip ? titleB : titleA; }, 1500);
                return () => { clearInterval(id); document.title = BASE_TITLE; };
            }, [hidden, titleA, titleB]);

            /* ---------- Mode 2: tiến độ, license, lịch thi ---------- */
            const reviewPack = (packId, itemId, ok) => {
                const k = progKey(packId, itemId);
                const prev = progressRef.current[k] || { id: k, packId, itemId, srsStage: 0, wrongCount: 0, correctCount: 0, reviewCount: 0, nextReview: null, lastReview: null };
                const r = Sch.applyReview(prev, ok).item;
                const rec = { id: k, packId, itemId, srsStage: r.srsStage, wrongCount: r.wrongCount, correctCount: r.correctCount, reviewCount: r.reviewCount, nextReview: r.nextReview, lastReview: r.lastReview };
                progressRef.current = Object.assign({}, progressRef.current, { [k]: rec });
                setProgress(progressRef.current);
                Store.progress.putMany([rec]).catch(e => toast('Lỗi lưu tiến độ: ' + e.message, 'error'));
            };
            const unlockPack = async (pack, key) => {
                const list = await Vault.unlock(pack, key);
                setUnlocked(u => Object.assign({}, u, { [pack.id]: list }));
                const next = Object.assign({}, licenses, { [pack.id]: Vault.normalizeKey(key) });
                setLicenses(next);
                Store.prefs.set('licenses', next);
                Sfx.milestone();
                toast('Đã mở khóa ' + list.length + ' câu Chặng 2–3 · ' + pack.code, 'success');
            };
            const setExam = (packId, e) => {
                const next = Object.assign({}, exams);
                if (e) next[packId] = e; else delete next[packId];
                setExams(next);
                Store.prefs.set('exams', next);
            };
            const bumpSession = (packId) => {
                const e = exams[packId];
                if (!e) return;
                setExam(packId, Object.assign({}, e, { sessionsDone: (e.sessionsDone || 0) + 1 }));
            };
            const markMilestone = (packId) => {
                const next = Object.assign({}, milestones, { [packId]: true });
                setMilestones(next);
                Store.prefs.set('milestones', next);
            };
            const statsOf = (p) => {
                const all = p.items.concat(unlocked[p.id] || []);
                const c1 = all.filter(t => t.checkpoint === 1);
                return {
                    c1: c1.length,
                    m1: c1.filter(t => isMastered(progress[progKey(p.id, t.id)])).length,
                    mAll: all.filter(t => isMastered(progress[progKey(p.id, t.id)])).length
                };
            };

            const switchMode = (m) => {
                if (m === nav.mode) return;
                if (nav.busy && !confirm('Bạn đang giữa một ca / phòng thi. Thoát ra?')) return;
                dispatch({ type: 'SWITCH_MODE', mode: m, force: true });
            };

            const focusMode = nav.mode === 'self' && nav.tab === 'today' && session && session.slotId;
            const tabs = [['today', 'home', 'Hôm nay'], ['library', 'list', 'Kho của tôi'], ['practice', 'target', 'Luyện tự do']];
            const pack = nav.packId ? packById.get(nav.packId) : null;
            const screenNow = (() => {
                const bits = [];
                if (nav.mode === 'self') bits.push(nav.tab === 'library' ? 'Kho của tôi' : nav.tab === 'practice' ? 'Luyện tự do' : 'Hôm nay');
                else if (pack) bits.push((pack.code ? pack.code + ' · ' : '') + (pack.name || 'Đề'));
                else bits.push('Kệ đề');
                if (session && session.title) bits.push(session.title);
                return bits.join(' · ').slice(0, 160);
            })();
            const openFeedback = () => {
                setSupportOpen(false);
                setLegalTab(null);
                setFeedbackOpen(true);
            };

            return (
                <div className="min-h-screen flex flex-col">
