                        <span>Time Left:</span>
                        <span className="eos-clock">{clock}</span>
                    </div>
                    <div style={{ marginLeft: 'auto' }}>
                        <div style={{ background: '#FFFFCC', border: '1px solid #C4C090', padding: '6px 10px', marginBottom: 6, minWidth: 210 }}>
                            <div>Multiple choice: {paper.length} question</div>
                            <div>Fill Blank: 0 question</div>
                            <div>Answered: {answeredCount}/{paper.length}</div>
                        </div>
                        <div role="list" aria-label="Danh sách câu hỏi" style={{ display: 'grid', gridTemplateColumns: 'repeat(10, 26px)', gap: 2, justifyContent: 'end', maxHeight: 120, overflowY: 'auto' }}>
                            {paper.map((_, i) => (
                                <button key={i} type="button" role="listitem" onClick={() => go(i)} aria-current={i === cur && tab === 'mcq' ? 'true' : undefined}
                                    aria-label={'Câu ' + (i + 1) + (answers[i] != null ? ', đã chọn' : '')}
                                    className={'eos-q' + (answers[i] != null ? ' done' : '') + (i === cur && tab === 'mcq' ? ' here' : '')}>{i + 1}</button>
                            ))}
                        </div>
                    </div>
                </div>
            );

            let body;
            if (!paper.length) {
                body = <div className="eos-sunken" style={{ flex: 1, padding: 16 }}>There is no question in this paper.</div>;
            } else if (result && reviewing) {
                body = (
                    <div className="eos-sunken" style={{ flex: 1, minHeight: 240, overflow: 'auto', padding: 10, background: '#fff' }}>
                        <div style={{ marginBottom: 8 }}><button type="button" className="eos-btn" onClick={() => setReviewing(false)}>Back</button></div>
                        {wrongItems.map(({ w, t: it }) => (
                            <div key={w.index} style={{ borderBottom: '1px solid #C0C0C0', padding: '8px 2px' }}>
                                <div><b>Question {w.index + 1}</b></div>
                                <div style={{ overflowWrap: 'anywhere', marginTop: 2 }}>{it.questionOrWord}</div>
                                <div style={{ color: '#FF0000', marginTop: 4, overflowWrap: 'anywhere' }}>
                                    {w.chosenOriginal == null ? 'Your answer: (blank)' : 'Your answer: ' + Sch.LETTERS[w.chosenOriginal] + '. ' + (it.options[w.chosenOriginal] || '')}
                                </div>
                                <div style={{ marginTop: 2 }}><b className="eos-val">Correct: {it.answerOrMeaning}. {Sch.correctText(it)}</b></div>
                                {it.explanationOrExample ? <div style={{ marginTop: 4, overflowWrap: 'anywhere' }}>{it.explanationOrExample}</div> : null}
                                {explained[it.id] ? <div style={{ marginTop: 4, overflowWrap: 'anywhere' }}>{explained[it.id]}</div> : null}
                                {canExplain && !explained[it.id] ? <button type="button" className="eos-btn" style={{ marginTop: 4 }} disabled={explaining === it.id} onClick={() => explainOne(it)}>{explaining === it.id ? 'Explaining…' : 'AI explanation'}</button> : null}
                            </div>
                        ))}
                    </div>
                );
            } else if (result) {
                body = (
                    <div className="eos-sunken" style={{ flex: 1, minHeight: 240, padding: 16, background: '#ECE9D8' }}>
                        <fieldset style={{ border: '2px groove #fff', padding: '12px 16px', maxWidth: 640 }}>
                            <legend style={{ padding: '0 6px' }}>Result</legend>
                            <div style={{ display: 'grid', gridTemplateColumns: '160px auto', gap: '4px 12px', marginBottom: 12 }}>
                                <span>Correct answers</span><b className="eos-val">{result.correct} / {result.total}</b>
                                <span>Mark ( /10 )</span><b className="eos-val">{result.score10.toFixed(1)}</b>
                                <span>Time used</span><b className="eos-val">{Plan.fmtCountdown(result.usedMs)}</b>
                            </div>
                            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start', gap: 6 }}>
                                <button type="button" className="eos-btn" disabled={!wrongItems.length} onClick={() => setReviewing(true)} data-autofocus>[ Xem lại các câu sai & Giải thích ]</button>
                                {onDrillWrong && <button type="button" className="eos-btn" disabled={!wrongItems.length} onClick={() => onDrillWrong(wrongItems.map(x => x.t.id))}>[ Đẩy các câu sai vào Băng đạn 5 câu để cày lại ngay ]</button>}
                            </div>
                        </fieldset>
                    </div>
                );
            } else if (tab === 'blank') {
                body = <div className="eos-sunken" style={{ flex: 1, minHeight: 240, padding: 16, background: '#fff' }}>There is no Fill Blank question in this paper.</div>;
            } else {
                body = (
                    <div style={{ flex: 1, minHeight: 280, display: 'flex', flexDirection: 'column' }}>
                        <div style={{ color: '#0000FF', fontWeight: 700, padding: '4px 2px' }}>Multiple choices {cur + 1}/{paper.length}</div>
                        <div className="eos-sunken" style={{ flex: 1, display: 'flex', minHeight: 240, background: '#fff' }}>
                            <div style={{ width: 118, flex: '0 0 118px', borderRight: '1px solid #808080', padding: 8, display: 'flex', flexDirection: 'column' }}>
                                <div style={{ fontWeight: 700, marginBottom: 8 }}>Answer</div>
                                <div role="group" aria-label={'Đáp án câu ' + (cur + 1)}>
                                    {q && q.order.map((oi, di) => (
                                        <label key={oi} style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 6, cursor: 'pointer' }}>
                                            <input type="checkbox" checked={answers[cur] === di} onChange={() => choose(di, true)} aria-label={Sch.LETTERS[di]} />
                                            <span>{Sch.LETTERS[di]}</span>
                                        </label>
                                    ))}
                                </div>
                                <div style={{ marginTop: 'auto', paddingTop: 12 }}>
                                    <button type="button" className="eos-btn" onClick={() => go(cur + 1)} disabled={cur >= paper.length - 1}>Next</button>
                                </div>
                            </div>
                            <div style={{ flex: 1, overflow: 'auto', padding: '12px 14px', fontSize: fontSize + 'pt' }}>
                                {t && <p style={{ overflowWrap: 'anywhere', margin: 0 }}>{t.questionOrWord}</p>}
                                <div style={{ marginTop: 16 }}>
                                    {q && t && q.order.map((oi, di) => (
                                        <button key={oi} type="button" className={'eos-hit' + (answers[cur] === di ? ' on' : '')} onClick={() => choose(di, false)}>
                                            <b>{Sch.LETTERS[di]}.</b> {t.options[oi]}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="eos-shell" role="region" aria-label="Phòng thi giả lập EOS">
                    <div className="eos-form">
                        {header}
                        <div style={{ display: 'flex', alignItems: 'flex-end', marginTop: 8 }}>
                            <button type="button" className="eos-tab" role="tab" aria-selected={tab === 'mcq' && !result} onClick={() => { setTab('mcq'); setReviewing(false); }}>Multiple Choices</button>
                            <button type="button" className="eos-tab" role="tab" aria-selected={tab === 'blank' && !result} onClick={() => { if (!result) setTab('blank'); }}>Fill Blank</button>
                        </div>
                        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', borderTop: '2px solid #fff', minHeight: 0 }}>{body}</div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 8, paddingTop: 6 }}>
                            <label style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
                                <input type="checkbox" checked={wantFinish} disabled={!!result} onChange={(e) => setWantFinish(e.target.checked)} />
                                I want to finish the exam.
                            </label>
                            <button type="button" className="eos-btn" disabled={!wantFinish || !!result || paying} onClick={() => submit(false)}
                                style={wantFinish && !result && !paying ? { background: '#FFFF99' } : undefined}>{paying ? '…' : 'Finish'}</button>
                            <span style={{ marginLeft: 'auto', color: '#0000FF' }}>Updated 01/10/2010</span>
                            <button type="button" className="eos-btn" onClick={leave}>Exit</button>
                        </div>
                    </div>
                </div>
            );
        };

        const EOSSetup = ({ max, onStart, onClose }) => {
            const sizes = [30, 40, 50].filter(n => n <= max);
            const [n, setN] = useState(sizes.length ? sizes[sizes.length > 1 ? 1 : 0] : max);
            const choices = sizes.length ? sizes : [max];
            return (
                <Modal title="Phòng thi giả lập EOS" onClose={onClose}
                    footer={<><button type="button" className="btn btn-secondary" onClick={onClose}>Hủy</button><button type="button" className="btn btn-primary" onClick={() => onStart(n, Math.max(5, Math.round(n * 1.2)))} data-autofocus><Icon name="play" /> Vào phòng thi</button></>}>
                    <p className="text-sm text-ink2 mb-3">Trộn ngẫu nhiên câu hỏi và thứ tự đáp án. Hết giờ hệ thống tự nộp bài. Câu sai tự vào mục "Ôn câu yếu".</p>
                    <p className="label">Số câu</p>
                    <div className="flex flex-wrap gap-2" role="radiogroup" aria-label="Số câu">
                        {choices.map(c => (
                            <button key={c} type="button" role="radio" aria-checked={n === c} onClick={() => setN(c)} className={'btn ' + (n === c ? 'btn-primary' : 'btn-secondary')}>{c} câu · {Math.max(5, Math.round(c * 1.2))} phút</button>
                        ))}
                    </div>
                    {max < 30 && <p className="text-xs text-muted mt-3">Kho hiện có {max} câu trắc nghiệm nên đề chỉ gồm {max} câu.</p>}
                </Modal>
            );
        };
    </script>

    <!-- ===================== MODE 1 · Sổ tay & Lịch học ===================== -->
    <script type="text/babel" data-presets="react">
        const sessionModeOf = (m) => (m === 'test' ? 'test' : m === 'burst' ? 'burst' : 'flash');

        const b64EncodeUtf8 = (str) => {
            const bytes = new TextEncoder().encode(str);
            let bin = '';
            for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
            return btoa(bin);
        };
        const b64DecodeUtf8 = (b64) => {
            const bin = atob(String(b64).replace(/\s+/g, ''));
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new TextDecoder().decode(bytes);
        };

        const DayStrip = ({ dayKey }) => (
            <div className="flex flex-wrap justify-center gap-1 mb-4 text-xs" aria-label="Ngày trong tuần">
                {Plan.WEEK.map(k => (
                    <span key={k} aria-current={k === dayKey ? 'date' : undefined} className={'px-2.5 py-1 rounded-full ' + (k === dayKey ? 'bg-ink text-white font-semibold' : 'text-muted')}>{Plan.WEEK_LABEL[k]}</span>
                ))}
            </div>
        );

        const SlotTrack = ({ slots, activeId }) => (
            <ol className="grid grid-cols-3 gap-2 mb-5" aria-label="3 việc hôm nay">
                {slots.map(s => {
                    const done = s.status === 'done';
                    const gate = s.status === 'phase2';
                    const tone = s.nghi ? 'bg-surface2 text-muted border-line' : done ? 'bg-success-soft text-success border-green-200' : gate ? 'bg-warn-soft text-warn border-amber-200' : s.id === activeId ? 'bg-primary-soft text-primary border-indigo-200' : 'bg-surface text-ink2 border-line';
                    return (
                        <li key={s.id} className={'rounded-xl border px-3 py-2 text-left ' + tone}>
                            <p className="text-[11px] font-semibold uppercase tracking-wide flex items-center gap-1">
                                <Icon name={s.nghi ? 'x' : done ? 'check' : gate ? 'book' : 'clock'} size={12} />
                                {s.nghi ? 'Nghỉ' : done ? 'Xong' : gate ? 'Đọc sách' : Plan.hhmmOf(Plan.triggerMin(s))}
                            </p>
                            <p className="text-sm font-medium text-flow">{s.anchorLabel}</p>
                        </li>
                    );
                })}
            </ol>
        );

        /* ---------- Flow Bridge: 8 thẻ mồi → đồng hồ đọc sách ngoài đời → cổng kiểm chứng ---------- */
        const FlowBridge = ({ slot, items, addItems, finishGate, toast, now }) => {
            const p2 = slot.phase2_externalTask || {};
            const p3 = slot.phase3_verificationGate || {};
            const need = p3.gateType === 'harvest_words' ? 0 : (p3.sentenceCount || 1);
            const [sentences, setSentences] = useState(() => Array.from({ length: Math.max(1, need) }, () => ''));
            const [harvest, setHarvest] = useState([{ term: '', meaning: '' }, { term: '', meaning: '' }]);
            const [err, setErr] = useState('');
            const [busy, setBusy] = useState(false);
            const rang = useRef(false);
            const total = Math.max(1, p2.durationMinutes || 25) * 60000;
            const started = slot.phase2StartedAt ? new Date(slot.phase2StartedAt).getTime() : now;
            const left = Math.max(0, started + total - now);

            useEffect(() => {
                if (left === 0 && !rang.current) { rang.current = true; Sfx.knock(); }
            }, [left === 0]);

            const slotWords = () => {
                const byId = new Map(items.map(t => [t.id, t]));
                const fromDeck = (slot.deckIds || []).map(id => byId.get(id)).filter(Sch.isFilled);
                return fromDeck.length ? fromDeck : Sch.byGroup(items, slot.group);
            };

            const submitSentences = async () => {
                const ds = slotWords().filter(t => t.type === 'vocab');
                const list = sentences.map(s => s.trim());
                if (list.length < need || list.some(s => !s)) { setErr('Cần viết đủ ' + need + ' câu.'); return; }
                if (list.some(s => s.split(/\s+/).filter(Boolean).length < 4)) { setErr('Mỗi câu cần ít nhất 4 từ.'); return; }
                if (ds.length && !list.some(s => ds.some(t => s.toLowerCase().indexOf(String(t.questionOrWord).toLowerCase()) >= 0))) {
                    setErr('Ít nhất một câu phải chứa một từ vừa học trong ca này.');
                    return;
                }
                setBusy(true);
                setErr('');
                const r = await AI.gradeSentences(list, p3.prompt);
                setBusy(false);
                if (!r.ok) { setErr(r.note || 'Câu chưa qua cổng.'); return; }
                toast(r.note || 'Đã nhận câu', 'success');
                finishGate(slot.id);
            };

            const submitHarvest = () => {
                const clean = harvest.map(h => ({ term: Sec.cleanText(h.term, 400), meaning: Sec.cleanText(h.meaning, 1500) })).filter(h => h.term && h.meaning);
                const min = p3.minWords || 2;
                if (clean.length < min) { setErr('Cần ít nhất ' + min + ' thuật ngữ / câu hỏi, mỗi mục có nghĩa hoặc đáp án.'); return; }
                const group = slot.group && slot.group !== 'all' ? slot.group : (p2.bookTitle || 'Thu hoạch');
                addItems(clean.map(h => ({ type: 'vocab', questionOrWord: h.term, answerOrMeaning: h.meaning, group })));
                toast('Đã nạp ' + clean.length + ' mục mới vào kho', 'success');
                finishGate(slot.id);
            };

            return (
                <div className="max-w-xl mx-auto space-y-4 enter">
                    <div className="card p-5 sm:p-6 text-center">
                        <p className="text-xs font-semibold uppercase tracking-wider text-muted mb-2">Pha 2 · Bắc cầu sang sách ngoài đời</p>
                        <div className={'tnum text-6xl font-semibold tracking-tight ' + (left === 0 ? 'text-success' : 'text-ink')} role="timer" aria-label="Thời gian đọc còn lại">{Plan.fmtCountdown(left)}</div>
                        <p className="text-sm text-muted mt-1">{left === 0 ? 'Hết giờ đọc — chốt ca ở cổng bên dưới.' : 'Gập laptop, mở sách. Màn hình này đếm giờ giúp bạn.'}</p>
                        <div className="mt-4 rounded-xl bg-surface2 p-4 text-left">
                            <p className="font-semibold flex items-center gap-2 text-flow"><Icon name="book" /> {p2.bookTitle}</p>
                            {p2.taskDetail && <p className="text-ink2 mt-1 text-flow">{p2.taskDetail}</p>}
                        </div>
                        {slot.dienTam && <p className="text-sm text-warn mt-3 text-flow">Phần sách này đang là buổi ôn tạm. Sửa lịch ngày mai nếu khác.</p>}
                    </div>
                    <div className="card p-5 sm:p-6">
                        <p className="text-xs font-semibold uppercase tracking-wider text-muted mb-2">Pha 3 · Cổng kiểm chứng — không có ô tự tick</p>
                        <p className="font-medium mb-3 text-flow">{p3.prompt || (p3.gateType === 'harvest_words' ? 'Nhập 2 thuật ngữ / câu hỏi mới rút ra từ bài đọc.' : 'Viết câu áp dụng điều vừa đọc.')}</p>
                        {p3.gateType === 'harvest_words' ? (
                            <div className="space-y-2">
                                {harvest.map((h, i) => (
                                    <div key={i} className="grid sm:grid-cols-2 gap-2">
                                        <input aria-label={'Thuật ngữ hoặc câu hỏi ' + (i + 1)} value={h.term} maxLength={400} onChange={(e) => setHarvest(harvest.map((x, j) => j === i ? Object.assign({}, x, { term: e.target.value }) : x))} placeholder="Thuật ngữ / câu hỏi" className="field" />
                                        <input aria-label={'Nghĩa hoặc đáp án ' + (i + 1)} value={h.meaning} maxLength={1500} onChange={(e) => setHarvest(harvest.map((x, j) => j === i ? Object.assign({}, x, { meaning: e.target.value }) : x))} placeholder="Nghĩa / đáp án" className="field" />
                                    </div>
                                ))}
                                <div className="flex flex-wrap gap-2 pt-1">
                                    <button type="button" className="btn btn-ghost btn-sm" onClick={() => setHarvest(harvest.concat({ term: '', meaning: '' }))}><Icon name="plus" size={14} /> Thêm dòng</button>
                                    <button type="button" className="btn btn-primary ml-auto" onClick={submitHarvest}>Nạp vào kho & chốt ca</button>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-2">
                                {sentences.map((s, i) => (
                                    <textarea key={i} aria-label={'Câu ' + (i + 1)} value={s} maxLength={500} onChange={(e) => setSentences(sentences.map((x, j) => j === i ? e.target.value : x))} rows={3} placeholder={'Câu ' + (i + 1) + ' bằng tiếng Anh'} className="field py-2" />
                                ))}
                                <button type="button" disabled={busy} onClick={submitSentences} className="btn btn-primary">{busy ? 'AI đang chấm…' : 'Gửi câu để AI chấm'}</button>
                            </div>
                        )}
                        {err && <p className="text-sm text-danger mt-3 text-flow" role="alert">{err}</p>}
                    </div>
                </div>
            );
        };

        /* ---------- Sửa lịch tuần: mọi thay đổi chỉ áp dụng từ 00:00 ngày mai ---------- */
        const PlanEditor = ({ week, nextWeek, groups, onSave, toast }) => {
            const base = Plan.isValidWeek(nextWeek) ? nextWeek : week;
            const [draft, setDraft] = useState(() => (base ? JSON.parse(JSON.stringify(base)) : null));
            const [day, setDay] = useState(() => { const d = new Date(); d.setDate(d.getDate() + 1); return Plan.weekdayOf(d); });
            const fileRef = useRef(null);
            const keys = groups.map(([k]) => k);
            if (!draft) return null;
            const slots = draft.days[day] || [];
            const edit = (id, fn) => setDraft(Object.assign({}, draft, { days: Object.assign({}, draft.days, { [day]: slots.map(s => (s.id === id ? fn(s) : s)) }) }));

            const exportPlan = () => downloadBlob(new Blob([JSON.stringify(draft, null, 2)], { type: 'application/json' }), 'ke-hoach-tuan.json');
            const importPlan = async (file) => {
                try {
                    const data = Sec.safeJSONParse(await Sec.readText(file, 512 * 1024), 512 * 1024);
                    if (!Plan.isValidWeek(data)) { toast('File chưa đủ 7 ngày, mỗi ngày 3 ca', 'error'); return; }
                    const w = Plan.normWeek(data);
                    setDraft(w);
                    onSave(w);
                } catch (e) {
                    toast(e.message || 'Không đọc được file', 'error');
                }
            };

            return (
                <div className="text-left mt-4 card p-5 space-y-4">
                    <p className="text-sm text-muted flex items-start gap-2"><Icon name="lock" size={16} className="mt-0.5" /> Khóa plan trong ngày: sửa giờ, nhóm, thêm việc chỉ có hiệu lực từ 00:00 ngày mai. Hôm nay giữ nguyên.</p>
                    <div className="flex flex-wrap gap-1" role="tablist" aria-label="Ngày">
                        {Plan.WEEK.map(k => <button type="button" role="tab" aria-selected={day === k} key={k} onClick={() => setDay(k)} className="tab">{Plan.WEEK_LABEL[k]}</button>)}
                    </div>
                    {slots.map(s => {
                        const p1 = s.phase1_inApp || {};
                        const p2 = s.phase2_externalTask || {};
                        const p3 = s.phase3_verificationGate || {};
                        return (
                            <fieldset key={s.id} className={'border border-line rounded-xl p-3 space-y-2 ' + (s.nghi ? 'bg-surface2' : '')}>
                                <legend className="sr-only">Ca {s.id}</legend>
                                <div className="flex flex-wrap items-center justify-between gap-2">
                                    <span className="text-sm font-semibold">Ca {s.id} · {s.time} · {s.anchorLabel}</span>
                                    <button type="button" aria-pressed={!!s.nghi} onClick={() => edit(s.id, x => Object.assign({}, x, { nghi: !x.nghi }))} className={'btn btn-sm ' + (s.nghi ? 'btn-primary' : 'btn-secondary')}>{s.nghi ? 'Bỏ nghỉ' : 'Nghỉ ca này'}</button>
                                </div>
                                {s.nghi ? <p className="text-sm text-muted">Ca này nghỉ. Không nhắc giờ và không mở thẻ.</p> : (
                                    <div className="space-y-2">
                                        <label className="block"><span className="label">Nhóm học</span>
                                            <select value={Sch.matchGroup(p1.group, keys)} onChange={(e) => edit(s.id, x => Object.assign({}, x, { group: e.target.value, phase1_inApp: Object.assign({}, p1, { group: e.target.value }) }))} className="field">
                                                <option value="all">Tất cả</option>
                                                {groups.filter(([k]) => k !== '__none').map(([k, n]) => <option key={k} value={k}>{k} ({n})</option>)}
                                            </select>
                                        </label>
                                        <div className="grid sm:grid-cols-4 gap-2">
                                            <label><span className="label">Giờ</span><input type="time" value={s.time} onChange={(e) => edit(s.id, x => Object.assign({}, x, { time: e.target.value }))} className="field" /></label>
                                            <label><span className="label">Nhãn</span><input value={s.anchorLabel} maxLength={60} onChange={(e) => edit(s.id, x => Object.assign({}, x, { anchorLabel: e.target.value }))} className="field" /></label>
                                            <label><span className="label">Kiểu học</span>
                                                <select value={p1.mode || 'flashcard'} onChange={(e) => edit(s.id, x => Object.assign({}, x, { phase1_inApp: Object.assign({}, p1, { mode: e.target.value }) }))} className="field">
                                                    {Plan.SLOT_MODES.map(m => <option key={m} value={m}>{Plan.MODE_LABEL[m]}</option>)}
                                                </select>
                                            </label>
                                            <label><span className="label">Số thẻ</span><input type="number" min="1" max="40" value={p1.cardCount || 8} onChange={(e) => edit(s.id, x => Object.assign({}, x, { phase1_inApp: Object.assign({}, p1, { cardCount: Number(e.target.value) || 1 }) }))} className="field" /></label>
                                        </div>
                                        <div className="grid sm:grid-cols-3 gap-2">
                                            <label className="sm:col-span-2"><span className="label">Sách ngoài đời (để trống nếu chỉ học app)</span><input value={p2.bookTitle || ''} maxLength={120} onChange={(e) => edit(s.id, x => Object.assign({}, x, { phase2_externalTask: Object.assign({}, p2, { hasExternal: !!e.target.value.trim(), bookTitle: e.target.value, durationMinutes: p2.durationMinutes || 25 }) }))} className="field" /></label>
                                            <label><span className="label">Phút đọc</span><input type="number" min="5" max="180" value={p2.durationMinutes || 25} onChange={(e) => edit(s.id, x => Object.assign({}, x, { phase2_externalTask: Object.assign({}, p2, { durationMinutes: Number(e.target.value) || 25 }) }))} className="field" /></label>
                                        </div>
                                        <label className="block"><span className="label">Việc cần làm với sách</span><input value={p2.taskDetail || ''} maxLength={300} onChange={(e) => edit(s.id, x => Object.assign({}, x, { phase2_externalTask: Object.assign({}, p2, { taskDetail: e.target.value }) }))} className="field" /></label>
                                        <div className="grid sm:grid-cols-3 gap-2">
                                            <label><span className="label">Cổng kiểm chứng</span>
                                                <select value={p3.gateType || 'sentence_creation'} onChange={(e) => edit(s.id, x => Object.assign({}, x, { phase3_verificationGate: Object.assign({}, p3, { gateType: e.target.value }) }))} className="field">
                                                    <option value="harvest_words">Nhập 2 thuật ngữ mới</option>
                                                    <option value="sentence_creation">Viết câu cho AI chấm</option>
                                                </select>
                                            </label>
                                            <label><span className="label">Số câu</span><input type="number" min="1" max="3" value={p3.sentenceCount || 1} onChange={(e) => edit(s.id, x => Object.assign({}, x, { phase3_verificationGate: Object.assign({}, p3, { sentenceCount: Number(e.target.value) || 1 }) }))} className="field" /></label>
                                            <label><span className="label">Lời nhắc cổng</span><input value={p3.prompt || ''} maxLength={300} onChange={(e) => edit(s.id, x => Object.assign({}, x, { phase3_verificationGate: Object.assign({}, p3, { prompt: e.target.value }) }))} className="field" /></label>
                                        </div>
                                        <label className="block"><span className="label">Ghi chú lớp</span><input value={p2.classSyncNote || ''} maxLength={200} onChange={(e) => edit(s.id, x => Object.assign({}, x, { phase2_externalTask: Object.assign({}, p2, { classSyncNote: e.target.value }) }))} className="field" /></label>
                                    </div>
                                )}
                            </fieldset>
                        );
                    })}
                    <div className="flex flex-wrap gap-2">
                        <button type="button" onClick={() => onSave(draft)} className="btn btn-primary"><Icon name="calendar" /> Lưu cho ngày mai</button>
                        <button type="button" onClick={exportPlan} className="btn btn-secondary"><Icon name="download" /> Xuất JSON</button>
                        <button type="button" onClick={() => fileRef.current && fileRef.current.click()} className="btn btn-secondary"><Icon name="upload" /> Nhập JSON</button>
                        <input ref={fileRef} type="file" accept="application/json,.json" className="hidden" onChange={(e) => { if (e.target.files && e.target.files[0]) importPlan(e.target.files[0]); e.target.value = ''; }} />
                    </div>
                </div>
            );
        };

        /* ---------- Hôm nay ---------- */
        const TodayView = (p) => {
            const { plan, planReady, week, nextWeek, now, items, itemsById, groups, session, cur, minimal, setMinimal, saveWeek, addItems, finishGate, snooze, enterEarly, askNotify, bonus, closeSession, startSession, review, patch, toast, finishSlot, openLibrary } = p;
            const [editOpen, setEditOpen] = useState(false);
            if (!planReady || !plan) return <p className="text-center text-muted py-16">Đang mở ngày hôm nay…</p>;

            const active = plan.slots.filter(s => !s.nghi);
            const doneCount = active.filter(s => s.status === 'done').length;
            const nowD = new Date(now);
            const msUntil = (slot) => { const d = new Date(nowD); d.setHours(0, 0, 0, 0); return Math.max(0, d.getTime() + Plan.triggerMin(slot) * 60000 - nowD.getTime()); };
            const statusLine = active.length > 0 && doneCount < active.length
                ? <p className="text-center text-sm text-muted mb-4">Hôm nay chưa xong · đã hoàn thành {doneCount}/{active.length} việc</p> : null;
            const editor = (
                <div className="mt-8 text-center">
                    <button type="button" onClick={() => setEditOpen(v => !v)} aria-expanded={editOpen} className="btn btn-ghost btn-sm"><Icon name="calendar" size={14} /> Sửa lịch tuần</button>
                    {editOpen && <PlanEditor week={week} nextWeek={nextWeek} groups={groups} onSave={saveWeek} toast={toast} />}
                </div>
            );

            const renderSession = () => {
                if (session.mode === 'burst') {
                    return (
                        <BurstSession key={session.id} itemsById={itemsById} ids={session.ids} title={session.title} subtitle={session.slotId ? 'Pha 1 · Băng đạn 5 câu' : 'Băng đạn 5 câu'}
                            onReview={(id, ok) => review(id, ok)} toast={toast}
                            onFinish={(st) => { if (session.slotId) finishSlot({ slotId: session.slotId, cardsDone: st.total, remembered: st.firstTryCorrect }); }}
                            renderDone={session.slotId ? () => null : undefined} onExit={session.slotId ? undefined : closeSession} />
                    );
                }
                return <FlashSession key={session.id} items={items} session={session} onReview={review} onPatch={patch} onFinish={finishSlot} onClose={closeSession} onRestart={startSession} toast={toast} />;
            };

            if (cur.kind === 'ALL_DONE') {
                const total = plan.slots.reduce((a, s) => a + (s.cardsDone || 0), 0);
                const kept = plan.slots.reduce((a, s) => a + (s.remembered || 0), 0);
                const receipt = [
                    'Phiếu hoàn thành ' + plan.date + ' · ' + (Plan.WEEK_LABEL[plan.dayKey] || ''),
                    ...plan.slots.map(s => {
                        if (s.nghi) return s.id + '. Nghỉ · ' + s.anchorLabel;
                        const at = s.finishedAt ? new Date(s.finishedAt) : null;
                        const hhmm = at ? Plan.hhmmOf(at.getHours() * 60 + at.getMinutes()) : s.time;
                        const book = s.phase2_externalTask && s.phase2_externalTask.hasExternal ? ' · ' + s.phase2_externalTask.bookTitle : '';
                        return s.id + '. ' + hhmm + ' · ' + s.anchorLabel + ' · ' + (Plan.MODE_LABEL[s.mode] || s.mode) + ' · ' + Sch.groupLabel(s.group) + ' · ' + (s.cardsDone || 0) + ' thẻ' + book;
                    }),
                    'Tổng: ' + total + ' lượt thẻ, ' + kept + ' câu/từ đã nạp vào não'
                ].join('\n');
                return (
                    <div className="max-w-xl mx-auto text-center">
                        <DayStrip dayKey={plan.dayKey} />
                        <div className="card p-6 sm:p-8 enter">
                            <div className="mx-auto w-14 h-14 rounded-2xl bg-success text-white flex items-center justify-center mb-4"><Icon name="check" size={28} /></div>
                            <h2 className="text-3xl font-bold">Hôm nay xong</h2>
                            <p className="text-ink2 mt-2">Điểm dừng rõ ràng. Không nợ thẻ sang ngày mai.</p>
                            <div className="grid grid-cols-2 gap-3 mt-6">
                                <div className="rounded-xl bg-primary-soft p-4"><p className="text-3xl font-bold text-primary tnum">{total}</p><p className="text-sm text-ink2">lượt thẻ đã xử lý</p></div>
                                <div className="rounded-xl bg-success-soft p-4"><p className="text-3xl font-bold text-success tnum">{kept}</p><p className="text-sm text-ink2">câu / từ đã nạp vào não</p></div>
                            </div>
                            <div className="flex flex-wrap justify-center gap-2 mt-6">
                                <button type="button" className="btn btn-primary" onClick={() => copyText(receipt).then(() => toast('Đã copy phiếu hoàn thành', 'success')).catch(() => toast('Trình duyệt chặn clipboard', 'error'))}><Icon name="copy" /> Copy phiếu hoàn thành</button>
                                <button type="button" className="btn btn-secondary" onClick={bonus}>Còn hứng? Thêm 5 thẻ ngoài lịch</button>
                            </div>
                        </div>
                        {session && !session.slotId && <div className="mt-6 text-left">{renderSession()}</div>}
                        {editor}
                    </div>
                );
            }

            const slot = cur.slot;
            if (!slot) return <p className="text-center text-muted py-16">Đang mở ngày hôm nay…</p>;
            const p2 = slot.phase2_externalTask || {};

            if (cur.kind === 'GATE') {
                return (
                    <div className="max-w-xl mx-auto">
                        <DayStrip dayKey={plan.dayKey} />
                        <SlotTrack slots={plan.slots} activeId={slot.id} />
                        <FlowBridge slot={slot} items={items} addItems={addItems} finishGate={finishGate} toast={toast} now={now} />
                    </div>
                );
            }

            const inSession = session && session.slotId === slot.id;
            if (inSession) {
                return (
                    <div className="max-w-3xl mx-auto">
                        <SlotTrack slots={plan.slots} activeId={slot.id} />
                        <div className="flex flex-wrap items-center justify-center gap-2 mb-4">
                            <span className="chip bg-surface2 text-ink2">Pha 1 · {session.ids.length} thẻ · {Sch.groupLabel(slot.group)}</span>
                            {cur.kind === 'LATE_RECOVERY' && <span className="chip bg-warn-soft text-warn"><Icon name="alert" size={12} /> Trễ giờ · rút gọn còn {session.ids.length} thẻ</span>}
                            {cur.kind === 'ON_TIME_ACTIVE' && !slot.snoozedOnce && <button type="button" onClick={() => snooze(slot.id)} className="btn btn-ghost btn-sm"><Icon name="clock" size={14} /> Đang dở tay — Lùi 15 phút (1 lần)</button>}
                            {cur.kind === 'LATE_RECOVERY' && !minimal && <button type="button" onClick={() => setMinimal(true)} className="btn btn-secondary btn-sm"><Icon name="zap" size={14} /> Nút chạm đáy: 2 thẻ trong 30 giây</button>}
                        </div>
                        {renderSession()}
                    </div>
                );
            }

            if (cur.kind === 'ON_TIME_ACTIVE' || cur.kind === 'LATE_RECOVERY') {
                return (
                    <div className="max-w-xl mx-auto text-center py-8">
                        <DayStrip dayKey={plan.dayKey} />
                        {statusLine}
                        <Empty icon="layers" title={'Ca ' + slot.id + ' · ' + slot.anchorLabel + ' chưa có thẻ'}>Nhóm "{Sch.groupLabel(slot.group)}" đang trống.</Empty>
                        <button type="button" onClick={openLibrary} className="btn btn-primary">Mở kho để thêm thẻ vào nhóm này</button>
                        {editor}
                    </div>
                );
            }

            const perm = window.Notification ? Notification.permission : 'denied';
            return (
                <div className="max-w-xl mx-auto text-center py-4">
                    <DayStrip dayKey={plan.dayKey} />
                    {plan.slots.some(s => s.dienTam) && <p className="text-sm text-warn mb-4 text-flow">Một vài phần sách hôm nay đang là buổi ôn tạm. Sửa lịch ngày mai nếu khác.</p>}
                    <SlotTrack slots={plan.slots} activeId={slot.id} />
                    {statusLine}
                    <div className="card p-6 sm:p-8">
                        <p className="text-xs font-semibold uppercase tracking-wider text-muted mb-3">Ca {slot.id} · {Plan.MODE_LABEL[slot.mode]} · {slot.baseCardCount} thẻ</p>
                        <div className="tnum text-6xl font-semibold tracking-tight mb-3" role="timer" aria-label="Thời gian tới ca tiếp theo">{Plan.fmtCountdown(msUntil(slot))}</div>
                        <p className="text-xl font-semibold">{Plan.hhmmOf(Plan.triggerMin(slot))} · {slot.anchorLabel}</p>
                        <p className="text-ink2 mt-1 text-flow">{Sch.groupLabel(slot.group)}</p>
                        <p className="text-sm text-muted mt-3 text-flow">{p2.hasExternal ? (p2.bookTitle + ' — ' + p2.taskDetail) : (p2.classSyncNote || 'Ca này chỉ học trên app')}</p>
                        <p className="text-xs text-muted mt-4">Đến giờ, thẻ s1 tự bung lên — không cần bấm Bắt đầu. Có thể treo tab cả ngày.</p>
                        <div className="mt-5 flex flex-wrap justify-center gap-2">
                            {cur.early && <button type="button" onClick={() => enterEarly(slot)} className="btn btn-secondary"><Icon name="play" /> Vào làm sớm ca này</button>}
                            {perm === 'default' && <button type="button" onClick={askNotify} className="btn btn-ghost"><Icon name="bell" /> Bật thông báo khi đến giờ</button>}
                        </div>
                    </div>
                    {editor}
                </div>
            );
        };

        /* ---------- Import / Paste / Edit dialogs ---------- */
        const ImportDialog = ({ batches, existingCount, onConfirm, onClose }) => {
            const single = batches.length === 1;
            const [group, setGroup] = useState(single ? (batches[0].defaultGroup || '') : '');
            const [mode, setMode] = useState('append');
            const all = batches.reduce((a, b) => a.concat(b.items), []);
            const vocab = all.filter(t => t.type === 'vocab').length;
            const ungrouped = all.filter(t => !t.group).length;
            const confirmIt = () => {
                const out = [];
                batches.forEach(b => {
                    const g = single ? Sec.cleanText(group, 80) : b.defaultGroup;
                    b.items.forEach(t => out.push(t.group || !g ? t : Object.assign({}, t, { group: g })));
                });
                onConfirm({ items: out, mode });
            };
            return (
                <Modal title={'Nhập ' + all.length + ' mục'} onClose={onClose}
                    footer={<><button type="button" className="btn btn-secondary" onClick={onClose}>Hủy</button><button type="button" className={'btn ' + (mode === 'replace' ? 'btn-danger' : 'btn-primary')} onClick={confirmIt} disabled={!all.length}>{mode === 'replace' ? 'Ghi đè ' + existingCount + ' mục cũ' : 'Nối tiếp vào kho'}</button></>}>
                    <div className="flex flex-wrap gap-2 mb-4">
                        <span className="chip bg-primary-soft text-primary">{vocab} từ vựng</span>
                        <span className="chip bg-surface2 text-ink2">{all.length - vocab} trắc nghiệm</span>
                        {!single && batches.map((b, i) => <span key={i} className="chip bg-surface2 text-ink2">{b.label}: {b.items.length}</span>)}
                    </div>
                    {single && ungrouped > 0 && (
                        <label className="block mb-4"><span className="label">Gắn nhóm cho {ungrouped} mục chưa có nhóm</span><input value={group} maxLength={80} onChange={(e) => setGroup(e.target.value)} className="field" data-autofocus /></label>
                    )}
                    {!single && <p className="text-sm text-muted mb-4">Mục chưa có nhóm sẽ được gắn theo tên file.</p>}
                    {existingCount > 0 && (
                        <fieldset>
                            <legend className="label">Cách nhập</legend>
                            <div className="grid sm:grid-cols-2 gap-2">
                                {[['append', 'Nối tiếp', 'Giữ ' + existingCount + ' mục cũ'], ['replace', 'Ghi đè', 'Xóa toàn bộ kho cũ']].map(([k, l, d]) => (
                                    <label key={k} className={'rounded-xl border-2 p-3 cursor-pointer ' + (mode === k ? (k === 'replace' ? 'border-danger bg-danger-soft' : 'border-primary bg-primary-soft') : 'border-line')}>
                                        <input type="radio" name="import-mode" className="sr-only" checked={mode === k} onChange={() => setMode(k)} />
                                        <span className="font-semibold block">{l}</span><span className="text-xs text-ink2">{d}</span>
                                    </label>
                                ))}
                            </div>
                        </fieldset>
                    )}
                    <p className="text-xs text-muted mt-4 flex items-start gap-1.5"><Icon name="shield" size={14} className="mt-0.5" /> Dữ liệu đã được kiểm schema, cắt độ dài và hiển thị dạng văn bản thuần — mã HTML/script trong file không thể chạy.</p>
                </Modal>
            );
        };

        const PasteCodeDialog = ({ onParsed, onClose, toast }) => {
            const [code, setCode] = useState('');
            const parse = () => {
                try {
                    const s = code.trim();
                    if (!s) return;
                    if (s.length > Sec.LIMITS.shareCodeChars) throw new Error('Mã chia sẻ quá lớn');
                    const json = b64DecodeUtf8(s.indexOf('EDU2:') === 0 ? s.slice(5) : s);
                    const data = Sec.safeJSONParse(json, Sec.LIMITS.shareCodeChars);
                    const items = Sch.itemsFromJSON(data).map(t => Object.assign({}, t, { id: Sch.newId('it') })).filter(Sch.isFilled);
                    if (!items.length) throw new Error('Mã không có mục nào');
                    onParsed([{ label: 'Mã chia sẻ', items, defaultGroup: 'Nhóm mới' }]);
                } catch (e) {
                    toast(e.message && e.message.length < 120 ? 'Mã không hợp lệ: ' + e.message : 'Mã không hợp lệ', 'error');
                }
            };
            return (
                <Modal title="Dán mã chia sẻ" onClose={onClose} footer={<><button type="button" className="btn btn-secondary" onClick={onClose}>Hủy</button><button type="button" className="btn btn-primary" onClick={parse} disabled={!code.trim()}>Đọc mã</button></>}>
                    <textarea value={code} onChange={(e) => setCode(e.target.value)} rows={7} className="field py-2 tnum text-xs" placeholder="EDU2:eyJ2Ijoy…" aria-label="Mã chia sẻ" data-autofocus />
                </Modal>
            );
        };

        const ShareCodeDialog = ({ code, onClose }) => (
            <Modal title="Mã chia sẻ" onClose={onClose} footer={<button type="button" className="btn btn-primary" onClick={onClose}>Xong</button>}>
                <p className="text-sm text-ink2 mb-2">Trình duyệt chặn copy tự động. Chọn toàn bộ và copy thủ công:</p>
                <textarea readOnly value={code} rows={7} className="field py-2 tnum text-xs" onFocus={(e) => e.target.select()} data-autofocus aria-label="Mã chia sẻ" />
                <p className="text-xs text-muted mt-2">Mã chỉ chứa nội dung học. API key và tiến độ cá nhân đã được loại bỏ.</p>
            </Modal>
        );

        const ItemEditor = ({ item, groups, onSave, onClose, onStudy, onAI, aiBusy }) => {
            const [d, setD] = useState(() => Object.assign({}, item, { keywordsText: (item.keywords || []).join(', ') }));
            const set = (k, v) => setD(x => Object.assign({}, x, { [k]: v }));
            const mcq = d.type === 'mcq';
            const save = () => {
                const out = Sch.normalizeItem(Object.assign({}, d, { keywords: d.keywordsText, options: mcq ? d.options : [] }), { source: item.source });
                onSave(Object.assign({}, item, out, { id: item.id }));
            };
            return (
                <Modal title={mcq ? 'Sửa câu trắc nghiệm' : 'Sửa từ vựng'} size="lg" onClose={onClose}
                    footer={<>
                        <button type="button" className="btn btn-ghost mr-auto" onClick={() => onStudy(item)}><Icon name="play" /> Học mục này</button>
                        <button type="button" className="btn btn-secondary" onClick={() => onAI(item)} disabled={aiBusy}><Icon name="sparkles" /> {aiBusy ? 'AI…' : mcq ? 'AI giải thích' : 'AI bổ sung'}</button>
                        <button type="button" className="btn btn-secondary" onClick={onClose}>Hủy</button>
                        <button type="button" className="btn btn-primary" onClick={save}>Lưu</button>
                    </>}>
                    <div className="grid sm:grid-cols-3 gap-3">
                        <label><span className="label">Loại</span>
                            <select className="field" value={d.type} onChange={(e) => setD(x => Object.assign({}, x, { type: e.target.value, options: e.target.value === 'mcq' ? (x.options && x.options.length ? x.options : ['', '', '', '']) : [], answerOrMeaning: e.target.value === 'mcq' ? 'A' : '' }))}>
                                <option value="vocab">Từ vựng</option><option value="mcq">Trắc nghiệm</option>
                            </select>
                        </label>
                        <label><span className="label">Nhóm</span><input className="field" list="group-list" value={d.group} maxLength={80} onChange={(e) => set('group', e.target.value)} /></label>
                        <label><span className="label">Chặng</span>
                            <select className="field" value={d.checkpoint} onChange={(e) => set('checkpoint', Number(e.target.value))}><option value={1}>1</option><option value={2}>2</option><option value={3}>3</option></select>
                        </label>
                    </div>
                    <datalist id="group-list">{groups.filter(([k]) => k !== '__none').map(([k]) => <option key={k} value={k} />)}</datalist>
                    <label className="block mt-3"><span className="label">{mcq ? 'Câu hỏi' : 'Từ / cụm từ tiếng Anh'}</span>
                        <textarea className="field py-2" rows={mcq ? 3 : 1} value={d.questionOrWord} maxLength={mcq ? 1500 : 400} onChange={(e) => set('questionOrWord', e.target.value)} data-autofocus />
                    </label>
                    {mcq ? (
                        <fieldset className="mt-3">
                            <legend className="label">Lựa chọn — bấm chữ cái để chọn đáp án đúng</legend>
                            <div className="space-y-2">
                                {[0, 1, 2, 3].map(i => (
                                    <div key={i} className="flex gap-2 items-start">
                                        <button type="button" aria-pressed={d.answerOrMeaning === Sch.LETTERS[i]} onClick={() => set('answerOrMeaning', Sch.LETTERS[i])} className={'btn btn-icon shrink-0 ' + (d.answerOrMeaning === Sch.LETTERS[i] ? 'btn-success' : 'btn-secondary')} aria-label={'Chọn ' + Sch.LETTERS[i] + ' là đáp án đúng'}>{Sch.LETTERS[i]}</button>
                                        <textarea className="field py-2" rows={1} maxLength={500} value={(d.options || [])[i] || ''} onChange={(e) => set('options', [0, 1, 2, 3].map(j => (j === i ? e.target.value : ((d.options || [])[j] || ''))))} aria-label={'Lựa chọn ' + Sch.LETTERS[i]} />
                                    </div>
                                ))}
                            </div>
                        </fieldset>
                    ) : (
                        <div className="grid sm:grid-cols-3 gap-3 mt-3">
                            <label><span className="label">Từ loại</span><input className="field" value={d.wordType} maxLength={24} onChange={(e) => set('wordType', e.target.value)} placeholder="n / v / adj…" /></label>
                            <label><span className="label">IPA</span><input className="field" value={d.ipa} maxLength={80} onChange={(e) => set('ipa', e.target.value)} placeholder="/əˈkaʊntənt/" /></label>
                            <label><span className="label">Nghĩa tiếng Việt</span><input className="field" value={d.answerOrMeaning} maxLength={1500} onChange={(e) => set('answerOrMeaning', e.target.value)} /></label>
                        </div>
                    )}
                    <label className="block mt-3"><span className="label">{mcq ? 'Giải thích' : 'Câu ví dụ (EN)'}</span><textarea className="field py-2" rows={2} maxLength={2500} value={d.explanationOrExample} onChange={(e) => set('explanationOrExample', e.target.value)} /></label>
                    {!mcq && <label className="block mt-3"><span className="label">Dịch câu ví dụ</span><textarea className="field py-2" rows={1} maxLength={1500} value={d.exampleVi} onChange={(e) => set('exampleVi', e.target.value)} /></label>}
                    <label className="block mt-3"><span className="label">Từ khóa ăn điểm (phím H) — cách nhau bằng dấu phẩy</span><input className="field" value={d.keywordsText} maxLength={1200} onChange={(e) => set('keywordsText', e.target.value)} /></label>
                    <div className="grid grid-cols-4 gap-2 mt-4 text-center">
                        {[['Đúng', item.correctCount, 'text-success'], ['Sai', item.wrongCount, 'text-danger'], ['Lần ôn', item.reviewCount, 'text-primary'], ['Phát âm', item.pronounceCount, 'text-ink2']].map(([l, v, c]) => (
                            <div key={l} className="rounded-xl bg-surface2 p-2"><p className={'text-xl font-bold tnum ' + c}>{v || 0}</p><p className="text-xs text-ink2">{l}</p></div>
                        ))}
                    </div>
                    {Sch.reviewNote(item) && <p className="text-sm text-muted mt-2">Lịch ôn: {Sch.reviewNote(item)}</p>}
                </Modal>
            );
        };

        /* ---------- Quick Paste ---------- */
        const QuickPaste = ({ groups, onAdd, toast }) => {
            const [text, setText] = useState('');
            const [group, setGroup] = useState('');
            const [preview, setPreview] = useState(null);
            const [busy, setBusy] = useState(false);
            const parseLocal = () => {
                const list = Sch.parseQuickPaste(text, group.trim());
                if (!list.length) { toast('Chưa tách được mục nào. Thử định dạng "word - nghĩa" hoặc câu có A. B. C. D.', 'info'); return; }
                setPreview(list);
            };
            const parseAI = async () => {
                if (!AI.ready()) { toast('AI chỉ chạy khi mở trang qua web, không mở file trực tiếp.', 'info'); return; }
                if (text.length > Sec.LIMITS.aiPasteChars) toast('Văn bản dài, AI chỉ đọc ' + Sec.LIMITS.aiPasteChars + ' ký tự đầu', 'info');
                setBusy(true);
                try {
                    const list = await AI.structurePaste(text, group.trim());
                    if (!list.length) toast('AI không tìm thấy mục nào', 'info');
                    else setPreview(list);
                } catch (e) {
                    toast(e.message, 'error');
                } finally {
                    setBusy(false);
                }
            };
            return (
                <section className="card p-4 sm:p-5 mb-4" aria-labelledby="qp-title">
                    <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <h3 id="qp-title" className="font-semibold flex items-center gap-2"><Icon name="clipboard" /> Ô nhập thông minh</h3>
                        <span className="text-xs text-muted">Dán danh sách từ hoặc cả đoạn câu hỏi trắc nghiệm</span>
                    </div>
                    {!preview ? (
                        <>
                            <textarea value={text} onChange={(e) => setText(e.target.value)} rows={6} maxLength={Sec.LIMITS.pasteChars} className="field py-2 font-mono text-[13px]" aria-label="Văn bản cần tách"
                                placeholder={'accountant - kế toán viên\nresign (v) - nghỉ việc\n\n1. Which testing technique is based on the specification?\nA. White-box\nB. Black-box\nC. Static analysis\nD. Code review\nĐáp án: B'} />
                            <div className="flex flex-wrap items-end gap-2 mt-3">
                                <label className="flex-1 min-w-[180px]"><span className="label">Nhóm</span><input className="field" list="qp-groups" value={group} maxLength={80} onChange={(e) => setGroup(e.target.value)} placeholder="Unit 1 - Jobs / SWT301 Ch.2" /></label>
                                <datalist id="qp-groups">{groups.filter(([k]) => k !== '__none').map(([k]) => <option key={k} value={k} />)}</datalist>
                                <button type="button" className="btn btn-secondary" onClick={parseLocal} disabled={!text.trim()}><Icon name="list" /> Tách nhanh</button>
                                <button type="button" className="btn btn-primary" onClick={parseAI} disabled={!text.trim() || busy}><Icon name="sparkles" /> {busy ? 'AI đang điền…' : 'AI điền tất cả'}</button>
                            </div>
                        </>
                    ) : (
                        <>
                            <p className="text-sm text-ink2 mb-2">Xem trước {preview.length} mục — bỏ mục sai trước khi thêm:</p>
                            <ul className="max-h-80 overflow-y-auto space-y-2 pr-1">
                                {preview.map(t => (
                                    <li key={t.id} className="rounded-xl border border-line p-3 flex gap-3 items-start">
                                        <span className={'chip shrink-0 ' + (t.type === 'mcq' ? 'bg-surface2 text-ink2' : 'bg-primary-soft text-primary')}>{t.type === 'mcq' ? 'MCQ' : 'Từ'}</span>
                                        <div className="min-w-0 flex-1 text-sm">
                                            <p className="font-semibold text-flow">{t.questionOrWord} {t.ipa && <span className="font-normal text-ink2">{t.ipa}</span>}</p>
                                            <p className="text-ink2 text-flow">{t.type === 'mcq' ? (t.answerOrMeaning ? t.answerOrMeaning + '. ' + Sch.correctText(t) : 'Chưa có đáp án') : (t.answerOrMeaning || 'Chưa có nghĩa')}</p>
                                            {t.keywords.length > 0 && <div className="flex flex-wrap gap-1 mt-1">{t.keywords.map(k => <span key={k} className="chip bg-warn-soft text-warn">{k}</span>)}</div>}
                                        </div>
                                        <button type="button" className="btn btn-ghost btn-sm btn-icon" onClick={() => setPreview(preview.filter(x => x.id !== t.id))} aria-label="Bỏ mục này"><Icon name="x" size={14} /></button>
                                    </li>
                                ))}
                            </ul>
                            <div className="flex flex-wrap gap-2 mt-3">
                                <button type="button" className="btn btn-secondary" onClick={() => setPreview(null)}><Icon name="back" /> Sửa văn bản</button>
                                <button type="button" className="btn btn-primary" disabled={!preview.length} onClick={() => { onAdd(preview); setPreview(null); setText(''); }}><Icon name="plus" /> Thêm {preview.length} mục vào kho</button>
                            </div>
                        </>
                    )}
                </section>
            );
        };

        /* ---------- Kho của tôi (bảng) ---------- */
        const LibraryView = ({ items, setItems, groups, groupFilter, setGroupFilter, onPractice, onWeak, onStudyFrom, toast, mergeItems }) => {
            const [quick, setQuick] = useState(false);
            const [importBatches, setImportBatches] = useState(null);
            const [pasteOpen, setPasteOpen] = useState(false);
            const [shareCode, setShareCode] = useState(null);
            const [editing, setEditing] = useState(null);
            const [sel, setSel] = useState(() => new Set());
            const [bulkGroup, setBulkGroup] = useState('');
            const [search, setSearch] = useState('');
            const [typeFilter, setTypeFilter] = useState('all');
            const [shown, setShown] = useState(150);
            const [aiAll, setAiAll] = useState(null);
            const [aiRow, setAiRow] = useState(null);
            const anchor = useRef(0);
            const dragging = useRef(false);
            const fileRef = useRef(null);

            useEffect(() => {
                const up = () => { dragging.current = false; };
                window.addEventListener('mouseup', up);
                return () => window.removeEventListener('mouseup', up);
            }, []);
            useEffect(() => { setSel(new Set()); setShown(150); }, [groupFilter, typeFilter, search]);

            const q = search.trim().toLowerCase();
            const rows = items.filter(t => Sch.inGroup(t, groupFilter) && (typeFilter === 'all' || t.type === typeFilter) &&
                (!q || (t.questionOrWord || '').toLowerCase().indexOf(q) >= 0 || (t.answerOrMeaning || '').toLowerCase().indexOf(q) >= 0));
            const studyable = Sch.byGroup(items, groupFilter);
            const weakCount = studyable.filter(t => Sch.isWeak(t)).length;
            const mcqPool = asMcqPool(studyable);

            const update = (id, patch) => setItems(prev => prev.map(t => (t.id === id ? Object.assign({}, t, patch) : t)));
            const selectRange = (a, b) => { const lo = Math.min(a, b); const hi = Math.max(a, b); setSel(new Set(rows.slice(lo, hi + 1).map(r => r.id))); };
            const bulkSetGroup = (name) => { if (!sel.size) return; setItems(prev => prev.map(t => (sel.has(t.id) ? Object.assign({}, t, { group: name }) : t))); };
            const addRow = () => {
                const g = groupFilter !== 'all' && groupFilter !== '__none' ? groupFilter : '';
                setItems(prev => prev.concat(Sch.normalizeItem({ type: typeFilter === 'mcq' ? 'mcq' : 'vocab', group: g, options: typeFilter === 'mcq' ? ['', '', '', ''] : [] })));
            };
            const removeRow = (id) => { if (confirm('Xóa mục này?')) setItems(prev => prev.filter(t => t.id !== id)); };
            const removeSelected = () => { if (sel.size && confirm('Xóa ' + sel.size + ' mục đã chọn?')) { setItems(prev => prev.filter(t => !sel.has(t.id))); setSel(new Set()); } };

            const applyEnrich = (map) => setItems(prev => prev.map(t => {
                const e = map[t.id];
                if (!e) return t;
                return Object.assign({}, t, {
                    wordType: t.wordType || e.wordType,
                    answerOrMeaning: t.answerOrMeaning || e.answerOrMeaning,
                    explanationOrExample: t.explanationOrExample || e.explanationOrExample,
                    exampleVi: t.exampleVi || e.exampleVi,
                    ipa: e.ipa || t.ipa,
                    vietSub: Sch.ipaToVi(e.ipa || t.ipa) || t.vietSub,
                    keywords: t.keywords.length ? t.keywords : e.keywords
                });
            }));

            const aiOne = async (t) => {
                if (!AI.ready()) { toast('AI chỉ chạy khi mở trang qua web, không mở file trực tiếp.', 'info'); return; }
                if (!t.questionOrWord) { toast('Nhập nội dung trước đã', 'error'); return; }
                setAiRow(t.id);
                try {
                    if (t.type === 'mcq') {
                        const ex = await AI.explain(t);
                        if (ex && (!t.explanationOrExample || confirm('Thay lời giải hiện có bằng lời giải AI?'))) update(t.id, { explanationOrExample: ex });
                    } else {
                        applyEnrich(await AI.enrichVocab([t]));
                    }
                    toast('AI xong: ' + t.questionOrWord.slice(0, 40), 'success');
                } catch (e) {
                    toast(e.message, 'error');
                } finally {
                    setAiRow(null);
                }
            };

            const aiEverything = async () => {
                if (!AI.ready()) { toast('AI chỉ chạy khi mở trang qua web, không mở file trực tiếp.', 'info'); return; }
                const need = items.filter(t => t.type === 'vocab' && t.questionOrWord && (!t.ipa || !t.explanationOrExample || !t.answerOrMeaning));
                if (!need.length) { toast('Tất cả từ đã đủ thông tin', 'info'); return; }
                if (!confirm('AI bổ sung thông tin cho ' + need.length + ' từ?')) return;
                let done = 0;
                setAiAll({ done: 0, total: need.length });
                for (let i = 0; i < need.length; i += 10) {
                    const chunk = need.slice(i, i + 10);
                    try { applyEnrich(await AI.enrichVocab(chunk)); } catch (e) { toast(e.message, 'error'); break; }
                    done += chunk.length;
                    setAiAll({ done, total: need.length });
                }
                setAiAll(null);
                toast('AI đã xử lý ' + done + ' từ', 'success');
            };

            const exportJSON = () => {
                if (!items.length) return;
                const data = { format: 'fpass', version: 2, exportedAt: new Date().toISOString(), items: Sec.stripSecrets(items) };
                downloadBlob(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), 'kho-hoc-' + todayIso() + '.json');
                toast('Đã xuất ' + items.length + ' mục (không kèm API key)', 'success');
            };

            const exportExcel = () => {
                if (!items.length || !window.XLSX) return;
                const clean = Sec.stripSecrets(items);
                const data = [Sch.EXCEL_HEADERS].concat(clean.map(Sch.toExcelRow));
                const ws = XLSX.utils.aoa_to_sheet(data);
                ws['!cols'] = [6, 10, 22, 7, 50, 9, 16, 28, 28, 28, 28, 30, 50, 40, 30, 16, 7, 7, 8].map(w => ({ wch: w }));
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Kho học');
                XLSX.writeFile(wb, 'kho-hoc-' + todayIso() + '.xlsx');
                toast('Đã xuất Excel ' + items.length + ' mục', 'success');
            };

            const makeShareCode = () => {
                if (!items.length) return;
                const payload = { v: 2, items: Sec.stripSecrets(rows.filter(Sch.isFilled).map(Sch.toShareable)) };
                const code = 'EDU2:' + b64EncodeUtf8(JSON.stringify(payload));
                if (code.length > Sec.LIMITS.shareCodeChars) { toast('Kho quá lớn để tạo mã. Lọc theo nhóm rồi tạo mã.', 'error'); return; }
                copyText(code).then(() => toast('Đã copy mã chia sẻ ' + payload.items.length + ' mục (đang lọc)', 'success')).catch(() => setShareCode(code));
            };

            const readFiles = async (files) => {
                const batches = [];
                for (const f of files) {
                    const name = Sec.cleanText(f.name, 120);
                    const label = name.replace(/\.(json|xlsx|xls|csv)$/i, '').replace(/[_]+/g, ' ').trim() || 'Nhóm mới';
                    if (/\.json$/i.test(name)) {
                        const data = Sec.safeJSONParse(await Sec.readText(f));
                        batches.push({ label, defaultGroup: label, items: Sch.itemsFromJSON(data).filter(Sch.isFilled) });
                    } else if (/\.(xlsx|xls|csv)$/i.test(name)) {
                        if (!window.XLSX) throw new Error('Thư viện Excel chưa tải xong');
                        const wb = XLSX.read(await Sec.readBuffer(f), { type: 'array', cellFormula: false, cellHTML: false });
                        const rowsX = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
                        batches.push({ label, defaultGroup: label, items: Sch.fromExcelRows(rowsX) });
                    } else {
                        throw new Error('"' + name + '" không phải JSON / Excel');
                    }
                }
                const total = batches.reduce((n, b) => n + b.items.length, 0);
                Sec.guardCount(total, 0);
                if (!total) throw new Error('File không có mục hợp lệ');
                return batches;
            };

            const pickFiles = async (e) => {
                const files = Array.from(e.target.files || []);
                e.target.value = '';
                if (!files.length) return;
                try { setImportBatches(await readFiles(files)); } catch (err) { toast(err.message || 'File không hợp lệ', 'error'); }
            };

            const confirmImport = async ({ items: incoming, mode }) => {
                try {
                    Sec.guardCount(incoming.length, mode === 'replace' ? 0 : items.length);
                    const space = await Sec.ensureStorage(JSON.stringify(incoming).length * 2);
                    if (!space.ok) { toast('Bộ nhớ trình duyệt sắp đầy — hãy xuất JSON để sao lưu rồi xóa bớt.', 'error'); return; }
                    mergeItems(incoming, mode);
                    setImportBatches(null);
                    Store.requestPersist();
                    const g = Array.from(new Set(incoming.map(t => t.group).filter(Boolean)));
                    toast('Đã nhập ' + incoming.length + ' mục' + (g.length === 1 ? ' · nhóm "' + g[0] + '"' : ''), 'success');
                } catch (e) {
                    toast(e.message, 'error');
                }
            };

            return (
                <div>
                    <div className="flex flex-wrap items-start justify-between gap-3 mb-4">
                        <div>
                            <h1 className="text-xl font-bold">Kho của tôi</h1>
                            <p className="text-sm text-muted">{rows.length}/{items.length} mục · Từ vựng và câu hỏi chuyên ngành bạn tự ghi</p>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            <button type="button" onClick={() => setQuick(v => !v)} aria-expanded={quick} className={'btn ' + (quick ? 'btn-primary' : 'btn-secondary')}><Icon name="clipboard" /> Dán nhanh</button>
                            <button type="button" onClick={addRow} className="btn btn-secondary"><Icon name="plus" /> Thêm dòng</button>
                            <button type="button" onClick={aiEverything} disabled={!!aiAll || !items.length} className="btn btn-secondary"><Icon name="sparkles" /> {aiAll ? 'AI ' + aiAll.done + '/' + aiAll.total : 'AI bổ sung tất cả'}</button>
                        </div>
                    </div>

                    <FundPanel toast={toast} />

                    {quick && <QuickPaste groups={groups} toast={toast} onAdd={(list) => confirmImport({ items: list, mode: 'append' })} />}

                    <div className="card mb-4">
                        <div className="p-3 sm:p-4 flex flex-wrap gap-2 items-end border-b border-line">
                            <label className="min-w-[160px] flex-1 sm:flex-none"><span className="label">Nhóm</span>
                                <select value={groupFilter} onChange={(e) => setGroupFilter(e.target.value)} className="field">
                                    <option value="all">Tất cả nhóm ({items.length})</option>
                                    {groups.map(([k, n]) => <option key={k} value={k}>{Sch.groupLabel(k)} ({n})</option>)}
                                </select>
                            </label>
                            <label className="min-w-[130px]"><span className="label">Loại</span>
                                <select value={typeFilter} onChange={(e) => setTypeFilter(e.target.value)} className="field">
                                    <option value="all">Tất cả</option><option value="vocab">Từ vựng</option><option value="mcq">Trắc nghiệm</option>
                                </select>
                            </label>
                            <label className="flex-1 min-w-[180px]"><span className="label">Tìm</span>
                                <div className="relative"><Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-muted" /><input value={search} onChange={(e) => setSearch(e.target.value)} className="field pl-9" placeholder="Từ, câu hỏi, nghĩa…" /></div>
                            </label>
                        </div>
                        <div className="p-3 sm:p-4 flex flex-wrap gap-2">
                            <button type="button" onClick={() => onPractice(studyable, 'flash', Sch.groupLabel(groupFilter))} disabled={!studyable.length} className="btn btn-primary"><Icon name="layers" /> Flashcard</button>
                            <button type="button" onClick={() => onPractice(studyable, 'burst', 'Băng đạn · ' + Sch.groupLabel(groupFilter))} disabled={!studyable.length} className="btn btn-secondary"><Icon name="zap" /> Băng đạn 5 câu</button>
                            <button type="button" onClick={() => onPractice(studyable, 'test', Sch.groupLabel(groupFilter))} disabled={!studyable.length} className="btn btn-secondary"><Icon name="pen" /> Test {groupFilter === 'all' ? 'tất cả' : 'nhóm này'}</button>
                            <button type="button" onClick={onWeak} className="btn btn-secondary"><Icon name="flame" /> Ôn từ yếu ({weakCount})</button>
                            <button type="button" onClick={() => { if (!requireTurns(toast)) return; onPractice(mcqPool, 'eos', 'EOS · ' + Sch.groupLabel(groupFilter)); }} disabled={mcqPool.length < 5} className="btn btn-secondary"><Icon name="monitor" /> Thi thử EOS</button>
                        </div>
                        <div className="px-3 sm:px-4 pb-3 sm:pb-4 flex flex-wrap gap-2">
                            <button type="button" onClick={() => fileRef.current && fileRef.current.click()} className="btn btn-ghost btn-sm"><Icon name="upload" size={14} /> Nhập JSON / Excel</button>
                            <button type="button" onClick={() => window.dispatchEvent(new CustomEvent('edu-contribute'))} className="btn btn-ghost btn-sm"><Icon name="share" size={14} /> Gửi đề cho admin</button>
                            <input ref={fileRef} type="file" multiple accept=".json,.xlsx,.xls,.csv,application/json" className="hidden" onChange={pickFiles} />
                            <button type="button" onClick={exportJSON} disabled={!items.length} className="btn btn-ghost btn-sm"><Icon name="file" size={14} /> Xuất JSON</button>
                            <button type="button" onClick={exportExcel} disabled={!items.length} className="btn btn-ghost btn-sm"><Icon name="sheet" size={14} /> Xuất Excel</button>
                            <button type="button" onClick={makeShareCode} disabled={!rows.length} className="btn btn-ghost btn-sm"><Icon name="share" size={14} /> Tạo mã chia sẻ</button>
                            <button type="button" onClick={() => setPasteOpen(true)} className="btn btn-ghost btn-sm"><Icon name="key" size={14} /> Dán mã</button>
                        </div>
                    </div>

                    {sel.size > 0 && (
                        <div className="sticky top-2 z-20 mb-3 rounded-xl bg-ink text-white px-4 py-2 flex flex-wrap items-center gap-2 shadow-lg">
                            <span className="text-sm">Đã chọn {sel.size} hàng · gán nhóm:</span>
                            <input list="bulk-groups" value={bulkGroup} onChange={(e) => { setBulkGroup(e.target.value); bulkSetGroup(e.target.value); }} placeholder="Unit 1 - Jobs" className="field !min-h-[36px] text-ink max-w-[240px]" aria-label="Nhóm cho các hàng đã chọn" />
                            <datalist id="bulk-groups">{groups.filter(([k]) => k !== '__none').map(([k]) => <option key={k} value={k} />)}</datalist>
                            <button type="button" className="btn btn-sm text-white hover:bg-white/10" onClick={removeSelected}><Icon name="trash" size={14} /> Xóa</button>
                            <button type="button" className="btn btn-sm text-white hover:bg-white/10 ml-auto" onClick={() => setSel(new Set())}>Bỏ chọn</button>
                        </div>
                    )}

                    <div className="card overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full min-w-[1080px] text-sm border-collapse">
                                <caption className="sr-only">Bảng kho học</caption>
                                <thead className="bg-surface2 text-ink2 text-xs">
                                    <tr>
                                        <th scope="col" className="px-2 py-2 text-left w-12" title="Giữ chuột và kéo để chọn nhiều hàng">#</th>
                                        <th scope="col" className="px-3 py-2 text-left w-48">Nhóm</th>
                                        <th scope="col" className="px-3 py-2 text-left w-24">Loại</th>
                                        <th scope="col" className="px-3 py-2 text-left">Từ / Câu hỏi</th>
                                        <th scope="col" className="px-3 py-2 text-left w-56">Nghĩa / Đáp án</th>
                                        <th scope="col" className="px-3 py-2 text-left">Ví dụ / Giải thích</th>
                                        <th scope="col" className="px-3 py-2 text-left w-40">Phát âm</th>
                                        <th scope="col" className="px-3 py-2 text-left w-28">Tiến độ</th>
                                        <th scope="col" className="px-3 py-2 text-left w-40">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {rows.length === 0 ? (
                                        <tr><td colSpan="9"><Empty icon="layers" title="Chưa có mục nào ở đây">Dùng "Dán nhanh" hoặc "Thêm dòng" để bắt đầu.</Empty></td></tr>
                                    ) : rows.slice(0, shown).map((t, i) => {
                                        const on = sel.has(t.id);
                                        const mcq = t.type === 'mcq';
                                        return (
                                            <tr key={t.id} className={'border-t border-line align-top ' + (on ? 'row-sel' : 'hover:bg-surface2')} onMouseEnter={() => { if (dragging.current) selectRange(anchor.current, i); }}>
                                                <td className="p-0">
                                                    <button type="button" aria-pressed={on} aria-label={'Chọn hàng ' + (i + 1)} className={'w-full min-h-[40px] px-2 text-xs tnum cursor-crosshair ' + (on ? 'text-white' : 'text-muted')}
                                                        onMouseDown={(e) => { if (e.button !== 0) return; e.preventDefault(); const a = e.shiftKey ? anchor.current : i; if (!e.shiftKey) anchor.current = i; dragging.current = true; selectRange(a, i); }}
                                                        onKeyDown={(e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setSel(s => { const n = new Set(s); if (n.has(t.id)) n.delete(t.id); else n.add(t.id); return n; }); } }}>
                                                        {i + 1}
                                                    </button>
                                                </td>
                                                <td className="p-0">
                                                    <div className="flex items-stretch">
                                                        <span className="w-1 shrink-0" style={{ background: t.group ? Sch.groupColor(t.group) : 'var(--border)' }} />
                                                        <textarea rows={1} className="cell-ta" value={t.group} maxLength={80} aria-label="Nhóm" placeholder="Unit, chủ đề…"
                                                            onChange={(e) => { if (on) bulkSetGroup(e.target.value); else update(t.id, { group: e.target.value }); }} />
                                                    </div>
                                                </td>
                                                <td className="p-2">
                                                    <select aria-label="Loại" className="field !min-h-[36px] text-xs px-2" value={t.type}
